while the anterolateral axons are intact. Dorsal column loss causes sensory ataxia with loss of vibration and position sense and a positive Romberg sign.", "distractor_explanations": {"A": "Those fibers run in the lateral (anterolateral) region, which stains normally here.", "B": "That is lower motor neuron disease in the ventral horn, not white matter pallor in the dorsal region.", "C": "Isolated sphincter loss does not match dorsal column degeneration.", "D": "The pale region is not the lateral corticospinal tract."}, "source": "Wk3 packet p.153 path-lab figure (Luxol fast blue; 'Degeneration of Dorsal / Posterior Column Axons' and 'Intact Anterolateral Axons' labels covered; image used) and p.154; Spinal Syndromes slide 11 (sensory ataxia with positive Romberg)", "annotation": {"image": "qbank/midterm1-mock3-images/annotated/s-path-lfb-dorsal.png", "options": {"E": "Labeled \"Degeneration of Dorsal / Posterior Column Axons\" (pale, purple circle)", "A": "Labeled \"Intact Anterolateral Axons\" (blue, red circle): the spinothalamic fibers are spared"}, "note": null, "how": "Same faculty figure with its labels uncovered (cropped wider). Green box = correct answer; red boxes = other answer choices the figure labels. Arrow redrawn where the question placed it.", "marked": ["A", "E"]}}, {"id": "mk3-q37", "n": 37, "part": 1, "title": null, "stem": "A 26-year-old man has 14 months of depression and anxiety, then painful sensations in his legs, worsening unsteadiness and, later, memory loss. Brain biopsy shows spongiform change with many large plaques of prion protein. Compared with sporadic CJD, this form:", "options": [{"letter": "A", "text": "Affects older people and causes death within weeks"}, {"letter": "B", "text": "Is caused by an inherited PRNP mutation in every case"}, {"letter": "C", "text": "Affects younger people, begins with psychiatric and cerebellar features, lasts longer, and is linked to eating BSE-infected beef"}, {"letter": "D", "text": "Shows neuritic plaques with tau-containing neurites"}, {"letter": "E", "text": "Is caused by JC virus infection of oligodendrocytes"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Neuropathology of Neurodegenerative Diseases Lecture", "topic": "Neuropathology of Neurodegenerative Diseases Lecture", "note": null, "blueprint_category": "Neuropathology of Neurodegenerative Diseases Lecture", "learning_objective": "Neuropathology LO8", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Variant CJD (first described in Britain in 1995) occurs in younger patients with early psychiatric and prominent cerebellar signs and a longer course; it shows spongiform change with florid prion plaques and is linked to BSE-infected cattle.", "distractor_explanations": {"A": "Sporadic CJD affects older adults and progresses rapidly; this variant has a longer course.", "B": "Familial CJD is inherited; this variant is acquired.", "D": "Neuritic plaques are an Alzheimer finding; these prion plaques lack neuritic processes.", "E": "That is progressive multifocal leukoencephalopathy."}, "source": "Wk3 packet p.124 ('This variant ... occurs in a younger age group with a psychiatric component. Cerebellar signs are more prominent and there is a longer duration ... deposits of prion protein forming plaques ... consumption of bovine spongiform encephalopathy (BSE)-infected cattle'); Neuropathology LO8"}, {"id": "mk3-q38", "n": 38, "part": 1, "title": null, "stem": "Healthy young volunteers given scopolamine perform poorly on a set of memory tasks, with a pattern resembling that seen in older adults. What does this suggest about memory decline in normal aging?", "options": [{"letter": "A", "text": "It is caused by loss of NMDA receptor Mg2+ block"}, {"letter": "B", "text": "It reflects increased dopamine release in the prefrontal cortex"}, {"letter": "C", "text": "It results from damage to the cerebellum"}, {"letter": "D", "text": "It is linked to reduced cholinergic (muscarinic) signaling in the brain"}, {"letter": "E", "text": "It is due to excess GABA-A receptor activity"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Memory Formation", "topic": "Memory Formation", "note": null, "blueprint_category": "Memory Formation", "learning_objective": "Learning & Memory LO9-10", "difficulty": 2, "format": "research scenario", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Scopolamine blocks muscarinic ACh receptors. Course framing: in normal aging the degree of memory loss correlates with declining brain acetylcholine, and blocking ACh in young adults mimics that pattern.", "distractor_explanations": {"A": "Scopolamine does not act on NMDA receptors.", "B": "Scopolamine is not a dopaminergic drug, and aging lowers rather than raises dopamine supply.", "C": "Scopolamine does not damage the cerebellum, and the deficit is in memory tasks.", "E": "Scopolamine is not a GABAergic drug."}, "source": "Wk3 packet p.66 ('In normal aging ... memory loss correlates with a decline in brain acetylcholine levels ... young adult volunteers received injections of scopolamine ... resembled that of senile people'); Learning & Memory slide 37 (scopolamine blocks muscarinic receptors)"}, {"id": "mk3-q39", "n": 39, "part": 1, "title": null, "stem": "Which stain is used to show axons and neurofibrillary tangles as dark black or brown fibers?", "options": [{"letter": "A", "text": "Nissl stain (cresyl violet)"}, {"letter": "B", "text": "Silver stain"}, {"letter": "C", "text": "Luxol fast blue"}, {"letter": "D", "text": "Hematoxylin and eosin alone"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Histology Lab", "topic": "Histology Lab", "note": null, "blueprint_category": "Histology Lab", "learning_objective": "Histology Lab LO7", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Silver impregnation stains neurofilaments and similar fibrils dark, so it shows axons, neuritic plaques and neurofibrillary tangles.", "distractor_explanations": {"A": "It stains rough ER in neuron cell bodies.", "C": "It stains myelin blue.", "D": "H&E shows nuclei and cytoplasm but does not pick out axons and tangles well."}, "source": "Histology Lab LO7 (Wk1 packet p.209); Histology Lab packet p.213 (Dorsal Root Ganglion (Silver Stain)); Wk3 packet p.152 (Alzheimer's disease, silver stain)"}, {"id": "mk3-q40", "n": 40, "part": 1, "title": null, "stem": "A 71-year-old man has 1 year of fluctuating attention, detailed visual hallucinations of children in his garden, and a stiff, slow gait. His wife says he has acted out his dreams for years. Which protein aggregates are most likely responsible?", "options": [{"letter": "A", "text": "Alpha-synuclein in Lewy bodies"}, {"letter": "B", "text": "Amyloid-beta in neuritic plaques"}, {"letter": "C", "text": "Hyperphosphorylated tau in Pick bodies"}, {"letter": "D", "text": "Misfolded prion protein"}, {"letter": "E", "text": "Huntingtin with expanded polyglutamine"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Aging and Neurodegenerative Disorders", "topic": "Aging and Neurodegenerative Disorders", "note": null, "blueprint_category": "Aging and Neurodegenerative Disorders", "learning_objective": "Aging & Neurodegenerative LO8", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Dementia with Lewy bodies combines cognitive decline with fluctuations, well-formed visual hallucinations, REM sleep behavior disorder and parkinsonism; its pathology is alpha-synuclein Lewy bodies.", "distractor_explanations": {"B": "Amyloid plaques define Alzheimer disease, which begins with memory loss rather than fluctuations and hallucinations.", "C": "Tau inclusions of this kind fit frontotemporal dementia with early behavioral change.", "D": "Prion disease progresses over months with myoclonus.", "E": "Huntington disease causes chorea and is autosomal dominant."}, "source": "Wk3 packet p.109 ('LO8 - DEMENTIA WITH LEWY BODIES ... fluctuations ... recurrent well-formed visual hallucinations, REM sleep behavior disorder, and spontaneous parkinsonism ... Lewy bodies ... α-synuclein')"}, {"id": "mk3-q41", "n": 41, "part": 1, "title": null, "stem": "After removal of the left submandibular gland through an incision just below the angle of the mandible, a 50-year-old woman cannot pull down the left corner of her mouth, and her lower lip droops on that side. The forehead, eyelids and cheek move normally. Which nerve was injured?", "options": [{"letter": "A", "text": "Marginal mandibular branch of the left facial nerve"}, {"letter": "B", "text": "Mental nerve (V3)"}, {"letter": "C", "text": "Cervical branch of the left facial nerve"}, {"letter": "D", "text": "Left hypoglossal nerve"}, {"letter": "E", "text": "Buccal branch of the left facial nerve"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Face Anatomy", "topic": "Face Anatomy", "note": null, "blueprint_category": "Face Anatomy", "learning_objective": "Face ILM LO6; CN Modules LO5", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The marginal mandibular branch of CN VII runs along the lower border of the mandible and supplies the lower lip and chin muscles, including the depressor anguli oris; it is at risk in incisions near the angle of the mandible.", "distractor_explanations": {"B": "It is sensory to the lower lip and chin; its loss causes numbness, not weakness.", "C": "It supplies the platysma; its loss does not cause a drooping lower lip and weak depressor of the mouth's corner.", "D": "It supplies tongue muscles; the tongue would deviate, but lip movement would be normal.", "E": "It supplies the buccinator and upper lip; the lower lip muscles would be spared."}, "source": "Wk1 packet p.164 ('Mandibular - controls the lower lip and chin muscles, including the depressor anguli oris'); Face ILM LO6 (p.34); Lab 1 structure list (CN VII branches)"}, {"id": "mk3-q42", "n": 42, "part": 1, "title": null, "stem": "Which autonomic neurons are derived from the neural tube rather than from neural crest?", "options": [{"letter": "A", "text": "Postganglionic sympathetic neurons of the chain ganglia"}, {"letter": "B", "text": "Chromaffin cells of the adrenal medulla"}, {"letter": "C", "text": "Enteric neurons of the myenteric plexus"}, {"letter": "D", "text": "Preganglionic sympathetic neurons of the intermediolateral cell column"}, {"letter": "E", "text": "Postganglionic parasympathetic neurons of the ciliary ganglion"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Autonomics", "topic": "Autonomics", "note": null, "blueprint_category": "Autonomics", "learning_objective": "Autonomic LO1-2", "difficulty": 2, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Postganglionic sympathetic and parasympathetic neurons, enteric neurons, adrenal chromaffin cells and support cells arise from neural crest; the preganglionic neurons are CNS neurons in the brainstem and spinal cord, derived from the neural tube.", "distractor_explanations": {"A": "These come from neural crest cells that migrate to form the ganglia.", "B": "They are neural crest derivatives that act as modified postganglionic neurons.", "C": "Enteric neurons come from neural crest.", "E": "Parasympathetic ganglion neurons also come from neural crest."}, "source": "Wk3 packet p.10 (LO-2: 'The postganglionic sympathetic, parasympathetic, enteric, adrenal chromaffin and support cells of the ANS develop from ... neural crest cells ... autonomic ganglia begin to receive input from neurons of the central nervous system termed preganglionic neurons')"}, {"id": "mk3-q43", "n": 43, "part": 1, "title": null, "stem": "A 25-year-old man's radial nerve is crushed against the humerus in a fracture. Studies show that the axons are interrupted but the endoneurium, perineurium and epineurium are intact. What is the expected course?", "options": [{"letter": "A", "text": "No Wallerian degeneration, with full recovery within days"}, {"letter": "B", "text": "Wallerian degeneration distally, followed by regrowth along the intact connective tissue tubes, so recovery is common"}, {"letter": "C", "text": "Complete Wallerian degeneration with no regrowth unless the nerve ends are surgically sutured"}, {"letter": "D", "text": "Regeneration blocked by an astrocytic scar"}, {"letter": "E", "text": "Degeneration of the neuron cell bodies in the spinal cord"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Axon Repair", "topic": "Axon Repair", "note": null, "blueprint_category": "Axon Repair", "learning_objective": "Axon Repair LO1-2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "This is axonotmesis: the axons are damaged but the connective tissue is intact, so Wallerian degeneration occurs and regeneration along the preserved endoneurial tubes is common.", "distractor_explanations": {"A": "That describes neurapraxia, where axons are compressed but not interrupted.", "C": "That describes neurotmesis, where the connective tissue is also cut.", "D": "Astrocytic scars form in the CNS, not in peripheral nerves.", "E": "The cell bodies usually survive and support regrowth of the axons."}, "source": "Wk2 packet p.50 ('Axonotmesis is a crush injury that damages the axons but leaves the connective tissue intact. Wallerian degeneration occurs but regeneration is also common. 3. Neurotmesis ... requires the surgical suturing'); Axon Repair slide 7"}, {"id": "mk3-q44", "n": 44, "part": 1, "title": null, "stem": "During a migraine, activated trigeminal nerve endings around meningeal blood vessels release CGRP and substance P. What do these peptides do there?", "options": [{"letter": "A", "text": "Constrict meningeal vessels and block nociceptor firing"}, {"letter": "B", "text": "Inhibit the spinal trigeminal nucleus"}, {"letter": "C", "text": "Activate 5-HT1B receptors on vessels"}, {"letter": "D", "text": "Close the blood-brain barrier to inflammatory cells"}, {"letter": "E", "text": "Dilate meningeal vessels and trigger mast cells to release histamine, which drives further peptide release"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Headaches", "topic": "Headaches", "note": null, "blueprint_category": "Headaches", "learning_objective": "Headache LO3", "difficulty": 2, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Neurogenic inflammation: CGRP and substance P dilate vessels and make mast cells release histamine, which promotes more CGRP and substance P release, a vicious cycle in neurovascular headaches. CGRP blockers target this.", "distractor_explanations": {"A": "CGRP is a vasodilator and promotes, not blocks, nociception.", "B": "They act peripherally on vessels and mast cells, sensitizing the pathway.", "C": "That is the action of triptans, which constrict vessels and reduce peptide release.", "D": "Neurogenic inflammation increases, not reduces, vascular permeability."}, "source": "Wk2 packet p.136 ('CGRP and substance P can cause blood vessel dilation and induce mast cells to release histamine. This histamine release then promotes further CGRP and substance P release'); Headache LO3"}, {"id": "mk3-q45", "n": 45, "part": 1, "title": null, "stem": "Neurons with one dendrite and one axon extending from opposite sides of the cell body are found mainly in which location?", "options": [{"letter": "A", "text": "Dorsal root ganglia"}, {"letter": "B", "text": "Ventral horn of the spinal cord"}, {"letter": "C", "text": "The retina and olfactory epithelium"}, {"letter": "D", "text": "Layer V of the motor cortex"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Histology of CNS 1: Neurons and Glia", "topic": "Histology of CNS 1: Neurons and Glia", "note": null, "blueprint_category": "Histology of CNS 1: Neurons and Glia", "learning_objective": "Histology CNS 1 LO3", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Bipolar neurons (one axon and one dendrite) are found in special senses such as the retina and olfactory epithelium.", "distractor_explanations": {"A": "DRG neurons are pseudounipolar, with a single process that splits into two branches.", "B": "Lower motor neurons are multipolar.", "D": "Pyramidal neurons are multipolar."}, "source": "Wk1 packet p.179 ('Bipolar neurons: One axon and one dendrite; found in special senses (e.g., retina, olfactory epithelium)'); Histology CNS 1 LO3"}, {"id": "mk3-q46", "n": 46, "part": 1, "title": null, "stem": "A 75-year-old man has 8 months of a slow, shuffling gait in which his feet seem stuck to the floor, urinary urgency with incontinence, and slowed thinking. CT shows large lateral ventricles that are out of proportion to the cortical sulci. Which test can best help predict whether he will improve with treatment?", "options": [{"letter": "A", "text": "Removal of CSF (lumbar drainage or tap test) with gait assessment before and after"}, {"letter": "B", "text": "CSF RT-QuIC"}, {"letter": "C", "text": "Serum TSH"}, {"letter": "D", "text": "Amyloid PET"}, {"letter": "E", "text": "Dopamine transporter scan"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Aging and Neurodegenerative Disorders", "topic": "Aging and Neurodegenerative Disorders", "note": null, "blueprint_category": "Aging and Neurodegenerative Disorders", "learning_objective": "Aging & Neurodegenerative LO2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Normal pressure hydrocephalus (gait apraxia, incontinence, cognitive dysfunction, ventriculomegaly disproportionate to sulci) is a treatable cause; specialist CSF drainage testing helps select patients likely to improve with shunting.", "distractor_explanations": {"B": "RT-QuIC supports prion disease, which progresses rapidly with myoclonus.", "C": "Hypothyroidism is a reversible cause of cognitive slowing but does not cause this gait and ventricular picture.", "D": "Amyloid PET supports Alzheimer disease; it does not predict response to CSF diversion.", "E": "It supports parkinsonian syndromes; the ventricular enlargement points elsewhere."}, "source": "Wk3 packet p.102 (reversible contributors: 'Normal pressure hydrocephalus ... Ventriculomegaly is disproportionate to cortical sulcal enlargement ... specialist-directed CSF drainage testing may help select patients'); Wk1 packet p.136 (NPH)"}, {"id": "mk3-q47", "n": 47, "part": 1, "title": null, "stem": "Why does cauda equina syndrome produce only lower motor neuron signs in the legs?", "options": [{"letter": "A", "text": "It compresses the lateral corticospinal tracts in the lumbar cord"}, {"letter": "B", "text": "It damages the conus medullaris, which contains only lower motor neurons"}, {"letter": "C", "text": "It always involves the motor cortex for the legs"}, {"letter": "D", "text": "It compresses lumbosacral nerve roots, which are lower motor neuron axons, below the end of the cord"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Cauda Equina and Conus Medullaris", "topic": "Cauda Equina and Conus Medullaris", "note": null, "blueprint_category": "Cauda Equina and Conus Medullaris", "learning_objective": "Cauda Equina & Conus LO2", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The cauda equina is a bundle of nerve roots (a multilevel radiculopathy), so motor findings are those of lower motor neuron lesions: weakness, hyporeflexia and reduced tone.", "distractor_explanations": {"A": "The cord ends at about L1-L2, above the cauda equina; no tracts are present there.", "B": "Conus lesions can produce mixed UMN and LMN signs.", "C": "The lesion is in the lumbar canal, far from the cortex."}, "source": "Wk2 packet p.126 ('Because the cauda equina is made up of nerve roots, motor deficits would be comparable with lower motor neuron lesions'); p.128 (conus syndrome affects UMNs)"}, {"id": "mk3-q48", "n": 48, "part": 1, "title": null, "stem": "A 30-year-old man has a complete transection of the spinal cord at T10 after a gunshot wound. Weeks later, after spinal shock resolves, which findings are expected below the lesion?", "options": [{"letter": "A", "text": "Flaccid paralysis of both legs with absent reflexes for life"}, {"letter": "B", "text": "Spastic paralysis of both legs, hyperreflexia, and loss of all sensation below about the umbilicus"}, {"letter": "C", "text": "Loss of pain and temperature only, with preserved vibration"}, {"letter": "D", "text": "Paralysis of the left leg only with loss of pain on the right"}, {"letter": "E", "text": "Weakness of both arms and legs"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Spinal Cord", "topic": "Spinal Cord", "note": null, "blueprint_category": "Spinal Cord", "learning_objective": "Spinal Cord LO8", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "A complete transverse section cuts all tracts: bilateral UMN paralysis below the level (spastic after spinal shock), loss of all sensory modalities below the level (T10 ≈ umbilicus), and bladder and bowel dysfunction.", "distractor_explanations": {"A": "Flaccid areflexia is the acute spinal shock phase; UMN signs follow as it resolves.", "C": "That pattern fits anterior cord syndrome, not complete transection.", "D": "That is a hemisection (Brown-Séquard) pattern.", "E": "A T10 lesion spares the arms, which are supplied from the cervical cord."}, "source": "Spinal Cord LO8 (Wk2 packet p.35: complete cord transverse section); Spinal Syndromes slide 16 ('motor and sensory loss below lesion ... flaccid → spastic paralysis (after spinal shock)')"}, {"id": "mk3-q49", "n": 49, "part": 1, "title": null, "stem": "Axons in the tract indicated by the green arrow carry vibration and position sense from which region, and where do they make their first synapse?", "options": [{"letter": "A", "text": "The ipsilateral lower limb; nucleus gracilis in the caudal medulla"}, {"letter": "B", "text": "The contralateral upper limb; the ventral posterolateral thalamus"}, {"letter": "C", "text": "The ipsilateral upper limb and upper trunk; nucleus cuneatus in the caudal medulla"}, {"letter": "D", "text": "The ipsilateral upper limb; the dorsal horn at the level of entry"}, {"letter": "E", "text": "The contralateral lower limb; the cerebellum"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock3-images/s-sc-cuneatus.png", "image_needed": true, "week": 2, "session_guess": "Spinal Cord Cross-Sectional Anatomy", "topic": "Spinal Cord Cross-Sectional Anatomy", "note": null, "blueprint_category": "Spinal Cord Cross-Sectional Anatomy", "learning_objective": "SC Cross-Sectional LO3-4", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The green arrow is on the fasciculus cuneatus, the lateral part of the dorsal columns present above T6. Its first-order axons from the ipsilateral arm and upper trunk ascend to synapse in nucleus cuneatus.", "distractor_explanations": {"A": "That is the fasciculus gracilis, the medial part of the dorsal columns.", "B": "These first-order axons are uncrossed and synapse in the medulla before reaching the thalamus.", "D": "Dorsal column axons ascend without synapsing in the dorsal horn.", "E": "Spinocerebellar tracts carry unconscious proprioception to the cerebellum; this tract is a dorsal column."}, "source": "SC Cross-Sectional worksheet p.10, Fig. 1 atlas ('Fasciculus cuneatus' labeled; image used); Somatosensory slides 31a (fasciculus cuneatus carries the upper limb); Sensory Receptors LO3", "annotation": {"image": "qbank/midterm1-mock3-images/annotated/s-sc-cuneatus.png", "options": {"C": "Labeled \"Fasciculus cuneatus\" (green arrow)", "A": "Labeled \"Fasciculus gracilis\": the medial dorsal column (lower limb)"}, "note": "B, D and E are synapse sites, not tracts on this diagram.", "how": "Same faculty figure with its labels uncovered (cropped wider). Green box = correct answer; red boxes = other answer choices the figure labels. Arrow redrawn where the question placed it.", "marked": ["A", "C"]}}, {"id": "mk3-q50", "n": 50, "part": 1, "title": null, "stem": "A 68-year-old woman has a stroke in the face area of her left primary motor cortex. Which pattern of facial weakness is expected?", "options": [{"letter": "A", "text": "Weakness of the whole right side of the face, including the forehead"}, {"letter": "B", "text": "Weakness of the whole left side of the face"}, {"letter": "C", "text": "Weakness of the left lower face, with the left forehead spared"}, {"letter": "D", "text": "Weakness of the forehead only, on both sides"}, {"letter": "E", "text": "Weakness of the right lower face, with the right forehead spared"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Cranial Nerves Module", "topic": "Cranial Nerves Module", "note": null, "blueprint_category": "Cranial Nerves Module", "learning_objective": "CN Modules LO5", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": true, "thursday_11_5": false, "explanation": "Central (UMN) facial palsy: the upper face receives corticobulbar input from both hemispheres, so a unilateral cortical lesion weakens only the contralateral lower face (forehead sparing).", "distractor_explanations": {"A": "Whole-hemiface weakness, including the forehead, points to a lower motor neuron (facial nerve) lesion.", "B": "A left cortical lesion affects the opposite (right) face.", "C": "Corticobulbar fibers to the lower face are crossed, so the weakness is on the right.", "D": "The forehead is the part spared by a one-sided cortical lesion because it gets input from both hemispheres."}, "source": "ILM Cranial Nerves Modules slide 49 ('Peripheral: ½ facial weakness · Central: ½ facial weakness with forehead sparing'); CN Modules LO5"}, {"id": "mk3-q51", "n": 51, "part": 1, "title": null, "stem": "Loperamide is a mu opioid receptor agonist used for diarrhea that causes little euphoria or respiratory depression at usual doses. Why?", "options": [{"letter": "A", "text": "It does not cross the blood-brain barrier"}, {"letter": "B", "text": "It is a mu opioid receptor antagonist"}, {"letter": "C", "text": "It acts only on kappa opioid receptors"}, {"letter": "D", "text": "It is a partial agonist with a ceiling effect, like buprenorphine"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Pain Medications", "topic": "Pain Medications", "note": null, "blueprint_category": "Pain Medications", "learning_objective": "Pain Medications LO1-2", "difficulty": 1, "format": "direct", "drug_item": "mechanism", "laterality": false, "thursday_11_5": false, "explanation": "Loperamide is a weak mu agonist that does not cross the BBB, so it slows the gut (constipation) with minimal central effects.", "distractor_explanations": {"B": "Loperamide is an agonist; antagonists such as naloxone reverse opioid effects.", "C": "Loperamide acts at mu receptors.", "D": "Its limited central effect comes from poor brain entry, not partial agonism."}, "source": "Pain Medication slide 11 ('Loperamide is a mu opioid that does NOT cross the blood brain barrier'); drug list, Exam 1 Pain: Loperamide (bold) 'does not cross the blood brain barrier, used for diarrhea'"}, {"id": "mk3-q52", "n": 52, "part": 1, "title": null, "stem": "A dentist injects local anesthetic near the mandibular foramen on the right to numb the right lower teeth. The patient's right lower lip and chin go numb, and the front of the right side of the tongue also goes numb. Why is the tongue numb?", "options": [{"letter": "A", "text": "The inferior alveolar nerve also supplies the tongue"}, {"letter": "B", "text": "The anesthetic spread to the hypoglossal nerve"}, {"letter": "C", "text": "The anesthetic blocked the chorda tympani's taste fibers only"}, {"letter": "D", "text": "The lingual nerve runs just in front of the inferior alveolar nerve near the mandibular foramen and was also anesthetized"}, {"letter": "E", "text": "The anesthetic spread to the glossopharyngeal nerve"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Face Anatomy", "topic": "Face Anatomy", "note": null, "blueprint_category": "Face Anatomy", "learning_objective": "Face ILM LO6", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "In the infratemporal fossa the lingual nerve (V3, general sensation to the anterior two-thirds of the tongue) lies close to the inferior alveolar nerve as it enters the mandibular foramen, so an inferior alveolar block usually numbs both.", "distractor_explanations": {"A": "The inferior alveolar nerve supplies the lower teeth and, via the mental nerve, the lip and chin, not the tongue.", "B": "CN XII is motor to the tongue; it carries no sensation.", "C": "Taste loss would not cause numbness to touch; general sensation of the anterior tongue rides the lingual nerve.", "E": "CN IX supplies the posterior third of the tongue, not the front."}, "source": "Lab 1 notes p.10-11, Figs. 15-16 and Step 7 (lingual nerve beside the inferior alveolar nerve); Face ILM LO6; Lab 1 structure list (Lingual, Inferior alveolar nerves)"}, {"id": "mk3-q53", "n": 53, "part": 1, "title": null, "stem": "A 23-year-old man who frequently inhales nitrous oxide at parties has numb feet, falls in the dark, and stiff legs. He has lost vibration and position sense in both feet, his knee reflexes are brisk, and both plantar responses are extensor. Which tracts are damaged?", "options": [{"letter": "A", "text": "Spinothalamic tracts and ventral horns"}, {"letter": "B", "text": "Dorsal columns and dorsal roots only"}, {"letter": "C", "text": "Anterior two-thirds of the cord"}, {"letter": "D", "text": "One half of the cord"}, {"letter": "E", "text": "Dorsal columns and lateral corticospinal tracts"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Spinal Syndromes", "topic": "Spinal Syndromes", "note": null, "blueprint_category": "Spinal Syndromes", "learning_objective": "Spinal Syndromes LO2, LO5", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "This is subacute combined degeneration from functional vitamin B12 deficiency (nitrous oxide inactivates B12): demyelination of the dorsal columns (sensory ataxia) and lateral corticospinal tracts (UMN signs).", "distractor_explanations": {"A": "These are spared here; pain and temperature and lower motor neurons are not the problem.", "B": "Dorsal root loss gives areflexia, not brisk reflexes and Babinski signs.", "C": "Anterior cord damage spares the dorsal columns.", "D": "A hemisection causes asymmetric findings with crossed pain loss."}, "source": "Wk2 packet p.112 ('Subacute Combined Degeneration ... vitamin B12 or folate deficiency ... Significant exposure to recreational nitrous oxide ... may also produce this syndrome'; UMN signs, spastic paresis)"}, {"id": "mk3-q54", "n": 54, "part": 1, "title": null, "stem": "A 68-year-old woman with mild cognitive impairment and amyloid confirmed on PET asks whether lecanemab will restore her memory. Which statement best reflects the course's account of this therapy?", "options": [{"letter": "A", "text": "It reverses neuronal loss and restores memory in most patients"}, {"letter": "B", "text": "It clears amyloid and modestly slows average decline, but it does not restore lost cognition"}, {"letter": "C", "text": "It works by inhibiting acetylcholinesterase"}, {"letter": "D", "text": "It is an NMDA receptor antagonist for severe disease"}, {"letter": "E", "text": "Removing amyloid on imaging proves that patients will function better"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Aging and Neurodegenerative Disorders", "topic": "Aging and Neurodegenerative Disorders", "note": null, "blueprint_category": "Aging and Neurodegenerative Disorders", "learning_objective": "Aging & Neurodegenerative LO6", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Lecanemab and donanemab are amyloid-directed antibodies for mild cognitive impairment or mild dementia with confirmed amyloid; they modestly slow average decline but do not restore cognition, and reduced amyloid on imaging does not by itself mean clinical benefit.", "distractor_explanations": {"A": "The anti-amyloid antibodies do not restore cognition already lost.", "C": "That is the mechanism of donepezil, rivastigmine and galantamine.", "D": "That describes memantine.", "E": "Biomarker improvement and meaningful clinical benefit are not the same thing."}, "source": "Wk3 packet p.106 (LO6: 'Lecanemab and donanemab ... do not restore cognition that has already been lost ... modestly slow the average rate of decline ... biomarker improvement and meaningful clinical benefit are not the same thing')"}, {"id": "mk3-q55", "n": 55, "part": 1, "title": null, "stem": "In the first hours after a severe spinal cord injury, what is expected below the level of the lesion?", "options": [{"letter": "A", "text": "Spastic paralysis with hyperreflexia and clonus"}, {"letter": "B", "text": "Normal strength with loss of vibration only"}, {"letter": "C", "text": "Flaccid paralysis with absent reflexes and no upper motor neuron signs"}, {"letter": "D", "text": "Fasciculations and muscle atrophy"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Spinal Syndromes", "topic": "Spinal Syndromes", "note": null, "blueprint_category": "Spinal Syndromes", "learning_objective": "Spinal Syndromes LO1", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Spinal shock: acute injury causes flaccid areflexia below the level without UMN signs; spasticity and hyperreflexia develop later.", "distractor_explanations": {"A": "These UMN signs appear later, after spinal shock resolves.", "B": "A severe injury affects motor function as well.", "D": "Atrophy takes weeks, and fasciculations are LMN signs that do not define the acute phase."}, "source": "Spinal Syndromes slide 12 ('Acute injury leads to flaccid areflexia below the level of the lesion, and the absence of upper motor neuron signs: Spinal shock') and slide 16"}, {"id": "mk3-q56", "n": 56, "part": 1, "title": null, "stem": "A 30-year-old cyclist is hit by a car and is unconscious for an hour. Afterward she can learn new information normally, but she cannot remember anything from the 2 weeks before the crash. What type of memory loss is this?", "options": [{"letter": "A", "text": "Anterograde amnesia"}, {"letter": "B", "text": "Transient global amnesia"}, {"letter": "C", "text": "Retrograde amnesia"}, {"letter": "D", "text": "Loss of procedural memory"}, {"letter": "E", "text": "Loss of working memory"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Memory Formation", "topic": "Memory Formation", "note": null, "blueprint_category": "Memory Formation", "learning_objective": "Learning & Memory LO4-5", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Retrograde amnesia is loss of memories formed before an injury; it is common after traumatic brain injury, hypoxia or seizures, while anterograde amnesia is failure to form new memories.", "distractor_explanations": {"A": "That is loss of the ability to form new memories, which she still has.", "B": "TGA is a temporary loss of new-memory formation lasting hours, without head injury.", "D": "Skills and habits are not what she has lost.", "E": "She can hold and use information now; the gap is in older memories."}, "source": "Wk3 packet p.64 ('Retrograde amnesia (loss of past long-term memories) can occur due to a number of events including Traumatic Brain Injury'); Learning & Memory LO4-5"}, {"id": "mk3-q57", "n": 57, "part": 1, "title": null, "stem": "A 15-year-old boy has burning pain in his hands and feet that gets worse with exercise and heat, small dark-red papules around his umbilicus, reduced sweating, and protein in his urine. His maternal uncle had kidney failure in his 30s. Deficiency of which enzyme is most likely?", "options": [{"letter": "A", "text": "Galactocerebrosidase"}, {"letter": "B", "text": "Arylsulfatase A"}, {"letter": "C", "text": "Sorbitol dehydrogenase"}, {"letter": "D", "text": "Alpha-galactosidase A"}, {"letter": "E", "text": "Hexosaminidase A"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Peripheral Neuropathies", "topic": "Peripheral Neuropathies", "note": null, "blueprint_category": "Peripheral Neuropathies", "learning_objective": "Peripheral Neuropathy LO7", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Fabry disease is an X-linked lysosomal storage disorder from alpha-galactosidase A (GLA) deficiency, causing painful small-fiber neuropathy, angiokeratomas and progressive renal involvement.", "distractor_explanations": {"A": "This is Krabbe disease, which presents in infancy with severe demyelination.", "B": "This is metachromatic leukodystrophy, a demyelinating disorder.", "C": "Its deficiency is a rare cause of neuropathy without angiokeratomas or kidney failure.", "E": "This is Tay-Sachs disease, a neurodegenerative disorder of infancy."}, "source": "Wk2 packet p.69 ('Fabry Disease: X-linked lysosomal storage disorder caused by a deficiency of the enzyme alpha-galactosidase A ... angiokeratomas ... severe neuropathic pain, and renal involvement') and p.63; Peripheral Neuropathy LO7"}, {"id": "mk3-q58", "n": 58, "part": 1, "title": null, "stem": "Ten days after a motor nerve is crushed, the cell bodies of the injured motor neurons are swollen, their nuclei have moved to the edge of the cell, and the basophilic clumps normally seen in the cytoplasm have dispersed. These clumps are made of:", "options": [{"letter": "A", "text": "Neurofilaments"}, {"letter": "B", "text": "Rough endoplasmic reticulum and free polysomes"}, {"letter": "C", "text": "Lipofuscin granules"}, {"letter": "D", "text": "Mitochondria"}, {"letter": "E", "text": "Lysosomes"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Histology of CNS 1: Neurons and Glia", "topic": "Histology of CNS 1: Neurons and Glia", "note": null, "blueprint_category": "Histology of CNS 1: Neurons and Glia", "learning_objective": "Histology CNS 1 LO1; Axon Repair LO1", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The basophilic clumps are Nissl substance (rough ER and polysomes) that reflect high protein synthesis; after axon injury they disperse (chromatolysis) as the cell body swells and the nucleus moves to the edge.", "distractor_explanations": {"A": "Neurofilaments are intermediate filaments that support the axon; they are not basophilic clumps.", "C": "Lipofuscin is a brown wear-and-tear pigment that builds up with age.", "D": "Mitochondria are found throughout the cytoplasm and are not the basophilic Nissl material.", "E": "Lysosomes are not the basophilic material that disperses after axon injury."}, "source": "Wk1 packet p.176 ('basophilic Nissl substance or Nissl bodies, which are large masses of free polysomes and RER'); Wk2 packet p.49 ('the neuronal cell body swells, its nucleus moves to an eccentric...')"}, {"id": "mk3-q59", "n": 59, "part": 1, "title": null, "stem": "Compared with chemical synapses, electrical synapses:", "options": [{"letter": "A", "text": "Pass current directly through connexin gap junctions, very fast and often in both directions"}, {"letter": "B", "text": "Use vesicles that release transmitter into a 20-nm cleft"}, {"letter": "C", "text": "Have a synaptic delay of several milliseconds"}, {"letter": "D", "text": "Can only inhibit the postsynaptic cell"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Synaptic transmission and neurotransmitters", "topic": "Synaptic transmission and neurotransmitters", "note": null, "blueprint_category": "Synaptic transmission and neurotransmitters", "learning_objective": "Synaptic Transmission LO1", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Electrical synapses link cytoplasm directly through gap junctions (connexin pores), allowing rapid, synchronous firing with flow that can be unidirectional or bidirectional.", "distractor_explanations": {"B": "That describes chemical synapses.", "C": "Chemical synapses have a delay; electrical ones are nearly instantaneous.", "D": "Electrical synapses pass current either way and synchronize cells."}, "source": "Wk3 packet p.21 ('LO-1; ELECTRICAL SYNAPSES ... gap junctions ... connexins ... rapid and synchronous firing ... unidirectionally or bidirectionally')"}, {"id": "mk3-q60", "n": 60, "part": 1, "title": null, "stem": "A routine exam of a healthy 6-year-old shows a small tuft of hair over the lower lumbar spine. Radiographs show that the vertebral arches at L5 have not fused, but there is no sac, and the meninges and cord are in normal position. What is this?", "options": [{"letter": "A", "text": "Meningocele"}, {"letter": "B", "text": "Myelomeningocele"}, {"letter": "C", "text": "Myeloschisis (rachischisis)"}, {"letter": "D", "text": "Tethered cord syndrome"}, {"letter": "E", "text": "Spina bifida occulta"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Embryo Disorders of CNS", "topic": "Embryo Disorders of CNS", "note": null, "blueprint_category": "Embryo Disorders of CNS", "learning_objective": "Embryological Disorders LO1", "difficulty": 1, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Spina bifida occulta is failed fusion of the vertebral arches without herniation of meninges or cord; it is often marked only by a hair tuft, dimple or skin change.", "distractor_explanations": {"A": "In a meningocele the meninges herniate through the defect as a fluid-filled sac.", "B": "In a myelomeningocele the meninges and neural tissue herniate, usually with neurologic deficits.", "C": "Here the neural tissue is open on the surface because the neural folds never fused.", "D": "This involves an abnormally low, fixed conus with progressive symptoms; isolated arch nonfusion is not enough."}, "source": "Embryological Disorders LO1 (Wk1 packet p.189-190: caudal neuropore disorders incl. spina bifida occulta, meningocele, myelomeningocele, myeloschisis); Wk1 packet p.190 Fig. 1"}, {"id": "mk3-q61", "n": 61, "part": 1, "title": null, "stem": "An 80-year-old woman with Alzheimer disease starts galantamine. Three weeks later she has nausea, loose stools and two episodes of lightheadedness, and her pulse is 46/min. What best explains these effects?", "options": [{"letter": "A", "text": "Blockade of NMDA receptor channels"}, {"letter": "B", "text": "Removal of amyloid plaques causing brain edema"}, {"letter": "C", "text": "Blockade of muscarinic receptors"}, {"letter": "D", "text": "More acetylcholine at muscarinic synapses in the gut and the heart"}, {"letter": "E", "text": "Release of dopamine in the basal ganglia"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Memory Formation", "topic": "Memory Formation", "note": null, "blueprint_category": "Memory Formation", "learning_objective": "Learning & Memory LO11", "difficulty": 2, "format": "vignette", "drug_item": "side effect", "laterality": false, "thursday_11_5": false, "explanation": "Galantamine (like donepezil and rivastigmine) inhibits acetylcholinesterase, so more ACh acts at peripheral muscarinic receptors: nausea, diarrhea and slowed heart rate, which can cause bradycardia or syncope.", "distractor_explanations": {"A": "That is memantine, whose effects are dizziness, confusion and hallucinations.", "B": "That relates to the anti-amyloid antibodies, not galantamine.", "C": "Antimuscarinic drugs cause dry mouth, constipation and a fast heart rate, the opposite pattern.", "E": "Galantamine does not act by releasing dopamine."}, "source": "Wk3 packet p.106 ('Common adverse effects include nausea, diarrhea ... these medications can also slow heart rate, they may cause bradycardia or syncope'); drug list, Exam 1 Alzheimer's Disease: Galantamine (bold) 'Inhibits the breakdown of acetylcholine'; Memantine row"}, {"id": "mk3-q62", "n": 62, "part": 1, "title": null, "stem": "Why does the left recurrent laryngeal nerve hook around the arch of the aorta while the right one hooks around the right subclavian artery?", "options": [{"letter": "A", "text": "The left nerve comes from the left fourth arch and the right nerve from the right sixth arch"}, {"letter": "B", "text": "The right third-arch artery forms the arch of the aorta"}, {"letter": "C", "text": "On the left the distal sixth-arch artery persists as the ductus arteriosus; on the right it regresses, so the nerve slips up to the fourth-arch artery"}, {"letter": "D", "text": "The left subclavian artery develops from the second-arch artery"}, {"letter": "E", "text": "The heart rotates to the right, pulling only the right nerve upward"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Face Embryology", "topic": "Face Embryology", "note": null, "blueprint_category": "Face Embryology", "learning_objective": "Facial Embryology LO3", "difficulty": 3, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Arch 4 forms part of the aortic arch (left) and the proximal right subclavian artery; arch 6 forms the pulmonary arteries and, on the left, the ductus arteriosus. The left RLN stays under the ductus (ligamentum arteriosum) at the aortic arch; on the right the distal sixth-arch artery disappears, so the nerve hooks under the right subclavian.", "distractor_explanations": {"A": "Both recurrent laryngeal nerves are sixth-arch nerves; the asymmetry comes from the arteries.", "B": "The third-arch arteries form the common carotid and proximal internal carotid arteries.", "D": "The second-arch artery forms the stapedial artery.", "E": "Cardiac rotation does not explain the different hooks; artery regression does."}, "source": "Wk1 packet p.24-25 (Table 5: arch 4 = part of arch of aorta, proximal right subclavian; arch 6 = pulmonary arteries, ductus arteriosus; 'relationship of the left Recurrent Laryngeal Nerve with the remnants of Arch 6'); p.68 (RLN under right subclavian or left arch of aorta)"}, {"id": "mk3-q63", "n": 63, "part": 1, "title": null, "stem": "Where are the upper motor neurons of the lateral vestibulospinal tract, and does the tract cross?", "options": [{"letter": "A", "text": "In the primary motor cortex; it crosses in the medulla"}, {"letter": "B", "text": "In the red nucleus; it crosses in the midbrain"}, {"letter": "C", "text": "In the superior colliculus; it crosses in the midbrain"}, {"letter": "D", "text": "In the lateral vestibular nucleus; it crosses in the anterior white commissure"}, {"letter": "E", "text": "In the lateral vestibular nucleus of the brainstem; it stays ipsilateral"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Corticospinal and UMN/LMN", "topic": "Corticospinal and UMN/LMN", "note": null, "blueprint_category": "Corticospinal and UMN/LMN", "learning_objective": "Descending Motor Pathways LO3", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The lateral vestibulospinal tract arises from the lateral vestibular nucleus and descends ipsilaterally to facilitate extensor (antigravity) motor neurons; the medial vestibulospinal tract acts bilaterally on neck muscles.", "distractor_explanations": {"A": "That is the lateral corticospinal tract.", "B": "That is the rubrospinal tract.", "C": "That is the tectospinal tract.", "D": "The lateral vestibulospinal tract does not cross."}, "source": "Wk2 packet p.30 ('Lateral Vestibulospinal Nucleus & Tract: Ipsilateral –– Does not cross. b. Medial Vestibulospinal ... Bilateral'); Descending Motor Pathways LO3"}, {"id": "mk3-q64", "n": 64, "part": 1, "title": null, "stem": "A 30-year-old woman with relapsing-remitting multiple sclerosis starts an injectable disease-modifying cytokine therapy. She is warned about flu-like symptoms after each dose. Which other adverse effect is characteristic of this drug?", "options": [{"letter": "A", "text": "Progressive multifocal leukoencephalopathy"}, {"letter": "B", "text": "Skin reactions at the injection site that can progress to necrosis"}, {"letter": "C", "text": "Reactivation of hepatitis B"}, {"letter": "D", "text": "Flushing and abdominal pain after oral doses"}, {"letter": "E", "text": "Cushingoid features with long-term use"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Multiple Sclerosis", "topic": "Multiple Sclerosis", "note": null, "blueprint_category": "Multiple Sclerosis", "learning_objective": "MS LO5", "difficulty": 1, "format": "vignette", "drug_item": "side effect", "laterality": false, "thursday_11_5": false, "explanation": "The drug is interferon beta-1a, an immunomodulatory cytokine given by injection; it causes flu-like symptoms and injection-site skin reactions that can become necrotic.", "distractor_explanations": {"A": "PML is the key risk of natalizumab, an anti-alpha-4-integrin antibody.", "C": "This is a warning for rituximab and other anti-CD20 antibodies.", "D": "These are effects of oral dimethyl fumarate.", "E": "These come from prolonged glucocorticoids such as prednisone."}, "source": "Drug list, Exam 1 'Multiple Sclerosis': Interferon β-1a (bold) 'Skin reactions at the site of injection – can lead to necrosis. Can cause flu-like symptoms'; Natalizumab, Rituximab, Dimethyl Fumarate rows; Wk2 packet p.79; MS LO5"}, {"id": "mk3-q65", "n": 65, "part": 1, "title": null, "stem": "Which functions are attributed to the cingulate cortex in the course's limbic framework?", "options": [{"letter": "A", "text": "Pain, interoception, error detection and prediction"}, {"letter": "B", "text": "Primary visual processing"}, {"letter": "C", "text": "Hearing and language comprehension"}, {"letter": "D", "text": "Voluntary movement of the hand"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Limbic System", "topic": "Limbic System", "note": null, "blueprint_category": "Limbic System", "learning_objective": "Limbic LO2", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Course framing: the cingulate cortex contributes to pain, interoception, error monitoring and predictions, linking emotion with behavior.", "distractor_explanations": {"B": "That is the occipital (calcarine) cortex.", "C": "These involve the superior temporal gyrus and Wernicke's area.", "D": "That is the precentral gyrus."}, "source": "Limbic System slide 14 ('The cingulate cortex · Pain · Interoception · Errors · Predictions'); Limbic LO2"}, {"id": "mk3-q66", "n": 66, "part": 1, "title": null, "stem": "Which suprahyoid muscle is supplied by the facial nerve?", "options": [{"letter": "A", "text": "Anterior belly of the digastric"}, {"letter": "B", "text": "Mylohyoid"}, {"letter": "C", "text": "Geniohyoid"}, {"letter": "D", "text": "Posterior belly of the digastric"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Neck Anatomy", "topic": "Neck Anatomy", "note": null, "blueprint_category": "Neck Anatomy", "learning_objective": "Neck ILM LO3", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The digastric has two bellies from two arches: the anterior belly (arch 1, V3) and the posterior belly (arch 2, CN VII, with the stylohyoid).", "distractor_explanations": {"A": "It is a first-arch muscle supplied by the nerve to mylohyoid (V3).", "B": "It is supplied by the nerve to mylohyoid, a branch of V3.", "C": "It is supplied by C1 fibers traveling with the hypoglossal nerve."}, "source": "Wk1 packet p.19 (arch 1: mylohyoid, anterior belly of digastric; arch 2: posterior belly of digastric, stylohyoid) and p.51; Lab 1 structure list (Digastric)"}, {"id": "mk3-q67", "n": 67, "part": 1, "title": null, "stem": "A 40-year-old woman with a severe flare of rheumatoid arthritis is given oral prednisone, which reduces her pain and swelling within days. By which mechanism does prednisone reduce inflammatory mediators?", "options": [{"letter": "A", "text": "It irreversibly acetylates COX-1 in platelets"}, {"letter": "B", "text": "It acts on a nuclear receptor to raise lipocortin, which inhibits phospholipase A2"}, {"letter": "C", "text": "It reversibly inhibits COX-1 and COX-2"}, {"letter": "D", "text": "It activates mu opioid receptors on nociceptors"}, {"letter": "E", "text": "It binds the alpha-2-delta subunit of voltage-gated calcium channels"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Pain Medications", "topic": "Pain Medications", "note": null, "blueprint_category": "Pain Medications", "learning_objective": "Pain Medications LO1", "difficulty": 2, "format": "vignette", "drug_item": "mechanism", "laterality": false, "thursday_11_5": false, "explanation": "Glucocorticoids act through a nuclear receptor to alter gene transcription; they increase lipocortin (annexin), which inhibits phospholipase A2 and so reduces arachidonic acid and all its downstream inflammatory mediators.", "distractor_explanations": {"A": "That is aspirin's mechanism.", "C": "That is the mechanism of NSAIDs such as ibuprofen and naproxen.", "D": "That is the opioid mechanism.", "E": "That is how gabapentin and pregabalin act."}, "source": "Wk2 packet p.90 ('increase in a peptide called lipocortin. Lipocortin inhibits phospholipase A2'); Pain Medication slide 8; drug list, Exam 1 Pain: Prednisone (bold) 'As above' (lipocortin, nuclear receptor)"}, {"id": "mk3-q68", "n": 68, "part": 1, "title": null, "stem": "A newborn has a cleft that runs from the upper lip, lateral to the nose, up to the medial corner of the eye, exposing the nasolacrimal duct. Failure of fusion between which structures caused this?", "options": [{"letter": "A", "text": "Medial nasal prominence and maxillary prominence"}, {"letter": "B", "text": "Both medial nasal prominences"}, {"letter": "C", "text": "Palatine shelves of the maxillary prominences"}, {"letter": "D", "text": "Mandibular prominences"}, {"letter": "E", "text": "Maxillary prominence and lateral nasal prominence"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Face Embryology", "topic": "Face Embryology", "note": null, "blueprint_category": "Face Embryology", "learning_objective": "Facial Embryology LO6", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "An oblique facial cleft is failed fusion of the maxillary prominence with the lateral nasal prominence, usually exposing the nasolacrimal duct from the orbit to the nose.", "distractor_explanations": {"A": "That failure causes the common cleft lip beside the philtrum.", "B": "Failure in the midline gives a rare median cleft of the upper lip.", "C": "That causes a cleft of the secondary (posterior) palate.", "D": "Failure there affects the lower lip and jaw."}, "source": "Wk1 packet p.33 ('Oblique facial cleft: failed fusion of the maxillary prominence to the lateral nasal prominence. Usually exposes nasolacrimal duct'); Facial Embryology LO6"}, {"id": "mk3-q69", "n": 69, "part": 1, "title": null, "stem": "After surgery near the pituitary stalk, a 35-year-old man passes 8 L of dilute urine a day and is constantly thirsty. His serum sodium is rising. Loss of which hormone, made by which neurons, explains this?", "options": [{"letter": "A", "text": "Oxytocin, made by arcuate neurons"}, {"letter": "B", "text": "Corticotropin-releasing hormone, made by parvocellular PVN neurons"}, {"letter": "C", "text": "Vasopressin (ADH), made by magnocellular neurons of the supraoptic and paraventricular nuclei"}, {"letter": "D", "text": "Dopamine, made by arcuate neurons"}, {"letter": "E", "text": "Melatonin, made by suprachiasmatic neurons"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Hypothalamus", "topic": "Hypothalamus", "note": null, "blueprint_category": "Hypothalamus", "learning_objective": "Hypothalamus LO3; Limbic LO1", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Central diabetes insipidus: supraoptic and PVN magnocellular neurons make vasopressin and send it down the stalk to the posterior pituitary; damage to this path stops vasopressin release, so the kidney cannot concentrate urine.", "distractor_explanations": {"A": "Oxytocin causes uterine contraction and milk ejection; it is not the antidiuretic hormone, and the arcuate does not make it.", "B": "CRH controls ACTH release; its loss does not cause large volumes of dilute urine.", "D": "Hypothalamic dopamine inhibits prolactin; it does not concentrate urine.", "E": "Melatonin comes from the pineal gland, and the SCN sets circadian timing."}, "source": "Wk3 packet p.4 (PVN and supraoptic magnocellular neurons express vasopressin and project to the posterior pituitary), p.6 (vasopressin causes water resorption by the renal tubules) and p.53 ('hypothalamic damage causes central diabetes insipidus')"}, {"id": "mk3-q70", "n": 70, "part": 1, "title": null, "stem": "An isolated axon is bathed in tetrodotoxin, which blocks voltage-gated Na+ channels. What happens when a strong stimulus is applied?", "options": [{"letter": "A", "text": "No action potential occurs, while the resting membrane potential stays about the same"}, {"letter": "B", "text": "The resting potential depolarizes to 0 mV"}, {"letter": "C", "text": "An action potential occurs but cannot repolarize"}, {"letter": "D", "text": "The axon fires repetitively"}, {"letter": "E", "text": "The membrane hyperpolarizes to the Na+ equilibrium potential"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Action Potentials", "topic": "Action Potentials", "note": null, "blueprint_category": "Action Potentials", "learning_objective": "AP LO4-5, LO11", "difficulty": 2, "format": "research scenario", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The upstroke of the action potential depends on voltage-gated Na+ channels; blocking them abolishes the action potential, while the resting potential (set mainly by K+ leak and the pump) is unchanged.", "distractor_explanations": {"B": "At rest few Na+ channels are open, so blocking them barely changes the resting potential.", "C": "Without Na+ channels there is no upstroke at all.", "D": "Blocking Na+ channels prevents firing rather than causing it.", "E": "E(Na) is strongly positive; the membrane cannot move there without Na+ permeability."}, "source": "AP LO4-5, LO11 (Wk3 packet p.44: sequence of Na+ and K+ channel activity; predict effects of changing Na+ channel activation/inactivation)"}, {"id": "mk3-q71", "n": 71, "part": 1, "title": null, "stem": "A 33-year-old man has 1-minute episodes of rhythmic twitching of his right hand. During each episode he can talk with his wife and later describes everything that happened. What type of seizure is this?", "options": [{"letter": "A", "text": "Focal aware seizure"}, {"letter": "B", "text": "Focal impaired awareness seizure"}, {"letter": "C", "text": "Absence seizure"}, {"letter": "D", "text": "Generalized tonic-clonic seizure"}, {"letter": "E", "text": "Atonic seizure"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Seizures & Epilepsy", "topic": "Seizures & Epilepsy", "note": null, "blueprint_category": "Seizures & Epilepsy", "learning_objective": "Seizures LO5-6", "difficulty": 1, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": true, "explanation": "A focal aware seizure begins in one hemisphere's network and leaves awareness intact; symptoms depend on the network involved, here motor cortex for the hand.", "distractor_explanations": {"B": "In these, awareness is impaired, so he could not interact normally or recall the event.", "C": "Absence seizures are brief generalized staring spells with impaired awareness.", "D": "These cause loss of consciousness with stiffening and jerking of the whole body.", "E": "These cause sudden loss of tone and falls."}, "source": "Wk3 packet p.139 (LO6: 'In a focal aware seizure, the patient remains aware of themselves and their surroundings ... rhythmic twitching of one hand'); Seizures LO5-6"}, {"id": "mk3-q72", "n": 72, "part": 1, "title": null, "stem": "Compared with a ligand-gated ion channel such as the nicotinic receptor, a G-protein-coupled receptor typically produces responses that are:", "options": [{"letter": "A", "text": "Faster, because the receptor is itself an ion channel"}, {"letter": "B", "text": "Limited to the nucleus, by changing gene transcription directly"}, {"letter": "C", "text": "Present only at the neuromuscular junction"}, {"letter": "D", "text": "Slower and longer lasting, through second messengers and enzymes that can open or close channels indirectly"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Synaptic transmission and neurotransmitters", "topic": "Synaptic transmission and neurotransmitters", "note": null, "blueprint_category": "Synaptic transmission and neurotransmitters", "learning_objective": "Synaptic Transmission LO6, LO8", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "GPCRs activate G proteins that regulate enzymes (adenylyl cyclase, phospholipases, kinases) and indirectly ion channels, giving slower, modulatory, longer-lasting effects than ionotropic receptors.", "distractor_explanations": {"A": "Ligand-gated channels are the fast receptors; GPCRs act indirectly.", "B": "That describes nuclear (steroid) receptors.", "C": "GPCRs are found throughout the nervous system, including autonomic adrenergic and muscarinic receptors."}, "source": "Wk3 packet p.32 (GPCRs act via G proteins on adenylyl cyclase, phospholipase A2, kinases 'and indirectly ion channels ... found throughout the nervous system'); Synaptic Transmission LO6, LO8"}, {"id": "mk3-q73", "n": 73, "part": 1, "title": null, "stem": "A 34-year-old woman with severe vomiting has a serum potassium of 2.4 mEq/L and generalized muscle weakness. How does the low extracellular K+ most directly affect her nerve and muscle cells?", "options": [{"letter": "A", "text": "The resting potential becomes less negative, inactivating Na+ channels"}, {"letter": "B", "text": "The resting potential becomes more negative, so a larger stimulus is needed to reach threshold"}, {"letter": "C", "text": "The Na+ equilibrium potential falls, lowering the action potential peak"}, {"letter": "D", "text": "The cells stay depolarized and fire repeatedly"}, {"letter": "E", "text": "The resting potential does not change, because K+ is not permeant at rest"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Action Potentials", "topic": "Action Potentials", "note": null, "blueprint_category": "Action Potentials", "learning_objective": "AP LO3, LO6", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Lower extracellular K+ steepens the K+ gradient, making E(K) and the resting potential more negative (hyperpolarized); the cell sits farther from threshold and is less excitable.", "distractor_explanations": {"A": "That is the effect of high extracellular K+.", "C": "Changing K+ does not change E(Na).", "D": "Hypokalemia hyperpolarizes cells and makes firing harder.", "E": "The resting membrane is mainly K+-permeable, so changing extracellular K+ moves the resting potential."}, "source": "AP LO3, LO6 (Wk3 packet p.44: predict how changing ion concentrations alters the membrane potential and how the resting potential influences the action potential)"}, {"id": "mk3-q74", "n": 74, "part": 1, "title": null, "stem": "Which receptor detects tension at the muscle-tendon junction and sends its signal on large, fast Ib axons?", "options": [{"letter": "A", "text": "Muscle spindle"}, {"letter": "B", "text": "Meissner corpuscle"}, {"letter": "C", "text": "Golgi tendon organ"}, {"letter": "D", "text": "Free nerve ending"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Somatosensory Receptors and Tracts", "topic": "Somatosensory Receptors and Tracts", "note": null, "blueprint_category": "Somatosensory Receptors and Tracts", "learning_objective": "Sensory Receptors LO1-2", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Golgi tendon organs are proprioceptors in tendons that detect changes as muscles contract and stretch the tendon; they use Aα (Ib) axons, the largest and fastest myelinated fibers.", "distractor_explanations": {"A": "It lies among the muscle fibers and detects changes in muscle length (Ia and II afferents).", "B": "It is a skin receptor for light touch and low-frequency flutter.", "D": "It detects pain and temperature on small, slow fibers."}, "source": "Wk2 packet p.6 ('Golgi Tendon Organs ... detect stretching- and compression-related changes in tendons ... Aα: largest diameter, fastest conducting myelinated axons (Lloyd classification: Ia and Ib)'); Sensory Receptors LO1-2"}, {"id": "mk3-q75", "n": 75, "part": 1, "title": null, "stem": "A 62-year-old man with long-standing type 2 diabetes develops severe pain in his right thigh over 2 weeks, followed by weakness of hip flexion and knee extension and a reduced right knee reflex. Lumbar MRI shows no disc herniation or stenosis. What is the most likely diagnosis?", "options": [{"letter": "A", "text": "L5 radiculopathy from a disc herniation"}, {"letter": "B", "text": "Distal symmetric diabetic polyneuropathy"}, {"letter": "C", "text": "Cauda equina syndrome"}, {"letter": "D", "text": "Guillain-Barré syndrome"}, {"letter": "E", "text": "Diabetic amyotrophy"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Radiculopathy; Spinal cord imaging", "topic": "Radiculopathy; Spinal cord imaging", "note": null, "blueprint_category": "Radiculopathy; Spinal cord imaging", "learning_objective": "Radiculopathy LO1", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "In diabetes, microvascular ischemia of the L2-L4 roots can cause diabetic amyotrophy (proximal diabetic neuropathy): acute thigh pain followed by proximal leg weakness and wasting, a non-compressive radiculopathy.", "distractor_explanations": {"A": "MRI shows no disc, and L5 affects the lateral leg and foot dorsiflexion.", "B": "That is a slow, length-dependent sensory neuropathy of both feet, not acute proximal thigh weakness.", "C": "It causes saddle anesthesia and bladder dysfunction from compression of many roots.", "D": "GBS is a symmetric, ascending weakness over days with areflexia."}, "source": "Radiculopathy slide 11 ('Diabetes ... L2-L4 nerve roots most susceptible ... diabetic amyotrophy a rare form of diabetic neuropathy in which muscles lose innervation and become weak'); Wk2 packet p.117"}, {"id": "mk3-q76", "n": 76, "part": 1, "title": null, "stem": "A 78-year-old woman with focal seizures is started on an antiseizure drug that prolongs fast inactivation of voltage-gated Na+ channels. Two weeks later she is confused and her serum sodium is 124 mEq/L. Which drug is the most likely cause?", "options": [{"letter": "A", "text": "Levetiracetam"}, {"letter": "B", "text": "Ethosuximide"}, {"letter": "C", "text": "Lacosamide"}, {"letter": "D", "text": "Oxcarbazepine"}, {"letter": "E", "text": "Gabapentin"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Antiepileptics", "topic": "Antiepileptics", "note": null, "blueprint_category": "Antiepileptics", "learning_objective": "Antiepileptics LO2", "difficulty": 2, "format": "vignette", "drug_item": "side effect", "laterality": false, "thursday_11_5": true, "explanation": "Oxcarbazepine prolongs fast Na+ channel inactivation; its key adverse effect is hyponatremia, worse in the elderly (carbamazepine also causes hyponatremia).", "distractor_explanations": {"A": "Its main effects are sedation, weakness and mood changes such as irritability, not hyponatremia.", "B": "It blocks T-type Ca2+ channels and is used for absence seizures.", "C": "It enhances slow, not fast, inactivation of Na+ channels and is not known for hyponatremia.", "E": "It reduces membrane Ca2+ channels and causes sedation and edema, not hyponatremia."}, "source": "Drug list, Exam 1 'Epilepsy Medications': Oxcarbazepine (bold) 'Prolong fast inactivation of voltage gated sodium channels ... Hyponatremia - worse in elderly'; Levetiracetam, Ethosuximide, Lacosamide, Gabapentin rows"}, {"id": "mk3-q77", "n": 77, "part": 1, "title": null, "stem": "Long-term depression (LTD) at hippocampal or cerebellar synapses mainly involves:", "options": [{"letter": "A", "text": "A lasting decrease in postsynaptic AMPA receptors, weakening the synapse"}, {"letter": "B", "text": "Insertion of extra AMPA receptors into the postsynaptic membrane"}, {"letter": "C", "text": "Permanent destruction of the presynaptic neuron"}, {"letter": "D", "text": "An increase in presynaptic glutamate release"}, {"letter": "E", "text": "Removal of the Mg2+ block from NMDA receptors at rest"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Memory Formation", "topic": "Memory Formation", "note": null, "blueprint_category": "Memory Formation", "learning_objective": "Learning & Memory LO14", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "In LTD, loss of synaptic excitability and reduced synthesis of particular proteins lead to fewer AMPA receptors (hippocampus, cerebellum), a form of plasticity that prunes less useful connections.", "distractor_explanations": {"B": "That is a mechanism of long-term potentiation.", "C": "LTD is a reversible change in synaptic strength, not cell death.", "D": "More release would strengthen the synapse.", "E": "This would favor potentiation, not depression."}, "source": "Wk3 packet p.71 ('LTD results when there is a loss of synaptic excitability ... a decrease in receptors such as the AMPA receptor in areas of the hippocampus or cerebellum'); Learning & Memory LO14"}, {"id": "mk3-q78", "n": 78, "part": 2, "title": "Gross anatomy lab image: Face", "stem": "A nerve block at the opening indicated by the arrow would numb which area?", "options": [{"letter": "A", "text": "The lower teeth on that side"}, {"letter": "B", "text": "The upper lip and cheek"}, {"letter": "C", "text": "The anterior two-thirds of the tongue"}, {"letter": "D", "text": "The skin over the angle of the mandible"}, {"letter": "E", "text": "The skin of the lower lip and chin on that side"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock3-images/lab-face-1.png", "image_needed": true, "week": 1, "session_guess": "Lab 1 (10/20)", "topic": "Face", "note": null, "blueprint_category": "Gross Anatomy Lab Image: Face", "learning_objective": "Lab 1 (10/20) LO1 (identify structures on the structure list); LO5 (dysfunction after injury)", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrow is on the mental foramen of the mandible. The mental nerve (end branch of the inferior alveolar nerve, V3) leaves here to supply the skin of the lower lip and chin.", "distractor_explanations": {"A": "The lower teeth are supplied by the inferior alveolar nerve inside the mandibular canal, before this branch leaves the bone.", "B": "These are supplied by the infraorbital nerve (V2), which exits below the orbit.", "C": "This is the lingual nerve (V3), which never enters the mandible.", "D": "This area is supplied by the great auricular nerve (C2-C3), not the trigeminal nerve."}, "source": "Lab 1 notes p.3, Fig. 2 (lateral skull; 'Mental foramen' label); Lab 1 structure list (Nerves, Face: Mental nerve); Face ILM LO6", "annotation": {"image": "qbank/midterm1-mock3-images/annotated/lab-face-1.png", "options": {"E": "Labeled \"Mental foramen\" (arrowed)"}, "note": "The other options are skin or tooth areas served by nerves that leave the skull elsewhere; their openings are outside this view.", "how": "Same faculty figure with its labels uncovered (cropped wider). Green box = correct answer; red boxes = other answer choices the figure labels. Arrow redrawn where the question placed it.", "marked": ["E"]}}, {"id": "mk3-q79", "n": 79, "part": 2, "title": "Gross anatomy lab image: Face", "stem": "Identify the nerve indicated by the arrow on this diagram of the sensory nerves of the face.", "options": [{"letter": "A", "text": "Zygomaticotemporal nerve (V2)"}, {"letter": "B", "text": "Great auricular nerve (C2-C3)"}, {"letter": "C", "text": "Auriculotemporal nerve (V3)"}, {"letter": "D", "text": "Supraorbital nerve (V1)"}, {"letter": "E", "text": "Buccal nerve (V3)"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock3-images/lab-face-2.png", "image_needed": true, "week": 1, "session_guess": "Lab 1 (10/20)", "topic": "Face", "note": null, "blueprint_category": "Gross Anatomy Lab Image: Face", "learning_objective": "Lab 1 (10/20) LO1 (identify structures on the structure list)", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrow is on the nerve running up just in front of the ear into the temple: the 'Auriculotemporal n.' label, a branch of V3.", "distractor_explanations": {"A": "It emerges higher, in the temple region behind the orbit.", "B": "It comes up from the neck over the sternocleidomastoid to the ear and angle of the jaw.", "D": "It runs up over the forehead from the upper orbital margin.", "E": "It supplies the cheek lower down, in front of the masseter."}, "source": "Lab 1 notes p.7, Fig. 10 (superficial branches of CN V; 'Auriculotemporal n.' label); Lab 1 structure list (Nerves, Face: Auriculotemporal nerve)", "annotation": {"image": "qbank/midterm1-mock3-images/annotated/lab-face-2.png", "options": {"C": "Labeled \"Auriculotemporal n.\" (arrowed, V3)", "A": "Labeled \"Zygomaticotemporal n.\" (V2, temple)", "B": "The nerve is not drawn; only its skin territory is (the pink \"C2–C3\" zone over the angle of the jaw and the ear)", "D": "Labeled \"Supraorbital n.\" (V1, forehead)", "E": "Labeled \"Buccal n.\" (V3, cheek)"}, "note": null, "how": "Same faculty figure with its labels uncovered (cropped wider). Green box = correct answer; red boxes = other answer choices the figure labels. Arrow redrawn where the question placed it.", "marked": ["A", "B", "C", "D", "E"]}}, {"id": "mk3-q80", "n": 80, "part": 2, "title": "Gross anatomy lab image: Face", "stem": "If the nerve supplying the muscle indicated by the arrow is cut, what will the pati
