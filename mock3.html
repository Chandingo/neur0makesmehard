<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Midterm 1 Mock #3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: sticky exam bar; question column (serif stems, like a printed exam) + item navigator rail; rail drops below on phones. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --ink:#15202b; --muted:#5a6976; --line:#d3dce3;
  --accent:#1d5f8a; --accent-ink:#ffffff; --accent-soft:#dfebf4;
  --flag:#a86a12; --ok:#21764a; --ok-soft:#e1f1e8; --bad:#b1352d; --bad-soft:#f7e2e0;
  --hl:#fbe68a; --hl-ink:#15202b;
  --font-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#151e27; --ink:#e3e9ee; --muted:#93a2ae; --line:#283541;
  --accent:#6db3df; --accent-ink:#0b1620; --accent-soft:#183245;
  --flag:#e3aa4f; --ok:#5ec48b; --ok-soft:#153424; --bad:#ef7f75; --bad-soft:#3b1d1b; --hl:#6b5a14; --hl-ink:#fff6d6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#151e27; --ink:#e3e9ee; --muted:#93a2ae; --line:#283541;
  --accent:#6db3df; --accent-ink:#0b1620; --accent-soft:#183245;
  --flag:#e3aa4f; --ok:#5ec48b; --ok-soft:#153424; --bad:#ef7f75; --bad-soft:#3b1d1b; --hl:#6b5a14; --hl-ink:#fff6d6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand b{font-weight:600;font-size:16px;letter-spacing:.01em}
.brand span{color:var(--muted);font-size:12.5px}
.meters{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.meter{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.meter small{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meter .mono{font-size:15px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-size:13.5px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 6px}
.btn.ghost:hover{color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
main{min-width:0}

/* question */
.qhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:12px}
.qnum{font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.qnum b{color:var(--ink);font-size:20px;font-weight:500;margin-right:4px}
.tag{font-size:11.5px;letter-spacing:.04em;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.thu{border-color:var(--flag);color:var(--flag)}
.spacer{margin-left:auto}
.flagbtn{display:inline-flex;align-items:center;gap:6px}
.flagbtn[aria-pressed="true"]{color:var(--flag);border-color:var(--flag)}
.flagbtn svg{width:14px;height:14px}
.stem{font-family:var(--font-body);font-size:18px;line-height:1.6;max-width:68ch;margin:0 0 16px;cursor:text}
.stem mark{background:var(--hl);color:var(--hl-ink);border-radius:2px;padding:0 1px;cursor:pointer}
.stem mark:hover{text-decoration:line-through;text-decoration-thickness:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:none;background:transparent;padding:6px 10px;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg-l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.meter.clock{cursor:pointer;background:transparent;border:none;padding:0;font:inherit;color:inherit}
.live{color:var(--ok)}
.figure{margin:0 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:inline-block;max-width:100%}
.figure img{display:block;max-height:460px;width:auto;max-width:100%;border-radius:4px;cursor:zoom-in}
.ann{margin:14px 0 4px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ann-h{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.ann img{display:block;max-width:100%;max-height:620px;width:auto;border-radius:4px;cursor:zoom-in;background:#fff}
.ann .how{font-size:12.5px;color:var(--muted);margin:8px 0 6px}
.ann ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.ann li{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;line-height:1.45}
.ann .dot{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 12px var(--font-mono);margin-top:1px}
.ann .dot.k{background:#169646}.ann .dot.d{background:#d63c32}.ann .dot.n{background:transparent;color:var(--muted);border:1px solid var(--line)}
.ann .note{font-size:13.5px;color:var(--muted);margin-top:8px}
.figure figcaption{font-size:12px;color:var(--muted);margin-top:6px}
.opts{display:flex;flex-direction:column;gap:8px;max-width:72ch}
.optrow{display:flex;gap:6px;align-items:stretch}
.opt{flex:1;min-width:0;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 14px;font-family:var(--font-body);font-size:16.5px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .L{font-family:var(--font-mono);font-size:13.5px;flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;margin-top:1px;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .L{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.struck .T{text-decoration:line-through;color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default;color:inherit}
.strike{flex:none;width:36px;border:1px solid transparent;background:transparent;border-radius:8px;color:var(--muted);font-size:13px}
.strike:hover{border-color:var(--line);color:var(--ink)}
.qnav{display:flex;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted)}
.hint kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}

.explain{margin-top:20px;max-width:72ch;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.explain .verdict{font-weight:600}
.explain .verdict.ok{color:var(--ok)} .explain .verdict.bad{color:var(--bad)}
.explain p{margin:0;font-family:var(--font-body);font-size:16px;line-height:1.55}
.whynot-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.whynot ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-family:var(--font-body);font-size:15px;line-height:1.5}
.whynot b{font-weight:600}
.explain dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.explain dt{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:11px;padding-top:2px}
.explain dd{margin:0}

/* rail */
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:calc(100vh - 100px);overflow:auto}
@media (max-width:860px){aside{position:static;max-height:none}}
.rail-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:4px}
.cell{position:relative;height:30px;border:1px solid var(--line);background:transparent;border-radius:5px;font-family:var(--font-mono);font-size:12px;color:var(--muted);padding:0}
.cell.ans{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.cell.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.cell.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.cell.skip{border-style:dashed;border-color:var(--bad);color:var(--bad)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--ink)}
.cell.flg::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--flag)}
.cell.dim{opacity:.25}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:3px 10px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.sync{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.sync.warn{color:var(--flag)}

/* results */
.results h2{font-family:var(--font-body);font-weight:600;font-size:28px;margin:0 0 4px;text-wrap:balance}
.results .sub{color:var(--muted);margin:0 0 20px}
.score{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;min-width:140px;flex:1}
.stat small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .mono{font-size:24px}
.stat .mono em{font-style:normal;font-size:14px;color:var(--muted);margin-left:6px}
.stat.lead{border-color:var(--accent)}
.section-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 8px}
.bars{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;font-size:13.5px}
.track{height:10px;background:var(--bad-soft);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--ok)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:none}
td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.miss{display:inline-block;font-family:var(--font-mono);font-size:12px;border:1px solid var(--bad);color:var(--bad);border-radius:4px;padding:0 6px;margin:0 4px 4px 0;background:transparent}
.miss.skipd{border-style:dashed}
.hist{font-size:13px;color:var(--muted)}
.hist li{margin-bottom:2px}

/* dialog + lightbox */
.scrim{position:fixed;inset:0;background:rgba(5,10,15,.55);z-index:20;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
.dialog h3{margin:0;font-size:17px}
.dialog p{margin:0;color:var(--muted)}
.dialog .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.lightbox img{max-width:100%;max-height:calc(100vh - 60px);border-radius:6px;background:#fff;cursor:zoom-out}
@media (prefers-reduced-motion:no-preference){.opt,.cell,.btn{transition:border-color .12s,background-color .12s}}
</style>

_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Face Anatomy", "topic": "Face Anatomy", "note": null, "blueprint_category": "Face Anatomy", "learning_objective": "Face ILM LO5", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Course framing: most facial veins drain into the retromandibular vein behind the ramus, which empties into the external jugular vein in the superficial neck (with frequent connections to the internal jugular vein).", "distractor_explanations": {"B": "The retromandibular vein's main drainage is into the external jugular vein, which in turn reaches the subclavian vein.", "C": "The face connects with the cavernous sinus through the ophthalmic veins and pterygoid plexus, not as its main drainage.", "D": "It drains the cervical spine region, not the face."}, "source": "Wk1 packet p.48 ('...a large Retromandibular Vein posterior to the mandibular ramus that dumps into the External Jugular Vein'); ILM Anatomy of the Face slide 20"}, {"id": "mk3-q02", "n": 2, "part": 1, "title": null, "stem": "On this axial T1-weighted MRI at the level of the pons, through which openings does CSF normally leave the cavity marked by the arrow?", "options": [{"letter": "A", "text": "The interventricular foramina into the lateral ventricles"}, {"letter": "B", "text": "The cerebral aqueduct into the third ventricle"}, {"letter": "C", "text": "The arachnoid granulations into the superior sagittal sinus"}, {"letter": "D", "text": "The central canal into the lumbar cistern"}, {"letter": "E", "text": "The median aperture (Magendie) and lateral apertures (Luschka) into the subarachnoid space"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock3-images/s-imaging-4thvent.png", "image_needed": true, "week": 1, "session_guess": "Imaging Techniques for the Head and Brain", "topic": "Imaging Techniques for the Head and Brain", "note": null, "blueprint_category": "Imaging Techniques for the Head and Brain", "learning_objective": "Imaging Techniques LO3; Protecting the Brain LO2", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrow is on the fourth ventricle (labeled on the same slice in the deck). CSF leaves it through the median aperture of Magendie and the paired lateral apertures of Luschka into the subarachnoid space.", "distractor_explanations": {"A": "These connect the lateral ventricles to the third ventricle, above this level.", "B": "CSF flows the other way, from the aqueduct down into this space.", "C": "Absorption happens there, after CSF has left the ventricles.", "D": "The central canal is a tiny dead-end channel; it is not the main outflow."}, "source": "Imaging Techniques deck, labeled slide 156 ('Fourth Ventricle', image used without labels); Wk1 packet p.117 ('exits through the median aperture of Magendie and the paired lateral apertures of Luschka'); Imaging LO3", "annotation": {"image": "qbank/midterm1-mock3-images/annotated/s-imaging-4thvent.png", "options": {"E": "Labeled \"Fourth Ventricle\" (the arrowed cavity)"}, "note": "A–D are CSF pathways, not structures on this slice; the \"Pons\" label sits just in front of the ventricle.", "how": "Same faculty figure with its labels uncovered (cropped wider). Green box = correct answer; red boxes = other answer choices the figure labels. Arrow redrawn where the question placed it.", "marked": ["E"]}}, {"id": "mk3-q03", "n": 3, "part": 1, "title": null, "stem": "Which fiber tract carries output from the hippocampal formation to the mammillary bodies of the hypothalamus?", "options": [{"letter": "A", "text": "Mammillothalamic tract"}, {"letter": "B", "text": "Fornix"}, {"letter": "C", "text": "Stria terminalis"}, {"letter": "D", "text": "Medial forebrain bundle"}, {"letter": "E", "text": "Retinohypothalamic tract"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Hypothalamus", "topic": "Hypothalamus", "note": null, "blueprint_category": "Hypothalamus", "learning_objective": "Hypothalamus LO1", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The fornix arches from the hippocampus under the corpus callosum and ends mainly in the mammillary bodies; the mammillothalamic tract continues the circuit to the anterior thalamus.", "distractor_explanations": {"A": "It carries signals onward from the mammillary bodies to the anterior thalamic nucleus.", "C": "It connects the amygdala with the hypothalamus and septal region.", "D": "It runs through the lateral hypothalamus linking the brainstem and basal forebrain.", "E": "It carries retinal light information to the suprachiasmatic nucleus."}, "source": "Hypothalamus LO1 (Wk3 packet p.1-2: major fiber tracts to and from the hypothalamus); Lab 3 notes text (mammillothalamic tract from mammillary body to anterior thalamic nucleus); Learning & Memory LO2-3"}, {"id": "mk3-q04", "n": 4, "part": 1, "title": null, "stem": "The spinal accessory nerve has an unusual course. Its rootlets arise from the upper cervical cord and run upward into the skull through which opening, before leaving the skull again through the jugular foramen?", "options": [{"letter": "A", "text": "Hypoglossal canal"}, {"letter": "B", "text": "Foramen ovale"}, {"letter": "C", "text": "Stylomastoid foramen"}, {"letter": "D", "text": "Foramen magnum"}, {"letter": "E", "text": "Internal acoustic meatus"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Cranial Nerves Module", "topic": "Cranial Nerves Module", "note": null, "blueprint_category": "Cranial Nerves Module", "learning_objective": "CN Modules LO2", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "CN XI arises from the cervical spinal cord, ascends through the foramen magnum and exits via the jugular foramen with IX and X to reach the sternocleidomastoid and trapezius.", "distractor_explanations": {"A": "It carries CN XII out of the skull.", "B": "It carries V3.", "C": "It carries the motor root of CN VII.", "E": "It carries CN VII and VIII from the posterior fossa into the temporal bone."}, "source": "Wk1 packet p.68 (CN XI 'enters the skull through the foramen magnum. It leaves via the jugular foramen with the other CN to the neck (IX and X)') and p.56 table (foramen magnum contents)"}, {"id": "mk3-q05", "n": 5, "part": 1, "title": null, "stem": "A 69-year-old woman suddenly develops weakness and numbness of her right leg and foot. Her right arm and face are normal, and her speech is normal. Occlusion of which artery best explains this?", "options": [{"letter": "A", "text": "Left middle cerebral artery"}, {"letter": "B", "text": "Right anterior cerebral artery"}, {"letter": "C", "text": "Left anterior cerebral artery"}, {"letter": "D", "text": "Left posterior cerebral artery"}, {"letter": "E", "text": "Basilar artery"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Protecting the Brain", "topic": "Protecting the Brain", "note": null, "blueprint_category": "Protecting the Brain", "learning_objective": "Protecting the Brain LO1", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": true, "thursday_11_5": false, "explanation": "The ACA supplies the medial frontal and parietal surfaces, where the leg and foot areas of the motor and sensory cortex lie, so ACA occlusion causes contralateral leg-predominant weakness and sensory loss.", "distractor_explanations": {"A": "The MCA supplies the lateral hemisphere, so it affects the face and arm more than the leg, and causes aphasia on the left.", "B": "The right ACA supplies the right medial hemisphere, which controls the left leg.", "D": "The PCA supplies the occipital lobe and medial temporal lobe, causing visual field loss.", "E": "Basilar occlusion affects the brainstem, with cranial nerve signs and often both sides."}, "source": "Wk1 packet p.92 ('The ACAs ... supply the orbital and medial surfaces of the frontal lobe as well as the medial surface of the parietal lobe'); Protecting the Brain LO1. Homunculus placement: Wk2 packet (S1 somatotopy) / standard neuroanatomy"}, {"id": "mk3-q06", "n": 6, "part": 1, "title": null, "stem": "Six weeks after a summer camping trip in Connecticut, a 32-year-old man develops weakness of both sides of his face and shooting pains in a band around his chest. He recalls an expanding red rash on his thigh a month earlier. What is the most likely cause?", "options": [{"letter": "A", "text": "Borrelia burgdorferi infection"}, {"letter": "B", "text": "Campylobacter jejuni infection"}, {"letter": "C", "text": "Vitamin B12 deficiency"}, {"letter": "D", "text": "Chronic alcohol use"}, {"letter": "E", "text": "Lead poisoning"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Peripheral Neuropathies", "topic": "Peripheral Neuropathies", "note": null, "blueprint_category": "Peripheral Neuropathies", "learning_objective": "Peripheral Neuropathy LO3", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Lyme disease (tick-borne Borrelia burgdorferi) can cause cranial neuropathies such as facial nerve palsy (often bilateral) and painful radiculopathies after the expanding erythema migrans rash.", "distractor_explanations": {"B": "It is a trigger for Guillain-Barré syndrome, which causes ascending weakness without a preceding expanding rash.", "C": "It causes a slowly progressive symmetric neuropathy with dorsal column signs.", "D": "It causes a length-dependent sensory neuropathy, not facial palsies with a rash.", "E": "It causes motor neuropathy such as wrist drop, often with anemia and abdominal pain."}, "source": "Wk2 packet p.65 ('Lyme Disease: a tick-borne infection caused by the bacterium Borrelia burgdorferi ... cranial neuropathies, such as facial nerve palsy, or peripheral neuropathies presenting as radiculopathies'); Peripheral Neuropathy slide 23 (Ixodes tick; facial nerve palsy)"}, {"id": "mk3-q07", "n": 7, "part": 1, "title": null, "stem": "A 64-year-old man with hypertension has a small lacunar infarct in the posterior limb of the right internal capsule. He has weakness of the left face, arm and leg with no sensory loss. Why is the face involved along with the limbs?", "options": [{"letter": "A", "text": "Facial motor neurons are located in the internal capsule"}, {"letter": "B", "text": "The lesion has also damaged the right facial nerve"}, {"letter": "C", "text": "The corticospinal tract crosses in the internal capsule"}, {"letter": "D", "text": "The infarct extends into the left motor cortex"}, {"letter": "E", "text": "Corticobulbar and corticospinal fibers run together in the internal capsule before they separate"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Corticospinal and UMN/LMN", "topic": "Corticospinal and UMN/LMN", "note": null, "blueprint_category": "Corticospinal and UMN/LMN", "learning_objective": "Descending Motor Pathways LO2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "In the internal capsule the corticobulbar fibers (to brainstem motor nuclei) and corticospinal fibers travel close together, so a small capsular lesion causes a pure motor hemiparesis of the contralateral face, arm and leg.", "distractor_explanations": {"A": "Facial lower motor neurons are in the facial nucleus in the pons.", "B": "A peripheral facial nerve lesion would weaken the right face, including the forehead.", "C": "Corticospinal fibers cross in the caudal medulla; at the capsule they are still uncrossed.", "D": "A right capsular lacune does not reach the left hemisphere."}, "source": "Wk2 packet p.27 (lateral CST course from cortex through the brain and brainstem; crosses at the caudal-most medulla); Descending Motor Pathways LO2; Wk1 packet p.122 (lenticulostriate perforators to internal capsule)"}, {"id": "mk3-q08", "n": 8, "part": 1, "title": null, "stem": "A 70-year-old man has had several strokes. When the examiner taps his chin with the mouth slightly open, the jaw closes briskly and repeatedly. The reflex's sensory neurons and motor neurons are intact. What best explains the exaggerated response?", "options": [{"letter": "A", "text": "A lesion of the mesencephalic trigeminal nucleus"}, {"letter": "B", "text": "A lesion of the trigeminal motor nucleus"}, {"letter": "C", "text": "Loss of upper motor neuron (corticobulbar) input to the trigeminal motor nucleus, above the pons"}, {"letter": "D", "text": "A lesion of the mandibular nerve at the foramen ovale"}, {"letter": "E", "text": "A lesion of the facial nucleus"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Cranial Nerve Reflexes", "topic": "Cranial Nerve Reflexes", "note": null, "blueprint_category": "Cranial Nerve Reflexes", "learning_objective": "CN Reflexes LO1-3", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The jaw jerk is a monosynaptic stretch reflex (masseter spindles → V3 → mesencephalic nucleus → trigeminal motor nucleus → masseter). Like spinal stretch reflexes, it becomes brisk when descending UMN control is lost, as with bilateral corticobulbar damage above the pons.", "distractor_explanations": {"A": "Damage to the afferent cell bodies would reduce or abolish the reflex.", "B": "Damage to the lower motor neurons would weaken the reflex and the masseter.", "D": "This interrupts both limbs of the reflex and would abolish it.", "E": "The facial nucleus is not part of the jaw jerk circuit."}, "source": "Wk2 packet p.55 (jaw jerk reflex: masseter spindles, Ia afferents in V3, mesencephalic trigeminal nucleus, reflex center in the brainstem); CN Reflexes slide 31. Brisk jaw jerk as a UMN sign is standard neurology, beyond the packet"}, {"id": "mk3-q09", "n": 9, "part": 1, "title": null, "stem": "Which feature of brain capillaries is the main structural basis of the blood-brain barrier?", "options": [{"letter": "A", "text": "Fenestrated endothelium that lets solutes pass freely"}, {"letter": "B", "text": "Microglia that line the inside of the capillary wall"}, {"letter": "C", "text": "Ependymal cells that wrap each capillary"}, {"letter": "D", "text": "Tight junctions between endothelial cells, with a continuous basal lamina and astrocyte end-feet around them"}, {"letter": "E", "text": "Schwann cells forming a myelin sheath around each vessel"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Protecting the Brain", "topic": "Protecting the Brain", "note": null, "blueprint_category": "Protecting the Brain", "learning_objective": "Protecting the Brain LO7", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The BBB is formed by endothelial cells joined by tight junctions, a continuous basal lamina and astrocyte foot processes, which together exclude pathogens and large or hydrophilic molecules.", "distractor_explanations": {"A": "Fenestrations are found where the barrier is absent (e.g., choroid plexus), not in the barrier itself.", "B": "Microglia are resident phagocytes in the parenchyma, not part of the capillary wall.", "C": "Ependymal cells line the ventricles, not capillaries.", "E": "Schwann cells are peripheral myelinating cells."}, "source": "Wk1 packet p.107 (LO7: 'vascular endothelial cells with numerous tight junctions, surrounded by a continuous basal lamina, and ... foot processes from ... astrocytes'); Protecting the Brain slide 47"}, {"id": "mk3-q10", "n": 10, "part": 1, "title": null, "stem": "A 60-year-old man has a squamous cell carcinoma of the posterior tongue. Its lymph spreads first to nodes that lie along which structure?", "options": [{"letter": "A", "text": "The external jugular vein (superficial cervical nodes)"}, {"letter": "B", "text": "The internal jugular vein (deep cervical nodes)"}, {"letter": "C", "text": "The subclavian artery"}, {"letter": "D", "text": "The vertebral artery"}, {"letter": "E", "text": "The thoracic duct in the posterior mediastinum"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Neck Anatomy", "topic": "Neck Anatomy", "note": null, "blueprint_category": "Neck Anatomy", "learning_objective": "Neck ILM LO4", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Deep structures of the head (midline cavities, tongue) drain along arteries to the deep cervical nodes, which lie along the internal jugular vein; superficial tissues drain to superficial nodes along the external jugular vein.", "distractor_explanations": {"A": "Superficial nodes along the external jugular vein drain superficial tissues, not deep midline structures such as the tongue.", "C": "Nodes are not organized along the subclavian artery for head and neck drainage.", "D": "The vertebral artery runs in the transverse foramina, deep in the spine, with no node chain.", "E": "The thoracic duct receives lymph at the end of the pathway, not as the first nodal station."}, "source": "ILM Anatomy of the Neck slide 12 ('superficial cervical (along external jugular) or deep cervical (along internal jugular) · Deep drainage of face follows arteries to the deep cervical nodes'); Wk1 packet p.64"}, {"id": "mk3-q11", "n": 11, "part": 1, "title": null, "stem": "A 33-year-old man has 3 weeks of worsening headaches that are worst on waking, with nausea. Fundoscopy shows bilateral papilledema, and he has mild weakness of his left arm. What should be done first?", "options": [{"letter": "A", "text": "Lumbar puncture to measure opening pressure"}, {"letter": "B", "text": "A trial of sumatriptan"}, {"letter": "C", "text": "Start acetazolamide for presumed idiopathic intracranial hypertension"}, {"letter": "D", "text": "Brain imaging (CT or MRI) before any lumbar puncture"}, {"letter": "E", "text": "Reassure him and review in 3 months"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Headaches", "topic": "Headaches", "note": null, "blueprint_category": "Headaches", "learning_objective": "Headache LO5, LO9", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Progressive headache worse on waking, papilledema and a focal deficit suggest raised ICP from a mass; neuroimaging comes first, and LP is avoided until a mass lesion is excluded.", "distractor_explanations": {"A": "With a focal deficit and papilledema, an LP before imaging risks herniation if there is a mass.", "B": "Red flags (papilledema, focal deficit, progressive course) rule out treating this as primary headache first.", "C": "IIH is a diagnosis made after imaging excludes a mass and shows no other cause.", "E": "Papilledema with a focal deficit needs urgent evaluation."}, "source": "Wk2 packet p.139 (evaluation: papilledema; localizing neurological deficits) and p.140 (SNOOP red flags); Headache LO5, LO9 (p.130); Wk1 packet p.132 (headache worse on waking with raised ICP). LP-after-imaging rule is standard practice"}, {"id": "mk3-q12", "n": 12, "part": 1, "title": null, "stem": "A 21-year-old man is found on the floor after a witnessed event in which he stiffened and then jerked all four limbs for about a minute. Afterward he is confused for 30 minutes and has bitten the side of his tongue. Which feature most supports an epileptic seizure over fainting (syncope)?", "options": [{"letter": "A", "text": "Brief loss of consciousness"}, {"letter": "B", "text": "Lateral tongue biting with prolonged postictal confusion"}, {"letter": "C", "text": "Pale skin before the event"}, {"letter": "D", "text": "Rapid return to full alertness within seconds"}, {"letter": "E", "text": "A few brief jerks lasting 2-3 seconds"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Seizures & Epilepsy", "topic": "Seizures & Epilepsy", "note": null, "blueprint_category": "Seizures & Epilepsy", "learning_objective": "Seizures LO7", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": true, "explanation": "A generalized tonic-clonic seizure has a tonic then clonic phase followed by postictal confusion; lateral tongue biting is more suggestive of an epileptic convulsion than a tip-of-tongue injury, though neither finding is diagnostic alone.", "distractor_explanations": {"A": "Both seizures and syncope cause loss of consciousness.", "C": "Pallor before collapse suggests syncope.", "D": "Quick recovery is typical of syncope, not a tonic-clonic seizure.", "E": "A few brief jerks can occur in syncope as well."}, "source": "Wk3 packet p.140 (GTC: tonic then clonic phases, postictal confusion; 'Lateral tongue biting is more suggestive of an epileptic convulsion than injury to the tip of the tongue'); Seizures LO7"}, {"id": "mk3-q13", "n": 13, "part": 1, "title": null, "stem": "In the developing cerebral cortex, how are neurons arranged by birth date?", "options": [{"letter": "A", "text": "The first-born neurons occupy the most superficial layer"}, {"letter": "B", "text": "All layers are formed at the same time from separate progenitors"}, {"letter": "C", "text": "Neurons migrate tangentially from the cortical surface toward the ventricle"}, {"letter": "D", "text": "Neurons are born in the cortical plate and do not migrate"}, {"letter": "E", "text": "The first-born neurons occupy the deepest layers, and each later wave migrates past them to more superficial layers"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Embryology of CNS PNS", "topic": "Embryology of CNS PNS", "note": null, "blueprint_category": "Embryology of CNS PNS", "learning_objective": "Embryology CNS/PNS LO7", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Cortical layering is inside-out: early-born neurons migrate first and form the deep layers, and later-born neurons migrate past them to form more superficial layers.", "distractor_explanations": {"A": "The pattern is inside-out: the oldest neurons end up deepest.", "B": "Layers form in sequence, not simultaneously.", "C": "Radial migration runs outward from the ventricular zone along radial glia.", "D": "Neurons are born in the ventricular zone and migrate to the cortical plate."}, "source": "Wk1 packet p.151 ('the last born neurons are in the outermost layer, and the oldest or first-born neurons are in the deepest layer'); Embryology CNS/PNS LO7"}, {"id": "mk3-q14", "n": 14, "part": 1, "title": null, "stem": "Spinal cord sections from segments C5-T1 show unusually large ventral horns. What do these enlarged horns contain?", "options": [{"letter": "A", "text": "Large numbers of lower motor neurons for the brachial plexus"}, {"letter": "B", "text": "Preganglionic sympathetic neurons for the upper limb"}, {"letter": "C", "text": "Second-order pain neurons for the upper limb"}, {"letter": "D", "text": "Cell bodies of the dorsal columns"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Spinal Cord", "topic": "Spinal Cord", "note": null, "blueprint_category": "Spinal Cord", "learning_objective": "Spinal Cord LO3", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The cervical enlargement (C5-T1) has big ventral horns full of lower motor neurons for the upper limb (brachial plexus); the lumbar enlargement does the same for the lower limb.", "distractor_explanations": {"B": "These lie in the small lateral horn (T1-L2), not the ventral horn.", "C": "These lie in the dorsal horn.", "D": "Dorsal column axons have their cell bodies in the dorsal root ganglia."}, "source": "Wk2 packet p.96 ('This is called the cervical enlargement and represents the high volume of lower motor neurons dedicated to the brachial plexus') and p.97 (lumbar enlargement)"}, {"id": "mk3-q15", "n": 15, "part": 1, "title": null, "stem": "Two weeks after a viral illness, a 7-year-old boy becomes drowsy and confused, with weakness of his legs and unsteadiness. MRI shows large, confluent white matter lesions in both hemispheres and the brainstem, all of similar age. What is the most likely diagnosis?", "options": [{"letter": "A", "text": "Multiple sclerosis"}, {"letter": "B", "text": "Guillain-Barré syndrome"}, {"letter": "C", "text": "Acute disseminated encephalomyelitis"}, {"letter": "D", "text": "Osmotic demyelination syndrome"}, {"letter": "E", "text": "Progressive multifocal leukoencephalopathy"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Multiple Sclerosis", "topic": "Multiple Sclerosis", "note": null, "blueprint_category": "Multiple Sclerosis", "learning_objective": "MS LO8", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "ADEM is an immune-mediated, usually single episode of widespread CNS demyelination that often follows an infection, mainly in children, with encephalopathy and large confluent lesions; MS is relapsing with discrete plaques in young adults.", "distractor_explanations": {"A": "MS usually starts in young adults with discrete periventricular plaques of different ages and relapses over time.", "B": "GBS is a peripheral demyelinating disorder with ascending weakness and areflexia, without encephalopathy or brain lesions.", "D": "It follows rapid correction of low sodium and mainly affects the central pons.", "E": "PML is a JC virus infection in immunosuppressed patients."}, "source": "Wk2 packet p.80 (LO-8: ADEM 'often occurs after an infection ... single episode of widespread inflammation ... primarily affects children ... large, confluent lesions')"}, {"id": "mk3-q16", "n": 16, "part": 1, "title": null, "stem": "The dopaminergic projection that links reward to motivation and risk taking arises in which region?", "options": [{"letter": "A", "text": "The ventral tegmental area of the midbrain (mesolimbic system)"}, {"letter": "B", "text": "The substantia nigra pars compacta (nigrostriatal system)"}, {"letter": "C", "text": "The locus coeruleus"}, {"letter": "D", "text": "The raphe nuclei"}, {"letter": "E", "text": "The basal nucleus of Meynert"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Limbic System", "topic": "Limbic System", "note": null, "blueprint_category": "Limbic System", "learning_objective": "Limbic LO4", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The mesolimbic dopaminergic system arises in the ventral tegmental area and projects to the ventral striatum (nucleus accumbens) and limbic regions, contributing to reward, motivation and risk taking.", "distractor_explanations": {"B": "Its dopamine goes to the dorsal striatum for movement.", "C": "It releases norepinephrine for arousal and vigilance.", "D": "They release serotonin for mood and impulse control.", "E": "It releases acetylcholine for attention and learning."}, "source": "Wk3 packet p.55 ('the mesolimbic dopaminergic system (originating in the ventral tegmental area), contribute to risk taking') and p.38; Limbic LO4"}, {"id": "mk3-q17", "n": 17, "part": 1, "title": null, "stem": "During a nerve block, a large dose of lidocaine is accidentally injected into a vein. A minute later the patient becomes confused, then has a seizure and an irregular heart rhythm. Which mechanism explains both the nerve block and this toxicity?", "options": [{"letter": "A", "text": "Blockade of voltage-gated K+ channels"}, {"letter": "B", "text": "Blockade of voltage-gated Na+ channels in nerves, brain and heart"}, {"letter": "C", "text": "Activation of GABA-A receptors"}, {"letter": "D", "text": "Inhibition of acetylcholinesterase"}, {"letter": "E", "text": "Blockade of nicotinic receptors at the neuromuscular junction"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Synaptic transmission and neurotransmitters", "topic": "Synaptic transmission and neurotransmitters", "note": null, "blueprint_category": "Synaptic transmission and neurotransmitters", "learning_objective": "Synaptic Transmission LO9", "difficulty": 2, "format": "vignette", "drug_item": "side effect", "laterality": false, "thursday_11_5": false, "explanation": "Lidocaine is an amide local anesthetic that blocks voltage-gated Na+ channels (use-dependent); systemic levels can cause seizures, arrhythmias and respiratory or cardiovascular depression.", "distractor_explanations": {"A": "Lidocaine acts on Na+ channels; K+ channel block would prolong repolarization.", "C": "GABA-A activation would suppress seizures, not cause them.", "D": "AChE inhibitors cause cholinergic excess, not local anesthesia.", "E": "That is the action of neuromuscular blockers."}, "source": "Drug list, Exam 1 Local Anesthetics: Lidocaine (bold) 'Blockade of Voltage gated sodium channels ... Use dependent ... Systemic doses can result in death ... cardiovascular problems ... Seizures'; Synaptic Transmission LO9 (Wk3 packet p.20, p.33)"}, {"id": "mk3-q18", "n": 18, "part": 1, "title": null, "stem": "A 45-year-old man with focal epilepsy takes an add-on drug that enhances slow inactivation of voltage-gated Na+ channels rather than fast inactivation. Which adverse effects should he be warned about?", "options": [{"letter": "A", "text": "Gingival enlargement and coarse facial features"}, {"letter": "B", "text": "Weight loss and kidney stones"}, {"letter": "C", "text": "Fulminant hepatitis and pancreatitis"}, {"letter": "D", "text": "Dizziness, blurred or double vision, ataxia and nausea"}, {"letter": "E", "text": "Aplastic anemia and agranulocytosis"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Antiepileptics", "topic": "Antiepileptics", "note": null, "blueprint_category": "Antiepileptics", "learning_objective": "Antiepileptics LO1-2", "difficulty": 2, "format": "vignette", "drug_item": "side effect", "laterality": false, "thursday_11_5": true, "explanation": "The drug is lacosamide, which prolongs slow inactivation of Na+ channels; its main adverse effects are GI upset, headache, blurred or double vision, dizziness and ataxia.", "distractor_explanations": {"A": "These are chronic phenytoin effects.", "B": "These come from topiramate's carbonic anhydrase inhibition.", "C": "These are valproate warnings.", "E": "These are carbamazepine warnings."}, "source": "Drug list, Exam 1 'Epilepsy Medications': Lacosamide (bold) 'Prolong slow inactivation ... GI disturbances, nausea vomiting headaches, blurred or double vision, headache, drowsiness, ataxia'; Phenytoin, Topiramate, Valproate, Carbamazepine rows"}, {"id": "mk3-q19", "n": 19, "part": 1, "title": null, "stem": "This H&E section is from healthy cerebral cortex. The large cell indicated by the arrow has a large, pale (euchromatic) nucleus with a prominent nucleolus. What does this appearance indicate?", "options": [{"letter": "A", "text": "Oligodendrocytes making myelin"}, {"letter": "B", "text": "Microglia engulfing debris"}, {"letter": "C", "text": "Neurons with a high rate of protein synthesis"}, {"letter": "D", "text": "Dying neurons undergoing apoptosis"}, {"letter": "E", "text": "Astrocytes forming a glial scar"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock3-images/s-path-healthy-neurons.png", "image_needed": true, "week": 3, "session_guess": "Neuropathology of Neurodegenerative Diseases Lab", "topic": "Neuropathology of Neurodegenerative Diseases Lab", "note": null, "blueprint_category": "Neuropathology of Neurodegenerative Diseases Lab", "learning_objective": "Neuropath Lab LO1", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": true, "explanation": "The arrow marks a neuron (one the faculty figure labels 'Neurons'). Healthy neurons have large euchromatic nuclei with prominent nucleoli and Nissl substance, reflecting heavy protein production (e.g., transmitters and structural proteins).", "distractor_explanations": {"A": "Oligodendrocytes are small cells with round, dark nuclei and often a clear halo.", "B": "Microglia have small, elongated, dark nuclei.", "D": "Dying neurons have shrunken, dark nuclei, not large pale ones with nucleoli.", "E": "Astrocytes have oval, pale nuclei without a prominent nucleolus or Nissl-rich cytoplasm."}, "source": "Wk3 packet p.151 path-lab figure (Healthy Cerebrum, H&E; 'Neurons' label covered; image used) and p.152 ('Healthy neurons should have large, visible, euchromatic nuclei with prominent nucleoli for protein production'); Wk1 packet p.177", "annotation": {"image": "qbank/midterm1-mock3-images/annotated/s-path-healthy-neurons.png", "options": {"C": "Labeled \"Neurons\" (arrowed): large cell, pale nucleus, nucleolus", "A": "Labeled \"Oligos\": small round dark nuclei with a clear halo", "E": "Labeled \"Astrocytes\": oval pale nuclei, no Nissl-rich cytoplasm", "B": "Microglia: not labeled in this figure", "D": "Not shown (dying neurons would look shrunken and dark)"}, "note": null, "how": "Same faculty figure with its labels uncovered (cropped wider). Green box = correct answer; red boxes = other answer choices the figure labels. Arrow redrawn where the question placed it.", "marked": ["A", "C", "E"]}}, {"id": "mk3-q20", "n": 20, "part": 1, "title": null, "stem": "In this H&E section of cerebellar cortex, the large neuron indicated by the arrow sends its axon to:", "options": [{"letter": "A", "text": "The overlying molecular layer only, as local interneurons"}, {"letter": "B", "text": "The thalamus directly"}, {"letter": "C", "text": "The spinal cord as a descending tract"}, {"letter": "D", "text": "The pons, as mossy fibers"}, {"letter": "E", "text": "The deep cerebellar nuclei, as the only output of the cerebellar cortex"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock3-images/s-histo-purkinje.png", "image_needed": true, "week": 1, "session_guess": "Histology of CNS 2: Organization of Nerve tissues", "topic": "Histology of CNS 2: Organization of Nerve tissues", "note": null, "blueprint_category": "Histology of CNS 2: Organization of Nerve tissues", "learning_objective": "Histology CNS 2 LO6", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrow marks a Purkinje cell body, in the one-cell-thick layer between the molecular layer above and the granule cell layer below. Purkinje cells are the output layer of the cerebellar cortex and project to the deep cerebellar nuclei.", "distractor_explanations": {"A": "The molecular layer holds their dendrites, but these neurons project out of the cortex.", "B": "Thalamic input comes from the deep cerebellar nuclei, not directly from the cerebellar cortex.", "C": "No cerebellar cortical neurons project to the spinal cord.", "D": "Mossy fibers are inputs from the pons and spinal cord to the granule cells, not outputs."}, "source": "Wk1 packet p.208, Fig. 11 high-power H&E inset ('Purkinje cell bodies' label covered; image used) and p.207 ('Purkinje Cell Layer ... Acts as the output layer of the cerebellar cortex. Purkinje cells send signals to the deep cerebellar nuclei')", "annotation": {"image": "qbank/midterm1-mock3-images/annotated/s-histo-purkinje.png", "options": {"E": "Labeled \"Purkinje cell bodies\" (arrowed)", "A": "Labeled \"molecular layer\": holds the Purkinje dendrites, not where their axons go"}, "note": "\"Granule cell layer\" is also labeled, below the Purkinje layer.", "how": "Same faculty figure with its labels uncovered (cropped wider). Green box = correct answer; red boxes = other answer choices the figure labels. Arrow redrawn where the question placed it.", "marked": ["A", "E"]}}, {"id": "mk3-q21", "n": 21, "part": 1, "title": null, "stem": "A 39-year-old woman with migraine now has headaches on 20 days a month. She takes an over-the-counter analgesic with caffeine almost every day and a triptan several times a week. What is the most appropriate first step?", "options": [{"letter": "A", "text": "Increase the triptan dose"}, {"letter": "B", "text": "Add a daily opioid for pain control"}, {"letter": "C", "text": "Order an urgent CT angiogram"}, {"letter": "D", "text": "Withdraw the overused acute medications"}, {"letter": "E", "text": "Start ergotamine every day"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Headaches", "topic": "Headaches", "note": null, "blueprint_category": "Headaches", "learning_objective": "Headache LO1, LO6", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Frequent use of analgesics, triptans, caffeine, opioids or ergotamine can cause medication overuse (rebound) headache, which resolves with withdrawal of the overused medication.", "distractor_explanations": {"A": "More acute medication worsens medication overuse headache.", "B": "Opioids are themselves a cause of medication overuse headache.", "C": "Her pattern of daily headaches with frequent analgesic use does not suggest a vascular emergency.", "E": "Ergotamine is another cause of overuse headache and is not used daily."}, "source": "Wk2 packet p.137 ('Medication Overuse Headaches ... resolution occurs with withdrawal from the medication'); Headache slide 26 (opioids, barbiturates, NSAIDs, ergotamine, triptans, caffeine)"}, {"id": "mk3-q22", "n": 22, "part": 1, "title": null, "stem": "On a standard axial CT or MRI image of the head, the patient's right side appears on which side of the screen?", "options": [{"letter": "A", "text": "The viewer's right"}, {"letter": "B", "text": "The top of the image"}, {"letter": "C", "text": "The viewer's left"}, {"letter": "D", "text": "It depends on the MRI sequence"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Neuroimaging Tutorial", "topic": "Neuroimaging Tutorial", "note": null, "blueprint_category": "Neuroimaging Tutorial", "learning_objective": "Neuroimaging Tutorial LO1", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": true, "thursday_11_5": false, "explanation": "Radiology convention: the image is viewed as though looking up from the patient's feet, so the patient's right is on the viewer's left. Confirm with anatomic landmarks.", "distractor_explanations": {"A": "Standard images are viewed as if facing the patient from the feet, so the sides are reversed.", "B": "The top of an axial image is anterior (the face).", "D": "Laterality convention is the same for all sequences and for CT."}, "source": "Wk1 packet p.217 ('IN RADIOLOGY: RIGHT IS ON THE LEFT; LEFT IS ON THE RIGHT'); Neuroimaging Tutorial LO1"}, {"id": "mk3-q23", "n": 23, "part": 1, "title": null, "stem": "On an H&E section of the medulla, a large, wavy, crumpled band of gray matter lies in the ventrolateral medulla, just lateral to the pyramid. What is this structure?", "options": [{"letter": "A", "text": "Medial lemniscus"}, {"letter": "B", "text": "Inferior olivary nucleus"}, {"letter": "C", "text": "Hypoglossal nucleus"}, {"letter": "D", "text": "Dentate nucleus"}, {"letter": "E", "text": "Nucleus gracilis"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Histology Lab", "topic": "Histology Lab", "note": null, "blueprint_category": "Histology Lab", "learning_objective": "Histology Lab LO4", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The inferior olive forms a crumpled-bag gray band in the ventrolateral (rostral) medulla beside the pyramid, producing the external olive bulge; it sends climbing fibers to the cerebellum (standard neuroanatomy).", "distractor_explanations": {"A": "It is a white-matter tract next to the midline, dorsal to the pyramid.", "C": "It lies in the dorsal medulla near the floor of the fourth ventricle.", "D": "It has a similar wavy shape but is in the cerebellum.", "E": "It lies in the dorsal caudal medulla."}, "source": "Histology Lab packet p.213 (Brain Stem - Medulla (H&E): identify 'Inferior olive, Medial lemniscus, Pyramids'); Histology Lab LO4"}, {"id": "mk3-q24", "n": 24, "part": 1, "title": null, "stem": "During removal of a lymph node from the root of the right side of the neck, the surgeon cuts a nerve lying on the anterior surface of the anterior scalene muscle. Which problem is most likely afterward?", "options": [{"letter": "A", "text": "Hoarseness from paralysis of the right vocal fold"}, {"letter": "B", "text": "Weakness of right shoulder elevation"}, {"letter": "C", "text": "A right Horner syndrome"}, {"letter": "D", "text": "Weakness of the right side of the tongue"}, {"letter": "E", "text": "Paralysis of the right half of the diaphragm"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Neck Anatomy", "topic": "Neck Anatomy", "note": null, "blueprint_category": "Neck Anatomy", "learning_objective": "Neck ILM LO7", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The phrenic nerve (C3-C5) descends on the anterior scalene to supply the ipsilateral hemidiaphragm; cutting it paralyzes that half of the diaphragm.", "distractor_explanations": {"A": "That would be the recurrent laryngeal nerve, which runs in the tracheoesophageal groove.", "B": "That would be the spinal accessory nerve to the trapezius in the posterior triangle.", "C": "That would be the cervical sympathetic chain, which lies medial and deeper along the prevertebral fascia.", "D": "That would be the hypoglossal nerve, which runs high in the neck above the hyoid."}, "source": "ILM Anatomy of the Neck slide 9 ('Phrenic Nerve runs over Anterior Scalene'); Wk1 packet p.69 (phrenic nerve from the cervical plexus); Neck ILM LO7"}, {"id": "mk3-q25", "n": 25, "part": 1, "title": null, "stem": "After a blow to the left orbit, a 22-year-old man cannot see with his left eye. When a light is shone into his left eye, neither pupil constricts. When the light is shone into his right eye, both pupils constrict. Where is the lesion?", "options": [{"letter": "A", "text": "Left optic nerve"}, {"letter": "B", "text": "Left oculomotor nerve"}, {"letter": "C", "text": "Right optic nerve"}, {"letter": "D", "text": "Optic chiasm"}, {"letter": "E", "text": "Left Edinger-Westphal nucleus"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Cranial Nerves Module", "topic": "Cranial Nerves Module", "note": null, "blueprint_category": "Cranial Nerves Module", "learning_objective": "CN Modules LO5", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": true, "thursday_11_5": false, "explanation": "The optic nerve is the afferent limb of the pupillary light reflex. With a left optic nerve injury, light in the left eye sends no signal, so neither pupil constricts; light in the right eye drives both pupils through the intact efferent (CN III) pathways (a relative afferent pupillary defect).", "distractor_explanations": {"B": "With a left CN III lesion, the left pupil would fail to constrict whichever eye is lit, while the right would constrict to light in either eye.", "C": "Light in the right eye works normally here, so the right optic nerve is intact.", "D": "A chiasm lesion causes bitemporal field loss, not complete loss of light response from one eye.", "E": "Loss of this nucleus would affect only the left pupil's constriction, whichever eye is lit."}, "source": "ILM Cranial Nerves Modules slide 13 ('loss of visual acuity ... and a relative afferent pupillary defect of the left eye ... suggestive of an optic nerve injury'); Wk1 packet p.172 table (CN II lesions); CN Modules LO5"}, {"id": "mk3-q26", "n": 26, "part": 1, "title": null, "stem": "Capsaicin, the hot ingredient in chili peppers, activates the same channel that transduces noxious heat on nociceptors. Which channel is this?", "options": [{"letter": "A", "text": "Piezo2"}, {"letter": "B", "text": "TRPV1"}, {"letter": "C", "text": "Voltage-gated Na+ channel Nav1.5"}, {"letter": "D", "text": "GABA-A receptor"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Pain & Pain pathways", "topic": "Pain & Pain pathways", "note": null, "blueprint_category": "Pain & Pain pathways", "learning_objective": "Pain & Pain Pathways LO3; Pain Medications LO3", "difficulty": 1, "format": "direct", "drug_item": "mechanism", "laterality": false, "thursday_11_5": false, "explanation": "TRPV1 (the vanilloid receptor) is a cation channel on nociceptors activated by heat and capsaicin; repeated capsaicin desensitizes it, which is the basis of topical capsaicin for neuropathic pain.", "distractor_explanations": {"A": "Piezo2 is a mechanotransducer for touch and proprioception.", "C": "Nav1.5 is the cardiac sodium channel.", "D": "It is a ligand-gated chloride channel that mediates fast inhibition."}, "source": "Wk2 packet p.17 ('TRPV1, the vanilloid receptor, which is activated by capsaicin'); Pain slide 34; drug list, Exam 1 'Additional drugs used for Chronic Pain': Capsaicin (bold) 'Binds to TRPV1 cation channels on nociceptors'"}, {"id": "mk3-q27", "n": 27, "part": 1, "title": null, "stem": "Which feature of a neuropathy suggests something other than the usual distal symmetric polyneuropathy and calls for further workup?", "options": [{"letter": "A", "text": "Numbness that starts in the toes and later reaches the fingertips"}, {"letter": "B", "text": "Slow progression over many years in a patient with diabetes"}, {"letter": "C", "text": "Symmetric burning in both feet"}, {"letter": "D", "text": "Reduced ankle reflexes with normal knee reflexes"}, {"letter": "E", "text": "Weakness that is more prominent than sensory loss and is asymmetric"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Peripheral Neuropathies", "topic": "Peripheral Neuropathies", "note": null, "blueprint_category": "Peripheral Neuropathies", "learning_objective": "Peripheral Neuropathy LO10", "difficulty": 2, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Red flags include severe or rapidly progressive symptoms, asymmetry, non-length dependence, motor predominance and prominent autonomic involvement; they point to other processes such as multifocal motor neuropathy, motor neuron disease, vasculitis or radiculopathy.", "distractor_explanations": {"A": "This is the typical length-dependent (stocking-glove) pattern.", "B": "A slow, length-dependent course in diabetes is the common expected pattern.", "C": "Symmetric distal burning fits a typical polyneuropathy.", "D": "Loss of the most distal reflexes first is typical of length-dependent neuropathy."}, "source": "Wk2 packet p.71 (red flags: asymmetry, non-length dependence, motor predominance, autonomic involvement) and p.60 (LO10)"}, {"id": "mk3-q28", "n": 28, "part": 1, "title": null, "stem": "A 58-year-old woman has a small cortical infarct on the medial surface of the left hemisphere, just behind the central sulcus (paracentral lobule). Which deficit is most likely?", "options": [{"letter": "A", "text": "Loss of discriminative touch in the right face and hand"}, {"letter": "B", "text": "Loss of discriminative touch in the left leg and foot"}, {"letter": "C", "text": "Loss of pain and temperature on the right side of the face"}, {"letter": "D", "text": "Loss of discriminative touch and position sense in the right leg and foot"}, {"letter": "E", "text": "Weakness of the right arm"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Somatosensory Receptors and Tracts", "topic": "Somatosensory Receptors and Tracts", "note": null, "blueprint_category": "Somatosensory Receptors and Tracts", "learning_objective": "Sensory Receptors LO3-4; Protecting the Brain LO1", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": true, "thursday_11_5": false, "explanation": "The leg and foot are represented on the medial surface of the postcentral gyrus (paracentral lobule), so a medial lesion on the left causes contralateral (right) leg sensory loss.", "distractor_explanations": {"A": "The face and hand are represented on the lateral surface of the postcentral gyrus, supplied by the MCA.", "B": "The left hemisphere receives sensation from the right side of the body.", "C": "Facial pain and temperature are relayed by the trigeminal system to the lateral postcentral gyrus.", "E": "The arm motor area is on the lateral precentral gyrus, not the medial postcentral cortex."}, "source": "Sensory Receptors LO3 (Wk2 packet p.1: trace DCML to primary somatosensory cortex with somatotopy); Somatosensory slides (S1 homunculus); Wk1 packet p.92 (ACA supplies the medial parietal surface)"}, {"id": "mk3-q29", "n": 29, "part": 1, "title": null, "stem": "A 2-week-old girl has trouble latching to breastfeed. When she cries, the tip of her tongue stays tethered to the floor of the mouth and forms a heart shape. What is the diagnosis?", "options": [{"letter": "A", "text": "Cleft of the secondary palate"}, {"letter": "B", "text": "Thyroglossal duct cyst"}, {"letter": "C", "text": "Ankyloglossia"}, {"letter": "D", "text": "DiGeorge syndrome"}, {"letter": "E", "text": "Treacher Collins syndrome"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Face Embryology", "topic": "Face Embryology", "note": null, "blueprint_category": "Face Embryology", "learning_objective": "Facial Embryology LO5-6", "difficulty": 1, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "In ankyloglossia (tongue-tie) part of the developing tongue does not grow free of the floor of the mouth and stays adherent through a short frenulum.", "distractor_explanations": {"A": "A palatal cleft lets milk escape through the nose; the tongue moves normally.", "B": "It is a midline neck mass that moves with tongue protrusion.", "D": "It involves the third and fourth pouches (thymus, parathyroids, heart defects), not a tethered tongue.", "E": "It is a first-arch defect with a small mandible and malar hypoplasia."}, "source": "Wk1 packet p.33 ('Ankyloglossia ... the lingual swellings of the tongue sometimes do not grow free of the mouth and remain adhered'); Facial Embryology LO6"}, {"id": "mk3-q30", "n": 30, "part": 1, "title": null, "stem": "A day after spraining her ankle, a 22-year-old woman finds that even gentle pressure on the swollen ankle is very painful, while the skin of her lower leg feels normal. Which mechanism mainly explains the increased pain at the injury site?", "options": [{"letter": "A", "text": "Inflammatory mediators lower the activation threshold of local nociceptors"}, {"letter": "B", "text": "Dorsal horn neurons have become hyperexcitable, spreading pain to uninjured skin"}, {"letter": "C", "text": "Aβ touch fibers now synapse directly on spinothalamic neurons"}, {"letter": "D", "text": "The periaqueductal gray is releasing extra endogenous opioids"}, {"letter": "E", "text": "The injured nerve has undergone Wallerian degeneration"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Pain & Pain pathways", "topic": "Pain & Pain pathways", "note": null, "blueprint_category": "Pain & Pain pathways", "learning_objective": "Pain & Pain Pathways LO7", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Primary hyperalgesia at the site of injury is peripheral sensitization: mediators released by damaged tissue (e.g., prostaglandins, bradykinin) lower nociceptor thresholds. Secondary hyperalgesia in surrounding tissue reflects central sensitization.", "distractor_explanations": {"B": "That is central sensitization, which causes secondary hyperalgesia in surrounding tissue.", "C": "Large touch fibers do not form new direct connections; gate control involves inhibitory interneurons.", "D": "Descending opioid release reduces pain rather than increasing it.", "E": "A sprain does not cut the nerve; degeneration would cause numbness, not increased pain."}, "source": "Wk2 packet p.21-22 ('Primary hyperalgesia occurs at the site of injury due to peripheral sensitization ... Inflammatory mediators released after tissue damage lower the threshold for nociceptor activation'); Pain LO7"}, {"id": "mk3-q31", "n": 31, "part": 1, "title": null, "stem": "A 63-year-old man with long-standing poorly controlled hypertension suddenly develops weakness of his left face, arm and leg. Noncontrast CT shows a bright, round hemorrhage in the right putamen extending toward the internal capsule. Which vessels most likely ruptured?", "options": [{"letter": "A", "text": "Bridging veins"}, {"letter": "B", "text": "The middle meningeal artery"}, {"letter": "C", "text": "A saccular aneurysm of the anterior communicating artery"}, {"letter": "D", "text": "Lenticulostriate branches of the middle cerebral artery"}, {"letter": "E", "text": "The superior sagittal sinus"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Protecting the Brain", "topic": "Protecting the Brain", "note": null, "blueprint_category": "Protecting the Brain", "learning_objective": "Protecting the Brain LO1, LO4", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Small perforating lenticulostriate arteries from the proximal MCA supply the basal ganglia and internal capsule; chronic hypertension weakens them (Charcot-Bouchard microaneurysms), causing deep hemorrhages.", "distractor_explanations": {"A": "Torn bridging veins cause a subdural hematoma over the convexity.", "B": "Its rupture causes an epidural hematoma between skull and dura.", "C": "Aneurysm rupture causes subarachnoid hemorrhage in the basal cisterns.", "E": "Venous sinus thrombosis causes venous infarcts and hemorrhages near the cortex, not a putaminal bleed."}, "source": "Wk1 packet p.122 ('Lenticulostriate arteries: Small perforators from proximal MCA toward deep nuclei and internal capsule'); Imaging Techniques slide 199 (intraparenchymal hemorrhage: hypertension, Charcot-Bouchard microaneurysms)"}, {"id": "mk3-q32", "n": 32, "part": 1, "title": null, "stem": "A 47-year-old man with a large cerebellar hemorrhage becomes less responsive. His blood pressure rises from 150/90 to 210/110 mm Hg, his heart rate falls from 88 to 46/min, and his breathing becomes irregular. What does this combination indicate?", "options": [{"letter": "A", "text": "Neurogenic shock from a cord injury"}, {"letter": "B", "text": "Autonomic dysreflexia"}, {"letter": "C", "text": "A generalized seizure"}, {"letter": "D", "text": "Expected effects of pain after the bleed"}, {"letter": "E", "text": "A Cushing response from severe intracranial pressure threatening the brainstem"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Increased Cranial Pressure", "topic": "Increased Cranial Pressure", "note": null, "blueprint_category": "Increased Cranial Pressure", "learning_objective": "Elevated ICP LO1", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Course framing: the Cushing response (hypertension, bradycardia, irregular respirations) is a late, ominous sign of severe ICP elevation and possible herniation, calling for immediate evaluation.", "distractor_explanations": {"A": "Neurogenic shock causes hypotension with bradycardia, not hypertension.", "B": "Dysreflexia occurs with spinal cord injury above T6 and is triggered by stimuli below the lesion.", "C": "Seizures raise heart rate, not slow it, and cause rhythmic motor activity.", "D": "Pain raises blood pressure and heart rate together; bradycardia with irregular breathing is not a pain response."}, "source": "Wk1 packet p.133 ('A late and particularly ominous finding is the Cushing response, consisting of hypertension, bradycardia, and irregular respirations'); Elevated ICP LO1"}, {"id": "mk3-q33", "n": 33, "part": 1, "title": null, "stem": "A 76-year-old man faints while an examiner presses firmly on his right neck at the level of the upper border of the thyroid cartilage. His heart rate drops sharply. Which pathway explains this?", "options": [{"letter": "A", "text": "Carotid sinus baroreceptors → glossopharyngeal nerve → nucleus of the solitary tract → vagal outflow to the heart"}, {"letter": "B", "text": "Carotid body chemoreceptors → vagus nerve → sympathetic outflow to the heart"}, {"letter": "C", "text": "Aortic arch baroreceptors → phrenic nerve → diaphragm"}, {"letter": "D", "text": "Direct pressure on the vagus nerve, blocking its signals to the heart"}, {"letter": "E", "text": "Pressure on the stellate ganglion, increasing sympathetic tone"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Autonomics", "topic": "Autonomics", "note": null, "blueprint_category": "Autonomics", "learning_objective": "Autonomic LO8", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Stretch of the carotid sinus activates baroreceptor afferents in CN IX to the nucleus of the solitary tract, which increases vagal (parasympathetic) output and reduces sympathetic output, slowing the heart and lowering pressure.", "distractor_explanations": {"B": "Chemoreceptors respond to low oxygen, and increased sympathetic outflow would raise the heart rate.", "C": "The phrenic nerve is motor to the diaphragm and plays no part in this reflex.", "D": "Blocking vagal signals would speed the heart, not slow it.", "E": "More sympathetic tone would raise heart rate and blood pressure."}, "source": "Wk3 packet p.17 ('aortic arch and carotid arteries (carotid sinus) called baroreceptors ... sense the oxygen levels and blood pressure'); Autonomic LO8 (sensory function of the ANS and the cranial nerves); Wk1 packet p.68 (CN IX supplies the carotid sinus)"}, {"id": "mk3-q34", "n": 34, "part": 1, "title": null, "stem": "In Nissl-stained sections, primary visual cortex (area 17) has an unusually thick, cell-dense layer IV, while the motor cortex has a very thin one. What does layer IV mainly do?", "options": [{"letter": "A", "text": "Sends output to the brainstem and spinal cord"}, {"letter": "B", "text": "Contains mostly dendrites and axons with few cells"}, {"letter": "C", "text": "Receives the main input from the thalamus"}, {"letter": "D", "text": "Sends corticocortical axons to the opposite hemisphere"}, {"letter": "E", "text": "Holds the CSF-producing cells of the cortex"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Histology Lab", "topic": "Histology Lab", "note": null, "blueprint_category": "Histology Lab", "learning_objective": "Histology Lab LO5; Histology CNS 2 LO6", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Layer IV (internal granular layer, granule cells) is the major input layer from the thalamus and is especially well developed in sensory cortex such as area 17, which receives the lateral geniculate input.", "distractor_explanations": {"A": "That is layer V, the internal pyramidal layer, which is prominent in motor cortex.", "B": "That describes layer I, the molecular layer.", "D": "Callosal projections come mainly from pyramidal neurons in layers II-III.", "E": "CSF is made by the choroid plexus, not cortical neurons."}, "source": "Wk1 packet p.206 ('Layer IV: Internal Granular Layer ... Major input layer from the thalamus ... Especially well-developed in sensory areas'); Histology Lab packet p.211 (compare area 17 with somatosensory cortex)"}, {"id": "mk3-q35", "n": 35, "part": 1, "title": null, "stem": "Which cranial nerve carries only special sensory fibers and enters the brainstem at the far lateral pontomedullary junction?", "options": [{"letter": "A", "text": "Facial nerve (CN VII)"}, {"letter": "B", "text": "Vestibulocochlear nerve (CN VIII)"}, {"letter": "C", "text": "Glossopharyngeal nerve (CN IX)"}, {"letter": "D", "text": "Optic nerve (CN II)"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Cranial Nerves Module", "topic": "Cranial Nerves Module", "note": null, "blueprint_category": "Cranial Nerves Module", "learning_objective": "CN Modules LO3", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "CN VIII (vestibular and cochlear divisions) is purely special sensory; both divisions pass through the internal acoustic meatus and enter the brainstem at the lateral pontomedullary junction.", "distractor_explanations": {"A": "CN VII also enters at the pontomedullary junction but is mixed (motor, parasympathetic, taste and general sensory).", "C": "CN IX is mixed and leaves the medulla behind the olive.", "D": "CN II is special sensory but joins the diencephalon at the optic chiasm, not the brainstem."}, "source": "ILM Cranial Nerves Modules slide 56 ('Both nerves ... enter the brainstem near the pontomedullary junction on the far lateral aspect'); Wk1 packet p.77 table and p.166"}, {"id": "mk3-q36", "n": 36, "part": 1, "title": null, "stem": "This spinal cord section is stained with Luxol fast blue, a myelin stain. The purple-circled region near the dorsal midline, enlarged at top right, is pale, while the red-circled lateral region, enlarged below, stains deeply blue. Which deficit would the patient most likely have?", "options": [{"letter": "A", "text": "Loss of pain and temperature sensation below the lesion"}, {"letter": "B", "text": "Flaccid weakness with fasciculations"}, {"letter": "C", "text": "Loss of bladder control only"}, {"letter": "D", "text": "Spastic weakness of one arm"}, {"letter": "E", "text": "Loss of vibration and position sense, with a positive Romberg sign"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock3-images/s-path-lfb-dorsal.png", "image_needed": true, "week": 3, "session_guess": "Neuropathology of Neurodegenerative Diseases Lab", "topic": "Neuropathology of Neurodegenerative Diseases Lab", "note": null, "blueprint_category": "Neuropathology of Neurodegenerative Diseases Lab", "learning_objective": "Neuropath Lab LO3-4", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": true, "explanation": "The pale dorsal region is the dorsal (posterior) columns, which have lost myelinated axons,
