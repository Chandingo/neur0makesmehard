l, "stem": "Levodopa raises brain dopamine because it bypasses which enzyme, the rate-limiting step in catecholamine synthesis?", "options": [{"letter": "A", "text": "DOPA decarboxylase"}, {"letter": "B", "text": "Tyrosine hydroxylase"}, {"letter": "C", "text": "Dopamine beta-hydroxylase"}, {"letter": "D", "text": "Tryptophan hydroxylase"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Synaptic transmission and neurotransmitters", "topic": "Synaptic transmission and neurotransmitters", "note": null, "blueprint_category": "Synaptic transmission and neurotransmitters", "learning_objective": "Synaptic Transmission LO3", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Tyrosine hydroxylase converts tyrosine to L-DOPA, the rate-limiting step for all catecholamines; giving L-DOPA bypasses it, which is the basis of levodopa therapy.", "distractor_explanations": {"A": "It converts L-DOPA to dopamine, a fast step after the rate-limiting one.", "C": "It converts dopamine to norepinephrine inside vesicles; it is not rate-limiting.", "D": "It is the rate-limiting enzyme for serotonin, not catecholamines."}, "source": "Wk3 packet p.24 ('bypassing the rate limiting tyrosine hydroxylase step in catecholamine synthesis'); Synaptic Transmission slide 5"}, {"id": "mk2-q39", "n": 39, "part": 1, "title": null, "stem": "Which bones form the middle cranial fossa?", "options": [{"letter": "A", "text": "Sphenoid (greater wings) and temporal bones"}, {"letter": "B", "text": "Frontal and ethmoid bones"}, {"letter": "C", "text": "Occipital and parietal bones"}, {"letter": "D", "text": "Ethmoid and lesser wings of the sphenoid only"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Protecting the Brain", "topic": "Protecting the Brain", "note": null, "blueprint_category": "Protecting the Brain", "learning_objective": "Protecting the Brain LO6", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Course framing: the middle cranial fossa is formed by the greater wing of the sphenoid and the temporal bones and holds the temporal lobes, pituitary and CN III-VII as they leave.", "distractor_explanations": {"B": "These form the anterior cranial fossa, which holds the frontal lobes and olfactory bulbs.", "C": "The occipital bone forms most of the posterior fossa; the parietal bones form the vault, not a fossa floor.", "D": "The lesser wings form the back edge of the anterior fossa; the ethmoid is anterior fossa."}, "source": "Wk1 packet p.105 ('Middle Cranial Fossa: Greater wing of the sphenoid and temporal bones o Temporal lobes o Pituitary gland o Cranial Nerves III through VII')"}, {"id": "mk2-q40", "n": 40, "part": 1, "title": null, "stem": "A 40-year-old man has a seizure that starts with jerking of his left hand and spreads to his whole left side. Afterward his left arm is weak for 10 hours, then recovers fully. MRI is normal. What is the best explanation for the arm weakness?", "options": [{"letter": "A", "text": "An aura"}, {"letter": "B", "text": "A transient ischemic attack that caused the seizure"}, {"letter": "C", "text": "Status epilepticus"}, {"letter": "D", "text": "A conversion (functional) disorder"}, {"letter": "E", "text": "A postictal (Todd) paralysis"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Seizures & Epilepsy", "topic": "Seizures & Epilepsy", "note": null, "blueprint_category": "Seizures & Epilepsy", "learning_objective": "Seizures LO2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": true, "explanation": "The postictal period can include transient focal weakness (Todd paralysis) or aphasia in the region where the seizure began, recovering over hours.", "distractor_explanations": {"A": "The aura is the first part of the seizure itself, occurring before or at its onset, not hours afterward.", "B": "Weakness that follows a focal motor seizure in the same limb and resolves is the expected postictal state.", "C": "Status means continuous seizure activity or repeated seizures without recovery, not a period of weakness.", "D": "The weakness has a clear seizure-related explanation in the same limb."}, "source": "Wk3 packet p.135 (LO2 table: 'Postictal ... Transient focal weakness or aphasia may occur'); Seizures and Epilepsy slides 33-34 ('Todd's paralysis')"}, {"id": "mk2-q41", "n": 41, "part": 1, "title": null, "stem": "A 58-year-old woman has back pain that radiates down the front of her thigh and over the inner side of her shin. Knee extension is weak and her knee (patellar) reflex is reduced; the ankle reflex is normal. Which nerve root is most likely compressed?", "options": [{"letter": "A", "text": "L2"}, {"letter": "B", "text": "L5"}, {"letter": "C", "text": "S1"}, {"letter": "D", "text": "L4"}, {"letter": "E", "text": "S2"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Radiculopathy; Spinal cord imaging", "topic": "Radiculopathy; Spinal cord imaging", "note": null, "blueprint_category": "Radiculopathy; Spinal cord imaging", "learning_objective": "Radiculopathy LO2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "L4: pain and numbness of the anterior thigh and medial leg, weak knee extension (quadriceps) and a reduced patellar reflex.", "distractor_explanations": {"A": "L2 compression would not reduce the patellar reflex or reach the inner shin.", "B": "L5 compression would not weaken knee extension or reduce the patellar reflex.", "C": "S1 compression would not weaken knee extension or reduce the patellar reflex.", "E": "S2 compression would not cause anterior thigh pain or quadriceps weakness."}, "source": "Radiculopathy LO2 (Wk2 packet p.113, p.116: L4-L5 and L5-S1 most common); Radiculopathy slide 10 (L5 and S1 patterns). The L4 pattern (anterior thigh/medial leg, quadriceps, patellar reflex) is the standard root map, beyond the slides"}, {"id": "mk2-q42", "n": 42, "part": 1, "title": null, "stem": "During a lumbar puncture at L4-L5, which is the last membrane the needle pierces before CSF can be drawn?", "options": [{"letter": "A", "text": "Arachnoid mater"}, {"letter": "B", "text": "Dura mater"}, {"letter": "C", "text": "Pia mater"}, {"letter": "D", "text": "Ligamentum flavum"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Spinal Cord", "topic": "Spinal Cord", "note": null, "blueprint_category": "Spinal Cord", "learning_objective": "Spinal Cord LO5", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "CSF lies in the subarachnoid space, under the arachnoid. Order from skin: supraspinous and interspinous ligaments, ligamentum flavum, epidural space, dura, arachnoid, then the subarachnoid space (lumbar cistern).", "distractor_explanations": {"B": "The dura is pierced just before the arachnoid; the dura and arachnoid lie against each other.", "C": "The pia covers the cord and roots directly; the needle stops in the subarachnoid space before reaching it.", "D": "It is the ligament pierced before the epidural space, well before the meninges."}, "source": "Spinal Cord LO5 (Wk2 packet p.35: meninges, filum terminale, CSF); Lab 2 structure list (denticulate ligament, cauda equina)"}, {"id": "mk2-q43", "n": 43, "part": 1, "title": null, "stem": "A cluster of neuron cell bodies inside the CNS that shares a function, such as the hypoglossal nucleus, has which type of organization?", "options": [{"letter": "A", "text": "Laminar"}, {"letter": "B", "text": "Nuclear"}, {"letter": "C", "text": "Ganglionic"}, {"letter": "D", "text": "Tract"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Histology of CNS 2: Organization of Nerve tissues", "topic": "Histology of CNS 2: Organization of Nerve tissues", "note": null, "blueprint_category": "Histology of CNS 2: Organization of Nerve tissues", "learning_objective": "Histology CNS 2 LO4", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Course terms: laminar = layers (cortex), nuclear = clusters inside the CNS, ganglionic = clusters in the PNS.", "distractor_explanations": {"A": "Laminar organization means neurons arranged in layers, as in the cerebral and cerebellar cortex.", "C": "Ganglia are clusters of neuron cell bodies outside the CNS.", "D": "A tract is a bundle of axons in the CNS, not a group of cell bodies."}, "source": "Wk1 packet p.204 (LO4: 'laminar,' 'nuclear,' and 'ganglionic'); Histology CNS 2 LO4-5 (p.199)"}, {"id": "mk2-q44", "n": 44, "part": 1, "title": null, "stem": "This H&E section of the basis pontis is from a 62-year-old man who had 4 years of ataxia, parkinsonism that did not respond to levodopa, and fainting when he stood up. The regions indicated by the arrows show neuron loss. In this disease, immunostaining for alpha-synuclein shows inclusions mainly in which cells?", "options": [{"letter": "A", "text": "Neurons, as Lewy bodies"}, {"letter": "B", "text": "Astrocytes"}, {"letter": "C", "text": "Microglia"}, {"letter": "D", "text": "Schwann cells"}, {"letter": "E", "text": "Oligodendrocytes"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock2-images/s-path-msa-pons.png", "image_needed": true, "week": 3, "session_guess": "Neuropathology of Neurodegenerative Diseases Lab", "topic": "Neuropathology of Neurodegenerative Diseases Lab", "note": null, "blueprint_category": "Neuropathology of Neurodegenerative Diseases Lab", "learning_objective": "Neuropath Lab LO4", "difficulty": 3, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": true, "explanation": "Ataxia, levodopa-resistant parkinsonism and autonomic failure with pontine (olivopontocerebellar) neuron loss is multiple system atrophy, whose alpha-synuclein inclusions sit in oligodendrocytes (Papp-Lantos bodies).", "distractor_explanations": {"A": "Neuronal Lewy bodies define Parkinson disease and dementia with Lewy bodies, not this disease.", "B": "Astrocytic tau inclusions are typical of other diseases (e.g., progressive supranuclear palsy), not alpha-synuclein disease.", "C": "Microglia react to the damage but do not hold the defining inclusions.", "D": "Schwann cells are peripheral; the disease is in the CNS."}, "source": "Wk3 packet p.156 path-lab figure (Multiple System Atrophy: Pons; 'Neuron degeneration in olivopontocerebellar nuclei' labeled; image used) and text ('α-synuclein inclusions in oligodendrocytes in this disease (Papp-Lantos bodies)')"}, {"id": "mk2-q45", "n": 45, "part": 1, "title": null, "stem": "The stylopharyngeus muscle develops from which pharyngeal arch, and which cranial nerve supplies it?", "options": [{"letter": "A", "text": "First arch; mandibular nerve"}, {"letter": "B", "text": "Second arch; facial nerve"}, {"letter": "C", "text": "Third arch; glossopharyngeal nerve"}, {"letter": "D", "text": "Fourth arch; superior laryngeal branch of the vagus"}, {"letter": "E", "text": "Sixth arch; recurrent laryngeal branch of the vagus"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Face Embryology", "topic": "Face Embryology", "note": null, "blueprint_category": "Face Embryology", "learning_objective": "Facial Embryology LO2", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Arch 3 contributes part of the hyoid and only one muscle, the stylopharyngeus, supplied by CN IX.", "distractor_explanations": {"A": "Arch 1 (V3) forms the muscles of mastication, mylohyoid and anterior digastric.", "B": "Arch 2 (VII) forms the muscles of facial expression, stapedius, stylohyoid and posterior digastric.", "D": "Arch 4 forms the cricothyroid and pharyngeal constrictors.", "E": "Arch 6 forms the intrinsic laryngeal muscles other than cricothyroid."}, "source": "Wk1 packet p.21 ('Arch 3: Stylopharyngeus muscle only'); Facial Embryology slide 10 (Arch 3: CN IX, Stylopharyngeus)"}, {"id": "mk2-q46", "n": 46, "part": 1, "title": null, "stem": "A 24-year-old woman with focal epilepsy starts a drug that prolongs fast inactivation of voltage-gated Na+ channels and may reduce glutamate release. She is told to stop it and seek care at once if a rash appears. Which serious adverse effect is the warning about?", "options": [{"letter": "A", "text": "Gingival enlargement"}, {"letter": "B", "text": "Kidney stones"}, {"letter": "C", "text": "Stevens-Johnson syndrome / toxic epidermal necrolysis"}, {"letter": "D", "text": "Fulminant hepatitis"}, {"letter": "E", "text": "Angle-closure glaucoma"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Antiepileptics", "topic": "Antiepileptics", "note": null, "blueprint_category": "Antiepileptics", "learning_objective": "Antiepileptics LO2", "difficulty": 2, "format": "vignette", "drug_item": "side effect", "laterality": false, "thursday_11_5": true, "explanation": "The drug is lamotrigine. Its life-threatening risk is SJS/TEN, which presents with rash, so any rash prompts stopping the drug.", "distractor_explanations": {"A": "Gum overgrowth is a phenytoin effect and is not signaled by a rash.", "B": "Stones come from carbonic anhydrase inhibition by topiramate.", "D": "Fatal hepatotoxicity is the key valproate warning.", "E": "Acute angle-closure glaucoma is a topiramate warning."}, "source": "Drug list, Exam 1 'Epilepsy Medications': Lamotrigine (bold) 'Prolong fast inactivation ... may block some glutamate release ... (SJS & TEN)'; Phenytoin (gingival enlargement), Topiramate (kidney stones, closed angle glaucoma), Valproate (hepatotoxicity) rows"}, {"id": "mk2-q47", "n": 47, "part": 1, "title": null, "stem": "A 70-year-old man has lost many of the large neurons of the basal nucleus of Meynert in the basal forebrain. He now has trouble paying attention and learning new information. Which neuromodulator has been lost, and what does it normally do?", "options": [{"letter": "A", "text": "Norepinephrine, which drives arousal and vigilance"}, {"letter": "B", "text": "Serotonin, which shapes mood and impulse control"}, {"letter": "C", "text": "Dopamine, which signals reward"}, {"letter": "D", "text": "Oxytocin, which modulates social behavior"}, {"letter": "E", "text": "Acetylcholine, which modulates attention, learning and cortical and hippocampal plasticity"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Limbic System", "topic": "Limbic System", "note": null, "blueprint_category": "Limbic System", "learning_objective": "Limbic LO4", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Course framing: acetylcholine from the basal nucleus of Meynert modulates attention, learning, memory and cortical/hippocampal plasticity; each other neuromodulator has its own source nucleus.", "distractor_explanations": {"A": "Norepinephrine comes from the locus coeruleus in the pons.", "B": "Serotonin is not made by basal forebrain neurons.", "C": "The reward-related dopamine projection comes from the midbrain (mesolimbic system).", "D": "Oxytocin comes from the paraventricular and supraoptic nuclei of the hypothalamus."}, "source": "Wk3 packet p.58 (Limbic LO4: 'Acetylcholine synthetized in the basal nucleus of Meynert modulates attention, learning, memory, and cortical/hippocampal plasticity'; serotonin/raphe, NE/locus coeruleus, oxytocin/PVN-SON) and p.54 (mesolimbic dopaminergic systems)"}, {"id": "mk2-q48", "n": 48, "part": 1, "title": null, "stem": "A small infarct damages only the spinal trigeminal nucleus and tract in the right lateral medulla. Which deficit is expected?", "options": [{"letter": "A", "text": "Loss of pain and temperature sensation on the left side of the face"}, {"letter": "B", "text": "Loss of discriminative touch on the right side of the face"}, {"letter": "C", "text": "Weakness of the right muscles of mastication"}, {"letter": "D", "text": "Loss of pain and temperature sensation on the right side of the face"}, {"letter": "E", "text": "Loss of taste from the right anterior tongue"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Cranial Nerves Module", "topic": "Cranial Nerves Module", "note": null, "blueprint_category": "Cranial Nerves Module", "learning_objective": "CN Modules LO1, LO5", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": true, "thursday_11_5": false, "explanation": "Pain, temperature and crude touch from the face enter with CN V and descend in the spinal trigeminal tract to the spinal trigeminal nucleus on the same side, so a lateral medullary lesion causes ipsilateral facial pain and temperature loss.", "distractor_explanations": {"A": "The spinal trigeminal tract carries uncrossed first-order fibers, so the loss is on the same side.", "B": "Discriminative touch from the face relays in the principal (chief) sensory nucleus in the pons.", "C": "The trigeminal motor nucleus is in the pons, not the medulla.", "E": "Taste goes to the solitary nucleus, not the trigeminal nuclei."}, "source": "CN Modules slide 35 ('pain, temperature, & chemical sensations from the face go to the spinal trigeminal nucleus of the pons, medulla, & spinal cord'); slide 72 (nuclei map); CN Modules LO1, LO5"}, {"id": "mk2-q49", "n": 49, "part": 1, "title": null, "stem": "Which migraine-prevention drug is a monthly injected human monoclonal antibody against the CGRP receptor?", "options": [{"letter": "A", "text": "Rimegepant"}, {"letter": "B", "text": "Erenumab"}, {"letter": "C", "text": "Sumatriptan"}, {"letter": "D", "text": "Propranolol"}, {"letter": "E", "text": "Topiramate"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Headaches", "topic": "Headaches", "note": null, "blueprint_category": "Headaches", "learning_objective": "Headache LO6", "difficulty": 1, "format": "direct", "drug_item": "mechanism", "laterality": false, "thursday_11_5": false, "explanation": "Erenumab is a fully human monoclonal antibody against the CGRP receptor, given by injection to prevent migraine.", "distractor_explanations": {"A": "It is an oral small-molecule CGRP receptor antagonist ('gepant'), not an antibody.", "C": "It is a 5-HT1B/1D agonist used to abort attacks.", "D": "It is an oral beta blocker used for prevention.", "E": "It is an oral antiseizure drug used for prevention."}, "source": "Wk2 packet p.92 ('Erenumab (Aimovig) is a fully human monoclonal antibody of calcitonin gene-related peptide receptor') and p.137; drug list, Exam 1 'Migraine Medications': Erenumab, Rimegepant (bold)"}, {"id": "mk2-q50", "n": 50, "part": 1, "title": null, "stem": "Which corticospinal fibers stay uncrossed in the brainstem and cross only at the spinal level of the lower motor neurons they serve, mainly controlling axial muscles?", "options": [{"letter": "A", "text": "Anterior corticospinal tract"}, {"letter": "B", "text": "Lateral corticospinal tract"}, {"letter": "C", "text": "Rubrospinal tract"}, {"letter": "D", "text": "Tectospinal tract"}, {"letter": "E", "text": "Lateral vestibulospinal tract"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Corticospinal and UMN/LMN", "topic": "Corticospinal and UMN/LMN", "note": null, "blueprint_category": "Corticospinal and UMN/LMN", "learning_objective": "Descending Motor Pathways LO2", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The anterior corticospinal tract is the smaller accessory pathway; its fibers descend uncrossed and cross in the anterior white commissure at the level of their lower motor neurons, which serve more proximal and axial muscles.", "distractor_explanations": {"B": "Most corticospinal fibers cross at the pyramidal decussation in the caudal medulla and form this tract to the limbs.", "C": "It starts in the red nucleus and crosses in the midbrain.", "D": "It starts in the superior colliculus and crosses in the midbrain.", "E": "Its fibers are not corticospinal and stay uncrossed throughout."}, "source": "Wk2 packet p.27 ('They cross the midline via the anterior white commissure at the level of the lower motor neurons. They synapse with lower motor neurons that innervate more proximal...')"}, {"id": "mk2-q51", "n": 51, "part": 1, "title": null, "stem": "Which MRI sequence makes CSF dark while edema and demyelinating plaques stay bright, so lesions next to the ventricles stand out?", "options": [{"letter": "A", "text": "T1-weighted"}, {"letter": "B", "text": "T2-weighted"}, {"letter": "C", "text": "FLAIR"}, {"letter": "D", "text": "Diffusion-weighted imaging"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Neuroimaging Tutorial", "topic": "Neuroimaging Tutorial", "note": null, "blueprint_category": "Neuroimaging Tutorial", "learning_objective": "Neuroimaging Tutorial LO2-3", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "FLAIR is a T2-sensitive sequence with the free-CSF signal suppressed, so bright lesions near the dark ventricles are easy to see.", "distractor_explanations": {"A": "T1 makes CSF dark but most plaques and edema are dark too, so contrast with CSF is poor.", "B": "T2 makes CSF bright, which can hide periventricular lesions beside the bright ventricles.", "D": "DWI is used mainly to detect acute ischemia (restricted diffusion)."}, "source": "Wk1 packet p.112 ('FLAIR is essentially a T2-sensitive sequence in which the signal from free CSF has been suppressed') and p.113 table"}, {"id": "mk2-q52", "n": 52, "part": 1, "title": null, "stem": "In an H&E section of spinal cord white matter, the most common glial nuclei are small and round and lie in rows between the bundles of axons. What do these cells do?", "options": [{"letter": "A", "text": "Each wraps myelin segments around several CNS axons"}, {"letter": "B", "text": "Each wraps a single myelin segment around one peripheral axon"}, {"letter": "C", "text": "They engulf debris as resident macrophages"}, {"letter": "D", "text": "They line the central canal and move CSF with cilia"}, {"letter": "E", "text": "They form the outer covering of the cord's surface"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Histology Lab", "topic": "Histology Lab", "note": null, "blueprint_category": "Histology Lab", "learning_objective": "Histology Lab LO1-2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "These are interfascicular oligodendrocytes, the myelinating cells of the CNS; one oligodendrocyte myelinates segments of many axons. (Their rows in white matter are standard histology beyond the packet.)", "distractor_explanations": {"B": "That describes a Schwann cell in the PNS.", "C": "That is microglia, which are far fewer and have elongated nuclei.", "D": "That is the ependyma.", "E": "The pia mater (connective tissue) covers the surface; it is not a glial cell population in the white matter."}, "source": "Histology Lab LO1-2 (Wk1 packet p.209); Wk1 packet p.186 (oligodendrocytes 'the myelinating cells of the CNS'; compare Schwann cells) and p.188"}, {"id": "mk2-q53", "n": 53, "part": 1, "title": null, "stem": "In the days after a peripheral nerve is cut, what happens to the segment of axon distal to the cut?", "options": [{"letter": "A", "text": "It survives for months because Schwann cells supply its proteins"}, {"letter": "B", "text": "It degenerates, and its myelin breaks down and is cleared by macrophages and Schwann cells"}, {"letter": "C", "text": "It regrows back toward the cell body"}, {"letter": "D", "text": "It fuses with the proximal stump within a few days"}, {"letter": "E", "text": "Its debris is cleared mainly by oligodendrocytes"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Axon Repair", "topic": "Axon Repair", "note": null, "blueprint_category": "Axon Repair", "learning_objective": "Axon Repair LO1", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Wallerian degeneration: the distal axon and its myelin break down and are phagocytosed, while the cell body shows chromatolysis and the proximal stump sprouts.", "distractor_explanations": {"A": "The distal axon is cut off from the cell body's protein supply and degenerates within days.", "C": "Regrowth starts from the proximal stump, attached to the cell body, not from the distal segment.", "D": "Severed axon segments do not reconnect by fusion.", "E": "Oligodendrocytes are CNS cells; in the PNS, Schwann cells and macrophages clear debris."}, "source": "Wk2 packet p.49-50 (stages of Wallerian degeneration; macrophages help Schwann cells remove axonal debris); Axon Repair slides 1-7"}, {"id": "mk2-q54", "n": 54, "part": 1, "title": null, "stem": "A 26-year-old woman has episodes of shimmering zigzag lines that start near the center of her vision and spread outward over about 15 minutes, followed by tingling that moves from her fingers up to her face over 10 minutes, then a headache. Which feature most strongly favors migraine aura over a transient ischemic attack?", "options": [{"letter": "A", "text": "Sudden onset of all symptoms at the same moment"}, {"letter": "B", "text": "Loss of vision without any positive visual phenomena"}, {"letter": "C", "text": "Complete resolution within 24 hours"}, {"letter": "D", "text": "Symptoms affecting one side of the body"}, {"letter": "E", "text": "Positive symptoms that spread gradually over several minutes"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Headaches", "topic": "Headaches", "note": null, "blueprint_category": "Headaches", "learning_objective": "Headache LO2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Migraine auras begin with positive symptoms (flashing lights, tingling) that build and march over 5-20 minutes; TIAs begin suddenly with negative symptoms.", "distractor_explanations": {"A": "Abrupt, simultaneous onset is typical of a TIA.", "B": "Purely negative symptoms (vision loss, numbness) point toward a TIA.", "C": "Both TIA and aura resolve, so this does not separate them.", "D": "Both TIA and aura can be one-sided."}, "source": "Wk2 packet p.133-134 (LO-2: migraine aura vs other conditions; 'Both seizures and migraine auras tend to begin with positive symptoms, while TIAs ... occur with negative symptoms'); p.132 ICHD-3 aura criteria"}, {"id": "mk2-q55", "n": 55, "part": 1, "title": null, "stem": "A 71-year-old woman with postherpetic neuralgia starts a drug that binds the alpha-2-delta subunit and reduces the number of voltage-gated calcium channels at the membrane surface. Which adverse effects are most expected?", "options": [{"letter": "A", "text": "Dry mouth, constipation and urinary retention"}, {"letter": "B", "text": "Liver injury, especially with heavy alcohol use"}, {"letter": "C", "text": "Gingival enlargement and horizontal nystagmus"}, {"letter": "D", "text": "Sedation, dizziness, ataxia and peripheral edema"}, {"letter": "E", "text": "Weight loss and kidney stones"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Pain Medications", "topic": "Pain Medications", "note": null, "blueprint_category": "Pain Medications", "learning_objective": "Pain Medications LO3-4", "difficulty": 2, "format": "vignette", "drug_item": "side effect", "laterality": false, "thursday_11_5": false, "explanation": "The drug is gabapentin (or pregabalin). Its main side effects are sedation, somnolence, dizziness, ataxia and peripheral edema.", "distractor_explanations": {"A": "These anticholinergic effects fit tricyclic antidepressants such as amitriptyline.", "B": "Hepatotoxicity is the key risk of acetaminophen.", "C": "These are phenytoin effects.", "E": "These fit topiramate, a carbonic anhydrase inhibitor."}, "source": "Wk2 packet p.91 (gabapentinoids act via voltage-gated Ca2+ channels); drug list, Exam 1 'Additional drugs used for Chronic Pain': Gabapentin (bold) 'Sedation, somnolence, dizziness, ataxia, peripheral edema'"}, {"id": "mk2-q56", "n": 56, "part": 1, "title": null, "stem": "Weeks after a severe spinal cord injury, which glial cells proliferate, migrate to the edge of the damage and form a scar that walls it off?", "options": [{"letter": "A", "text": "Astrocytes"}, {"letter": "B", "text": "Oligodendrocytes"}, {"letter": "C", "text": "Ependymal cells"}, {"letter": "D", "text": "Schwann cells"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Histology of CNS 1: Neurons and Glia", "topic": "Histology of CNS 1: Neurons and Glia", "note": null, "blueprint_category": "Histology of CNS 1: Neurons and Glia", "learning_objective": "Histology CNS 1 LO5", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Severe injury triggers reactive astrogliosis: astrocytes proliferate and migrate to the margin of the damaged area and, with recruited cells, form an irreversible scar.", "distractor_explanations": {"B": "They myelinate CNS axons and do not form the glial scar.", "C": "They line the ventricles and central canal.", "D": "They are PNS cells that myelinate and guide regrowing peripheral axons."}, "source": "Wk1 packet p.187 ('Severe insults cause a proliferation and migration of the newly born astrocytes ... to form scars, walling off damaged areas'; Figure 16)"}, {"id": "mk2-q57", "n": 57, "part": 1, "title": null, "stem": "Parvocellular neurons of which hypothalamic nucleus secrete corticotropin-releasing hormone (CRH) and thyrotropin-releasing hormone (TRH) into the capillaries of the median eminence?", "options": [{"letter": "A", "text": "Supraoptic nucleus"}, {"letter": "B", "text": "Suprachiasmatic nucleus"}, {"letter": "C", "text": "Arcuate nucleus"}, {"letter": "D", "text": "Paraventricular nucleus"}, {"letter": "E", "text": "Medial preoptic area"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Hypothalamus", "topic": "Hypothalamus", "note": null, "blueprint_category": "Hypothalamus", "learning_objective": "Hypothalamus LO3-4", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The PVN has magnocellular neurons (oxytocin, vasopressin to the posterior pituitary) and parvocellular neuroendocrine neurons that release CRH and TRH into the median eminence for the hypophyseal portal system.", "distractor_explanations": {"A": "Its neurons are magnocellular and release vasopressin and oxytocin from the posterior pituitary, not releasing hormones into the portal system.", "B": "It sets circadian rhythms.", "C": "Its POMC/NPY, GHRH and somatostatin neurons have other roles; CRH and TRH come from the PVN.", "E": "It serves thermoregulation and sexual behavior."}, "source": "Wk3 packet p.4 ('Other small (parvocellular) neuroendocrine neurons project to the median eminence and secrete corticotropin-releasing hormone (CRH) and thyrotropin-releasing hormone (TRH)')"}, {"id": "mk2-q58", "n": 58, "part": 1, "title": null, "stem": "A 41-year-old man has a meningioma that compresses both orbitofrontal and ventromedial prefrontal cortices. His intelligence tests are normal, but he has become impulsive, makes poor personal decisions, and no longer adjusts his behavior to social feedback. These cortical areas normally contribute mainly to:", "options": [{"letter": "A", "text": "Primary processing of touch from the face"}, {"letter": "B", "text": "Valuing outcomes and regulating emotional behavior in social context"}, {"letter": "C", "text": "Forming new declarative memories"}, {"letter": "D", "text": "Generating voluntary movement of the limbs"}, {"letter": "E", "text": "Relaying visual information to the occipital cortex"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Limbic System", "topic": "Limbic System", "note": null, "blueprint_category": "Limbic System", "learning_objective": "Limbic LO2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The orbitofrontal and ventromedial prefrontal cortices are cortical limbic components that link emotion with value, decisions and social behavior; damage leaves intellect intact but disrupts judgment and emotional regulation.", "distractor_explanations": {"A": "That is the lateral postcentral gyrus (S1).", "C": "That depends on the hippocampus and medial temporal lobe.", "D": "That is the precentral gyrus and premotor areas.", "E": "That is the lateral geniculate nucleus and optic radiations."}, "source": "Wk3 packet p.52 (cortical limbic structures: anterior insula, orbitofrontal cortex, ventromedial prefrontal cortex, anterior cingulate) and p.54 (insula, amygdala, prefrontal cortex integrate context); Limbic LO2. The behavioral picture after frontal damage is standard neurology beyond the packet"}, {"id": "mk2-q59", "n": 59, "part": 1, "title": null, "stem": "A 74-year-old widower has 4 months of poor concentration and forgetfulness. He sleeps poorly, has lost interest in his hobbies and moves and speaks slowly. Thyroid function and vitamin B12 are normal. What is the most appropriate next step?", "options": [{"letter": "A", "text": "Start donepezil for presumed Alzheimer disease"}, {"letter": "B", "text": "Order CSF RT-QuIC testing"}, {"letter": "C", "text": "Arrange CSF drainage testing for normal pressure hydrocephalus"}, {"letter": "D", "text": "Reassure him that this is normal aging"}, {"letter": "E", "text": "Screen for and treat depression, then reassess his cognition"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Aging and Neurodegenerative Disorders", "topic": "Aging and Neurodegenerative Disorders", "note": null, "blueprint_category": "Aging and Neurodegenerative Disorders", "learning_objective": "Aging & Neurodegenerative LO2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Depression (low mood, anhedonia, sleep change, psychomotor slowing, poor concentration) can mimic dementia; the course approach is to screen, treat and reassess, since improvement supports a mood contribution.", "distractor_explanations": {"A": "Treatable contributors such as depression should be looked for before assuming a neurodegenerative cause.", "B": "RT-QuIC is for suspected rapidly progressive prion disease, which this is not.", "C": "NPH causes gait apraxia, incontinence and disproportionate ventriculomegaly, none of which he has.", "D": "Anhedonia, sleep change and slowing are not normal aging and need evaluation."}, "source": "Wk3 packet p.102 (reversible contributors table: 'Depression ... Screen for depression, treat it, and reassess cognition'); Aging & Neurodegenerative LO2 (p.100)"}, {"id": "mk2-q60", "n": 60, "part": 1, "title": null, "stem": "Which process of explicit memory makes newly stored, still-labile information stable for long-term storage through gene expression and new protein synthesis?", "options": [{"letter": "A", "text": "Encoding"}, {"letter": "B", "text": "Retrieval"}, {"letter": "C", "text": "Consolidation"}, {"letter": "D", "text": "Working memory"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Memory Formation", "topic": "Memory Formation", "note": null, "blueprint_category": "Memory Formation", "learning_objective": "Learning & Memory LO8", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Course framing: explicit memory involves encoding, consolidation, storage and retrieval; consolidation stabilizes labile memories (gene expression, protein synthesis, structural change).", "distractor_explanations": {"A": "Encoding is the initial attending to and processing of new information.", "B": "Retrieval is recalling stored information when needed.", "D": "Working memory holds information briefly in the prefrontal cortex; it is not one of the four explicit-memory processes."}, "source": "Wk3 packet p.66 ('Consolidation refers to those processes that alter the newly stored and still labile information so as to make it more stable for long-term storage'); Learning & Memory LO8"}, {"id": "mk2-q61", "n": 61, "part": 1, "title": null, "stem": "A 37-year-old man wakes with weakness of the whole right side of his face, including the forehead. Loud sounds are painful in his right ear and taste is reduced on the front of the right side of his tongue, but tear production is normal. Where is the lesion?", "options": [{"letter": "A", "text": "Right facial nerve in the internal acoustic meatus"}, {"letter": "B", "text": "Right facial nerve in the facial canal, between the geniculate ganglion and the nerve to stapedius"}, {"letter": "C", "text": "Right facial nerve at the stylomastoid foramen"}, {"letter": "D", "text": "Right facial nerve branches within the parotid gland"}, {"letter": "E", "text": "Left primary motor cortex (face area)"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Cranial Nerves Module", "topic": "Cranial Nerves Module", "note": null, "blueprint_category": "Cranial Nerves Module", "learning_objective": "CN Modules LO3-5", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": true, "thursday_11_5": false, "explanation": "Forehead involvement means a lower motor neuron (nerve) lesion. Lacrimation spared puts it distal to the geniculate ganglion (greater petrosal), while hyperacusis and taste loss put it proximal to the branches to stapedius and chorda tympani.", "distractor_explanations": {"A": "A lesion here would also cut the greater petrosal fibers (dry eye) and often CN VIII (hearing loss, not hyperacusis).", "C": "Beyond this point only motor branches remain, so taste and stapedius function would be spared.", "D": "Only terminal motor branches run in the parotid; taste and hearing would be normal.", "E": "An upper motor neuron lesion spares the forehead and gives contralateral lower-face weakness without taste or hearing changes."}, "source": "Wk1 packet p.162 (CN VII branches incl. the stapedius) and p.172 (CN lesion table); Wk1 packet p.19 (arch 2: stapedius); CN Modules LO5"}, {"id": "mk2-q62", "n": 62, "part": 1, "title": null, "stem": "Which muscle closes the eyelids, and which nerve supplies it?", "options": [{"letter": "A", "text": "Levator palpebrae superioris; oculomotor nerve"}, {"letter": "B", "text": "Orbicularis oculi; ophthalmic division of the trigeminal nerve"}, {"letter": "C", "text": "Orbicularis oculi; facial nerve (temporal and zygomatic branches)"}, {"letter": "D", "text": "Frontalis; facial nerve (temporal branch)"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Face Anatomy", "topic": "Face Anatomy", "note": null, "blueprint_category": "Face Anatomy", "learning_objective": "Face ILM LO2", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The orbicularis oculi encircles the orbit and closes the eye (gently and tightly); it is a muscle of facial expression supplied by temporal and zygomatic branches of CN VII.", "distractor_explanations": {"A": "This muscle raises the upper eyelid; it does not close the eye.", "B": "V1 carries sensation from the eyelids and cornea but does not supply the muscle.", "D": "Frontalis raises the eyebrows and wrinkles the forehead."}, "source": "Wk1 packet p.39 ('Orbicularis oculi named for its circular arrangement around the orbit') and p.164 (temporal and zygomatic branches to orbicularis oculi)"}, {"id": "mk2-q63", "n": 63, "part": 1, "title": null, "stem": "Second-order neurons of the spinothalamic tract cross the midline in which structure?", "options": [{"letter": "A", "text": "The sensory decussation in the caudal medulla"}, {"letter": "B", "text": "The pyramidal decussation"}, {"letter": "C", "text": "The posterior commissure of the midbrain"}, {"letter": "D", "text": "The thalamus, before the third-order neuron"}, {"letter": "E", "text": "The anterior (ventral) white commissure"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Pain & Pain pathways", "topic": "Pain & Pain pathways", "note": null, "blueprint_category": "Pain & Pain pathways", "learning_objective": "Pain & Pain Pathways LO1", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Pain and temperature fibers synapse in the dorsal horn; the second-order axons cross in the anterior white commissure near their entry level and ascend in the contralateral anterolateral column.", "distractor_explanations": {"A": "That is where the dorsal column-medial lemniscus pathway crosses (internal arcuate fibers).", "B": "That is where most corticospinal (motor) axons cross.", "C": "It carries pupillary light reflex fibers, not ascending pain fibers.", "D": "Spinothalamic fibers are already contralateral when they reach VPL."}, "source": "Pain & Pain Pathways LO1 (Wk2 packet p.13); SC Cross-Sectional worksheet list (anterior white commissure) Wk2 packet p.103"}, {"id": "mk2-q64", "n": 64, "part": 1, "title": null, "stem": "A 4-year-old with severe obesity since infancy and constant hunger is found to have a defect in proopiomelanocortin (POMC) signaling. The hypothalamic POMC neurons that help control body weight are located in which nucleus?", "options": [{"letter": "A", "text": "Suprachiasmatic nucleus"}, {"letter": "B", "text": "Supraoptic nucleus"}, {"letter": "C", "text": "Medial preoptic area"}, {"letter": "D", "text": "Arcuate (infundibular) nucleus"}, {"letter": "E", "text": "Mammillary body"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Hypothalamus", "topic": "Hypothalamus", "note": null, "blueprint_category": "Hypothalamus", "learning_objective": "Hypothalamus LO2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arcuate nucleus, above the median eminence, contains POMC and NPY neurons that control body weight, along with several other neuroendocrine populations (e.g., GHRH, somatostatin and KNDy neurons).", "distractor_explanations": {"A": "It is the circadian master clock driven by retinal input.", "B": "Its magnocellular neurons release vasopressin and oxytocin from the posterior pituitary.", "C": "It serves temperature regulation, sexual behavior and water balance.", "E": "It is part of the memory circuit (fornix to mammillothalamic tract), not a body-weight center."}, "source": "Wk3 packet p.4 ('Arcuate (infundibular) nucleus ... proopiomelanocortin (POMC) and neuropeptide Y (NPY) neurons control body weight'); p.3 (SCN, medial preoptic area)"}, {"id": "mk2-q65", "n": 65, "part": 1, "title": null, "stem": "In an isolated segment of intestine, a researcher blocks transmission only in the enteric plexus that lies between the circular and longitudinal smooth muscle layers. Which function is most directly lost?", "options": [{"letter": "A", "text": "The peristaltic reflex that propels contents along the gut"}, {"letter": "B", "text": "Secretion by the mucosal glands"}, {"letter": "C", "text": "Vagal sensory signaling from the gut to the brainstem"}, {"letter": "D", "text": "Sympathetic vasoconstriction of gut arterioles"}, {"letter": "E", "text": "Contraction of the external anal sphincter"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Autonomics", "topic": "Autonomics", "note": null, "blueprint_category": "Autonomics", "learning_objective": "Autonomic LO9", "difficulty": 2, "format": "research scenario", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The myenteric (Auerbach) plexus between the circular and longitudinal muscle layers coordinates motility and can produce the peristaltic reflex even in vitro, independent of the CNS; the submucosal (Meissner) plexus regulates secretion and blood flow.", "distractor_explanations": {"B": "Secretion and local blood flow are regulated mainly by the submucosal (Meissner) plexus.", "C": "These afferents run in the vagus nerve to the nucleus of the solitary tract; an isolated gut segment has no connection to them anyway.", "D": "This depends on postganglionic sympathetic fibers from prevertebral ganglia, not the enteric plexus.", "E": "It is skeletal muscle supplied by the pudendal nerve (somatic)."}, "source": "Wk3 packet p.17 ('myenteric plexus is characteristically found between the circular and longitudinal layers ... can be excited in-vitro to produce the peristaltic reflex'); Autonomic LO9"}, {"id": "mk2-q66", "n": 66, "part": 1, "title": null, "stem": "A 26-year-old woman takes one drug both for migraine prevention and for seizures. It prolongs Na+ channel inactivation, increases GABA-A activity, blocks AMPA/kainate receptors and has a fourth action. She now has colicky flank pain and blood in her urine. Which action explains this problem?", "options": [{"letter": "A", "text": "Prolonged inactivation of voltage-gated Na+ channels"}, {"letter": "B", "text": "Inhibition of carbonic anhydrase"}, {"letter": "C", "text": "Increased GABA-A chloride channel activity"}, {"letter": "D", "text": "Blockade of AMPA/kainate glutamate receptors"}, {"letter": "E", "text": "Induction of hepatic CYP3A4"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Antiepileptics", "topic": "Antiepileptics", "note": null, "blueprint_category": "Antiepileptics", "learning_objective": "Antiepileptics LO1-2", "difficulty": 3, "format": "vignette", "drug_item": "side effect", "laterality": false, "thursday_11_5": true, "explanation": "The drug is topiramate. Its carbonic anhydrase inhibition alkalinizes the urine and lowers citrate, raising the risk of calcium phosphate kidney stones.", "distractor_explanations": {"A": "This is the drug's main antiseizure action and is shared with carbamazepine and phenytoin, which do not cause stones.", "C": "GABA-A enhancement causes sedation and cognitive slowing, not kidney stones.", "D": "Glutamate blockade contributes to the antiseizure effect and cognitive side effects, not stones.", "E": "Enzyme induction causes drug interactions, not kidney stones."}, "source": "Drug list, Exam 1 'Epilepsy Medications' and 'Migraine Medications': Topiramate (bold) '... carbonic anhydrase inhibitor ... (because of CA inhibitor - increase kidney stones)'; Wk3 packet p.163 (topiramate mechanisms)"}, {"id": "mk2-q67", "n": 67, "part": 1, "title": null, "stem": "High-frequency stimulation of inputs to a hippocampal CA1 neuron produces long-term potentiation. Which sequence best explains the lasting increase in synaptic strength?", "options": [{"letter": "A", "text": "Glutamate binds AMPA receptors, which let Mg2+ in to trigger kinase activity"}, {"letter": "B", "text": "Calcium entry activates phosphatases that remove AMPA receptors from the synapse"}, {"letter": "C", "text": "GABA release onto CA1 blocks further glutamate release"}, {"letter": "D", "text": "Strong depolarization removes the Mg2+ block of NMDA receptors; Ca2+ enters, activating kinases that add AMPA receptors to the synapse"}, {"letter": "E", "text": "Glutamate opens NMDA receptors at rest without depolarization"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Memory Formation", "topic": "Memory Formation", "note": null, "blueprint_category": "Memory Formation", "learning_objective": "Learning & Memory LO13", "difficulty": 3, "format": "research scenario", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "LTP needs coincident glutamate binding and depolarization so NMDA receptors pass Ca2+; Ca2+ activates kinases (e.g., CaMKII) that insert and phosphorylate AMPA receptors.", "distractor_explanations": {"A": "AMPA receptors mainly pass Na+ (and K+); Mg2+ blocks NMDA channels rather than acting as the signal.", "B": "That is the mechanism of long-term depression, produced by low-frequency stimulation.", "C": "Increased inhibition would weaken, not potentiate, the synapse.", "E": "At rest Mg2+ blocks the NMDA channel; depolarization is required to relieve it."}, "source": "Wk3 packet p.68-69 (LO12-14: LTP and LTD; NMDA receptor role); Learning & Memory LO13"}, {"id": "mk2-q68", "n": 68, "part": 1, "title": null, "stem": "A 72-year-old man with long-standing hypertension and diabetes has had two sudden steps of worsening in thinking over 2 years. He is slow to answer and has trouble planning, and he has mild right-sided weakness. MRI shows several lacunar infarcts and confluent periventricular white matter hyperintensities. What best explains his cognitive decline?", "options": [{"letter": "A", "text": "Cumulative ischemic injury from small-vessel disease disrupting frontal-subcortical circuits"}, {"letter": "B", "text": "Extracellular amyloid plaques and intracellular tau tangles"}, {"letter": "C", "text": "Misfolded prion protein spreading through the cortex"}, {"letter": "D", "text": "Alpha-synuclein aggregates in cortical neurons"}, {"letter": "E", "text": "Impaired CSF absorption causing ventricular enlargement"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Aging and Neurodegenerative Disorders", "topic": "Aging and Neurodegenerative Disorders", "note": null, "blueprint_category": "Aging and Neurodegenerative Disorders", "learning_objective": "Aging & Neurodegenerative LO9", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Vascular cognitive impairment is decline caused by cerebrovascular disease; small-vessel disease from hypertension and diabetes produces lacunes and white matter lesions, a stepwise course, executive slowing and focal signs.", "distractor_explanations": {"B": "AD causes gradual memory-first decline with medial temporal atrophy, not stepwise decline with infarcts.", "C": "CJD is rapidly progressive over months, with myoclonus and characteristic DWI changes.", "D": "Dementia with Lewy bodies causes fluctuations, visual hallucinations and parkinsonism.", "E": "Normal pressure hydrocephalus causes gait trouble, incontinence and large ventricles, not lacunes."}, "source": "Wk3 packet p.109 ('LO9 - VASCULAR DEMENTIA Vascular cognitive impairment refers to cognitive decline caused or worsened by cerebrovascular disease') and p.114 table ('Stepwise or gradual decline; executive slowing, sometimes focal signs')"}, {"id": "mk2-q69", "n": 69, "part": 1, "title": null, "stem": "In which part of the CNS does gray matter form a central, butterfly-shaped core surrounded by white matter?", "options": [{"letter": "A", "text": "Cerebral hemispheres"}, {"letter": "B", "text": "Cerebellum"}, {"letter": "C", "text": "Spinal cord"}, {"letter": "D", "text": "Corpus callosum"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Histology Lab", "topic": "Histology Lab", "note": null, "blueprint_category": "Histology Lab", "learning_objective": "Histology Lab LO4; Histology CNS 2 LO3", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "In the spinal cord the gray matter is central (H- or butterfly-shaped) and the tracts are peripheral; in the cerebrum and cerebellum the cortex is outside the white matter.", "distractor_explanations": {"A": "Here gray matter forms the outer cortex, with white matter inside.", "B": "Here gray matter forms the outer cortex over a white-matter core (with deep nuclei inside).", "D": "It is a white-matter commissure with no gray core."}, "source": "Nervous System Basics slide 42 ('the butterfly shaped collection of cells in the spinal cord'); Wk1 packet p.204 Fig. 6 ('In the spinal cord, gray matter is central (forming an H-...')"}, {"id": "mk2-q70", "n": 70, "part": 1, "title": null, "stem": "A 58-year-old man has 1 year of progressive weakness. His hands are wasted with visible twitching of the muscles, yet his reflexes are brisk and both plantar responses are extensor. Sensation and bladder function are normal. Which neurons are degenerating?", "options": [{"letter": "A", "text": "Dorsal root ganglion neurons"}, {"letter": "B", "text": "Cerebellar Purkinje cells"}, {"letter": "C", "text": "Dopaminergic neurons of the substantia nigra"}, {"letter": "D", "text": "Neurons of the dorsal columns and spinocerebellar tracts"}, {"letter": "E", "text": "Upper motor neurons in the motor cortex and lower motor neurons in the brainstem and spinal cord"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Neuropathology of Neurodegenerative Diseases Lecture", "topic": "Neuropathology of Neurodegenerative Diseases Lecture", "note": null, "blueprint_category": "Neuropathology of Neurodegenerative Diseases Lecture", "learning_objective": "Neuropathology LO5", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Mixed UMN signs (hyperreflexia, Babinski) and LMN signs (atrophy, fasciculations) with normal sensation define amyotrophic lateral sclerosis.", "distractor_explanations": {"A": "Their loss causes sensory ataxia and areflexia with normal strength.", "B": "Their loss causes ataxia, not wasting with fasciculations.", "C": "Their loss causes Parkinson disease: bradykinesia, rigidity and tremor.", "D": "This pattern fits Friedreich ataxia, with sensory loss and areflexia."}, "source": "Wk3 packet p.121 ('LO-5; AMYOTROPHIC LATERAL SCLEROSIS (ALS): ... loss of upper mot[or] ... neurons'); Neuropathology slide 16 ('ALS affects both the Upper and Lower Motor Neurons')"}, {"id": "mk2-q71", "n": 71, "part": 1, "title": null, "stem": "During surgery for primary hyperparathyroidism, a surgeon cannot find one of the inferior parathyroid glands in the neck. It is finally located in the anterior mediastinum, embedded in thymic tissue. This location is explained by the gland's origin from the:", "options": [{"letter": "A", "text": "Fourth pharyngeal pouch, which migrates caudally with the thymus"}, {"letter": "B", "text": "Second pharyngeal pouch, which forms the tonsillar fossa"}, {"letter": "C", "text": "Thyroglossal duct, which descends from the foramen cecum"}, {"letter": "D", "text": "Third pharyngeal pouch, which migrates caudally with the thymus"}, {"letter": "E", "text": "Ultimobranchial body, which joins the thyroid"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Neck Anatomy", "topic": "Neck Anatomy", "note": null, "blueprint_category": "Neck Anatomy", "learning_objective": "Neck ILM LO6", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The inferior parathyroids come from pouch 3 together with the thymus and travel further down than the superior (pouch 4) glands, so an ectopic inferior gland can end up in the mediastinum with the thymus.", "distractor_explanations": {"A": "Pouch 4 forms the superior parathyroids, which move only a short distance and usually stay at the upper thyroid.", "B": "Pouch 2 forms the palatine tonsil, not parathyroid tissue.", "C": "The thyroglossal duct carries the thyroid, not the parathyroids, down the midline.", "E": "The ultimobranchial body supplies the thyroid's parafollicular (C) cells."}, "source": "Wk1 packet p.66 (embryological origin and migration of the thyroid and parathyroid glands; links to DiGeorge); Neck ILM LO6 (p.53)"}, {"id": "mk2-q72", "n": 72, "part": 1, "title": null, "stem": "A 72-year-old woman has a new headache over her right temple, pain in her jaw when chewing, and a tender, cord-like artery that pulses just in front of her ear above the zygomatic arch. A surgeon biopsies that artery. Which statement about it is correct?", "options": [{"letter": "A", "text": "It is a branch of the ophthalmic artery from the internal carotid"}, {"letter": "B", "text": "It is the facial artery, which crosses the zygomatic arch"}, {"letter": "C", "text": "It is a terminal branch of the external carotid artery and runs with the auriculotemporal nerve"}, {"letter": "D", "text": "It is the middle meningeal artery, which supplies the scalp"}, {"letter": "E", "text": "It is the occipital artery, which supplies the anterior scalp"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Face Anatomy", "topic": "Face Anatomy", "note": null, "blueprint_category": "Face Anatomy", "learning_objective": "Face ILM LO5", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The pulse in front of the tragus above the zygomatic arch is the superficial temporal artery, one of the two terminal branches of the external carotid; it ascends with the superficial temporal vein and auriculotemporal nerve. (Temporal arteritis as the reason for biopsy is general medical knowledge.)", "distractor_explanations": {"A": "Ophthalmic branches (supraorbital, supratrochlear) reach the forehead from the orbit, not the area in front of the ear.", "B": "The facial artery crosses the lower border of the mandible and runs toward the angle of the mouth and nose.", "D": "The middle meningeal artery enters the skull through the foramen spinosum to supply the dura.", "E": "The occipital artery supplies the posterior scalp."}, "source": "Wk1 packet p.46 (superficial temporal artery 'ascends superficial to the zygomatic arch'); ILM Anatomy of the Face slide 17; Lab 1 notes Fig. 12 (auriculotemporal n. with superficial temporal a. and v.)"}, {"id": "mk2-q73", "n": 73, "part": 1, "title": null, "stem": "A newborn has closely spaced eyes, a single central upper incisor and a midline cleft of the upper lip. MRI shows that the cerebral hemispheres failed to separate. A defect in which signaling pathway is most often responsible?", "options": [{"letter": "A", "text": "Bone morphogenetic protein from the roof plate"}, {"letter": "B", "text": "Wnt signaling from the neural folds"}, {"letter": "C", "text": "Fibroblast growth factor from the apical ectodermal ridge"}, {"letter": "D", "text": "Folate-dependent closure of the caudal neuropore"}, {"letter": "E", "text": "Sonic hedgehog"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Face Embryology", "topic": "Face Embryology", "note": null, "blueprint_category": "Face Embryology", "learning_objective": "Facial Embryology LO6", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Holoprosencephaly is failed cleavage of the prosencephalon, often with midline facial defects (hypotelorism, single incisor, cleft lip); it is classically linked to loss of sonic hedgehog signaling.", "distractor_explanations": {"A": "BMP is not the pathway classically linked to failed forebrain cleavage.", "B": "Wnt is not the pathway classically linked to holoprosencephaly.", "C": "FGF from the AER drives limb outgrowth.", "D": "Folate deficiency is linked to open neural tube defects such as spina bifida, not midline facial and forebrain defects."}, "source": "Wk1 packet p.32 (holoprosencephaly, 'defects to several genes including sonic hedgehog'); p.193 (undivided prosencephalon)"}, {"id": "mk2-q74", "n": 74, "part": 1, "title": null, "stem": "A 70-year-old man suddenly cannot tell where he is being touched on one side of his face. MRI shows a lacunar infarct in the ventral posteromedial (VPM) nucleus of the right thalamus. Which deficit is expected?", "options": [{"letter": "A", "text": "Loss of discriminative touch on the right side of the face"}, {"letter": "B", "text": "Loss of discriminative touch on the left side of the face"}, {"letter": "C", "text": "Loss of vibration and position sense in the left arm and leg"}, {"letter": "D", "text": "Loss of vibration and position sense in the right arm and leg"}, {"letter": "E", "text": "Loss of touch on both sides of the face"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Somatosensory Receptors and Tracts", "topic": "Somatosensory Receptors and Tracts", "note": null, "blueprint_category": "Somatosensory Receptors and Tracts", "learning_objective": "Sensory Receptors LO5-6", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": true, "thursday_11_5": false, "explanation": "Second-order trigeminal fibers cross and ascend in the trigeminal lemniscus to the contralateral VPM, which projects through the posterior limb of the internal capsule to the lateral postcentral gyrus.", "distractor_explanations": {"A": "The trigeminal touch pathway crosses in the pons before reaching VPM, so right VPM serves the left face.", "C": "Body sensation from the dorsal columns relays in VPL, not VPM.", "D": "This would need a right-sided lesion below the medullary decussation or a left VPL lesion.", "E": "Each VPM serves the opposite half of the face, so a one-sided lesion gives one-sided loss."}, "source": "Wk2 packet p.11 ('Third order neuron: The nerve cell bodies in the VPM of the thalamus ...'); Sensory Receptors LO5-6 (p.1); somatosensory slides 50/27 (VPM to lateral-inferior postcentral gyrus)"}, {"id": "mk2-q75", "n": 75, "part": 1, "title": null, "stem": "A 61-year-old man swims in a cold lake. For the next 6 hours he keeps asking his wife where they are and what they did that morning, forgetting her answers within minutes. He knows who he is and has no weakness. By the next day he is completely normal. What is the most likely diagnosis?", "options": [{"letter": "A", "text": "Transient global amnesia"}, {"letter": "B", "text": "Focal impaired awareness seizure"}, {"letter": "C", "text": "Transient ischemic attack"}, {"letter": "D", "text": "Korsakoff syndrome"}, {"letter": "E", "text": "Herpes simplex encephalitis"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Memory Formation", "topic": "Memory Formation", "note": null, "blueprint_category": "Memory Formation", "learning_objective": "Learning & Memory LO4-5", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Transient global amnesia is a temporary loss of new-memory formation, often after exertion, cold water, stress or Valsalva, with identity preserved and complete recovery within about a day.", "distractor_explanations": {"B": "Seizures last minutes, often with automatisms, and do not cause hours of isolated amnesia with otherwise normal behavior.", "C": "TIAs cause focal negative deficits such as weakness or aphasia, not isolated new-memory loss for hours.", "D": "Korsakoff is a lasting amnesia with confabulation after thiamine deficiency, not a one-day episode.", "E": "It causes fever, seizures and lasting medial temporal damage rather than a full recovery within a day."}, "source": "Wk3 packet p.64 ('A transient global amnesia may be preceded by specific physical or emotional events, including: strenuous physical exertion ...'); Learning & Memory LO4-5 (p.59)"}, {"id": "mk2-q76", "n": 76, "part": 1, "title": null, "stem": "A 50-year-old woman with adult-onset asthma and a high eosinophil count has, over 6 weeks, a sudden right foot drop, then numbness of her left little finger, then weakness of left wrist extension. A sural nerve biopsy would most likely show:", "options": [{"letter": "A", "text": "Segmental demyelination with macrophages stripping myelin and few vessel changes"}, {"letter": "B", "text": "Amyloid deposits around nerve fibers"}, {"letter": "C", "text": "Inflammation and necrosis of small nerve blood vessel walls, with axonal degeneration"}, {"letter": "D", "text": "Normal nerve with loss of anterior horn cells"}, {"letter": "E", "text": "Selective loss of large myelinated fibers from vitamin B12 deficiency"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Peripheral Neuropathies", "topic": "Peripheral Neuropathies", "note": null, "blueprint_category": "Peripheral Neuropathies", "learning_objective": "Peripheral Neuropathy LO2-3", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Sequential, asymmetric single-nerve lesions (mononeuritis multiplex) with asthma and eosinophilia point to eosinophilic granulomatosis with polyangiitis, a small-to-medium vessel vasculitis that infarcts nerves (axonal injury).", "distractor_explanations": {"A": "That is a demyelinating process; this patient has separate, sudden single-nerve lesions, which point to nerve infarction.", "B": "Amyloid neuropathy is slowly progressive, symmetric and often autonomic.", "D": "This fits a motor neuron disease, which has no sensory loss.", "E": "B12 deficiency gives a symmetric, length-dependent picture with dorsal column signs."}, "source": "Wk2 packet p.66 ('Eosinophilic Granulomatosis with Polyangiitis ... asthma, eosinophilia ... mononeuritis multiplex'); Peripheral Neuropathy LO2-3 (p.60)"}, {"id": "mk2-q77", "n": 77, "part": 1, "title": null, "stem": "After a lymph node biopsy in the left posterior triangle of the neck, a 45-year-old man has a drooping left shoulder and cannot raise his left arm above his head. Turning his head against resistance is strong in both directions. Where was the nerve most likely injured?", "options": [{"letter": "A", "text": "Spinal accessory nerve at the jugular foramen"}, {"letter": "B", "text": "Suprascapular nerve at the scapular notch"}, {"letter": "C", "text": "Fifth cervical root in the intervertebral foramen"}, {"letter": "D", "text": "Great auricular nerve over the sternocleidomastoid"}, {"letter": "E", "text": "Spinal accessory nerve in the posterior triangle, after its branch to the sternocleidomastoid"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Neck Anatomy", "topic": "Neck Anatomy", "note": null, "blueprint_category": "Neck Anatomy", "learning_objective": "Neck ILM LO7", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "CN XI supplies the sternocleidomastoid first and then crosses the posterior triangle superficially to the trapezius, where node biopsies can cut it; trapezius loss gives shoulder droop and weak elevation above the head while head turning is spared.", "distractor_explanations": {"A": "A lesion there would also weaken the sternocleidomastoid (weak head turning to the opposite side) and usually involve IX and X.", "B": "It supplies supraspinatus and infraspinatus; it would not cause shoulder droop from trapezius loss.", "C": "C5 would weaken shoulder abduction and the biceps reflex with lateral arm numbness, without isolated trapezius paralysis.", "D": "It is a sensory cervical plexus branch; injury causes numbness near the ear, not weakness."}, "source": "Wk1 packet p.68-69 (course of XI under the sternocleidomastoid and across the neck; lesion consequences, Neck ILM LO7); Lab 1 notes p.12 Step 2 (accessory nerve under trapezius)"}, {"id": "mk2-q78", "n": 78, "part": 2, "title": "Gross anatomy lab image: Face", "stem": "Which nerve emerges from the opening indicated by the arrow?", "options": [{"letter": "A", "text": "Infraorbital nerve (V2)"}, {"letter": "B", "text": "Supraorbital nerve (V1)"}, {"letter": "C", "text": "Mental nerve (V3)"}, {"letter": "D", "text": "Zygomatic branch of the facial nerve"}, {"letter": "E", "text": "Maxillary nerve (V2) trunk"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock2-images/lab-face-1.png", "image_needed": true, "week": 1, "session_guess": "Lab 1 (10/20)", "topic": "Face", "note": null, "blueprint_category": "Gross Anatomy Lab Image: Face", "learning_objective": "Lab 1 (10/20) LO1 (identify structures on the structure list); LO3 (relationships/functions)", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrow is on the infra-orbital foramen of the maxilla, just below the orbital rim, where the infraorbital nerve (terminal branch of V2) and vessels reach the cheek.", "distractor_explanations": {"B": "It leaves through the supraorbital notch or foramen on the upper orbital margin.", "C": "It leaves through the mental foramen on the body of the mandible.", "D": "Facial nerve branches leave the skull at the stylomastoid foramen and fan out from the parotid; none use this opening.", "E": "The V2 trunk leaves the middle cranial fossa through the foramen rotundum, deep in the skull; only its infraorbital branch reaches the face here."}, "source": "Lab 1 notes p.3, Fig. 1 (anterior skull; 'Infra-orbital foramen' label); Lab 1 structure list (Nerves, Face: Infraorbital nerve)"}, {"id": "mk2-q79", "n": 79, "part": 2, "title": "Gross anatomy lab image: Face", "stem": "Identify the structure indicated by the arrow in this lateral view of the face.", "options": [{"letter": "A", "text": "Submandibular gland"}, {"letter": "B", "text": "Masseter muscle"}, {"letter": "C", "text": "Buccal fat pad"}, {"letter": "D", "text": "Parotid gland"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock2-images/lab-face-2.png", "image_needed": true, "week": 1, "session_guess": "Lab 1 (10/20)", "topic": "Face", "note": null, "blueprint_category": "Gross Anatomy Lab Image: Face", "learning_objective": "Lab 1 (10/20) LO1 (identify structures on the structure list)", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrow is on the lobulated gland in front of the ear, over the posterior border of the ramus, with facial nerve branches emerging from it: the 'Parotid gland' label in the figure.", "distractor_explanations": {"A": "It lies in the submandibular triangle under the body of the mandible, not over the ramus in front of the ear.", "B": "The masseter lies anterior to the gland, over the ramus, and its fibers run vertically.", "C": "It sits deep to the cheek, anterior to the masseter."}, "source": "Lab 1 notes p.8, Fig. 12 (parotid region; 'Parotid gland' label); Lab 1 structure list (Glands, Face: Parotid gland)"}, {"id": "mk2-q80", "n": 80, "part": 2, "title": "Gross anatomy lab image: Face", "stem": "This is the infratemporal fossa after removal of the zygomatic arch, part of the mandibular ramus and part of the lateral pterygoid. Identify the muscle indicated by the arrow.", "options": [{"letter": "A", "text": "Lateral pterygoid"}, {"letter": "B", "text": "Medial pterygoid"}, {"letter": "C", "text": "Temporalis"}, {"letter": "D", "text": "Masseter"}, {"letter": "E", "text": "Buccinator"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock2-images/lab-face-3.png", "image_needed": true, "week": 1, "session_guess": "Lab 1 (10/20)", "topic": "Face", "note": null, "blueprint_category": "Gross Anatomy Lab Image: Face", "learning_objective": "Lab 1 (10/20) LO1 (identify structures on the structure list)", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrow is on the vertical muscle deep to the lingual and inferior alveolar nerves, running down to the angle of the mandible: the 'Medial pterygoid' label.", "distractor_explanations": {"A": "Its cut stump lies higher, near the TMJ and condyle, running horizontally.", "C": "Its cut tendon lies above, attached to the coronoid process.", "D": "It lies superficial to the ramus and was removed with it in this dissection.", "E": "It lies further forward in the cheek, deep to the buccal fat pad."}, "source": "Lab 1 notes p.11, Fig. 16 (infratemporal fossa; 'Medial pterygoid' label); Lab 1 structure list (Muscles, Face: Medial pterygoid)"}, {"id": "mk2-q81", "n": 81, "part": 2, "title": "Gross anatomy lab image: Neck", "stem": "Identify the nerve indicated by the arrow in this dissection of the upper neck.", "options": [{"letter": "A", "text": "Hypoglossal nerve (CN XII)"}, {"letter": "B", "text": "Vagus nerve (CN X)"}, {"letter": "C", "text": "Spinal accessory nerve (CN XI)"}, {"letter": "D", "text": "Superior laryngeal nerve"}, {"letter": "E", "text": "Superior root of the ansa cervicalis"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock2-images/lab-neck-1.png", "image_needed": true, "week": 1, "session_guess": "Lab 1 (10/20)", "topic": "Neck", "note": null, "blueprint_category": "Gross Anatomy Lab Image: Neck", "learning_objective": "Lab 1 (10/20) LO1 (identify structures on the structure list)", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrow is on the nerve looping forward across the external and internal carotid arteries above the hyoid, toward the tongue: the 'Hypoglossal n. (CN XII)' label.", "distractor_explanations": {"B": "The vagus runs vertically inside the carotid sheath between the internal jugular vein and the carotid artery.", "C": "It runs backward into the sternocleidomastoid, which is reflected here.", "D": "It runs down and forward behind the carotid arteries toward the larynx, below this level.", "E": "It leaves the hypoglossal nerve and runs downward on the carotid sheath; the arrow is on the nerve crossing forward above it."}, "source": "Lab 1 notes p.13, Fig. 20 (submandibular region; 'Hypoglossal n. (CN XII)' label); Lab 1 structure list (Nerves, Neck: Hypoglossal nerve)"}, {"id": "mk2-q82", "n": 82, "part": 2, "title": "Gross anatomy lab image: External Features", "stem": "Identify the gyral region indicated by the arrow on this lateral view of the left hemisphere.", "options": [{"letter": "A", "text": "Orbital part of the inferior frontal gyrus"}, {"letter": "B", "text": "Opercular part of the inferior frontal gyrus"}, {"letter": "C", "text": "Middle frontal gyrus"}, {"letter": "D", "text": "Supramarginal gyrus"}, {"letter": "E", "text": "Triangular part of the inferior frontal gyrus"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock2-images/lab-ext-1.png", "image_needed": true, "week": 2, "session_guess": "Lab 2 (10/27)", "topic": "External Features", "note": null, "blueprint_category": "Gross Anatomy Lab Image: External Features", "learning_objective": "Lab 2 (10/27) LO1 (identify structures on the structure list); LO3 (relationships/functions)", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrow is on the middle (triangular) part of the inferior frontal gyrus, labeled '2' in Nolte's drawing, between the orbital part (1) in front and the opercular part (3) behind.", "distractor_explanations": {"A": "It is the most anterior and inferior part, near the orbit.", "B": "It is the most posterior part, just in front of the precentral gyrus.", "C": "It lies one gyrus higher, above the inferior frontal sulcus.", "D": "It is in the parietal lobe, capping the end of the lateral sulcus."}, "source": "Nolte Ch. 1, Fig. 1.4 (drawing PDF p.19; 'Inferior frontal gyrus 1. orbital part 2. triangular part 3. opercular part'); Lab 2 structure list (Inferior frontal gyrus: triangular part (pars triangularis))"}, {"id": "mk2-q83", "n": 83, "part": 2, "title": "Gross anatomy lab image: External Features", "stem": "Identify the structure indicated by the arrow on this ventral view of the brainstem and base of the forebrain.", "options": [{"letter": "A", "text": "Trochlear nerve (CN IV)"}, {"letter": "B", "text": "Oculomotor nerve (CN III)"}, {"letter": "C", "text": "Optic tract"}, {"letter": "D", "text": "Trigeminal nerve (CN
