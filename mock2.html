<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Midterm 1 Mock #2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: sticky exam bar; question column (serif stems, like a printed exam) + item navigator rail; rail drops below on phones. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --ink:#15202b; --muted:#5a6976; --line:#d3dce3;
  --accent:#1d5f8a; --accent-ink:#ffffff; --accent-soft:#dfebf4;
  --flag:#a86a12; --ok:#21764a; --ok-soft:#e1f1e8; --bad:#b1352d; --bad-soft:#f7e2e0;
  --hl:#fbe68a; --hl-ink:#15202b;
  --font-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#151e27; --ink:#e3e9ee; --muted:#93a2ae; --line:#283541;
  --accent:#6db3df; --accent-ink:#0b1620; --accent-soft:#183245;
  --flag:#e3aa4f; --ok:#5ec48b; --ok-soft:#153424; --bad:#ef7f75; --bad-soft:#3b1d1b; --hl:#6b5a14; --hl-ink:#fff6d6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#151e27; --ink:#e3e9ee; --muted:#93a2ae; --line:#283541;
  --accent:#6db3df; --accent-ink:#0b1620; --accent-soft:#183245;
  --flag:#e3aa4f; --ok:#5ec48b; --ok-soft:#153424; --bad:#ef7f75; --bad-soft:#3b1d1b; --hl:#6b5a14; --hl-ink:#fff6d6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand b{font-weight:600;font-size:16px;letter-spacing:.01em}
.brand span{color:var(--muted);font-size:12.5px}
.meters{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.meter{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.meter small{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meter .mono{font-size:15px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-size:13.5px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 6px}
.btn.ghost:hover{color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
main{min-width:0}

/* question */
.qhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:12px}
.qnum{font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.qnum b{color:var(--ink);font-size:20px;font-weight:500;margin-right:4px}
.tag{font-size:11.5px;letter-spacing:.04em;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.thu{border-color:var(--flag);color:var(--flag)}
.spacer{margin-left:auto}
.flagbtn{display:inline-flex;align-items:center;gap:6px}
.flagbtn[aria-pressed="true"]{color:var(--flag);border-color:var(--flag)}
.flagbtn svg{width:14px;height:14px}
.stem{font-family:var(--font-body);font-size:18px;line-height:1.6;max-width:68ch;margin:0 0 16px;cursor:text}
.stem mark{background:var(--hl);color:var(--hl-ink);border-radius:2px;padding:0 1px;cursor:pointer}
.stem mark:hover{text-decoration:line-through;text-decoration-thickness:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:none;background:transparent;padding:6px 10px;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg-l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.meter.clock{cursor:pointer;background:transparent;border:none;padding:0;font:inherit;color:inherit}
.live{color:var(--ok)}
.figure{margin:0 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:inline-block;max-width:100%}
.figure img{display:block;max-height:460px;width:auto;max-width:100%;border-radius:4px;cursor:zoom-in}
.ann{margin:14px 0 4px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ann-h{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.ann img{display:block;max-width:100%;max-height:620px;width:auto;border-radius:4px;cursor:zoom-in;background:#fff}
.ann .how{font-size:12.5px;color:var(--muted);margin:8px 0 6px}
.ann ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.ann li{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;line-height:1.45}
.ann .dot{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 12px var(--font-mono);margin-top:1px}
.ann .dot.k{background:#169646}.ann .dot.d{background:#d63c32}.ann .dot.n{background:transparent;color:var(--muted);border:1px solid var(--line)}
.ann .note{font-size:13.5px;color:var(--muted);margin-top:8px}
.figure figcaption{font-size:12px;color:var(--muted);margin-top:6px}
.opts{display:flex;flex-direction:column;gap:8px;max-width:72ch}
.optrow{display:flex;gap:6px;align-items:stretch}
.opt{flex:1;min-width:0;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 14px;font-family:var(--font-body);font-size:16.5px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .L{font-family:var(--font-mono);font-size:13.5px;flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;margin-top:1px;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .L{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.struck .T{text-decoration:line-through;color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default;color:inherit}
.strike{flex:none;width:36px;border:1px solid transparent;background:transparent;border-radius:8px;color:var(--muted);font-size:13px}
.strike:hover{border-color:var(--line);color:var(--ink)}
.qnav{display:flex;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted)}
.hint kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}

.explain{margin-top:20px;max-width:72ch;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.explain .verdict{font-weight:600}
.explain .verdict.ok{color:var(--ok)} .explain .verdict.bad{color:var(--bad)}
.explain p{margin:0;font-family:var(--font-body);font-size:16px;line-height:1.55}
.whynot-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.whynot ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-family:var(--font-body);font-size:15px;line-height:1.5}
.whynot b{font-weight:600}
.explain dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.explain dt{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:11px;padding-top:2px}
.explain dd{margin:0}

/* rail */
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:calc(100vh - 100px);overflow:auto}
@media (max-width:860px){aside{position:static;max-height:none}}
.rail-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:4px}
.cell{position:relative;height:30px;border:1px solid var(--line);background:transparent;border-radius:5px;font-family:var(--font-mono);font-size:12px;color:var(--muted);padding:0}
.cell.ans{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.cell.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.cell.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.cell.skip{border-style:dashed;border-color:var(--bad);color:var(--bad)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--ink)}
.cell.flg::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--flag)}
.cell.dim{opacity:.25}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:3px 10px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.sync{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.sync.warn{color:var(--flag)}

/* results */
.results h2{font-family:var(--font-body);font-weight:600;font-size:28px;margin:0 0 4px;text-wrap:balance}
.results .sub{color:var(--muted);margin:0 0 20px}
.score{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;min-width:140px;flex:1}
.stat small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .mono{font-size:24px}
.stat .mono em{font-style:normal;font-size:14px;color:var(--muted);margin-left:6px}
.stat.lead{border-color:var(--accent)}
.section-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 8px}
.bars{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;font-size:13.5px}
.track{height:10px;background:var(--bad-soft);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--ok)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:none}
td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.miss{display:inline-block;font-family:var(--font-mono);font-size:12px;border:1px solid var(--bad);color:var(--bad);border-radius:4px;padding:0 6px;margin:0 4px 4px 0;background:transparent}
.miss.skipd{border-style:dashed}
.hist{font-size:13px;color:var(--muted)}
.hist li{margin-bottom:2px}

/* dialog + lightbox */
.scrim{position:fixed;inset:0;background:rgba(5,10,15,.55);z-index:20;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
.dialog h3{margin:0;font-size:17px}
.dialog p{margin:0;color:var(--muted)}
.dialog .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.lightbox img{max-width:100%;max-height:calc(100vh - 60px);border-radius:6px;background:#fff;cursor:zoom-out}
@media (prefers-reduced-motion:no-preference){.opt,.cell,.btn{transition:border-color .12s,background-color .12s}}
</style>

r": "D", "text": "Third and fourth pharyngeal pouches"}, {"letter": "E", "text": "Thyroglossal duct"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Face Embryology", "topic": "Face Embryology", "note": null, "blueprint_category": "Face Embryology", "learning_objective": "Facial Embryology LO6", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "DiGeorge syndrome (22q11.2 deletion) disrupts pouches 3 and 4, which form the parathyroid glands and thymus, giving hypocalcemia, T-cell deficiency and conotruncal heart defects.", "distractor_explanations": {"A": "Arch 1 forms the mandible, malleus, incus and muscles of mastication; its defects (e.g., Treacher Collins) do not affect calcium.", "B": "Pouch 2 forms the palatine tonsil, which has no role in calcium regulation.", "C": "Cleft 1 forms the external acoustic meatus.", "E": "The duct marks the thyroid's descent; the thyroid's follicular cells do not set serum calcium."}, "source": "Wk1 packet p.31 (DiGeorge syndrome, 22q11.2); p.16 LO6; Facial Embryology slide 10 (pouch derivatives)"}, {"id": "mk2-q02", "n": 2, "part": 1, "title": null, "stem": "A 26-year-old woman has occipital headaches that get worse when she coughs or strains. MRI shows the cerebellar tonsils extending 8 mm below the foramen magnum; the brainstem and vermis are in normal position and there is no spinal defect. What is the diagnosis?", "options": [{"letter": "A", "text": "Chiari type II malformation"}, {"letter": "B", "text": "Chiari type I malformation"}, {"letter": "C", "text": "Dandy-Walker malformation"}, {"letter": "D", "text": "Holoprosencephaly"}, {"letter": "E", "text": "Encephalocele"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Embryo Disorders of CNS", "topic": "Embryo Disorders of CNS", "note": null, "blueprint_category": "Embryo Disorders of CNS", "learning_objective": "Embryological Disorders LO3", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Chiari I is downward displacement of the cerebellar tonsils alone through the foramen magnum, often found in adults, sometimes with a syrinx.", "distractor_explanations": {"A": "Type II displaces the vermis and brainstem too and is usually seen with a myelomeningocele.", "C": "It is vermian hypoplasia with a cystic, enlarged fourth ventricle in a large posterior fossa.", "D": "It is failed separation of the forebrain hemispheres.", "E": "It is herniation of brain tissue through a defect in the skull."}, "source": "Wk1 packet p.193 ('Type I = cerebellar tonsils; Type II = cerebellum and brainstem, often accompanied by myelomeningocele'); Embryological Disorders slide 22"}, {"id": "mk2-q03", "n": 3, "part": 1, "title": null, "stem": "A 76-year-old man has had 3 years of slowly worsening memory for recent events, then trouble finding words and getting lost in familiar places. Which MRI finding is most characteristic of his likely disease, especially early?", "options": [{"letter": "A", "text": "Atrophy of the hippocampi and medial temporal lobes"}, {"letter": "B", "text": "Atrophy limited to the frontal and anterior temporal lobes"}, {"letter": "C", "text": "Atrophy of the caudate nuclei"}, {"letter": "D", "text": "Multiple lacunar infarcts with confluent white matter lesions"}, {"letter": "E", "text": "Cortical ribboning on diffusion-weighted imaging"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Aging and Neurodegenerative Disorders", "topic": "Aging and Neurodegenerative Disorders", "note": null, "blueprint_category": "Aging and Neurodegenerative Disorders", "learning_objective": "Aging & Neurodegenerative LO5", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Alzheimer disease causes cortical atrophy that begins most prominently in the hippocampi and medial temporal lobes and spreads with time.", "distractor_explanations": {"B": "This pattern fits frontotemporal dementia, which begins with behavior or language change.", "C": "Caudate atrophy is typical of Huntington disease.", "D": "This fits vascular cognitive impairment.", "E": "Restricted diffusion along the cortex suggests Creutzfeldt-Jakob disease."}, "source": "Wk3 packet p.104 ('cortical atrophy, often beginning most prominently in the hippocampi and medial temporal lobes') and p.114 (dementia comparison table)"}, {"id": "mk2-q04", "n": 4, "part": 1, "title": null, "stem": "Days after a small cortical infarct, resident CNS cells with small, elongated nuclei multiply around the dying neurons and engulf the debris. Unlike the other glial cells of the CNS, these cells:", "options": [{"letter": "A", "text": "Arise from neural crest, like Schwann cells"}, {"letter": "B", "text": "Line the ventricles and secrete CSF"}, {"letter": "C", "text": "Form end-feet around capillaries that support the blood-brain barrier"}, {"letter": "D", "text": "Wrap myelin around segments of several CNS axons"}, {"letter": "E", "text": "Arise from monocyte (mesodermal) precursors rather than neuroectoderm"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Histology of CNS 1: Neurons and Glia", "topic": "Histology of CNS 1: Neurons and Glia", "note": null, "blueprint_category": "Histology of CNS 1: Neurons and Glia", "learning_objective": "Histology CNS 1 LO5", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The cells are microglia, the CNS's resident phagocytes; the course describes them as macrophages from monocyte precursors, whereas astrocytes, oligodendrocytes and ependymal cells come from the neural tube.", "distractor_explanations": {"A": "Neural crest gives rise to Schwann and satellite cells in the PNS, not CNS phagocytes.", "B": "That describes ependymal cells and the choroid plexus epithelium.", "C": "That is an astrocyte function.", "D": "That is the oligodendrocyte's role."}, "source": "ILM Histology of the CNS 1 slide 50 ('Microglia: Phagocytic macrophages ... Monocyte precursors · Elongated nuclei'); Wk1 packet p.186 (Figure 14)"}, {"id": "mk2-q05", "n": 5, "part": 1, "title": null, "stem": "Over 2 days a 28-year-old woman develops weakness of both legs, a sensory level at T6 and urinary retention. MRI shows a T2-bright, enhancing lesion inside the thoracic cord spanning several segments, with no compression of the cord. What is the most appropriate acute treatment?", "options": [{"letter": "A", "text": "Urgent surgical decompression"}, {"letter": "B", "text": "IV antibiotics and surgical drainage"}, {"letter": "C", "text": "High-dose IV corticosteroids"}, {"letter": "D", "text": "Intramuscular vitamin B12"}, {"letter": "E", "text": "Observation, since it will resolve on its own"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Spinal Syndromes", "topic": "Spinal Syndromes", "note": null, "blueprint_category": "Spinal Syndromes", "learning_objective": "Spinal Syndromes LO2, LO6", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "This is acute (inflammatory) transverse myelitis. Autoimmune myelopathies such as MS or transverse myelitis are treated acutely with high-dose corticosteroids, then plasma exchange or IVIG if needed.", "distractor_explanations": {"A": "Decompression treats compressive myelopathies; MRI shows no compression.", "B": "These treat an epidural abscess or vertebral osteomyelitis, which would show a collection on MRI.", "D": "B12 replacement treats subacute combined degeneration, which develops slowly and targets the dorsal and lateral columns.", "E": "An acute inflammatory myelopathy needs immunotherapy to limit lasting deficits."}, "source": "Wk2 packet p.112 (LO-6: 'For compressive myelopathies, surgical decompression ... Autoimmune causes of myelopathies, such as MS or transverse myelitis, are treated acutely with ... high-dose corticosteroids, plasmapheresis ... or IVIG'); p.109 (MS can cause transverse myelitis); Spinal Syndromes slide 9 (sensory level)"}, {"id": "mk2-q06", "n": 6, "part": 1, "title": null, "stem": "The infrahyoid strap muscles (sternohyoid, sternothyroid, omohyoid) are innervated mainly by:", "options": [{"letter": "A", "text": "The hypoglossal nerve's own fibers"}, {"letter": "B", "text": "The vagus nerve"}, {"letter": "C", "text": "The ansa cervicalis (C1-C3)"}, {"letter": "D", "text": "The facial nerve"}, {"letter": "E", "text": "The nerve to mylohyoid (V3)"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Neck Anatomy", "topic": "Neck Anatomy", "note": null, "blueprint_category": "Neck Anatomy", "learning_objective": "Neck ILM LO3", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The strap muscles are supplied by cervical spinal levels C1-C3 through the ansa cervicalis loop; the thyrohyoid is the odd one out, supplied by C1 fibers traveling with CN XII.", "distractor_explanations": {"A": "CN XII supplies tongue muscles; the C1 fibers that hitch a ride on it (e.g., to thyrohyoid) are cervical, not hypoglossal, fibers.", "B": "CN X supplies the pharynx and larynx, not the strap muscles.", "D": "CN VII supplies the posterior digastric and stylohyoid among neck muscles, not the infrahyoids.", "E": "It supplies the mylohyoid and anterior digastric, which are suprahyoid muscles."}, "source": "Wk1 packet p.60 ('spinal cord levels C1-C3, facilitated by the loop of the ansa cervicalis ... thyrohyoid'); Neck ILM LO3"}, {"id": "mk2-q07", "n": 7, "part": 1, "title": null, "stem": "Which patient meets the definition of epilepsy?", "options": [{"letter": "A", "text": "A 30-year-old with two unprovoked seizures 3 months apart"}, {"letter": "B", "text": "A 45-year-old with one seizure during alcohol withdrawal"}, {"letter": "C", "text": "A 2-year-old with one seizure during a high fever"}, {"letter": "D", "text": "A 60-year-old with one seizure when his blood glucose was 30 mg/dL"}, {"letter": "E", "text": "A 25-year-old with two seizures within the same hour after a head injury"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Seizures & Epilepsy", "topic": "Seizures & Epilepsy", "note": null, "blueprint_category": "Seizures & Epilepsy", "learning_objective": "Seizures LO3", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": true, "explanation": "Epilepsy is an enduring predisposition to recurrent, unprovoked seizures; the usual practical threshold is at least two unprovoked seizures more than 24 hours apart.", "distractor_explanations": {"B": "A seizure with an acute trigger is a provoked seizure and does not by itself establish epilepsy.", "C": "A febrile seizure is provoked by fever.", "D": "Hypoglycemia is an acute provoking cause.", "E": "Seizures in the immediate aftermath of an injury are acute symptomatic (provoked) seizures."}, "source": "Seizures LO3 (Wk3 packet p.133); Seizures and Epilepsy slide 53 ('Epilepsy - disorder of propensity to manifest recurrent, unprovoked seizures'); the two-seizures-24-hours rule is the standard ILAE definition, beyond the slides"}, {"id": "mk2-q08", "n": 8, "part": 1, "title": null, "stem": "A 79-year-old woman with advanced Alzheimer disease has a head CT. The lateral and third ventricles are enlarged, and the cortical sulci are widened. She has no gait change or urinary incontinence, and opening pressure on lumbar puncture is normal. What best explains the large ventricles?", "options": [{"letter": "A", "text": "Obstruction of CSF outflow from the fourth ventricle"}, {"letter": "B", "text": "Loss of brain tissue, with the ventricles enlarging to fill the space"}, {"letter": "C", "text": "Impaired CSF absorption at the arachnoid granulations"}, {"letter": "D", "text": "Normal pressure hydrocephalus"}, {"letter": "E", "text": "Idiopathic intracranial hypertension"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Increased Cranial Pressure", "topic": "Increased Cranial Pressure", "note": null, "blueprint_category": "Increased Cranial Pressure", "learning_objective": "Elevated ICP LO2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Hydrocephalus ex vacuo is ventricular enlargement from tissue loss (atrophy); the sulci are enlarged too and the pressure is normal, so it is not true hydrocephalus.", "distractor_explanations": {"A": "Obstruction raises CSF pressure and enlarges the ventricles upstream while the sulci are effaced, not widened.", "C": "Communicating hydrocephalus raises CSF pressure and compresses the sulci rather than widening them.", "D": "NPH gives gait disturbance, incontinence and cognitive decline, with ventricles out of proportion to the sulci.", "E": "IIH raises opening pressure and usually shows normal or small ventricles."}, "source": "Wk1 packet p.118 ('In ex vacuo ventriculomegaly, brain tissue has been lost ... the cortical sulci are usually enlarged as well') and p.136 (NPH vs ex vacuo)"}, {"id": "mk2-q09", "n": 9, "part": 1, "title": null, "stem": "A 29-year-old woman has had two episodes of neurologic symptoms a year apart. MRI shows several periventricular and juxtacortical white matter lesions of different ages. Which CSF finding would best support the diagnosis?", "options": [{"letter": "A", "text": "Raised protein with a normal white cell count"}, {"letter": "B", "text": "Many neutrophils with a low glucose"}, {"letter": "C", "text": "Xanthochromia"}, {"letter": "D", "text": "Oligoclonal IgG bands present in CSF but not in serum"}, {"letter": "E", "text": "Elevated 14-3-3 protein"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Multiple Sclerosis", "topic": "Multiple Sclerosis", "note": null, "blueprint_category": "Multiple Sclerosis", "learning_objective": "MS LO4", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "CSF-specific oligoclonal bands show intrathecal immunoglobulin production and support MS (McDonald criteria) alongside lesions disseminated in space and time.", "distractor_explanations": {"A": "Albuminocytologic dissociation is the classic CSF finding in Guillain-Barré syndrome.", "B": "This pattern points to bacterial meningitis.", "C": "Yellow CSF from broken-down red cells suggests subarachnoid hemorrhage.", "E": "14-3-3 is a nonspecific marker of rapid neuronal injury used in suspected CJD."}, "source": "Wk2 packet p.75 and p.78 ('CSF-specific oligoclonal bands ... supports intrathecal immunoglobulin production'); MS LO4 (p.74)"}, {"id": "mk2-q10", "n": 10, "part": 1, "title": null, "stem": "This H&E section is from the pons of a patient with Parkinson disease. The small circle on the dorsal pons is enlarged above it, and the boxed area is magnified at right, where the arrow marks a neuron. The pigmented neurons of this nucleus normally release which neurotransmitter?", "options": [{"letter": "A", "text": "Dopamine"}, {"letter": "B", "text": "Serotonin"}, {"letter": "C", "text": "Acetylcholine"}, {"letter": "D", "text": "Glycine"}, {"letter": "E", "text": "Norepinephrine"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock2-images/s-path-pd-locus.png", "image_needed": true, "week": 3, "session_guess": "Neuropathology of Neurodegenerative Diseases Lab", "topic": "Neuropathology of Neurodegenerative Diseases Lab", "note": null, "blueprint_category": "Neuropathology of Neurodegenerative Diseases Lab", "learning_objective": "Neuropath Lab LO1, LO4; Synaptic Transmission LO11", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": true, "explanation": "The circle marks the locus coeruleus, a noradrenergic nucleus near the aqueduct in the dorsal pons whose neurons contain neuromelanin; in Parkinson disease it loses neurons and shows Lewy bodies, adding to depression and autonomic features.", "distractor_explanations": {"A": "Dopaminergic pigmented neurons are in the substantia nigra of the midbrain, not the dorsal pons.", "B": "Serotonergic neurons are not pigmented and do not form this dorsal pontine nucleus.", "C": "Cholinergic modulatory neurons are mainly in the basal nucleus of Meynert, not this pontine nucleus.", "D": "Glycine is an inhibitory transmitter of spinal and brainstem interneurons, not a pigmented nucleus."}, "source": "Wk3 packet p.155 path-lab figure (Parkinson's Disease: Pons; 'Locus Coeruleus' and 'Neuron with Lewy Bodies' labels covered; image used) and text ('the locus coeruleus, a noradrenergic nucleus located near the aqueduct in the dorsal pons'); Wk3 packet p.37 (NE neurons in the locus coeruleus)"}, {"id": "mk2-q11", "n": 11, "part": 1, "title": null, "stem": "This axial T1-weighted MRI passes through the midbrain. Identify the CSF space indicated by the arrow.", "options": [{"letter": "A", "text": "Fourth ventricle"}, {"letter": "B", "text": "Cerebral aqueduct"}, {"letter": "C", "text": "Third ventricle"}, {"letter": "D", "text": "Interpeduncular cistern"}, {"letter": "E", "text": "Central canal"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock2-images/s-imaging-aqueduct.png", "image_needed": true, "week": 1, "session_guess": "Imaging Techniques for the Head and Brain", "topic": "Imaging Techniques for the Head and Brain", "note": null, "blueprint_category": "Imaging Techniques for the Head and Brain", "learning_objective": "Imaging Techniques LO3", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "At the level of the midbrain, the small dark CSF dot in the dorsal midbrain is the cerebral aqueduct (labeled 'Cerebral Aqueduct' on the same slice in the deck).", "distractor_explanations": {"A": "The fourth ventricle sits lower, between the pons/medulla and the cerebellum, not within the midbrain.", "C": "The third ventricle is a midline slit between the thalami, above the midbrain.", "D": "This CSF space lies on the ventral surface of the midbrain between the cerebral peduncles, not in its dorsal core.", "E": "The central canal runs in the spinal cord and caudal medulla."}, "source": "Imaging Techniques deck, labeled slide 134 ('Cerebral Aqueduct' pin; image used without labels); Wk1 packet p.108 (LO3)"}, {"id": "mk2-q12", "n": 12, "part": 1, "title": null, "stem": "At the end of surgery, a 52-year-old woman who received rocuronium for intubation is given neostigmine, and her muscle strength returns. Why does neostigmine reverse this block?", "options": [{"letter": "A", "text": "Rocuronium is a depolarizing agonist, and neostigmine stops the depolarization"}, {"letter": "B", "text": "Neostigmine directly activates the nicotinic receptors on the muscle"}, {"letter": "C", "text": "Neostigmine increases calcium release from the sarcoplasmic reticulum"}, {"letter": "D", "text": "Rocuronium competes with ACh at nicotinic receptors, so raising ACh in the cleft overcomes the block"}, {"letter": "E", "text": "Rocuronium blocks ACh release from the nerve terminal, and neostigmine restores release"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Synaptic transmission and neurotransmitters", "topic": "Synaptic transmission and neurotransmitters", "note": null, "blueprint_category": "Synaptic transmission and neurotransmitters", "learning_objective": "Synaptic Transmission LO10", "difficulty": 3, "format": "vignette", "drug_item": "mechanism", "laterality": false, "thursday_11_5": false, "explanation": "Nondepolarizing blockers (rocuronium, vecuronium, pancuronium) are competitive nicotinic antagonists. An AChE inhibitor lets ACh build up and outcompete the antagonist at the end plate.", "distractor_explanations": {"A": "Rocuronium is a nondepolarizing antagonist; succinylcholine is the depolarizing agent, and neostigmine would deepen its phase I block.", "B": "Neostigmine works by inhibiting acetylcholinesterase, not by binding nicotinic receptors as an agonist.", "C": "That is not its action; dantrolene acts on SR calcium release, in the opposite direction.", "E": "Rocuronium acts postsynaptically at the receptor; presynaptic release blockade is botulinum toxin's action."}, "source": "Wk3 packet p.34 (neuromuscular blockers: 'Nicotinic antagonists (Non-depolarizing block) ... Rocuronium; Succinylcholine (Depolarizing Block)'); drug list, Exam 1 Neuromuscular Blockers: Rocuronium (bold). Neostigmine is a green (Exam 2) drug"}, {"id": "mk2-q13", "n": 13, "part": 1, "title": null, "stem": "A 55-year-old man with cirrhosis from long-term heavy drinking needs a regular pain reliever for knee osteoarthritis. Which drug's main toxicity makes it the most dangerous choice for him?", "options": [{"letter": "A", "text": "Ibuprofen"}, {"letter": "B", "text": "Morphine"}, {"letter": "C", "text": "Acetaminophen"}, {"letter": "D", "text": "Capsaicin cream"}, {"letter": "E", "text": "Gabapentin"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Pain Medications", "topic": "Pain Medications", "note": null, "blueprint_category": "Pain Medications", "learning_objective": "Pain Medications LO1-2", "difficulty": 2, "format": "vignette", "drug_item": "side effect", "laterality": false, "thursday_11_5": false, "explanation": "Acetaminophen is not an NSAID; its mechanism is uncertain, and it can be hepatotoxic. The drug list states it is contraindicated in alcoholism.", "distractor_explanations": {"A": "Its main risks are GI irritation and ulcers (and kidney injury), not liver failure.", "B": "Its main risks are respiratory depression, constipation, sedation and abuse.", "D": "It is a topical irritant that desensitizes TRPV1 nociceptors.", "E": "Its main effects are sedation, dizziness, ataxia and edema."}, "source": "Drug list, Exam 1 Pain: Acetaminophen (bold) 'Can be hepatotoxic, skin rash, Contraindicated in alcoholism'; Pain Medication slide 6 (acetaminophen 'can be hepatotoxic')"}, {"id": "mk2-q14", "n": 14, "part": 1, "title": null, "stem": "After a blow to the top of the head, a 24-year-old man has a soft, boggy swelling that spreads over much of the skull and later bruises both upper eyelids. The blood has collected in which scalp layer, just superficial to the pericranium?", "options": [{"letter": "A", "text": "Loose connective tissue"}, {"letter": "B", "text": "Dense connective tissue"}, {"letter": "C", "text": "Aponeurosis (galea)"}, {"letter": "D", "text": "Skin"}, {"letter": "E", "text": "Subarachnoid space"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Protecting the Brain", "topic": "Protecting the Brain", "note": null, "blueprint_category": "Protecting the Brain", "learning_objective": "Protecting the Brain LO3", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "SCALP: skin, dense connective tissue, aponeurosis, loose connective tissue, pericranium. The loose layer lets the scalp move, so blood or infection can spread widely in it; spread into the eyelids follows the attachments of the frontalis (standard anatomy beyond the packet).", "distractor_explanations": {"B": "This layer holds the scalp vessels and is tightly bound to the skin, so bleeding there stays localized.", "C": "It is a tough tendinous sheet, not a space where blood spreads.", "D": "Bleeding in the skin is a local bruise.", "E": "This space is inside the skull, so bleeding there cannot produce swelling of the scalp or eyelids."}, "source": "Wk1 packet p.6 and p.97 (SCALP layers, superficial to deep); Protecting the Brain LO3 (p.90)"}, {"id": "mk2-q15", "n": 15, "part": 1, "title": null, "stem": "A researcher records from a neuron's soma while a single excitatory synapse on a distant dendrite is activated. The response is a 3-mV depolarization that is smaller than the same event recorded right at the synapse, and two such events arriving close together produce a larger response. Which property explains these findings?", "options": [{"letter": "A", "text": "Action potentials are all-or-none and propagate without decrement"}, {"letter": "B", "text": "The dendrite has passed its absolute refractory period"}, {"letter": "C", "text": "Voltage-gated Na+ channels in the dendrite are fully inactivated"}, {"letter": "D", "text": "The synapse is electrical, so the signal is bidirectional"}, {"letter": "E", "text": "Graded potentials vary in size, decay with distance, and can summate"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Action Potentials", "topic": "Action Potentials", "note": null, "blueprint_category": "Action Potentials", "learning_objective": "AP LO9; Synaptic Transmission LO7", "difficulty": 2, "format": "research scenario", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Synaptic potentials are graded: their size depends on input strength, they spread passively and shrink with distance, and they summate in time and space at the axon hillock; one input seldom reaches threshold.", "distractor_explanations": {"A": "That describes action potentials, which neither shrink with distance nor sum like this.", "B": "Refractory periods follow an action potential; a 3-mV response is not an action potential.", "C": "Inactivation would block regenerative spikes; it does not explain small responses that sum.", "D": "Electrical coupling concerns how current crosses between cells, not why a graded response decays and sums."}, "source": "Wk3 packet p.28 ('Graded potentials produce only small perturbations ... one graded potential seldom results in sufficient postsynaptic cell depolarization ... requiring many graded potential inputs'); AP LO9, Synaptic Transmission LO7 (p.20)"}, {"id": "mk2-q16", "n": 16, "part": 1, "title": null, "stem": "The neurons in the gray-matter region indicated by the arrow on this thoracic spinal cord section are:", "options": [{"letter": "A", "text": "Lower motor neurons to skeletal muscle"}, {"letter": "B", "text": "Second-order pain neurons"}, {"letter": "C", "text": "Neurons of the dorsal nucleus (of Clarke)"}, {"letter": "D", "text": "Preganglionic sympathetic neurons"}, {"letter": "E", "text": "Preganglionic parasympathetic neurons"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock2-images/s-sc-iml.png", "image_needed": true, "week": 2, "session_guess": "Spinal Cord Cross-Sectional Anatomy", "topic": "Spinal Cord Cross-Sectional Anatomy", "note": null, "blueprint_category": "Spinal Cord Cross-Sectional Anatomy", "learning_objective": "SC Cross-Sectional LO2-3", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrow marks the intermediolateral nucleus (lateral horn, T1-L2), which holds preganglionic sympathetic cell bodies whose axons leave in the ventral root and white ramus.", "distractor_explanations": {"A": "Alpha motor neurons sit in the ventral horn, not in this lateral horn.", "B": "These lie in the dorsal horn, including the substantia gelatinosa.", "C": "Clarke's nucleus lies at the medial base of the dorsal horn and gives rise to the posterior spinocerebellar tract.", "E": "Spinal parasympathetic preganglionic neurons are found only at S2-S4, not in the thoracic cord."}, "source": "SC Cross-Sectional worksheet p.10, Fig. 2 ('Intermediolateral nucleus' labeled; image used); Wk2 packet p.96 ('intermediolateral gray column, which houses presynaptic sympathetic nerve cell bodies'); Spinal Cord slide 46 (T1 to L2)"}, {"id": "mk2-q17", "n": 17, "part": 1, "title": null, "stem": "After a small stroke, a 60-year-old woman can still say exactly where a pinprick on her hand is and that it feels sharp, but she says it no longer bothers her at all. Damage to which region best explains this?", "options": [{"letter": "A", "text": "Primary somatosensory cortex"}, {"letter": "B", "text": "Ventral posterolateral nucleus of the thalamus"}, {"letter": "C", "text": "Anterior cingulate cortex"}, {"letter": "D", "text": "Substantia gelatinosa of the dorsal horn"}, {"letter": "E", "text": "Periaqueductal gray"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Pain & Pain pathways", "topic": "Pain & Pain pathways", "note": null, "blueprint_category": "Pain & Pain pathways", "learning_objective": "Pain & Pain Pathways LO4-5", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The affective-motivational (suffering) component of pain depends on limbic and frontal regions such as the anterior cingulate cortex and insula, separate from the S1-based discriminative component.", "distractor_explanations": {"A": "S1 handles the sensory-discriminative side (where, how sharp), which she still has.", "B": "VPL relays the discriminative pathway to S1; damage would impair localization.", "D": "Damage here would disrupt pain input itself at the spinal level.", "E": "The PAG drives descending inhibition; its loss would not remove the unpleasantness of a correctly perceived stimulus."}, "source": "Wk2 packet p.13 (LO4-5) and p.18 ('limbic system, prefrontal cortex, and anterior cingulate cortex, which are involved in emotion and motivation')"}, {"id": "mk2-q18", "n": 18, "part": 1, "title": null, "stem": "Which cranial nerve emerges from the dorsal (posterior) surface of the brainstem?", "options": [{"letter": "A", "text": "Oculomotor nerve (CN III)"}, {"letter": "B", "text": "Trochlear nerve (CN IV)"}, {"letter": "C", "text": "Abducens nerve (CN VI)"}, {"letter": "D", "text": "Trigeminal nerve (CN V)"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Cranial Nerves Module", "topic": "Cranial Nerves Module", "note": null, "blueprint_category": "Cranial Nerves Module", "learning_objective": "CN Modules LO2", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "CN IV is the only cranial nerve to exit the dorsal brainstem, just below the inferior colliculi, before wrapping around the midbrain.", "distractor_explanations": {"A": "CN III leaves the ventral midbrain in the interpeduncular fossa.", "C": "CN VI leaves ventrally at the pontomedullary junction.", "D": "CN V leaves the lateral (ventrolateral) pons."}, "source": "CN Modules LO2 (Wk1 packet p.152); Lab 3 notes Fig. 7 (Haines dorsal view: 'Trochlear nerve (cranial nerve IV)' beside the inferior colliculus); Wk1 packet p.77 table"}, {"id": "mk2-q19", "n": 19, "part": 1, "title": null, "stem": "Twenty minutes after taking a drug at the start of a migraine attack, a 31-year-old woman feels brief tightness in her chest and throat, and her headache then eases. The drug most likely relieved her migraine by acting as:", "options": [{"letter": "A", "text": "An agonist at 5-HT1B and 5-HT1D receptors"}, {"letter": "B", "text": "An antagonist at CGRP receptors"}, {"letter": "C", "text": "An agonist at mu opioid receptors"}, {"letter": "D", "text": "A nonselective beta-adrenergic antagonist"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Headaches", "topic": "Headaches", "note": null, "blueprint_category": "Headaches", "learning_objective": "Headache LO6", "difficulty": 2, "format": "vignette", "drug_item": "mechanism", "laterality": false, "thursday_11_5": false, "explanation": "The drug is a triptan (e.g., sumatriptan), a 5-HT1B/1D agonist; 5-HT1B-mediated vasoconstriction can cause chest or throat tightness and coronary vasospasm.", "distractor_explanations": {"B": "That is the gepants (e.g., rimegepant), which do not cause vasoconstriction-related chest tightness.", "C": "Opioids are not migraine-specific abortive drugs and act through mu receptors.", "D": "Propranolol is used for prevention, not to abort an attack."}, "source": "Drug list, Exam 1 'Migraine Medications': Sumatriptan (bold) '5HT1B and 5HT1D agonists ... coronary artery vasospasm'; Wk2 packet p.91 (triptans act as agonists at serotonin receptors)"}, {"id": "mk2-q20", "n": 20, "part": 1, "title": null, "stem": "After a brainstem stroke, a 70-year-old man aspirates liquids. Touching the mucosa of his larynx no longer makes him cough. Which nerve carries the afferent limb of the cough reflex from the larynx?", "options": [{"letter": "A", "text": "Glossopharyngeal nerve (CN IX)"}, {"letter": "B", "text": "Trigeminal nerve (CN V)"}, {"letter": "C", "text": "Facial nerve (CN VII)"}, {"letter": "D", "text": "Phrenic nerve (C3-C5)"}, {"letter": "E", "text": "Vagus nerve (CN X)"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Cranial Nerve Reflexes", "topic": "Cranial Nerve Reflexes", "note": null, "blueprint_category": "Cranial Nerve Reflexes", "learning_objective": "CN Reflexes LO1-2", "difficulty": 1, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Cough receptors in the larynx and airways send signals through vagal fibers (nodose and jugular ganglia) to the medulla; the motor output then recruits brainstem and spinal respiratory motor neurons.", "distractor_explanations": {"A": "CN IX does not carry sensation from the larynx.", "B": "CN V is the afferent limb of the corneal and jaw jerk reflexes.", "C": "CN VII carries the efferent limb of the corneal (blink) and lacrimal reflexes.", "D": "The phrenic nerve is a spinal motor nerve used in the breathing phase of a cough, not its sensory limb."}, "source": "Wk2 packet p.57-58 ('afferent signals from the cough receptors travel through vagal fibers to the nodose and jugular ganglia'); CN Reflexes slide 36"}, {"id": "mk2-q21", "n": 21, "part": 1, "title": null, "stem": "Which statement best describes the temporomandibular joint during wide opening of the mouth?", "options": [{"letter": "A", "text": "The condyle only rotates and stays within the mandibular fossa throughout opening"}, {"letter": "B", "text": "The disc stays fixed in the fossa while the condyle slides forward beneath it"}, {"letter": "C", "text": "It is a cartilaginous joint with no synovial cavity"}, {"letter": "D", "text": "The condyle moves backward behind the mandibular fossa"}, {"letter": "E", "text": "The condyle first rotates on the articular disc, then the condyle and disc glide forward toward the articular tubercle"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Face Anatomy", "topic": "Face Anatomy", "note": null, "blueprint_category": "Face Anatomy", "learning_objective": "Face ILM LO3", "difficulty": 2, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Course framing: in partial opening the condyle rotates on the disc; in full opening there is also a forward glide of the disc and condyle. Excess glide past the tubercle is how the jaw dislocates.", "distractor_explanations": {"A": "Rotation alone happens in partial opening; wide opening adds a forward glide out of the fossa.", "B": "The disc moves forward with the condyle during the glide.", "C": "The TMJ is a synovial joint whose disc completely separates the condyle from the fossa.", "D": "Backward movement (retraction) does not open the mouth; opening carries the condyle forward."}, "source": "Wk1 packet p.42 ('In partial opening ... rotation of the condylar process on the articular disc. In full opening ... considerable gliding forward of the disc'); Face ILM LO3"}, {"id": "mk2-q22", "n": 22, "part": 1, "title": null, "stem": "Neurofibrillary tangles appear early in the entorhinal cortex in Alzheimer disease, and patients lose the ability to form new memories early. Why does entorhinal damage impair new memory formation so early?", "options": [{"letter": "A", "text": "It destroys the fornix, the main output of the hippocampus"}, {"letter": "B", "text": "It cuts the mammillothalamic tract"}, {"letter": "C", "text": "It cuts the perforant pathway, the hippocampus's main input from the cortex"}, {"letter": "D", "text": "It is the main storage site for remote memories"}, {"letter": "E", "text": "It is the main source of acetylcholine for the cortex"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Memory Formation", "topic": "Memory Formation", "note": null, "blueprint_category": "Memory Formation", "learning_objective": "Learning & Memory LO3", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The entorhinal cortex funnels cortical input into the hippocampus through the perforant pathway, so early entorhinal damage disconnects the hippocampus and blocks new learning.", "distractor_explanations": {"A": "The fornix is a white-matter output bundle from the hippocampus; it is not the entorhinal cortex.", "B": "That tract connects the mammillary body to the anterior thalamic nucleus, away from the temporal lobe.", "D": "Remote memories are stored widely in neocortex; early AD typically spares them.", "E": "Cortical acetylcholine comes from the basal forebrain, not the entorhinal cortex."}, "source": "Learning & Memory slide 18 ('Input to the Hippocampus ... Perforant Pathway via the Entorhinal cortex'); Wk3 packet p.166 (AD 'primarily affects the hippocampus and entorhinal cortex'). That tangles begin in the entorhinal cortex is standard neuropathology (Braak staging), beyond the packet"}, {"id": "mk2-q23", "n": 23, "part": 1, "title": null, "stem": "In a neuron with a resting potential of -70 mV, the Cl- equilibrium potential is also -70 mV. A drug opens GABA-A chloride channels. What is the main effect?", "options": [{"letter": "A", "text": "The membrane hyperpolarizes to about -90 mV"}, {"letter": "B", "text": "Little change in membrane potential, but excitatory inputs now depolarize the cell less, so it fires less"}, {"letter": "C", "text": "The membrane depolarizes to threshold and fires"}, {"letter": "D", "text": "No change in membrane potential and no change in excitability"}, {"letter": "E", "text": "Voltage-gated Na+ channels become inactivated"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Action Potentials", "topic": "Action Potentials", "note": null, "blueprint_category": "Action Potentials", "learning_objective": "AP LO10", "difficulty": 3, "format": "research scenario", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "When E(Cl) equals the resting potential, opening Cl- channels causes no visible IPSP but holds the membrane near -70 mV (shunting inhibition), so EPSPs become smaller and less likely to reach threshold.", "distractor_explanations": {"A": "Opening Cl- channels drives the membrane toward E(Cl), which here equals the resting potential, not -90 mV.", "C": "With E(Cl) at -70 mV, Cl- current cannot depolarize the cell from -70 mV.", "D": "The added conductance clamps the membrane near -70 mV and shunts excitatory current, so excitability does fall.", "E": "Inactivation requires sustained depolarization, which does not occur here."}, "source": "AP LO1, LO10 (Wk3 packet p.44: equilibrium potentials for Na+, K+ and Cl-; predict effects of permeability changes); Synaptic Transmission LO7 (summation at the axon hillock)"}, {"id": "mk2-q24", "n": 24, "part": 1, "title": null, "stem": "The pons and cerebellum develop from which secondary brain vesicle?", "options": [{"letter": "A", "text": "Metencephalon"}, {"letter": "B", "text": "Myelencephalon"}, {"letter": "C", "text": "Mesencephalon"}, {"letter": "D", "text": "Diencephalon"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Embryology of CNS PNS", "topic": "Embryology of CNS PNS", "note": null, "blueprint_category": "Embryology of CNS PNS", "learning_objective": "Embryology CNS/PNS LO5", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The rhombencephalon divides into the metencephalon (pons, cerebellum) and myelencephalon (medulla).", "distractor_explanations": {"B": "It forms the medulla.", "C": "It forms the midbrain.", "D": "It forms the thalamus, hypothalamus and related structures."}, "source": "Wk1 packet p.146 and p.148 ('The metencephalon forms the future pons and cerebellum')"}, {"id": "mk2-q25", "n": 25, "part": 1, "title": null, "stem": "This is a longitudinal section of a peripheral nerve. At the gap indicated by the arrowhead, which feature lets the action potential jump from one gap to the next?", "options": [{"letter": "A", "text": "A gap junction between neighboring Schwann cells that passes the current directly"}, {"letter": "B", "text": "A break in the axon where the impulse crosses a chemical synapse"}, {"letter": "C", "text": "A cluster of voltage-gated K+ channels that depolarizes the membrane"}, {"letter": "D", "text": "A high density of voltage-gated Na+ channels in the exposed axon membrane"}, {"letter": "E", "text": "The thickest part of the myelin sheath, which boosts the signal"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock2-images/s-histo-node-ranvier.png", "image_needed": true, "week": 1, "session_guess": "Histology Lab", "topic": "Histology Lab", "note": null, "blueprint_category": "Histology Lab", "learning_objective": "Histology Lab LO3; Histology CNS 1 LO4", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrowhead marks a node of Ranvier, the gap between two Schwann cells' myelin segments. Na+ channels are concentrated there, so depolarization regenerates only at nodes (saltatory conduction).", "distractor_explanations": {"A": "Neighboring Schwann cells do not relay the impulse; the current flows inside the axon.", "B": "The axon is continuous through the node; there is no synapse there.", "C": "K+ channels repolarize the membrane, and in myelinated fibers they sit mostly beside the node, not in it.", "E": "The arrowhead marks the node, where myelin is absent; myelin insulates the internodes."}, "source": "Wk1 packet p.184, Fig. 11 ('Arrow indicates a Node of Ranvier'; image used) and Fig. 10; Histology Lab packet p.214 (Peripheral Nerve: identify Node of Ranvier)"}, {"id": "mk2-q26", "n": 26, "part": 1, "title": null, "stem": "A 34-year-old woman with relapsing-remitting multiple sclerosis develops new weakness and numbness of her left leg over 3 days. Which is the standard first treatment for this relapse?", "options": [{"letter": "A", "text": "High-dose IV methylprednisolone"}, {"letter": "B", "text": "Natalizumab"}, {"letter": "C", "text": "Dimethyl fumarate"}, {"letter": "D", "text": "Baclofen"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Multiple Sclerosis", "topic": "Multiple Sclerosis", "note": null, "blueprint_category": "Multiple Sclerosis", "learning_objective": "MS LO6", "difficulty": 1, "format": "vignette", "drug_item": "indication", "laterality": false, "thursday_11_5": false, "explanation": "Acute MS flares are treated with high-dose IV corticosteroids such as methylprednisolone to reduce inflammation and speed recovery; plasma exchange is reserved for steroid-unresponsive attacks.", "distractor_explanations": {"B": "A disease-modifying therapy that prevents future relapses; it is not used to treat an acute flare.", "C": "An oral disease-modifying therapy for long-term relapse prevention, not acute treatment.", "D": "A GABA-B agonist used for MS spasticity, not to shorten a relapse."}, "source": "Wk2 packet p.79 ('high-dose intravenous (IV) corticosteroids, such as methylprednisolone'); MS LO6 (p.74); drug list, Exam 1 'Multiple Sclerosis': Methylprednisolone (bold)"}, {"id": "mk2-q27", "n": 27, "part": 1, "title": null, "stem": "The great cerebral vein (of Galen), which drains deep brain structures, empties directly into which dural sinus?", "options": [{"letter": "A", "text": "Superior sagittal sinus"}, {"letter": "B", "text": "Straight sinus"}, {"letter": "C", "text": "Cavernous sinus"}, {"letter": "D", "text": "Sigmoid sinus"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Protecting the Brain", "topic": "Protecting the Brain", "note": null, "blueprint_category": "Protecting the Brain", "learning_objective": "Protecting the Brain LO1", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The inferior sagittal sinus and the great cerebral vein join to form the straight sinus, which runs along the falx-tentorium junction to the confluence of sinuses.", "distractor_explanations": {"A": "It runs along the attached upper edge of the falx and drains the cortical surface veins.", "C": "It lies beside the sella and receives the ophthalmic veins.", "D": "It is further downstream, near the jugular foramen, and does not receive the great cerebral vein."}, "source": "Wk1 packet p.94 ('...feed into the straight sinus, the other being the great cerebral vein') and p.124 table; Imaging Techniques slide 33"}, {"id": "mk2-q28", "n": 28, "part": 1, "title": null, "stem": "MRI confirms that a 41-year-old man's new saddle numbness, weak plantarflexion and urinary retention are caused by a large central L4-L5 disc herniation compressing the cauda equina. Symptoms began 10 hours ago. What is the most appropriate management?", "options": [{"letter": "A", "text": "Six weeks of NSAIDs and physical therapy"}, {"letter": "B", "text": "An epidural steroid injection"}, {"letter": "C", "text": "Urgent surgical decompression"}, {"letter": "D", "text": "Gabapentin and outpatient follow-up"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Cauda Equina and Conus Medullaris", "topic": "Cauda Equina and Conus Medullaris", "note": null, "blueprint_category": "Cauda Equina and Conus Medullaris", "learning_objective": "Cauda Equina & Conus LO4", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Cauda equina syndrome can be considered a surgical emergency: untreated compression risks permanent sensory loss, paralysis and bowel or bladder dysfunction, so decompression follows urgently once imaging finds the cause.", "distractor_explanations": {"A": "Conservative care suits uncomplicated radiculopathy, not cauda equina compression with sphincter involvement.", "B": "Injections treat radicular pain but do not relieve a compressive emergency.", "D": "Treating the pain alone risks permanent weakness and bowel or bladder dysfunction."}, "source": "Wk2 packet p.129 TREATMENT ('It can be considered a surgical emergency ... Urgent surgical decompression is done after computed tomography (CT) or magnetic resonance imaging (MRI)'); Cauda Equina & Conus LO4"}, {"id": "mk2-q29", "n": 29, "part": 1, "title": null, "stem": "After falling and striking his forehead, a 45-year-old man loses his sense of smell and has clear fluid dripping from his nose. Which structure was most likely fractured?", "options": [{"letter": "A", "text": "Optic canal"}, {"letter": "B", "text": "Superior orbital fissure"}, {"letter": "C", "text": "Foramen rotundum"}, {"letter": "D", "text": "Cribriform plate of the ethmoid bone"}, {"letter": "E", "text": "Internal acoustic meatus"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Cranial Nerves Module", "topic": "Cranial Nerves Module", "note": null, "blueprint_category": "Cranial Nerves Module", "learning_objective": "CN Modules LO5", "difficulty": 1, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Olfactory filaments pass through the cribriform plate; fractures shear them (anosmia) and tear the dura, causing CSF rhinorrhea.", "distractor_explanations": {"A": "A fracture here threatens CN II and vision, not smell.", "B": "It carries the nerves to the extraocular muscles and V1; injury gives ophthalmoplegia and forehead numbness.", "C": "It carries V2; injury numbs the cheek and upper lip.", "E": "It carries VII and VIII; injury affects hearing, balance and facial movement."}, "source": "Wk1 packet p.172 table ('CN I: Fracture of cribriform plate: Anosmia (loss of smell); cerebrospinal fluid rhinorrhea'); p.158"}, {"id": "mk2-q30", "n": 30, "part": 1, "title": null, "stem": "MRI of a 66-year-old woman with sudden weakness shows a tiny infarct in the left medullary pyramid, rostral to the pyramidal decussation, with nothing else involved. Which deficit does she most likely have?", "options": [{"letter": "A", "text": "Weakness of the left arm and leg"}, {"letter": "B", "text": "Weakness of the right face, arm and leg"}, {"letter": "C", "text": "Weakness of the left side of the tongue"}, {"letter": "D", "text": "Weakness of both legs only"}, {"letter": "E", "text": "Weakness of the right arm and leg"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Corticospinal and UMN/LMN", "topic": "Corticospinal and UMN/LMN", "note": null, "blueprint_category": "Corticospinal and UMN/LMN", "learning_objective": "Descending Motor Pathways LO2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": true, "thursday_11_5": false, "explanation": "Lateral corticospinal axons run in the ipsilateral pyramid and cross at the pyramidal decussation in the caudal medulla, so a lesion above the crossing causes contralateral limb weakness.", "distractor_explanations": {"A": "The fibers in the left pyramid have not crossed yet; they will serve the right side below the decussation.", "B": "Corticobulbar fibers for the face have already left the tract above the medulla.", "C": "That would need a hypoglossal nerve or nucleus lesion, not a lesion confined to the pyramid.", "D": "A one-sided pyramid lesion affects the opposite arm and leg, not both legs."}, "source": "Wk2 packet p.27 (lateral CST crosses at the caudal-most medulla); Motor slide 15 ('decussates at the decussation of the pyramids in the caudal-most medulla')"}, {"id": "mk2-q31", "n": 31, "part": 1, "title": null, "stem": "A day after eating home-canned vegetables, a 40-year-old man has double vision, drooping eyelids, dilated pupils and weakness that spreads downward from his face to his arms. The toxin responsible acts by:", "options": [{"letter": "A", "text": "Blocking nicotinic receptors on the muscle end plate"}, {"letter": "B", "text": "Inhibiting acetylcholinesterase in the synaptic cleft"}, {"letter": "C", "text": "Blocking voltage-gated Na+ channels in motor axons"}, {"letter": "D", "text": "Cleaving SNARE proteins so that vesicles cannot fuse and release acetylcholine"}, {"letter": "E", "text": "Preventing choline reuptake into the nerve terminal"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Synaptic transmission and neurotransmitters", "topic": "Synaptic transmission and neurotransmitters", "note": null, "blueprint_category": "Synaptic transmission and neurotransmitters", "learning_objective": "Synaptic Transmission LO2, LO4", "difficulty": 2, "format": "vignette", "drug_item": "mechanism", "laterality": false, "thursday_11_5": false, "explanation": "Botulinum toxin enters cholinergic terminals and cleaves SNARE proteins, preventing vesicle fusion and ACh release at the neuromuscular junction and autonomic synapses, causing descending flaccid paralysis with dilated pupils.", "distractor_explanations": {"A": "Competitive receptor blockade is how curare-like (nondepolarizing) drugs act; the release step is normal with them.", "B": "AChE inhibitors (e.g., organophosphates) cause excess cholinergic activity: small pupils, secretions and fasciculations.", "C": "That is how tetrodotoxin and local anesthetics block conduction.", "E": "Blocking choline uptake slowly reduces ACh synthesis; it is not botulinum toxin's action."}, "source": "Drug list, Exam 1 Spasmolytics: Botulinum Toxin (bold) 'preventing the SNARE proteins from fusing with the membrane and preventing release of Ach'; Wk3 packet p.25-26 (synaptic vesicle fusion steps) and spasmolytics text ('inhibiting the release of acetylcholine at the neuromuscular junction')"}, {"id": "mk2-q32", "n": 32, "part": 1, "title": null, "stem": "A 48-year-old woman has a small tumor in the back of the right orbit between the optic nerve and lateral rectus. Her right pupil is large and reacts poorly to light, and she cannot focus on near objects with that eye, but eye movements and eyelid position are normal. Damage to which structure best explains this?", "options": [{"letter": "A", "text": "Right ciliary ganglion"}, {"letter": "B", "text": "Right superior cervical ganglion"}, {"letter": "C", "text": "Right oculomotor nerve trunk"}, {"letter": "D", "text": "Right pterygopalatine ganglion"}, {"letter": "E", "text": "Right optic nerve"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Autonomics", "topic": "Autonomics", "note": null, "blueprint_category": "Autonomics", "learning_objective": "Autonomic LO5", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": true, "thursday_11_5": false, "explanation": "Parasympathetic fibers relay in the ciliary ganglion (in the back of the orbit) and go to the pupillary sphincter and ciliary muscle via M3 receptors. Loss gives a dilated pupil and poor accommodation with normal eye movements.", "distractor_explanations": {"B": "Loss of this sympathetic supply would make the pupil small and cause a mild ptosis.", "C": "A trunk lesion would also weaken the extraocular muscles and the levator, causing ptosis and a down-and-out eye.", "D": "It supplies the lacrimal and nasal glands, not the pupil.", "E": "An optic nerve lesion causes vision loss; the pupil still constricts when light is shone in the other eye."}, "source": "Wk3 packet p.15 ('ciliary ganglia ... located in the posterior part of the orbit between the optic nerve and the lateral rectus muscle ... sphincter muscle of the pupil as well as the ciliary body and ciliary muscle'); Autonomic LO5"}, {"id": "mk2-q33", "n": 33, "part": 1, "title": null, "stem": "Six weeks into chemotherapy for lymphoma, a 63-year-old woman has tingling and numbness in her feet and fingers, mild weakness of ankle dorsiflexion and new constipation. Which drug in her regimen is the most likely cause?", "options": [{"letter": "A", "text": "Rituximab"}, {"letter": "B", "text": "Vincristine"}, {"letter": "C", "text": "Prednisone"}, {"letter": "D", "text": "Cyclophosphamide"}, {"letter": "E", "text": "Doxorubicin"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Peripheral Neuropathies", "topic": "Peripheral Neuropathies", "note": null, "blueprint_category": "Peripheral Neuropathies", "learning_objective": "Peripheral Neuropathy LO6", "difficulty": 1, "format": "vignette", "drug_item": "side effect", "laterality": false, "thursday_11_5": false, "explanation": "The course lists vincristine (with paclitaxel, cisplatin and bortezomib) as chemotherapy that causes dose-dependent sensory and motor polyneuropathy; autonomic involvement such as constipation is typical of vincristine.", "distractor_explanations": {"A": "An anti-CD20 antibody; its main risks are infusion reactions, infection and hepatitis B reactivation, not dose-dependent neuropathy.", "C": "Steroids cause hyperglycemia, mood change and myopathy, not a length-dependent polyneuropathy.", "D": "An alkylating agent known for hemorrhagic cystitis and marrow suppression rather than neuropathy.", "E": "An anthracycline known for cardiotoxicity, not neuropathy."}, "source": "Wk2 packet p.60 (LO6 drug list) and p.67 ('Vincristine: causes dose-dependent peripheral neuropathy affecting both sensory and motor nerves'). Distractor side effects are standard pharmacology, beyond the packet"}, {"id": "mk2-q34", "n": 34, "part": 1, "title": null, "stem": "A schwannoma compresses only the left C5 dorsal root, sparing the ventral root and the spinal cord. Which findings are most likely?", "options": [{"letter": "A", "text": "Weakness and fasciculations of the left deltoid with normal sensation"}, {"letter": "B", "text": "Loss of pain and temperature on the right side below C5"}, {"letter": "C", "text": "Numbness over the lateral left shoulder and a reduced left biceps reflex, with normal strength"}, {"letter": "D", "text": "Loss of vibration and position sense in the left arm and leg"}, {"letter": "E", "text": "Spastic weakness of the left leg"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Spinal Cord", "topic": "Spinal Cord", "note": null, "blueprint_category": "Spinal Cord", "learning_objective": "Spinal Cord LO8", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": true, "thursday_11_5": false, "explanation": "The dorsal root carries all sensory fibers of its segment, including the stretch-reflex afferents, so its loss causes dermatomal numbness and a reduced reflex without weakness.", "distractor_explanations": {"A": "That is a ventral root (motor) lesion.", "B": "That needs a lesion of the left spinothalamic tract inside the cord.", "D": "That needs a lesion of the left dorsal columns inside the cord, which carry fibers from many levels.", "E": "That is an upper motor neuron (lateral corticospinal tract) lesion inside the cord."}, "source": "Spinal Cord LO8 (Wk2 packet p.35: lesions incl. radiculopathy); Radiculopathy slide 3 (dorsal root, dorsal root ganglion, ventral root); the C5 dermatome and biceps reflex are the standard root map, beyond the packet (which details C7, L5 and S1)"}, {"id": "mk2-q35", "n": 35, "part": 1, "title": null, "stem": "A 52-year-old man with long-standing heavy alcohol use has burning feet and numbness to the mid-shins. He is also confused, has nystagmus, and walks with a wide-based, unsteady gait. Deficiency of which vitamin best explains all of these findings?", "options": [{"letter": "A", "text": "Cobalamin (B12)"}, {"letter": "B", "text": "Pyridoxine (B6)"}, {"letter": "C", "text": "Niacin (B3)"}, {"letter": "D", "text": "Folate (B9)"}, {"letter": "E", "text": "Thiamine (B1)"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Peripheral Neuropathies", "topic": "Peripheral Neuropathies", "note": null, "blueprint_category": "Peripheral Neuropathies", "learning_objective": "Peripheral Neuropathy LO5", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Chronic alcohol use leads to thiamine deficiency, which causes a painful polyneuropathy (beriberi) and Wernicke encephalopathy (confusion, eye movement abnormalities, ataxia).", "distractor_explanations": {"A": "B12 deficiency causes neuropathy with dorsal column and corticospinal signs, but not the acute confusion, nystagmus and ataxia of Wernicke encephalopathy.", "B": "Pyridoxine problems do not cause the confusion, nystagmus and ataxia of Wernicke encephalopathy.", "C": "Niacin deficiency causes pellagra: dermatitis, diarrhea and dementia.", "D": "Folate deficiency causes megaloblastic anemia; it is not the cause of this neuropathy-plus-Wernicke picture."}, "source": "Wk2 packet p.67 ('Thiamine (Vitamin B1): Deficiency of thiamine leads to beriberi ... peripheral neuropathy ... Wernicke-Korsakoff syndrome'); p.64 table"}, {"id": "mk2-q36", "n": 36, "part": 1, "title": null, "stem": "Which receptor in skeletal muscle signals changes in muscle length?", "options": [{"letter": "A", "text": "Golgi tendon organ"}, {"letter": "B", "text": "Pacinian corpuscle"}, {"letter": "C", "text": "Muscle spindle"}, {"letter": "D", "text": "Ruffini ending"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Somatosensory Receptors and Tracts", "topic": "Somatosensory Receptors and Tracts", "note": null, "blueprint_category": "Somatosensory Receptors and Tracts", "learning_objective": "Sensory Receptors LO1", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Muscle spindles are proprioceptors embedded among muscle fibers that detect stretch-related changes in length; Golgi tendon organs detect tension.", "distractor_explanations": {"A": "It sits at the muscle-tendon junction and signals muscle tension, not length.", "B": "It is a rapidly adapting skin and deep-tissue receptor for vibration.", "D": "It is a slowly adapting skin receptor for stretch of the skin."}, "source": "Wk2 packet p.3 and p.6 ('muscle spindles detect stretching- and compression-related changes in muscle fiber lengths'); Table 1"}, {"id": "mk2-q37", "n": 37, "part": 1, "title": null, "stem": "An hour after a diving accident with a complete C5 spinal cord injury, a 19-year-old man has a blood pressure of 78/40 mm Hg and a heart rate of 48/min. His skin is warm and dry. What best explains these vital signs?", "options": [{"letter": "A", "text": "Bleeding with loss of blood volume"}, {"letter": "B", "text": "Autonomic dysreflexia"}, {"letter": "C", "text": "Increased intracranial pressure with the Cushing response"}, {"letter": "D", "text": "Loss of sympathetic tone with unopposed vagal activity"}, {"letter": "E", "text": "Damage to the vagal motor nuclei in the medulla"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Spinal Syndromes", "topic": "Spinal Syndromes", "note": null, "blueprint_category": "Spinal Syndromes", "learning_objective": "Spinal Syndromes LO1, LO5", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Neurogenic shock: a cord injury above T6 cuts descending drive to the sympathetic outflow (T1-L2), causing hypotension with warm skin, while vagal (parasympathetic) activity continues unopposed and slows the heart.", "distractor_explanations": {"A": "Hemorrhagic shock causes a fast heart rate and cool, pale skin.", "B": "Dysreflexia appears later and causes very high blood pressure, triggered by stimuli below the lesion.", "C": "The Cushing response causes hypertension with bradycardia, not hypotension.", "E": "The medulla is above the injury; losing vagal output would raise the heart rate, not lower it."}, "source": "Spinal Syndromes slide 12 ('Spinal cord injury above T6 → loss of sympathetic tone causes hypotension · Unopposed parasympathetic (vagal) activity → bradycardia · Neurogenic shock'); Spinal Syndromes LO1, LO5"}, {"id": "mk2-q38", "n": 38, "part": 1, "title": nul
