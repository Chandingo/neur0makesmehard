<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Midterm 1 Mock #1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: sticky exam bar; question column (serif stems, like a printed exam) + item navigator rail; rail drops below on phones. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --ink:#15202b; --muted:#5a6976; --line:#d3dce3;
  --accent:#1d5f8a; --accent-ink:#ffffff; --accent-soft:#dfebf4;
  --flag:#a86a12; --ok:#21764a; --ok-soft:#e1f1e8; --bad:#b1352d; --bad-soft:#f7e2e0;
  --hl:#fbe68a; --hl-ink:#15202b;
  --font-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#151e27; --ink:#e3e9ee; --muted:#93a2ae; --line:#283541;
  --accent:#6db3df; --accent-ink:#0b1620; --accent-soft:#183245;
  --flag:#e3aa4f; --ok:#5ec48b; --ok-soft:#153424; --bad:#ef7f75; --bad-soft:#3b1d1b; --hl:#6b5a14; --hl-ink:#fff6d6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#151e27; --ink:#e3e9ee; --muted:#93a2ae; --line:#283541;
  --accent:#6db3df; --accent-ink:#0b1620; --accent-soft:#183245;
  --flag:#e3aa4f; --ok:#5ec48b; --ok-soft:#153424; --bad:#ef7f75; --bad-soft:#3b1d1b; --hl:#6b5a14; --hl-ink:#fff6d6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand b{font-weight:600;font-size:16px;letter-spacing:.01em}
.brand span{color:var(--muted);font-size:12.5px}
.meters{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.meter{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.meter small{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meter .mono{font-size:15px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-size:13.5px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 6px}
.btn.ghost:hover{color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
main{min-width:0}

/* question */
.qhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:12px}
.qnum{font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.qnum b{color:var(--ink);font-size:20px;font-weight:500;margin-right:4px}
.tag{font-size:11.5px;letter-spacing:.04em;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.thu{border-color:var(--flag);color:var(--flag)}
.spacer{margin-left:auto}
.flagbtn{display:inline-flex;align-items:center;gap:6px}
.flagbtn[aria-pressed="true"]{color:var(--flag);border-color:var(--flag)}
.flagbtn svg{width:14px;height:14px}
.stem{font-family:var(--font-body);font-size:18px;line-height:1.6;max-width:68ch;margin:0 0 16px;cursor:text}
.stem mark{background:var(--hl);color:var(--hl-ink);border-radius:2px;padding:0 1px;cursor:pointer}
.stem mark:hover{text-decoration:line-through;text-decoration-thickness:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:none;background:transparent;padding:6px 10px;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg-l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.meter.clock{cursor:pointer;background:transparent;border:none;padding:0;font:inherit;color:inherit}
.live{color:var(--ok)}
.figure{margin:0 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:inline-block;max-width:100%}
.figure img{display:block;max-height:460px;width:auto;max-width:100%;border-radius:4px;cursor:zoom-in}
.ann{margin:14px 0 4px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ann-h{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.ann img{display:block;max-width:100%;max-height:620px;width:auto;border-radius:4px;cursor:zoom-in;background:#fff}
.ann .how{font-size:12.5px;color:var(--muted);margin:8px 0 6px}
.ann ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.ann li{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;line-height:1.45}
.ann .dot{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 12px var(--font-mono);margin-top:1px}
.ann .dot.k{background:#169646}.ann .dot.d{background:#d63c32}.ann .dot.n{background:transparent;color:var(--muted);border:1px solid var(--line)}
.ann .note{font-size:13.5px;color:var(--muted);margin-top:8px}
.figure figcaption{font-size:12px;color:var(--muted);margin-top:6px}
.opts{display:flex;flex-direction:column;gap:8px;max-width:72ch}
.optrow{display:flex;gap:6px;align-items:stretch}
.opt{flex:1;min-width:0;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 14px;font-family:var(--font-body);font-size:16.5px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .L{font-family:var(--font-mono);font-size:13.5px;flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;margin-top:1px;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .L{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.struck .T{text-decoration:line-through;color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default;color:inherit}
.strike{flex:none;width:36px;border:1px solid transparent;background:transparent;border-radius:8px;color:var(--muted);font-size:13px}
.strike:hover{border-color:var(--line);color:var(--ink)}
.qnav{display:flex;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted)}
.hint kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}

.explain{margin-top:20px;max-width:72ch;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.explain .verdict{font-weight:600}
.explain .verdict.ok{color:var(--ok)} .explain .verdict.bad{color:var(--bad)}
.explain p{margin:0;font-family:var(--font-body);font-size:16px;line-height:1.55}
.whynot-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.whynot ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-family:var(--font-body);font-size:15px;line-height:1.5}
.whynot b{font-weight:600}
.explain dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.explain dt{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:11px;padding-top:2px}
.explain dd{margin:0}

/* rail */
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:calc(100vh - 100px);overflow:auto}
@media (max-width:860px){aside{position:static;max-height:none}}
.rail-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:4px}
.cell{position:relative;height:30px;border:1px solid var(--line);background:transparent;border-radius:5px;font-family:var(--font-mono);font-size:12px;color:var(--muted);padding:0}
.cell.ans{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.cell.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.cell.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.cell.skip{border-style:dashed;border-color:var(--bad);color:var(--bad)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--ink)}
.cell.flg::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--flag)}
.cell.dim{opacity:.25}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:3px 10px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.sync{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.sync.warn{color:var(--flag)}

/* results */
.results h2{font-family:var(--font-body);font-weight:600;font-size:28px;margin:0 0 4px;text-wrap:balance}
.results .sub{color:var(--muted);margin:0 0 20px}
.score{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;min-width:140px;flex:1}
.stat small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .mono{font-size:24px}
.stat .mono em{font-style:normal;font-size:14px;color:var(--muted);margin-left:6px}
.stat.lead{border-color:var(--accent)}
.section-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 8px}
.bars{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;font-size:13.5px}
.track{height:10px;background:var(--bad-soft);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--ok)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:none}
td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.miss{display:inline-block;font-family:var(--font-mono);font-size:12px;border:1px solid var(--bad);color:var(--bad);border-radius:4px;padding:0 6px;margin:0 4px 4px 0;background:transparent}
.miss.skipd{border-style:dashed}
.hist{font-size:13px;color:var(--muted)}
.hist li{margin-bottom:2px}

/* dialog + lightbox */
.scrim{position:fixed;inset:0;background:rgba(5,10,15,.55);z-index:20;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
.dialog h3{margin:0;font-size:17px}
.dialog p{margin:0;color:var(--muted)}
.dialog .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.lightbox img{max-width:100%;max-height:calc(100vh - 60px);border-radius:6px;background:#fff;cursor:zoom-out}
@media (prefers-reduced-motion:no-preference){.opt,.cell,.btn{transition:border-color .12s,background-color .12s}}
</style>

and Brain", "note": null, "blueprint_category": "Imaging Techniques for the Head and Brain", "learning_objective": "Imaging Techniques LO3", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrow sits on the gray matter beside the third ventricle, medial to the posterior limb of the internal capsule; it is the 'Thalamus' pin on the labeled version of this slice.", "source": "Imaging Techniques deck, stop-sign slide 109 (image used) and labeled slide 112 ('Thalamus'); Wk1 packet p.108 (LO3)", "distractor_explanations": {"A": "The caudate sits in the lateral wall of the frontal horn of the lateral ventricle, in front of the anterior limb of the internal capsule. That is farther forward than the arrow.", "B": "The putamen is lateral to the internal capsule (the outer part of the lentiform nucleus, next to the external capsule). The arrow is medial to the capsule.", "C": "The globus pallidus is the inner part of the lentiform nucleus, but it is still lateral to the internal capsule. The arrow is on the medial side of the capsule, beside the third ventricle.", "E": "The internal capsule is the white matter band that separates the thalamus and caudate from the lentiform nucleus. The arrow is on gray matter medial to its posterior limb, not on the capsule itself."}}, {"id": "mk1-q02", "n": 2, "part": 1, "title": null, "stem": "Three days after a right carotid endarterectomy, a 70-year-old man has slurred speech. When he protrudes his tongue, it deviates to the right. Sensation and taste on the tongue are normal. Which nerve was most likely injured?", "options": [{"letter": "A", "text": "Left hypoglossal nerve"}, {"letter": "B", "text": "Right hypoglossal nerve"}, {"letter": "C", "text": "Right lingual nerve"}, {"letter": "D", "text": "Right glossopharyngeal nerve"}, {"letter": "E", "text": "Right vagus nerve"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Neck Anatomy", "topic": "Neck Anatomy", "note": null, "blueprint_category": "Neck Anatomy", "learning_objective": "Neck ILM LO7", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": true, "thursday_11_5": false, "explanation": "CN XII crosses the carotid arteries high in the neck; with a lesion the intact side pushes the tongue toward the injured side.", "source": "CN Modules slides 108-109 ('Tongue will deviate towards the side of the hypoglossal nerve lesion'); Neck ILM LO7", "distractor_explanations": {"A": "The tongue deviates toward the weak side, so a left XII lesion would push it to the left. The surgery was also on the right.", "C": "The lingual nerve (V3) carries general sensation from the anterior tongue, which is normal here. It does not move the tongue.", "D": "CN IX carries taste and sensation from the posterior tongue and does not supply tongue muscles.", "E": "A vagus injury causes hoarseness and uvula deviation, not tongue deviation."}}, {"id": "mk1-q03", "n": 3, "part": 1, "title": null, "stem": "A 50-year-old man has neck pain radiating down the inner forearm into his ring and little fingers. He has a weak grip and weak finger flexion. Biceps and triceps reflexes are normal. Which nerve root is most likely compressed?", "options": [{"letter": "A", "text": "C5"}, {"letter": "B", "text": "C6"}, {"letter": "C", "text": "C7"}, {"letter": "D", "text": "C8"}, {"letter": "E", "text": "T1"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Radiculopathy; Spinal cord imaging", "topic": "Radiculopathy; Spinal cord imaging", "note": null, "blueprint_category": "Radiculopathy; Spinal cord imaging", "learning_objective": "Radiculopathy LO2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "C8: ulnar forearm pain, ring/little finger and hypothenar sensory loss, weak intrinsic hand muscles and finger flexors/extensors, no reflex change; T1 affects the ulnar arm (with Horner).", "source": "Wk2 packet p.122, Fig. 6 'Common Cervical Root Syndromes'", "distractor_explanations": {"A": "C5: deltoid and biceps weakness, numbness over the lateral shoulder, and a reduced biceps reflex. Nothing here involves the shoulder.", "B": "C6: numbness of the lateral (thumb-side) forearm and thumb/index finger, weak wrist extension, and a reduced biceps/brachioradialis reflex. This patient's symptoms are on the ulnar side.", "C": "C7: middle finger numbness, triceps weakness and a reduced triceps reflex. His triceps reflex is normal.", "E": "T1: numbness of the medial arm above the elbow, intrinsic hand weakness, and sometimes Horner syndrome. The ring and little fingers are C8 dermatome."}}, {"id": "mk1-q04", "n": 4, "part": 1, "title": null, "stem": "A 71-year-old woman arrives 3 hours after the sudden onset of right arm weakness and trouble speaking. MRI shows a left middle cerebral artery territory lesion that is bright on diffusion-weighted imaging. The swelling in this tissue at this stage is mainly due to:", "options": [{"letter": "A", "text": "Cell swelling after energy failure impairs Na+/K+-ATPase pumps"}, {"letter": "B", "text": "Plasma leaking across a disrupted blood-brain barrier into the extracellular space"}, {"letter": "C", "text": "Increased CSF production by the choroid plexus"}, {"letter": "D", "text": "Reduced CSF absorption at the arachnoid granulations"}, {"letter": "E", "text": "Venous outflow obstruction from sinus thrombosis"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Increased Cranial Pressure", "topic": "Increased Cranial Pressure", "note": null, "blueprint_category": "Increased Cranial Pressure", "learning_objective": "Elevated ICP LO5", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Early ischemia causes cytotoxic (intracellular) edema from ion-pump failure, which restricts diffusion; vasogenic edema from BBB leak is typical around tumors.", "source": "Wk1 packet p.139 (vasogenic vs cytotoxic edema table); p.113-114 (DWI restriction in cytotoxic edema)", "distractor_explanations": {"B": "That is vasogenic edema. It is typical around tumors and abscesses and develops later in an infarct (days), not within 3 hours. It also does not restrict diffusion the way cytotoxic edema does.", "C": "Overproduction of CSF (e.g., choroid plexus papilloma) causes hydrocephalus with enlarged ventricles, not swelling confined to one arterial territory.", "D": "Poor CSF absorption at the arachnoid granulations causes communicating hydrocephalus (e.g., after meningitis or SAH). It enlarges the ventricles and does not fit a sudden MCA-territory lesion.", "E": "Venous sinus thrombosis gives venous infarcts, often hemorrhagic, that don't follow an arterial territory. This history is a sudden MCA stroke."}}, {"id": "mk1-q05", "n": 5, "part": 1, "title": null, "stem": "A child in status epilepticus that has not responded to a benzodiazepine is given a drug that increases the duration of GABA-A chloride channel opening and, at high concentrations, opens the channel directly. Which drug was given?", "options": [{"letter": "A", "text": "Lorazepam"}, {"letter": "B", "text": "Midazolam"}, {"letter": "C", "text": "Phenobarbital"}, {"letter": "D", "text": "Levetiracetam"}, {"letter": "E", "text": "Lacosamide"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Antiepileptics", "topic": "Antiepileptics", "note": null, "blueprint_category": "Antiepileptics", "learning_objective": "Antiepileptics LO1-2", "difficulty": 1, "format": "direct", "drug_item": "mechanism", "laterality": false, "thursday_11_5": true, "explanation": "Barbiturates increase the duration of GABA-A openings (and open it directly at high doses); benzodiazepines increase opening frequency.", "source": "Drug list, Exam 1 'Epilepsy Medications': Phenobarbital row ('increase duration of GABAA CL-channel openings, at high concentrations can open directly'; 'pediatrics and status epilepticus'); Lorazepam/Midazolam rows ('frequency')", "distractor_explanations": {"A": "Lorazepam is a benzodiazepine: it increases how often the GABA-A channel opens, not how long, and it can't open the channel by itself. This child has also already failed a benzodiazepine.", "B": "Midazolam is also a benzodiazepine (frequency of opening, not duration), so it has the same mechanism as the drug that already failed.", "D": "Levetiracetam binds the synaptic vesicle protein SV2A. It does not act on the GABA-A channel.", "E": "Lacosamide enhances slow inactivation of voltage-gated Na+ channels. It does not act on the GABA-A channel."}}, {"id": "mk1-q06", "n": 6, "part": 1, "title": null, "stem": "A 4-year-old boy has had poor feeding, frequent lung infections, no tears when he cries, episodes of very high and very low blood pressure, and reduced sensitivity to pain and temperature. Both parents are healthy, and a cousin had the same condition. Which neurons are primarily affected?", "options": [{"letter": "A", "text": "Upper motor neurons of the motor cortex"}, {"letter": "B", "text": "Lower motor neurons of the ventral horn"}, {"letter": "C", "text": "Cerebellar Purkinje cells"}, {"letter": "D", "text": "Hypothalamic magnocellular neurons"}, {"letter": "E", "text": "Autonomic and sensory neurons"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Autonomics", "topic": "Autonomics", "note": null, "blueprint_category": "Autonomics", "learning_objective": "Autonomic LO7", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Familial dysautonomia (Riley-Day, autosomal recessive ELP1) disrupts development, function and survival of autonomic and sensory neurons.", "source": "Autonomic & Enteric slides 7-8; Wk3 packet p.15-16", "distractor_explanations": {"A": "UMN loss gives spastic weakness and brisk reflexes, not absent tears, labile blood pressure and pain insensitivity.", "B": "LMN loss gives flaccid weakness and atrophy; it does not explain the autonomic and pain/temperature findings.", "C": "Purkinje cell loss causes ataxia, not autonomic failure or sensory loss.", "D": "These neurons make ADH and oxytocin; their loss causes diabetes insipidus, not this picture."}}, {"id": "mk1-q07", "n": 7, "part": 1, "title": null, "stem": "A 42-year-old woman recovered from herpes simplex encephalitis that damaged both medial temporal lobes. Months later she cannot recall conversations from earlier the same day, yet she remembers her childhood and has learned a new piano piece through practice. Which type of memory is impaired?", "options": [{"letter": "A", "text": "Formation of new explicit (declarative) memories"}, {"letter": "B", "text": "Implicit procedural memory"}, {"letter": "C", "text": "Retrieval of remote memories"}, {"letter": "D", "text": "Working memory"}, {"letter": "E", "text": "Classical conditioning"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Memory Formation", "topic": "Memory Formation", "note": null, "blueprint_category": "Memory Formation", "learning_objective": "Learning & Memory LO1, LO4-5", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Bilateral medial temporal (hippocampal) damage causes anterograde amnesia for facts and events, sparing remote memories and procedural learning (striatum/cerebellum).", "source": "Learning & Memory slides 10, 14, 44 (Patient E.P., herpes simplex encephalitis, bilateral medial temporal lobe); Wk3 packet p.59", "distractor_explanations": {"B": "Procedural (implicit) memory depends on the striatum and cerebellum. It is intact: she learned a new piano piece.", "C": "Remote memories are intact (she remembers her childhood). Older memories are stored in the neocortex and no longer depend on the hippocampus.", "D": "Working memory (holding information for seconds) depends on the prefrontal cortex. Her problem is keeping new information over minutes to hours.", "E": "Classical conditioning is implicit memory that relies on the cerebellum (motor conditioning) and amygdala (fear conditioning), not the hippocampus."}}, {"id": "mk1-q08", "n": 8, "part": 1, "title": null, "stem": "Which intracranial structures are the main sources of headache pain?", "options": [{"letter": "A", "text": "The brain parenchyma"}, {"letter": "B", "text": "The meninges (dura) and intracranial blood vessels"}, {"letter": "C", "text": "The choroid plexus"}, {"letter": "D", "text": "The ependymal lining of the ventricles"}, {"letter": "E", "text": "The cerebral white matter tracts"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Headaches", "topic": "Headaches", "note": null, "blueprint_category": "Headaches", "learning_objective": "Headache LO4", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Headache pain comes from irritation, traction or inflammation of pain-sensitive tissues, mainly the meninges and intracranial vessels; brain tissue itself is not pain-sensitive.", "source": "Wk2 packet p.135 (pain-sensitive tissues: meninges and intracranial blood vessels); Headache slide 5 (meningeal vessels)", "distractor_explanations": {"A": "Brain tissue itself has no pain receptors, which is why awake brain surgery is possible.", "C": "The choroid plexus makes CSF and is not a recognized pain-sensitive structure.", "D": "The ventricular lining is not pain-sensitive.", "E": "White matter tracts, like the rest of the parenchyma, are not pain-sensitive."}}, {"id": "mk1-q09", "n": 9, "part": 1, "title": null, "stem": "A 16-year-old is struck on the side of the head by a baseball. He is briefly confused, then talks normally, and 2 hours later becomes hard to arouse. CT shows a hyperdense collection over the temporal lobe that stops at the coronal and lambdoid sutures. The torn vessel is a direct branch of which artery?", "options": [{"letter": "A", "text": "Internal carotid artery"}, {"letter": "B", "text": "Superficial temporal artery"}, {"letter": "C", "text": "Maxillary artery"}, {"letter": "D", "text": "Facial artery"}, {"letter": "E", "text": "Ophthalmic artery"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Protecting the Brain", "topic": "Protecting the Brain", "note": null, "blueprint_category": "Protecting the Brain", "learning_objective": "Protecting the Brain LO3-4", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "A suture-limited, lens-shaped bleed is epidural, classically from the middle meningeal artery, which branches from the maxillary artery and enters through the foramen spinosum.", "source": "Wk1 packet p.46 (middle meningeal a. = branch of maxillary a., through foramen spinosum); Protecting & Supplying the Brain slides 35-38; Headache slide 5", "distractor_explanations": {"A": "The internal carotid gives no branch that runs in the temporal dura. Its injuries cause dissection or carotid-cavernous fistula, not a suture-limited epidural bleed.", "B": "The superficial temporal artery is a terminal branch of the external carotid, but it runs in the scalp outside the skull. Tearing it gives a scalp hematoma, not an epidural hematoma. The middle meningeal comes from the maxillary artery.", "D": "The facial artery supplies the face and never enters the skull.", "E": "The ophthalmic artery is a branch of the internal carotid that supplies the orbit. It does not supply the temporal dura."}}, {"id": "mk1-q10", "n": 10, "part": 1, "title": null, "stem": "A 63-year-old man with metastatic prostate cancer develops, over one day, symmetric numbness of the perineum and buttocks, urinary retention, and erectile dysfunction. Back pain is mild with no radiating leg pain, and leg weakness is mild and symmetric. Which diagnosis is most likely?", "options": [{"letter": "A", "text": "Cauda equina syndrome"}, {"letter": "B", "text": "Conus medullaris syndrome"}, {"letter": "C", "text": "Anterior cord syndrome"}, {"letter": "D", "text": "Brown-Sequard syndrome"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Cauda Equina and Conus Medullaris", "topic": "Cauda Equina and Conus Medullaris", "note": null, "blueprint_category": "Cauda Equina and Conus Medullaris", "learning_objective": "Cauda Equina & Conus LO1-2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Sudden, symmetric saddle anesthesia with early bladder and sexual dysfunction and milder symmetric weakness fits the conus (terminal cord, T12-L2); cauda equina is more asymmetric with prominent radicular pain.", "source": "Wk2 packet p.128 (conus: symmetric saddle anesthesia, early bowel/bladder dysfunction, milder weakness); Cauda Equina & Conus slide 11", "distractor_explanations": {"A": "Cauda equina syndrome (root compression) is usually asymmetric, with prominent radicular leg pain and LMN weakness; bladder problems tend to come later.", "C": "Anterior cord syndrome gives paralysis and pain/temperature loss below the lesion with preserved dorsal columns, not isolated saddle findings.", "D": "Brown-Sequard (hemisection) gives ipsilateral weakness and proprioceptive loss with contralateral pain/temperature loss, not a symmetric pattern."}}, {"id": "mk1-q11", "n": 11, "part": 1, "title": null, "stem": "During emergency surgery, a 19-year-old man is intubated after receiving the neuromuscular blocker that acts as a nicotinic receptor agonist. Twenty minutes later he develops jaw and limb rigidity, a temperature of 40.5 C (104.9 F), and tachycardia. The drug of choice for this reaction acts by:", "options": [{"letter": "A", "text": "Activating GABA-B receptors in the spinal cord"}, {"letter": "B", "text": "Activating alpha-2 adrenergic receptors"}, {"letter": "C", "text": "Inhibiting acetylcholine release at the neuromuscular junction"}, {"letter": "D", "text": "Competitively blocking skeletal muscle nicotinic receptors"}, {"letter": "E", "text": "Blocking calcium release from the sarcoplasmic reticulum at the ryanodine receptor"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Synaptic transmission and neurotransmitters", "topic": "Synaptic transmission and neurotransmitters", "note": null, "blueprint_category": "Synaptic transmission and neurotransmitters", "learning_objective": "Synaptic Transmission LO10", "difficulty": 3, "format": "vignette", "drug_item": "side effect", "laterality": false, "thursday_11_5": false, "explanation": "Succinylcholine can trigger malignant hyperthermia; dantrolene treats it by blocking the ryanodine receptor. Distractors are baclofen, tizanidine, botulinum toxin and the competitive blockers.", "source": "Drug list, Exam 1 'Neuromuscular Blockers': Succinylcholine row ('agonist'; 'Can cause Malignant Hyperthermia'); 'Spasmolytics': Dantrolene row ('used for malignant hyperthermia'; 'blocking the ryanodine receptor'); Synaptic LO10 (Wk3 packet p.20)", "distractor_explanations": {"A": "This is baclofen, a spasmolytic for spasticity, not the treatment for malignant hyperthermia.", "B": "This is tizanidine, a centrally acting spasmolytic.", "C": "This is botulinum toxin, which would cause flaccid paralysis.", "D": "This describes nondepolarizing blockers such as rocuronium. They do not stop the runaway calcium release in muscle."}}, {"id": "mk1-q12", "n": 12, "part": 1, "title": null, "stem": "A section of gray matter shows only three layers: an outer, cell-sparse layer; a single row of large, flask-shaped neurons; and a deep layer densely packed with small, round neurons. Where was this tissue taken from?", "options": [{"letter": "A", "text": "Primary motor cortex"}, {"letter": "B", "text": "Primary visual cortex"}, {"letter": "C", "text": "Cerebellar cortex"}, {"letter": "D", "text": "Spinal cord ventral horn"}, {"letter": "E", "text": "Dorsal root ganglion"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Histology of CNS 2: Organization of Nerve tissues", "topic": "Histology of CNS 2: Organization of Nerve tissues", "note": null, "blueprint_category": "Histology of CNS 2: Organization of Nerve tissues", "learning_objective": "Histology CNS 2 LO3, LO6", "difficulty": 2, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Three layers (molecular, a one-cell-thick Purkinje layer, granule layer) is cerebellar cortex; cerebral cortex (motor or visual) has six layers.", "source": "Wk1 packet p.205, p.207 ('Purkinje Cell Layer: the middle layer, one cell layer thick')", "distractor_explanations": {"A": "Cerebral cortex has six layers; motor cortex is marked by large pyramidal (Betz) cells in layer 5.", "B": "Visual cortex also has six layers, with a thick layer 4 (stria of Gennari).", "D": "The ventral horn holds scattered large motor neurons, not three distinct layers.", "E": "A dorsal root ganglion has round pseudounipolar cell bodies ringed by satellite cells, not a layered cortex."}}, {"id": "mk1-q13", "n": 13, "part": 1, "title": null, "stem": "This H&E section is from the midbrain of a 74-year-old man at autopsy. The inclusion indicated by the arrow is composed mainly of:", "options": [{"letter": "A", "text": "Alpha-synuclein"}, {"letter": "B", "text": "Hyperphosphorylated tau"}, {"letter": "C", "text": "Amyloid-beta"}, {"letter": "D", "text": "TDP-43"}, {"letter": "E", "text": "Prion protein"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock1-images/s-path-pd-nigra.png", "image_needed": true, "week": 3, "session_guess": "Neuropathology of Neurodegenerative Diseases Lab", "topic": "Neuropathology of Neurodegenerative Diseases Lab", "note": null, "blueprint_category": "Neuropathology of Neurodegenerative Diseases Lab", "learning_objective": "Neuropath Lab LO3-4", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": true, "explanation": "The arrow is on the 'Lewy Body' in a pigmented substantia nigra neuron; Lewy bodies are intracytoplasmic alpha-synuclein aggregates.", "source": "Wk3 packet p.154 path-lab figure (PD substantia nigra; 'Lewy Body' labeled); Neuropathology slide 27 ('Alpha synuclein protein forms Lewy bodies')", "distractor_explanations": {"B": "Hyperphosphorylated tau forms neurofibrillary tangles (Alzheimer disease, PSP, Pick bodies). Those are flame-shaped or skein-like, not the round pink inclusion with a halo in a nigral neuron.", "C": "Amyloid-beta forms extracellular plaques and amyloid angiopathy in Alzheimer disease. It is not an inclusion inside a neuron.", "D": "TDP-43 inclusions are the marker of ALS and frontotemporal lobar degeneration. They are not found in pigmented substantia nigra neurons in Parkinson disease.", "E": "Prion disease shows spongiform vacuoles in the neuropil (and sometimes kuru plaques), not round intracytoplasmic inclusions."}}, {"id": "mk1-q14", "n": 14, "part": 1, "title": null, "stem": "A 63-year-old man has 3 months of rapidly worsening memory and confusion, sudden jerking of his limbs, and an unsteady gait. MRI shows restricted diffusion along the cerebral cortex. Which CSF test is most specific for the likely diagnosis?", "options": [{"letter": "A", "text": "14-3-3 protein"}, {"letter": "B", "text": "Oligoclonal bands"}, {"letter": "C", "text": "Cryptococcal antigen"}, {"letter": "D", "text": "RT-QuIC"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Aging and Neurodegenerative Disorders", "topic": "Aging and Neurodegenerative Disorders", "note": null, "blueprint_category": "Aging and Neurodegenerative Disorders", "learning_objective": "Aging & Neurodegenerative LO10-11", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Rapidly progressive dementia with myoclonus suggests CJD; RT-QuIC detects prion seeding activity and strongly supports it, while 14-3-3 is nonspecific.", "source": "Wk3 packet p.112 (RT-QuIC; 14-3-3 limits); Dementia slide 50", "distractor_explanations": {"A": "14-3-3 protein is released whenever neurons are destroyed quickly. It is raised in CJD but also in stroke and encephalitis, so it is sensitive but not specific.", "B": "Oligoclonal bands show antibody production inside the CNS. They support MS or other inflammatory disease, not CJD.", "C": "Cryptococcal antigen diagnoses cryptococcal meningitis, usually in an immunocompromised patient with subacute headache and fever. It doesn't explain myoclonus with cortical restricted diffusion."}}, {"id": "mk1-q15", "n": 15, "part": 1, "title": null, "stem": "Signals from the roof plate of the developing neural tube pattern which region?", "options": [{"letter": "A", "text": "Basal plate, which forms ventral (motor) neurons"}, {"letter": "B", "text": "Floor plate, which forms the ventral midline"}, {"letter": "C", "text": "Somites, which form the vertebrae"}, {"letter": "D", "text": "Notochord, which forms the nucleus pulposus"}, {"letter": "E", "text": "Alar plate, which forms dorsal (sensory) neurons"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Embryology of CNS PNS", "topic": "Embryology of CNS PNS", "note": null, "blueprint_category": "Embryology of CNS PNS", "learning_objective": "Embryology CNS/PNS LO3-4", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Roof plate signals pattern the alar plate (sensory); the floor plate and notochord (SHH) pattern the basal plate (motor).", "source": "ILM Embryology of the CNS and PNS slide 35 ('Roofplate signals alar plate / floorplate signals basal plate'); Wk1 packet p.141", "distractor_explanations": {"A": "The basal plate is patterned by ventral signals (SHH from the floor plate and notochord), not by the roof plate.", "B": "The floor plate is itself a ventral signaling center driven by the notochord.", "C": "Somites are paraxial mesoderm outside the neural tube; they are not patterned by the roof plate.", "D": "The notochord is a ventral signaling source below the neural tube, not a target of roof plate signals."}}, {"id": "mk1-q16", "n": 16, "part": 1, "title": null, "stem": "A 72-year-old woman has 8 months of slowed thinking and poor memory. She has also gained weight, feels cold all the time, and has dry skin and constipation. Which test is most likely to reveal a reversible cause of her cognitive decline?", "options": [{"letter": "A", "text": "Amyloid PET scan"}, {"letter": "B", "text": "Serum thyroid-stimulating hormone"}, {"letter": "C", "text": "CSF 14-3-3 protein"}, {"letter": "D", "text": "ApoE genotyping"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Aging and Neurodegenerative Disorders", "topic": "Aging and Neurodegenerative Disorders", "note": null, "blueprint_category": "Aging and Neurodegenerative Disorders", "learning_objective": "Aging & Neurodegenerative LO2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Weight gain, cold intolerance, dry skin and constipation point to hypothyroidism, a reversible metabolic cause of dementia; the other tests look for irreversible degenerative disease.", "source": "Wk3 packet p.100 (LO2)", "distractor_explanations": {"A": "Amyloid PET looks for Alzheimer pathology, which is not reversible, and it does not explain her other symptoms.", "C": "14-3-3 is a marker of rapid neuronal destruction (e.g., CJD), not a reversible cause.", "D": "ApoE4 is a risk allele for Alzheimer disease; genotyping does not identify a treatable cause."}}, {"id": "mk1-q17", "n": 17, "part": 1, "title": null, "stem": "A lesion limited to the left ventral roots of C5 and C6 would most likely produce which findings?", "options": [{"letter": "A", "text": "Numbness over the left lateral arm with normal strength"}, {"letter": "B", "text": "Spastic weakness of the left leg with a Babinski sign"}, {"letter": "C", "text": "Flaccid weakness and atrophy of the left deltoid and biceps, a reduced biceps reflex, and normal sensation"}, {"letter": "D", "text": "Loss of pain and temperature on the right side below C6"}, {"letter": "E", "text": "Numbness over the left lateral arm with flaccid weakness of the deltoid and biceps"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Spinal Cord", "topic": "Spinal Cord", "note": null, "blueprint_category": "Spinal Cord", "learning_objective": "Spinal Cord LO8", "difficulty": 2, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Ventral roots carry only lower motor neuron axons: flaccid weakness, atrophy and hyporeflexia in that myotome with no sensory loss (a mixed spinal nerve lesion gives both).", "source": "O'Brien Spinal Cord slides 47-49 (root vs spinal nerve lesions); Wk2 packet p.122 Fig. 6 (C5-C6 muscles, biceps reflex)", "distractor_explanations": {"A": "Ventral roots carry no sensory fibers, so there would be no numbness, and strength would be lost.", "B": "A spastic leg with a Babinski sign is an UMN finding from a cord or brain lesion, not a root lesion.", "D": "Contralateral pain/temperature loss below a level is the spinothalamic part of a hemicord lesion.", "E": "Numbness requires dorsal root (sensory) involvement, as in a mixed spinal nerve lesion."}}, {"id": "mk1-q18", "n": 18, "part": 1, "title": null, "stem": "Preganglionic parasympathetic fibers that drive parotid gland secretion synapse in which ganglion?", "options": [{"letter": "A", "text": "Submandibular ganglion"}, {"letter": "B", "text": "Pterygopalatine ganglion"}, {"letter": "C", "text": "Ciliary ganglion"}, {"letter": "D", "text": "Geniculate ganglion"}, {"letter": "E", "text": "Otic ganglion"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Face Anatomy", "topic": "Face Anatomy", "note": null, "blueprint_category": "Face Anatomy", "learning_objective": "Face ILM LO4", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "CN IX -> tympanic nerve -> lesser petrosal nerve -> otic ganglion; postganglionic fibers ride the auriculotemporal nerve (V3) to the parotid. The geniculate ganglion is sensory (no synapse).", "source": "ILM Anatomy of the Face slides 14-16 (otic ganglion pathway); Wk1 packet p.34 (Face LO4)", "distractor_explanations": {"A": "The submandibular ganglion receives CN VII fibers (chorda tympani via the lingual nerve) and supplies the submandibular and sublingual glands.", "B": "The pterygopalatine ganglion receives CN VII fibers (greater petrosal nerve) and supplies the lacrimal gland and the nasal and palatal glands.", "C": "The ciliary ganglion receives CN III fibers and supplies the pupillary sphincter and ciliary muscle.", "D": "The geniculate ganglion is the sensory ganglion of CN VII (cell bodies for taste). No autonomic synapse happens there; parasympathetic fibers only pass through."}}, {"id": "mk1-q19", "n": 19, "part": 1, "title": null, "stem": "A 28-year-old man who uses heroin daily wants treatment. Six hours after his last use, he takes his first sublingual dose of a buprenorphine-naloxone tablet. Within an hour he has yawning, a runny nose, sweating, and abdominal cramps. Which property of buprenorphine best explains this reaction?", "options": [{"letter": "A", "text": "It is a partial agonist at mu opioid receptors"}, {"letter": "B", "text": "It is a full mu agonist more potent than morphine"}, {"letter": "C", "text": "It blocks reuptake of norepinephrine and serotonin"}, {"letter": "D", "text": "It is a mu agonist that does not cross the blood-brain barrier"}, {"letter": "E", "text": "It irreversibly inhibits cyclooxygenase"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Pain Medications", "topic": "Pain Medications", "note": null, "blueprint_category": "Pain Medications", "learning_objective": "Pain Medications LO1-2", "difficulty": 3, "format": "vignette", "drug_item": "mechanism", "laterality": false, "thursday_11_5": false, "explanation": "As a partial mu agonist, buprenorphine displaces the full agonist and lowers receptor activation, precipitating withdrawal; the list notes Suboxone 'will cause withdrawal in people using opiates.'", "source": "Drug list, Exam 1 'Medications Used for Pain': Buprenorphine / Buprenorphine + Naloxone row ('Partial Mu agonist ...'); displacement by high affinity is standard Step 1", "distractor_explanations": {"B": "A full agonist would relieve withdrawal, not cause it.", "C": "This describes tramadol's added action or SNRIs; it is not buprenorphine's mechanism.", "D": "This describes loperamide, an antidiarrheal.", "E": "This describes aspirin."}}, {"id": "mk1-q20", "n": 20, "part": 1, "title": null, "stem": "A 31-year-old woman has spells that begin with a rising feeling in her stomach and a sense of deja vu. Her husband then sees her stare, smack her lips, and fumble with her shirt buttons for about a minute; she does not respond to him, and afterward she is confused and cannot recall the event. Which seizure type is this?", "options": [{"letter": "A", "text": "Focal aware seizure"}, {"letter": "B", "text": "Absence seizure"}, {"letter": "C", "text": "Generalized tonic-clonic seizure"}, {"letter": "D", "text": "Focal impaired awareness seizure"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Seizures & Epilepsy", "topic": "Seizures & Epilepsy", "note": null, "blueprint_category": "Seizures & Epilepsy", "learning_objective": "Seizures LO2, LO5-6", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": true, "explanation": "A focal onset (aura) followed by unresponsiveness with automatisms and postictal confusion is a focal impaired awareness seizure; awareness is preserved in focal aware seizures.", "source": "Seizures and Epilepsy slides 27-28 (focal impaired awareness; automatisms); Wk3 packet p.133 (LO2, LO5-6)", "distractor_explanations": {"A": "In a focal aware seizure the person stays aware and remembers it. She was unresponsive and amnestic.", "B": "Absence seizures are brief (seconds), have no aura and no postictal confusion, and usually start in childhood.", "C": "A GTC seizure has tonic stiffening then clonic jerking of all limbs, not staring with lip smacking and fumbling."}}, {"id": "mk1-q21", "n": 21, "part": 1, "title": null, "stem": "A 27-year-old man is stabbed in the right side of his mid-back. He has weakness and hyperreflexia of the right leg, loss of vibration and joint position sense in the right leg, and loss of pinprick and temperature sensation in the left leg and trunk starting a few segments below the wound. Which additional finding is most likely?", "options": [{"letter": "A", "text": "Loss of vibration sense in a band on the left at the level of the injury"}, {"letter": "B", "text": "Flaccid weakness and atrophy of the right hand muscles"}, {"letter": "C", "text": "Bilateral loss of pain and temperature over the shoulders"}, {"letter": "D", "text": "Spastic weakness of the left leg"}, {"letter": "E", "text": "Loss of pinprick and temperature in a narrow band on the right at the level of the injury"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Spinal Syndromes", "topic": "Spinal Syndromes", "note": null, "blueprint_category": "Spinal Syndromes", "learning_objective": "Spinal Syndromes LO1, LO3", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": true, "thursday_11_5": false, "explanation": "Brown-Sequard hemisection: ipsilateral UMN weakness and DCML loss, contralateral spinothalamic loss below, and ipsilateral pain/temperature loss at the level of the lesion.", "source": "Spinal Syndromes slide 21 ('Ipsilateral loss of pain and temperature at level of lesion'); Wk2 packet p.105 (LO1)", "distractor_explanations": {"A": "The dorsal columns stay on the same side until the medulla, so vibration loss is on the right, below the lesion, not a band on the left.", "B": "Lower motor neuron signs appear only at the segments that were cut. This is a mid-back (thoracic) wound, so the hand (C8-T1) is spared.", "C": "Bilateral cape-like pain and temperature loss over the shoulders is central cord syndrome or syringomyelia in the cervical cord, not a thoracic hemisection.", "D": "The corticospinal tract has already crossed in the medulla, so a right hemisection weakens the right leg, not the left."}}, {"id": "mk1-q22", "n": 22, "part": 1, "title": null, "stem": "The upper motor neurons of the tectospinal tract are located in the:", "options": [{"letter": "A", "text": "Midbrain tectum (superior colliculus)"}, {"letter": "B", "text": "Red nucleus"}, {"letter": "C", "text": "Vestibular nuclei"}, {"letter": "D", "text": "Pontine reticular formation"}, {"letter": "E", "text": "Primary motor cortex"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Corticospinal and UMN/LMN", "topic": "Corticospinal and UMN/LMN", "note": null, "blueprint_category": "Corticospinal and UMN/LMN", "learning_objective": "Descending Motor Pathways LO3", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Tectospinal UMNs sit in the midbrain roof (tectum) and drive orienting head turns; the pathway is crossed.", "source": "Wk2 packet p.30; Descending Motor Pathways slides 34-35", "distractor_explanations": {"B": "The red nucleus gives rise to the rubrospinal tract.", "C": "The vestibular nuclei give rise to the vestibulospinal tracts.", "D": "The pontine reticular formation gives rise to the (medial) reticulospinal tract.", "E": "Primary motor cortex gives rise to the corticospinal tract."}}, {"id": "mk1-q23", "n": 23, "part": 1, "title": null, "stem": "A 64-year-old woman has a small infarct confined to the left medial lemniscus in the mid pons. Which deficit is most likely?", "options": [{"letter": "A", "text": "Loss of vibration and position sense on the left side of the body"}, {"letter": "B", "text": "Loss of vibration and position sense on the right side of the body"}, {"letter": "C", "text": "Loss of pain and temperature on the right side of the body"}, {"letter": "D", "text": "Loss of discriminative touch on the left side of the face"}, {"letter": "E", "text": "Weakness of the right arm and leg"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Somatosensory Receptors and Tracts", "topic": "Somatosensory Receptors and Tracts", "note": null, "blueprint_category": "Somatosensory Receptors and Tracts", "learning_objective": "Sensory Receptors LO3-4", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": true, "thursday_11_5": false, "explanation": "DCML axons cross in the caudal medulla, so the left medial lemniscus in the pons carries fine touch, vibration and proprioception from the right body.", "source": "Wk2 packet p.1 (LO4: DCML deficits by lesion level) and p.4-8 (DCML pathway)", "distractor_explanations": {"A": "Dorsal column fibers cross in the caudal medulla (internal arcuate fibers). Above that, the left medial lemniscus carries the right side of the body.", "C": "Pain and temperature travel in the spinothalamic tract, which runs separately, lateral to the medial lemniscus in the pons. A lesion confined to the medial lemniscus spares it.", "D": "Fine touch from the face travels in the trigeminal pathway (principal sensory nucleus of V to the trigeminothalamic tract), not in the medial lemniscus.", "E": "Corticospinal fibers run in the basilar (ventral) pons, in front of the medial lemniscus. A lesion confined to the lemniscus spares them."}}, {"id": "mk1-q24", "n": 24, "part": 1, "title": null, "stem": "A 58-year-old man has had a drooping right eyelid and double vision for a month. The right eye cannot move in any direction, the right pupil is dilated, and sensation is decreased over the right forehead and cornea. Visual acuity is normal, and sensation over the right cheek and upper lip is intact. A mass is most likely compressing structures at which site?", "options": [{"letter": "A", "text": "Right cavernous sinus"}, {"letter": "B", "text": "Right optic canal"}, {"letter": "C", "text": "Right superior orbital fissure"}, {"letter": "D", "text": "Right foramen rotundum"}, {"letter": "E", "text": "Right internal acoustic meatus"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Cranial Nerves Module", "topic": "Cranial Nerves Module", "note": null, "blueprint_category": "Cranial Nerves Module", "learning_objective": "CN Modules LO2, LO5", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "CN III, IV, V1 and VI pass through the superior orbital fissure; a cavernous sinus lesion would also take V2 (cheek), and the optic canal would affect vision.", "source": "ILM Anatomy of the Face slide 6 ('SOF: CN III, IV, V1, VI'); Wk1 packet p.100 (cavernous sinus damage -> periorbital AND maxillary sensory loss); CN Modules LO2, LO5", "distractor_explanations": {"A": "The cavernous sinus also carries V2, so cheek and upper lip sensation would be lost too.", "B": "The optic canal carries CN II, so vision would be affected.", "D": "Foramen rotundum carries only V2, which is spared here.", "E": "The internal acoustic meatus carries CN VII and VIII (face and hearing), not the eye-movement nerves."}}, {"id": "mk1-q25", "n": 25, "part": 1, "title": null, "stem": "A newborn has an open lumbosacral myelomeningocele. MRI of the head shows the cerebellar vermis and lower brainstem displaced through the foramen magnum, with enlarged lateral ventricles. Which diagnosis best explains the head imaging?", "options": [{"letter": "A", "text": "Chiari type I malformation"}, {"letter": "B", "text": "Dandy-Walker malformation"}, {"letter": "C", "text": "Holoprosencephaly"}, {"letter": "D", "text": "Chiari type II malformation"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Embryo Disorders of CNS", "topic": "Embryo Disorders of CNS", "note": null, "blueprint_category": "Embryo Disorders of CNS", "learning_objective": "Embryological Disorders LO3", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Chiari II: cerebellum and brainstem herniate through the foramen magnum, usually with a myelomeningocele and hydrocephalus; Chiari I involves the tonsils only.", "source": "Wk1 packet p.193 ('Type II = cerebellum and brainstem, often accompanied by myelomeningocele')", "distractor_explanations": {"A": "Chiari I is tonsillar herniation alone, usually in adults, without a myelomeningocele.", "B": "Dandy-Walker is a hypoplastic vermis with a cystic fourth ventricle in an enlarged posterior fossa, not herniation downward.", "C": "Holoprosencephaly is failed separation of the forebrain hemispheres."}}, {"id": "mk1-q26", "n": 26, "part": 1, "title": null, "stem": "A 30-year-old man with a severe head injury from a motorcycle crash is unresponsive. When stimulated, he extends and internally rotates his arms and extends his legs. CT shows hemorrhage in the upper pons. Which descending pathway is thought to drive this posture?", "options": [{"letter": "A", "text": "Rubrospinal tract"}, {"letter": "B", "text": "Lateral corticospinal tract"}, {"letter": "C", "text": "Tectospinal tract"}, {"letter": "D", "text": "Anterior corticospinal tract"}, {"letter": "E", "text": "Reticulospinal tract"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Corticospinal and UMN/LMN", "topic": "Corticospinal and UMN/LMN", "note": null, "blueprint_category": "Corticospinal and UMN/LMN", "learning_objective": "Descending Motor Pathways LO4", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Course framing: extensor (decerebrate) posturing after injury at the level of the pons is attributed to the reticulospinal tract; flexor (decorticate) posturing is rubrospinal.", "source": "Descending Motor Pathways slide 38 ('THE RETICULOSPINAL TRACT is responsible for EXTENSOR POSTURING after severe injury at the level of the pons'); Wk2 packet p.30", "distractor_explanations": {"A": "In the course framing, rubrospinal output drives flexor (decorticate) posturing. That happens with lesions above the red nucleus. A pontine lesion is below it.", "B": "The lateral corticospinal tract carries voluntary, fine distal movement. Losing it releases brainstem pathways; it doesn't produce the posture itself.", "C": "The tectospinal tract turns the head and neck toward visual and auditory stimuli. It isn't linked to posturing.", "D": "The anterior corticospinal tract carries voluntary control of axial and proximal muscles. It isn't the pathway behind extensor posturing."}}, {"id": "mk1-q27", "n": 27, "part": 1, "title": null, "stem": "On a Nissl-stained section of spinal cord, which region stains most intensely?", "options": [{"letter": "A", "text": "Dorsal columns"}, {"letter": "B", "text": "Lateral funiculus"}, {"letter": "C", "text": "Ventral roots"}, {"letter": "D", "text": "Ventral horn gray matter"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Histology Lab", "topic": "Histology Lab", "note": null, "blueprint_category": "Histology Lab", "learning_objective": "Histology Lab LO4, LO7", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Nissl stain marks rough ER in neuron cell bodies, so gray matter stains; a myelin stain is needed to show white-matter tracts.", "source": "Histology of the CNS 2 slide 23 ('Gray Matter = neuron cell bodies (Nissl stain); White Matter = axons (Myelin stain)'); Wk1 packet p.209 (Lab LO7)", "distractor_explanations": {"A": "The dorsal columns are white matter (axons), which take up little Nissl stain.", "B": "The lateral funiculus is white matter tracts, not cell bodies.", "C": "Ventral roots contain axons, not the cell bodies whose rough ER Nissl stains."}}, {"id": "mk1-q28", "n": 28, "part": 1, "title": null, "stem": "Most axons in the tract indicated by the green arrow arise from upper motor neurons in which structure?", "options": [{"letter": "A", "text": "Ipsilateral red nucleus"}, {"letter": "B", "text": "Contralateral red nucleus"}, {"letter": "C", "text": "Contralateral primary motor cortex"}, {"letter": "D", "text": "Ipsilateral vestibular nuclei"}, {"letter": "E", "text": "Contralateral superior colliculus"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock1-images/s-sc-atlas-tract.png", "image_needed": true, "week": 2, "session_guess": "Spinal Cord Cross-Sectional Anatomy", "topic": "Spinal Cord Cross-Sectional Anatomy", "note": null, "blueprint_category": "Spinal Cord Cross-Sectional Anatomy", "learning_objective": "SC Cross-Sectional LO3", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrow marks the rubrospinal tract (labeled on the worksheet atlas), just in front of the lateral corticospinal tract; its UMNs are in the red nucleus and cross in the midbrain.", "source": "SC Cross-Sectional Anatomy worksheet p.10, Fig. 1 atlas ('Rubrospinal tract' labeled); Wk2 packet p.29-30 (rubrospinal UMN, crossing)", "distractor_explanations": {"A": "Rubrospinal fibers cross in the midbrain (ventral tegmental decussation), so the cell bodies are contralateral.", "C": "Lateral corticospinal fibers come from motor cortex, but this tract sits just in front of them; the arrowed tract is rubrospinal.", "D": "Vestibulospinal tracts run in the ventral (anterior) funiculus, not the lateral funiculus.", "E": "Tectospinal fibers from the superior colliculus run in the ventral funiculus and reach mainly cervical levels."}}, {"id": "mk1-q29", "n": 29, "part": 1, "title": null, "stem": "A painless midline neck mass that moves upward when the patient sticks out the tongue most likely arises from which embryologic structure?", "options": [{"letter": "A", "text": "Second pharyngeal cleft"}, {"letter": "B", "text": "Third pharyngeal pouch"}, {"letter": "C", "text": "Thyroglossal duct"}, {"letter": "D", "text": "Fourth pharyngeal pouch"}, {"letter": "E", "text": "Cervical sinus"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Neck Anatomy", "topic": "Neck Anatomy", "note": null, "blueprint_category": "Neck Anatomy", "learning_objective": "Neck ILM LO6", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The thyroid descends from the foramen cecum through the thyroglossal duct; a patent duct can become cystic, a common midline neck mass.", "source": "Wk1 packet p.66-67 (cystic thyroglossal duct); ILM Anatomy of the Neck slides 15-16", "distractor_explanations": {"A": "Second cleft cysts are lateral, along the anterior border of the sternocleidomastoid, and do not move with the tongue.", "B": "The third pouch forms the thymus and inferior parathyroids.", "D": "The fourth pouch forms the superior parathyroids and ultimobranchial body.", "E": "Cervical sinus remnants form lateral neck cysts or fistulas."}}, {"id": "mk1-q30", "n": 30, "part": 1, "title": null, "stem": "Retrograde axonal transport, which carries material from the axon terminal back to the cell body, depends on which motor protein?", "options": [{"letter": "A", "text": "Dynein"}, {"letter": "B", "text": "Kinesin"}, {"letter": "C", "text": "Myosin"}, {"letter": "D", "text": "Tau"}, {"letter": "E", "text": "Neurofilament protein"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Histology of CNS 1: Neurons and Glia", "topic": "Histology of CNS 1: Neurons and Glia", "note": null, "blueprint_category": "Histology of CNS 1: Neurons and Glia", "learning_objective": "Histology CNS 1 LO2", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Kinesin moves cargo anterograde along microtubules; dynein carries it retrograde to the soma.", "source": "Wk1 packet p.178-179; Histology of the CNS 1 slide 15 ('Anterograde: Kinesin, Retrograde: Dynein')", "distractor_explanations": {"B": "Kinesin moves cargo anterograde, from the cell body out to the terminal. This is the most common mix-up: Kinesin = Kicks it out, Dynein = Drags it back.", "C": "Myosin moves along actin over short distances (growth cones, terminals). It isn't the long-range microtubule motor.", "D": "Tau is a microtubule-associated protein that stabilizes microtubules, not a motor. It is the protein in neurofibrillary tangles when hyperphosphorylated.", "E": "Neurofilaments are intermediate filaments that set axon diameter. They are structural, not motors."}}, {"id": "mk1-q31", "n": 31, "part": 1, "title": null, "stem": "A newborn girl has a cleft of the upper lip just to the left of the philtrum. The alveolar ridge and palate are intact. Failure of fusion between which structures caused this defect?", "options": [{"letter": "A", "text": "Left and right maxillary prominences"}, {"letter": "B", "text": "Left maxillary prominence and the medial nasal prominence"}, {"letter": "C", "text": "Left lateral nasal prominence and left maxillary prominence"}, {"letter": "D", "text": "Left and right medial nasal prominences"}, {"letter": "E", "text": "Left lateral nasal prominence and the medial nasal prominence"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Face Embryology", "topic": "Face Embryology", "note": null, "blueprint_category": "Face Embryology", "learning_objective": "Facial Embryology LO5-6", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "A unilateral cleft lip is failed fusion of a maxillary prominence with the medial nasal prominences; a midline cleft (rare) is failure of the two medial nasal prominences to unite.", "source": "Wk1 packet p.32 ('Cleft lip: failed fusion of medial nasal prominences with the maxillary prominences'); p.29", "distractor_explanations": {"A": "The two maxillary prominences never meet each other in the upper lip; the medial nasal prominences sit between them. (The palatal shelves of the maxillary prominences fuse to form the secondary palate, and failure there causes cleft palate, which she doesn't have.)", "C": "The groove between the lateral nasal and maxillary prominences becomes the nasolacrimal duct. Failure there gives an oblique facial cleft, not a cleft lip.", "D": "Failure of the two medial nasal prominences to merge gives a rare median (midline) cleft lip. Hers is to the left of the philtrum.", "E": "The lateral nasal prominence forms the ala of the nose. It doesn't form part of the upper lip, so it can't cause a cleft lip."}}, {"id": "mk1-q32", "n": 32, "part": 1, "title": null, "stem": "This H&E section of cerebral cortex is from a 66-year-old at autopsy. The change indicated by the arrow results from:", "options": [{"letter": "A", "text": "Intracellular alpha-synuclein aggregation"}, {"letter": "B", "text": "Extracellular amyloid-beta plaques"}, {"letter": "C", "text": "JC virus infection of oligodendrocytes"}, {"letter": "D", "text": "Misfolded prion protein inducing normal prion protein to misfold"}, {"letter": "E", "text": "Ischemic neuronal necrosis"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock1-images/s-path-cjd-cortex.png", "image_needed": true, "week": 3, "session_guess": "Neuropathology of Neurodegenerative Diseases Lab", "topic": "Neuropathology of Neurodegenerative Diseases Lab", "note": null, "blueprint_category": "Neuropathology of Neurodegenerative Diseases Lab", "learning_objective": "Neuropath Lab LO4", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": true, "explanation": "The arrow is on 'Spongiform Degeneration' (vacuolated neuropil) in CJD, caused by abnormal prion protein templating misfolding of normal PrP.", "source": "Wk3 packet p.157 path-lab figure (CJD cortex; 'Spongiform Degeneration' labeled); Neuropathology LO7 (Wk3 packet p.116)", "distractor_explanations": {"A": "Alpha-synuclein forms Lewy bodies, which are solid round pink inclusions inside neurons, not empty holes in the neuropil.", "B": "Amyloid-beta plaques are extracellular pink deposits with dystrophic neurites. They are solid material, not vacuoles.", "C": "JC virus causes PML: patchy demyelination of white matter with enlarged, glassy oligodendrocyte nuclei. This slide is cortex with spongy vacuoles.", "E": "Ischemic necrosis first shows red neurons (shrunken, very pink cells with dark nuclei) and later cavities full of macrophages, not the fine spongy vacuoles of spongiform change."}}, {"id": "mk1-q33", "n": 33, "part": 1, "title": null, "stem": "A 62-year-old man reports vertical double vision that is worst when he walks down stairs or reads a book in his lap. He holds his head tilted away from the affected side. MRI shows a small lesion in the dorsal midbrain. Weakness of which muscle best explains his symptoms?", "options": [{"letter": "A", "text": "Inferior oblique"}, {"letter": "B", "text": "Inferior rectus"}, {"letter": "C", "text": "Superior oblique"}, {"letter": "D", "text": "Superior rectus"}, {"letter": "E", "text": "Lateral rectus"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Cranial Nerves Module", "topic": "Cranial Nerves Module", "note": null, "blueprint_category": "Cranial Nerves Module", "learning_objective": "CN Modules LO4-5", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "CN IV, the only cranial nerve leaving the dorsal brainstem, supplies the superior oblique (depresses the adducted eye), so its palsy gives vertical diplopia on downgaze.", "source": "Wk1 packet p.152 (CN Modules LO4-5); CN Modules slide 27 ('LR6 SO4')", "distractor_explanations": {"A": "Inferior oblique weakness causes trouble looking up and in, not on downgaze, and CN III is not a dorsal midbrain exit.", "B": "The inferior rectus (CN III) depresses the eye, but a CN III lesion would also cause ptosis and other deficits; head tilt away and a dorsal exit point to CN IV.", "D": "Superior rectus weakness impairs upgaze, not reading or stairs.", "E": "Lateral rectus (CN VI) weakness causes horizontal double vision."}}, {"id": "mk1-q34", "n": 34, "part": 1, "title": null, "stem": "A 68-year-old man with kidney failure has muscle weakness, and his serum potassium is 7.8 mEq/L. Which change in his excitable cells best explains the weakness?", "options": [{"letter": "A", "text": "The resting potential becomes more negative, moving cells away from threshold"}, {"letter": "B", "text": "The Na+ equilibrium potential falls toward zero"}, {"letter": "C", "text": "Voltage-gated K+ channels can no longer open"}, {"letter": "D", "text": "The Na+/K+ pump reverses direction"}, {"letter": "E", "text": "The resting potential becomes less negative, keeping more voltage-gated Na+ channels inactivated"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Action Potentials", "topic": "Action Potentials", "note": null, "blueprint_category": "Action Potentials", "learning_objective": "AP LO3, LO6", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "High extracellular K+ shrinks the K+ gradient and depolarizes the resting membrane; sustained depolarization inactivates Na+ channels, so fewer are available to fire.", "source": "Wk3 packet p.44 (LO3, LO6, LO11) and p.45-48 (K+ gradient, resting potential, Na+ channel inactivation); inactivation by sustained depolarization = standard physiology", "distractor_explanations": {"A": "A more negative resting potential (hyperpolarization) is what happens in hypokalemia. High K+ does the opposite.", "B": "The Na+ equilibrium potential depends on the Na+ gradient, which hyperkalemia doesn't change.", "C": "Voltage-gated K+ channels still open. The problem is the smaller K+ gradient and the depolarized resting membrane.", "D": "The Na+/K+ pump doesn't reverse. High extracellular K+ actually stimulates it."}}, {"id": "mk1-q35", "n": 35, "part": 1, "title": null, "stem": "A 79-year-old man with moderate Alzheimer disease already takes donepezil. His physician adds a second drug that blocks the open state of NMDA glutamate channels and reduces calcium influx. Which drug was added?", "options": [{"letter": "A", "text": "Memantine"}, {"letter": "B", "text": "Rivastigmine"}, {"letter": "C", "text": "Galantamine"}, {"letter": "D", "text": "Gabapentin"}, {"letter": "E", "text": "Lecanemab"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Memory Formation", "topic": "Memory Formation", "note": null, "blueprint_category": "Memory Formation", "learning_objective": "Learning & Memory LO11", "difficulty": 1, "format": "vignette", "drug_item": "mechanism", "laterality": false, "thursday_11_5": false, "explanation": "Memantine blocks open NMDA channels; rivastigmine and galantamine are AChE inhibitors like donepezil; gabapentin reduces membrane Ca2+ channels.", "source": "Drug list, Exam 1 'Medications used for Alzheimer's Disease': Memantine row ('Blocks the open-state of NMDA glutamate channels causing a decrease in the influx of calcium')", "distractor_explanations": {"B": "Rivastigmine is an acetylcholinesterase (and butyrylcholinesterase) inhibitor, the same class as donepezil. It doesn't block NMDA channels.", "C": "Galantamine is also an acetylcholinesterase inhibitor (with some nicotinic receptor modulation), so again the same class as donepezil.", "D": "Gabapentin binds the alpha-2-delta subunit of voltage-gated Ca2+ channels. It is used for neuropathic pain and seizures and doesn't act at NMDA receptors.", "E": "Lecanemab is an IV anti-amyloid-beta antibody for early Alzheimer disease (main risk: ARIA). It doesn't act on NMDA channels."}}, {"id": "mk1-q36", "n": 36, "part": 1, "title": null, "stem": "A 61-year-old man with type 2 diabetes has burning pain in both feet that keeps him awake, and he also meets criteria for major depressive disorder. He has benign prostatic hyperplasia with urinary retention. Which medication is best to treat both his neuropathic pain and his depression?", "options": [{"letter": "A", "text": "Amitriptyline"}, {"letter": "B", "text": "Pregabalin"}, {"letter": "C", "text": "Carbamazepine"}, {"letter": "D", "text": "Duloxetine"}, {"letter": "E", "text": "Capsaicin"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Peripheral Neuropathies", "topic": "Peripheral Neuropathies", "note": null, "blueprint_category": "Peripheral Neuropathies", "learning_objective": "Peripheral Neuropathy LO11", "difficulty": 3, "format": "vignette", "drug_item": "indication", "laterality": false, "thursday_11_5": false, "explanation": "Duloxetine (SNRI) treats painful polyneuropathy and depression; amitriptyline also inhibits NE/5-HT reuptake, but its antimuscarinic action worsens urinary retention.", "source": "Drug list, Exam 1 'Additional drugs used for Chronic Pain': Duloxetine (SNRI), Amitriptyline ('Antimuscarinic action'); Peripheral Neuropathy LO11 (Wk2 packet p.60). Antidepressant use is standard Step 1", "distractor_explanations": {"A": "Amitriptyline (a TCA) treats both neuropathic pain and depression, but it is strongly anticholinergic and would worsen his urinary retention from BPH. That detail is the reason it is wrong here.", "B": "Pregabalin (alpha-2-delta ligand) treats painful diabetic neuropathy but has no antidepressant effect.", "C": "Carbamazepine is first-line for trigeminal neuralgia, not diabetic neuropathy, and it doesn't treat depression.", "E": "Topical capsaicin depletes substance P through TRPV1 and helps localized pain only. It does nothing for depression."}}, {"id": "mk1-q37", "n": 37, "part": 1, "title": null, "stem": "A 72-year-old woman is given IV hydromorphone after hip surgery. Two hours later she is hard to arouse, with a respiratory rate of 6/min and pinpoint pupils. Which drug should be given?", "options": [{"letter": "A", "text": "Naltrexone"}, {"letter": "B", "text": "Buprenorphine"}, {"letter": "C", "text": "Naloxone"}, {"letter": "D", "text": "Flumazenil"}, {"letter": "E", "text": "Methadone"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source",
