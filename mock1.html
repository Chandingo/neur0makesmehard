"image": null, "image_needed": false, "week": 2, "session_guess": "Pain Medications", "topic": "Pain Medications", "note": null, "blueprint_category": "Pain Medications", "learning_objective": "Pain Medications LO1-2", "difficulty": 2, "format": "vignette", "drug_item": "indication", "laterality": false, "thursday_11_5": false, "explanation": "Naloxone is the short-acting opioid receptor blocker used for opioid overdose; naltrexone is longer acting (dependence, cravings) and flumazenil reverses benzodiazepines.", "source": "Drug list, Exam 1 'Medications Used for Pain': Naloxone row ('Not for Pain BUT used for Opioid overdose'; 'Blocks Opioid Receptors, Short acting'), Naltrexone row", "distractor_explanations": {"A": "Naltrexone is a long-acting oral antagonist used for alcohol or opioid dependence, not for acute overdose.", "B": "Buprenorphine is a partial agonist and would not reverse respiratory depression quickly.", "D": "Flumazenil reverses benzodiazepines, not opioids.", "E": "Methadone is a full mu agonist and would worsen the overdose."}}, {"id": "mk1-q38", "n": 38, "part": 1, "title": null, "stem": "The periaqueductal gray reduces pain mainly by activating neurons in which region, which then project to the dorsal horn?", "options": [{"letter": "A", "text": "Ventral posterolateral nucleus of the thalamus"}, {"letter": "B", "text": "Rostral ventromedial medulla"}, {"letter": "C", "text": "Superior colliculus"}, {"letter": "D", "text": "Primary somatosensory cortex"}, {"letter": "E", "text": "Anterior cingulate cortex"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Pain & Pain pathways", "topic": "Pain & Pain pathways", "note": null, "blueprint_category": "Pain & Pain pathways", "learning_objective": "Pain & Pain Pathways LO6", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Descending control: PAG -> rostral ventromedial medulla (RVM) -> dorsal horn of the spinal cord.", "source": "Wk2 packet p.20; Pain & Pain Pathways slides 48-50", "distractor_explanations": {"A": "The VPL nucleus relays ascending body sensation to the cortex. It is part of the ascending pathway, not descending pain control.", "C": "The superior colliculus handles visual orienting (and gives rise to the tectospinal tract). It isn't part of the descending pain pathway.", "D": "Primary somatosensory cortex tells where pain is and how intense it is. It isn't the PAG's relay to the dorsal horn.", "E": "The anterior cingulate cortex handles how unpleasant pain feels. It projects to the PAG (upstream), not the other way round."}}, {"id": "mk1-q39", "n": 39, "part": 1, "title": null, "stem": "A 59-year-old man has had left-sided weakness and slurred speech for 90 minutes. A noncontrast head CT shows no hemorrhage and no clear abnormality. Which study is most sensitive for confirming an acute ischemic infarct?", "options": [{"letter": "A", "text": "MRI with diffusion-weighted imaging"}, {"letter": "B", "text": "Repeat noncontrast CT in 1 hour"}, {"letter": "C", "text": "T1-weighted MRI without contrast"}, {"letter": "D", "text": "Contrast-enhanced CT"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Neuroimaging Tutorial", "topic": "Neuroimaging Tutorial", "note": null, "blueprint_category": "Neuroimaging Tutorial", "learning_objective": "Neuroimaging Tutorial LO4", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Acute infarcts restrict diffusion and are bright on DWI within minutes; noncontrast CT, chosen first to exclude bleeding, is often normal early.", "source": "Imaging Techniques slide 202 ('Acute ischemic stroke ... bright, hyperintense on DWI'); Wk1 packet p.113, p.216 (Tutorial LO4)", "distractor_explanations": {"B": "CT stays insensitive to early ischemia; waiting an hour does not reliably show it.", "C": "T1 changes appear later; T1 is not the most sensitive sequence for acute infarction.", "D": "Contrast CT is not the test for confirming early infarction; contrast enhancement appears days later."}}, {"id": "mk1-q40", "n": 40, "part": 1, "title": null, "stem": "When no danger is present, the amygdala circuit that would otherwise trigger a fear response is held in check mainly by:", "options": [{"letter": "A", "text": "Glutamatergic input from the hippocampus"}, {"letter": "B", "text": "GABAergic inhibitory neurons recruited by the prefrontal cortex"}, {"letter": "C", "text": "Dopamine from the ventral tegmental area"}, {"letter": "D", "text": "Norepinephrine from the locus coeruleus"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Limbic System", "topic": "Limbic System", "note": null, "blueprint_category": "Limbic System", "learning_objective": "Limbic LO3", "difficulty": 2, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Inhibitory GABAergic neurons gate transfer from the basolateral to the central nuclei, and the prefrontal cortex closes this gate when there is no danger.", "source": "Limbic System slides 18-19", "distractor_explanations": {"A": "Hippocampal glutamatergic input supplies context and tends to excite the amygdala rather than hold it back.", "C": "VTA dopamine is linked to reward and motivation, not to gating amygdala output.", "D": "Locus coeruleus norepinephrine raises arousal and supports fear responses."}}, {"id": "mk1-q41", "n": 41, "part": 1, "title": null, "stem": "A 31-year-old man with a complete T3 spinal cord injury from 2 years ago suddenly develops a pounding headache, with flushing and sweating above the level of injury. His blood pressure is 210/110 mm Hg and heart rate is 46/min. His urinary catheter is kinked. Which mechanism explains his heart rate?", "options": [{"letter": "A", "text": "Spinal sympathetic neurons below the lesion directly slow the SA node"}, {"letter": "B", "text": "All parasympathetic input to the heart was lost with the injury"}, {"letter": "C", "text": "Adrenal epinephrine acts on cardiac beta-1 receptors"}, {"letter": "D", "text": "Bladder afferents directly inhibit cardiac sympathetic neurons in the brainstem"}, {"letter": "E", "text": "Brainstem centers sense the high pressure and increase vagal output to the heart"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Autonomics", "topic": "Autonomics", "note": null, "blueprint_category": "Autonomics", "learning_objective": "Autonomic LO6", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Autonomic dysreflexia: input below the lesion triggers massive sympathetic vasoconstriction; the brainstem cannot inhibit the cord sympathetics, so all it can do is slow the heart through the vagus.", "source": "Autonomic & Enteric slide 7; Wk3 packet p.15 ('all one can do is get the vagus to slow the heart down')", "distractor_explanations": {"A": "Spinal sympathetic neurons speed the heart; they do not slow the SA node.", "B": "Vagal (parasympathetic) supply leaves the brainstem, above the injury, so it is intact.", "C": "Epinephrine on beta-1 receptors would speed the heart, not slow it.", "D": "Bladder afferents enter the cord below the lesion and cannot reach the brainstem."}}, {"id": "mk1-q42", "n": 42, "part": 1, "title": null, "stem": "A 74-year-old woman with atrial fibrillation suddenly loses vision in both eyes. Over the next days she cannot remember anything new for more than a few minutes, though she recalls events from years ago. MRI shows infarcts in both occipital lobes and both medial temporal lobes. Occlusion at which site most likely caused this?", "options": [{"letter": "A", "text": "Left middle cerebral artery"}, {"letter": "B", "text": "Anterior communicating artery"}, {"letter": "C", "text": "Distal (top of the) basilar artery"}, {"letter": "D", "text": "Right internal carotid artery"}, {"letter": "E", "text": "Left anterior choroidal artery"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Memory Formation", "topic": "Memory Formation", "note": null, "blueprint_category": "Memory Formation", "learning_objective": "Learning & Memory LO3-4", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The hippocampus and occipital cortex are both PCA territory; an embolus at the basilar tip cuts off both PCAs, giving cortical blindness plus anterograde amnesia.", "source": "Wk3 packet p.62 ('The Blood Supply of the hippocampus is from the posterior cerebral artery'); Wk1 packet p.122 (PCA from the basilar tip -> occipital and inferomedial temporal)", "distractor_explanations": {"A": "A left MCA stroke hits the lateral cortex: aphasia and right face and arm weakness. It is one-sided and spares the occipital and medial temporal lobes.", "B": "The anterior communicating artery is an aneurysm site. ACA-territory damage affects the medial frontal lobes (leg weakness, abulia), not the occipital lobes.", "D": "A right ICA occlusion damages right MCA and ACA territory, and its ophthalmic branch can cause one-eye blindness. It can't hit both occipital lobes and both medial temporal lobes.", "E": "The anterior choroidal supplies one side's posterior limb of the internal capsule, lateral geniculate and part of the hippocampus. That gives one-sided weakness and field loss, not bilateral findings."}}, {"id": "mk1-q43", "n": 43, "part": 1, "title": null, "stem": "A 34-year-old woman has migraine without aura on about 8 days a month. She also has newly diagnosed hypertension and does not have asthma. She wants a daily oral medication to prevent her headaches that could also help her blood pressure. Which medication is most appropriate?", "options": [{"letter": "A", "text": "Sumatriptan"}, {"letter": "B", "text": "Topiramate"}, {"letter": "C", "text": "Amitriptyline"}, {"letter": "D", "text": "Rimegepant"}, {"letter": "E", "text": "Propranolol"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Headaches", "topic": "Headaches", "note": null, "blueprint_category": "Headaches", "learning_objective": "Headache LO6", "difficulty": 2, "format": "vignette", "drug_item": "indication", "laterality": false, "thursday_11_5": false, "explanation": "Propranolol (nonselective beta blocker) is a listed migraine prophylactic and lowers blood pressure; sumatriptan is abortive, topiramate and rimegepant prevent migraine without treating hypertension, amitriptyline is listed for tension-type prophylaxis.", "source": "Drug list, Exam 1 'Migraine Medications': Propranolol row ('Nonselective antagonist for the b1 and b2 adrenergic receptors'; side effects incl. hypotension, bronchospasm), Topiramate (listed under 'Prophylactic agents for migraine'), Rimegepant ('can be used prophylactically'), Amitriptyline (tension prophylaxis) rows; Headache LO6. Propranolol's migraine-prophylaxis use and antihypertensive effect = standard Step 1", "distractor_explanations": {"A": "Sumatriptan treats attacks; it is not a daily preventive and is a vasoconstrictor.", "B": "Topiramate prevents migraine but does not treat hypertension.", "C": "Amitriptyline is listed for tension-type headache prophylaxis and does not lower blood pressure.", "D": "Rimegepant can prevent migraine but has no blood pressure benefit."}}, {"id": "mk1-q44", "n": 44, "part": 1, "title": null, "stem": "A 52-year-old woman has hoarseness and difficulty swallowing. Touching the left side of her posterior pharynx produces no gag, and she cannot shrug her left shoulder against resistance. Her tongue protrudes in the midline. A tumor is most likely compressing which opening?", "options": [{"letter": "A", "text": "Left hypoglossal canal"}, {"letter": "B", "text": "Left internal acoustic meatus"}, {"letter": "C", "text": "Foramen magnum"}, {"letter": "D", "text": "Left jugular foramen"}, {"letter": "E", "text": "Left foramen ovale"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Protecting the Brain", "topic": "Protecting the Brain", "note": null, "blueprint_category": "Protecting the Brain", "learning_objective": "Protecting the Brain LO8", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": true, "thursday_11_5": false, "explanation": "CN IX, X and XI all leave through the jugular foramen; a midline tongue shows CN XII (hypoglossal canal) is spared.", "source": "CN Modules slides 64, 67, 91 (IX and XI via the jugular foramen); ILM Anatomy of the Face slide 18; Wk1 packet p.90 (LO8)", "distractor_explanations": {"A": "The hypoglossal canal carries CN XII; her tongue is midline.", "B": "The internal acoustic meatus carries CN VII and VIII, which would cause facial weakness or hearing loss.", "C": "The foramen magnum carries the medulla, vertebral arteries and the ascending part of CN XI, not IX and X together with XI.", "E": "Foramen ovale carries V3, which would affect chewing and jaw sensation."}}, {"id": "mk1-q45", "n": 45, "part": 1, "title": null, "stem": "A 24-year-old man fractures the body of his left mandible in a fall, and the fracture line runs through the mandibular canal. He reports numbness of his left lower lip and chin. Which additional finding is most likely?", "options": [{"letter": "A", "text": "Numbness of the left lower teeth"}, {"letter": "B", "text": "Weakness of the left masseter"}, {"letter": "C", "text": "Loss of taste on the left anterior tongue"}, {"letter": "D", "text": "Numbness of the left upper lip"}, {"letter": "E", "text": "Weakness of the left buccinator"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Face Anatomy", "topic": "Face Anatomy", "note": null, "blueprint_category": "Face Anatomy", "learning_objective": "Face ILM LO6", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The inferior alveolar nerve (V3) runs in the mandibular canal, supplies the lower teeth and ends as the mental nerve (lip and chin); motor and taste fibers are not in the canal.", "source": "Wk1 packet p.51 (V3 branches: inferior alveolar, mental); Face ILM LO6", "distractor_explanations": {"B": "The nerve to the masseter is a motor branch of V3 that passes through the mandibular notch. It doesn't run in the mandibular canal.", "C": "Taste from the anterior tongue rides the chorda tympani (VII) on the lingual nerve, which runs on the inside of the mandible, not in the canal.", "D": "The upper lip is supplied by the infraorbital nerve (V2), which is nowhere near the mandible.", "E": "The buccinator is moved by the buccal branch of the facial nerve (VII). The buccal nerve of V3 is only sensory to the cheek, and neither runs in the canal."}}, {"id": "mk1-q46", "n": 46, "part": 1, "title": null, "stem": "Compared with peripheral axons, injured CNS axons regenerate poorly mainly because of:", "options": [{"letter": "A", "text": "Absence of Wallerian degeneration in the CNS"}, {"letter": "B", "text": "Lack of microtubules in CNS axons"}, {"letter": "C", "text": "Inhibitory myelin proteins from oligodendrocytes and an astrocytic glial scar"}, {"letter": "D", "text": "Excess Schwann cell proliferation in the CNS"}, {"letter": "E", "text": "Faster clearance of myelin debris by CNS microglia"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Axon Repair", "topic": "Axon Repair", "note": null, "blueprint_category": "Axon Repair", "learning_objective": "Axon Repair LO2", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "CNS regrowth is blocked by oligodendrocyte inhibitors (e.g., Nogo), a glial scar and scarce trophic support; PNS regrowth is driven by Schwann cells.", "source": "Wk2 packet p.51 (glial scar, scarce trophic factors, slow debris removal); Histology of the CNS 1 slide 42 ('Regrowth inhibited (NOGO protein)')", "distractor_explanations": {"A": "Wallerian degeneration does happen in the CNS. It is just slower, and the leftover myelin debris is cleared poorly.", "B": "CNS axons have plenty of microtubules; they need them for axonal transport.", "D": "Schwann cells are PNS cells. Their absence from the CNS (not an excess) is part of why CNS axons don't regrow.", "E": "This is backwards. CNS myelin debris is cleared slowly, so inhibitory debris lingers. In the PNS, macrophages and Schwann cells clear it fast."}}, {"id": "mk1-q47", "n": 47, "part": 1, "title": null, "stem": "A 66-year-old woman has 3 years of slowly progressive numbness and tingling in both feet that now reaches her mid-shins, with reduced ankle reflexes. Which underlying cause is most common for this pattern in developed countries?", "options": [{"letter": "A", "text": "Vitamin B12 deficiency"}, {"letter": "B", "text": "Diabetes mellitus"}, {"letter": "C", "text": "Hypothyroidism"}, {"letter": "D", "text": "Lyme disease"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Peripheral Neuropathies", "topic": "Peripheral Neuropathies", "note": null, "blueprint_category": "Peripheral Neuropathies", "learning_objective": "Peripheral Neuropathy LO1, LO9", "difficulty": 1, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "A distal, symmetric, length-dependent polyneuropathy; diabetes is the most common cause in developed countries.", "source": "Wk2 packet p.64 ('Diabetes Mellitus: the most common cause of polyneuropathy in developed countries') and p.70", "distractor_explanations": {"A": "B12 deficiency can cause this pattern but is much less common than diabetes.", "C": "Hypothyroidism is an uncommon cause of neuropathy.", "D": "Lyme disease causes cranial neuropathies and radiculopathies more than a slow stocking pattern."}}, {"id": "mk1-q48", "n": 48, "part": 1, "title": null, "stem": "A 15-year-old girl has 3 years of worsening gait ataxia, loss of vibration and position sense in her feet, absent ankle reflexes, and high-arched feet. Her parents are unaffected. Which mechanism underlies her disease?", "options": [{"letter": "A", "text": "A CAG repeat expansion in the huntingtin gene"}, {"letter": "B", "text": "Misfolded prion protein converting normal prion protein"}, {"letter": "C", "text": "Autoimmune demyelination of the dorsal columns"}, {"letter": "D", "text": "Dietary deficiency of vitamin B12"}, {"letter": "E", "text": "A GAA trinucleotide repeat expansion that reduces frataxin, a mitochondrial protein"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Neuropathology of Neurodegenerative Diseases Lecture", "topic": "Neuropathology of Neurodegenerative Diseases Lecture", "note": null, "blueprint_category": "Neuropathology of Neurodegenerative Diseases Lecture", "learning_objective": "Neuropathology LO9-10", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Friedreich ataxia: autosomal recessive GAA expansion in the frataxin gene impairs mitochondrial function (spinocerebellar degeneration).", "source": "Wk3 packet p.126; Neuropathology of Neurodegenerative Disease slide 26", "distractor_explanations": {"A": "CAG repeats in huntingtin cause Huntington disease (chorea, dominant inheritance, adult onset).", "B": "Prion disease causes rapidly progressive dementia with myoclonus.", "C": "MS-type demyelination does not cause pes cavus or a slowly progressive recessive picture from childhood.", "D": "B12 deficiency affects dorsal columns too, but it does not cause high-arched feet or a familial early-onset course."}}, {"id": "mk1-q49", "n": 49, "part": 1, "title": null, "stem": "A researcher blocks fast axonal transport in a cultured neuron for 24 hours while the axon terminals remain intact. Release of which transmitter would be expected to fall first?", "options": [{"letter": "A", "text": "Substance P"}, {"letter": "B", "text": "Glutamate"}, {"letter": "C", "text": "GABA"}, {"letter": "D", "text": "Acetylcholine"}, {"letter": "E", "text": "Glycine"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Synaptic transmission and neurotransmitters", "topic": "Synaptic transmission and neurotransmitters", "note": null, "blueprint_category": "Synaptic transmission and neurotransmitters", "learning_objective": "Synaptic Transmission LO5", "difficulty": 2, "format": "research scenario", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Peptide transmitters are made in the cell body, packaged in large vesicles and shipped down the axon; small-molecule transmitters are synthesized and recycled in the terminal.", "source": "Wk3 packet p.30 ('peptide neurotransmitters are usually synthesized in the cell body ... and transported'); Synaptic Transmission slide 11", "distractor_explanations": {"B": "Glutamate is made and recycled right in the terminal (the glutamate-glutamine cycle with astrocytes), so it doesn't need fast transport from the cell body.", "C": "GABA is made in the terminal from glutamate by GAD and is taken back up and reused.", "D": "Acetylcholine is made in the terminal by choline acetyltransferase from recycled choline and acetyl-CoA. The enzyme travels by slow transport, so blocking fast transport for 24 hours doesn't stop ACh release.", "E": "Glycine is made and recycled in the terminal and taken back up by glycine transporters."}}, {"id": "mk1-q50", "n": 50, "part": 1, "title": null, "stem": "A 44-year-old man who restores old houses has crampy abdominal pain and cannot extend his right wrist or fingers. He is also anemic. Which exposure most likely explains his neuropathy?", "options": [{"letter": "A", "text": "Arsenic"}, {"letter": "B", "text": "Chronic alcohol use"}, {"letter": "C", "text": "Vitamin B6 excess"}, {"letter": "D", "text": "Lead"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Peripheral Neuropathies", "topic": "Peripheral Neuropathies", "note": null, "blueprint_category": "Peripheral Neuropathies", "learning_objective": "Peripheral Neuropathy LO4", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Lead inhibits heme synthesis (anemia) and causes wrist or foot drop with abdominal spasms.", "source": "Peripheral Neuropathy slide 31 ('Lead: inhibits heme synthesis; wrist drop/foot drop; abdominal spasms'); Wk2 packet p.66", "distractor_explanations": {"A": "Arsenic causes a painful sensory-predominant neuropathy with skin changes and Mees lines.", "B": "Alcohol causes a length-dependent sensory neuropathy, not wrist drop with anemia and abdominal cramps.", "C": "B6 excess causes a sensory neuronopathy, not a motor wrist drop."}}, {"id": "mk1-q51", "n": 51, "part": 1, "title": null, "stem": "A 45-year-old woman has been bumping into door frames on both sides. Visual field testing shows loss of the temporal half of the field in each eye. MRI shows a mass expanding upward from the sella turcica. Which fibers are being compressed?", "options": [{"letter": "A", "text": "Uncrossed fibers from the temporal half of each retina"}, {"letter": "B", "text": "All fibers of the right optic tract"}, {"letter": "C", "text": "All fibers of the left optic nerve"}, {"letter": "D", "text": "Crossing fibers from the nasal half of each retina"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Hypothalamus", "topic": "Hypothalamus", "note": null, "blueprint_category": "Hypothalamus", "learning_objective": "Hypothalamus LO3", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "A pituitary adenoma presses on the middle of the chiasm, interrupting crossing nasal-retina fibers that carry the temporal fields (bitemporal hemianopia).", "source": "Wk3 packet p.5", "distractor_explanations": {"A": "Uncrossed fibers from the temporal retina carry the nasal field. Pressing on the side of the chiasm (e.g., an ICA aneurysm) causes nasal field loss in that eye, not bitemporal loss.", "B": "A right optic tract lesion causes a left homonymous hemianopia, meaning the same half of the field is lost in both eyes, not the temporal half of each.", "C": "A left optic nerve lesion blinds the left eye only."}}, {"id": "mk1-q52", "n": 52, "part": 1, "title": null, "stem": "Which cranial nerve carries taste sensation from the posterior one-third of the tongue?", "options": [{"letter": "A", "text": "Facial nerve (CN VII)"}, {"letter": "B", "text": "Glossopharyngeal nerve (CN IX)"}, {"letter": "C", "text": "Vagus nerve (CN X)"}, {"letter": "D", "text": "Hypoglossal nerve (CN XII)"}, {"letter": "E", "text": "Mandibular division of the trigeminal nerve (CN V3)"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Cranial Nerves Module", "topic": "Cranial Nerves Module", "note": null, "blueprint_category": "Cranial Nerves Module", "learning_objective": "CN Modules LO3", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "CN IX carries taste and general sensation from the posterior 1/3; VII (chorda tympani) carries anterior-2/3 taste, V3 anterior-2/3 general sensation, XII is motor only.", "source": "Wk1 packet p.152 (CN Modules LO3); CN Modules slide 62 ('Taste to posterior 1/3 of tongue')", "distractor_explanations": {"A": "CN VII (chorda tympani) carries taste from the anterior two-thirds.", "C": "CN X carries taste from the epiglottis region, not the posterior third of the tongue.", "D": "CN XII is purely motor to the tongue.", "E": "V3 (lingual nerve) carries general sensation from the anterior two-thirds, not taste."}}, {"id": "mk1-q53", "n": 53, "part": 1, "title": null, "stem": "After a right temporal bone fracture, a 33-year-old woman notices that her right eye is dry. Touching either cornea makes both eyes blink, but the right eye does not tear. Facial movements and taste on the anterior tongue are normal on both sides. The lesion most likely involves the:", "options": [{"letter": "A", "text": "Right ophthalmic nerve (V1)"}, {"letter": "B", "text": "Right facial nerve at the stylomastoid foramen"}, {"letter": "C", "text": "Right greater petrosal nerve"}, {"letter": "D", "text": "Right chorda tympani"}, {"letter": "E", "text": "Right lesser petrosal nerve"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Cranial Nerve Reflexes", "topic": "Cranial Nerve Reflexes", "note": null, "blueprint_category": "Cranial Nerve Reflexes", "learning_objective": "CN Reflexes LO1-3", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": true, "thursday_11_5": false, "explanation": "Lacrimal reflex: V1 in, VII out via the greater petrosal nerve to the pterygopalatine ganglion; normal blinks clear V1 and VII motor, normal taste clears the chorda tympani, and the lesser petrosal serves the parotid.", "source": "Reflex Arc & Cranial Reflexes (Gothard 2026) slides 15-19 (lacrimal reflex: V1 in, VII out via greater petrosal n.); Wk2 packet p.54-55", "distractor_explanations": {"A": "V1 is the afferent limb; both eyes blink to touching the right cornea, so V1 works.", "B": "A lesion at the stylomastoid foramen would weaken the face but spare tearing, which branches off earlier.", "D": "The chorda tympani carries taste and submandibular secretion; taste is normal.", "E": "The lesser petrosal (CN IX) supplies the parotid, not the lacrimal gland."}}, {"id": "mk1-q54", "n": 54, "part": 1, "title": null, "stem": "At the resting membrane potential, what prevents current through NMDA receptor channels even when glutamate is bound?", "options": [{"letter": "A", "text": "Mg2+ sitting in the channel pore"}, {"letter": "B", "text": "Ca2+ bound to the glycine site"}, {"letter": "C", "text": "Phosphorylation by CaMKII"}, {"letter": "D", "text": "Closure of nearby AMPA receptors"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Memory Formation", "topic": "Memory Formation", "note": null, "blueprint_category": "Memory Formation", "learning_objective": "Learning & Memory LO12-13", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "At rest Mg2+ blocks the NMDA pore; depolarization (from AMPA activity) expels it so Ca2+ can enter, which triggers LTP.", "source": "Wk3 packet p.69-70", "distractor_explanations": {"B": "Glycine (or D-serine) is a co-agonist that is needed to open the channel; calcium at that site is not the block.", "C": "CaMKII is activated downstream of NMDA calcium entry; it does not block the pore.", "D": "AMPA receptor activity helps relieve the block by depolarizing the membrane; closed AMPA receptors are not the blocking mechanism."}}, {"id": "mk1-q55", "n": 55, "part": 1, "title": null, "stem": "In an adult, the conus medullaris usually lies at which vertebral level?", "options": [{"letter": "A", "text": "T10-T11"}, {"letter": "B", "text": "L1-L2"}, {"letter": "C", "text": "L3-L4"}, {"letter": "D", "text": "L5-S1"}, {"letter": "E", "text": "S2-S3"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Spinal Cord", "topic": "Spinal Cord", "note": null, "blueprint_category": "Spinal Cord", "learning_objective": "Spinal Cord LO1, LO5", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The adult cord ends at about L1-L2 (near L3 at birth), with the cauda equina below.", "source": "Wk2 packet p.124 and p.128; Wk1 packet p.197", "distractor_explanations": {"A": "This is too high; the cord continues below T11.", "C": "About L3 is the level at birth, not in adults.", "D": "Only the cauda equina and dural sac lie at this level.", "E": "The dural sac ends around S2; the cord ends far above it."}}, {"id": "mk1-q56", "n": 56, "part": 1, "title": null, "stem": "Six weeks after a deep burn on her forearm has healed, a 35-year-old woman says the light touch of her sleeve on the healed skin is painful. Which mechanism best explains this?", "options": [{"letter": "A", "text": "A-beta fibers are activating inhibitory interneurons in the dorsal horn"}, {"letter": "B", "text": "The periaqueductal gray is releasing more endogenous opioids"}, {"letter": "C", "text": "Nociceptor TRP channels have been lost from the healed skin"}, {"letter": "D", "text": "The dorsal columns serving that dermatome have demyelinated"}, {"letter": "E", "text": "Dorsal horn neurons have become hypersensitive, so A-beta touch input now drives pain pathways"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Pain & Pain pathways", "topic": "Pain & Pain pathways", "note": null, "blueprint_category": "Pain & Pain pathways", "learning_objective": "Pain & Pain Pathways LO7", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "This is allodynia from central sensitization: after repeated nociceptor input, neurons that normally process A-beta touch become coupled to pain pathways.", "source": "Wk2 packet p.21-22 (central sensitization; allodynia); Pain & Pain Pathways slide 58", "distractor_explanations": {"A": "A-beta activation of inhibitory interneurons is the gate-control mechanism that reduces pain, as with rubbing a bumped elbow.", "B": "More endogenous opioids would reduce pain, not create it.", "C": "Losing nociceptor channels would reduce pain sensitivity.", "D": "Dorsal column damage would cause numbness to touch and vibration, not pain from touch."}}, {"id": "mk1-q57", "n": 57, "part": 1, "title": null, "stem": "A 35-year-old man with a known Chiari I malformation notices painless burns on both forearms from cooking. He has lost pain and temperature sensation over both shoulders, arms, and forearms, but light touch and vibration are normal there and in his legs. Damage to which fibers explains this pattern?", "options": [{"letter": "A", "text": "Spinothalamic fibers crossing in the anterior white commissure"}, {"letter": "B", "text": "Dorsal column fibers in the fasciculus cuneatus"}, {"letter": "C", "text": "Lateral corticospinal tract fibers"}, {"letter": "D", "text": "Dorsal root ganglion neurons at C5-C6"}, {"letter": "E", "text": "Spinocerebellar fibers in the lateral funiculus"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Spinal Syndromes", "topic": "Spinal Syndromes", "note": null, "blueprint_category": "Spinal Syndromes", "learning_objective": "Spinal Syndromes LO1, LO3", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "A central cord lesion (syrinx) cuts pain and temperature fibers as they cross ventral to the central canal, giving bilateral cape ('suspended') loss with spared dorsal columns.", "source": "Spinal Syndromes slide 23 (central cord: anterolateral pathways, cape-like loss at the level of injury); Wk2 packet p.144 (suspended sensory loss, syringomyelia); Wk1 packet p.193 (Chiari -> cape-like paresthesia)", "distractor_explanations": {"B": "Dorsal column damage would impair touch and vibration, which are normal.", "C": "Corticospinal damage would cause weakness and UMN signs, not sensory loss.", "D": "A DRG lesion would cause loss of all sensory modalities in that dermatome, not just pain and temperature.", "E": "Spinocerebellar fibers carry unconscious proprioception; their loss causes ataxia, not burns."}}, {"id": "mk1-q58", "n": 58, "part": 1, "title": null, "stem": "A tumor arises from the glial cells that line the ventricles and the central canal of the spinal cord. Besides lining these spaces, the normal counterparts of these cells:", "options": [{"letter": "A", "text": "Form myelin segments around several CNS axons"}, {"letter": "B", "text": "Phagocytose debris as the resident immune cells"}, {"letter": "C", "text": "Form end-feet that contribute to the blood-brain barrier"}, {"letter": "D", "text": "Produce CSF as the modified epithelium of the choroid plexus"}, {"letter": "E", "text": "Myelinate a single peripheral axon"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Histology of CNS 1: Neurons and Glia", "topic": "Histology of CNS 1: Neurons and Glia", "note": null, "blueprint_category": "Histology of CNS 1: Neurons and Glia", "learning_objective": "Histology CNS 1 LO5-6", "difficulty": 2, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Ependymal cells line the ventricles and central canal and form the CSF-secreting choroid plexus epithelium; the distractors describe oligodendrocytes, microglia, astrocytes and Schwann cells.", "source": "Wk1 packet p.186, p.188 (ependymal cells); Histology of the CNS 1 slides 48, 51 (ependymoma)", "distractor_explanations": {"A": "Forming myelin around several CNS axons is the oligodendrocyte.", "B": "Phagocytosing debris as the resident immune cell is the microglia (mesoderm/yolk-sac origin, not neuroectoderm).", "C": "End-feet that contribute to the blood-brain barrier belong to astrocytes.", "E": "Myelinating a single peripheral axon is the Schwann cell (neural crest, PNS)."}}, {"id": "mk1-q59", "n": 59, "part": 1, "title": null, "stem": "During the relative refractory period, a second action potential can be triggered only by a stronger-than-normal stimulus because:", "options": [{"letter": "A", "text": "All voltage-gated Na+ channels are still inactivated"}, {"letter": "B", "text": "Voltage-gated K+ channels have already closed"}, {"letter": "C", "text": "Only some voltage-gated Na+ channels have recovered from inactivation"}, {"letter": "D", "text": "The Na+/K+ pump has stopped working"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Action Potentials", "topic": "Action Potentials", "note": null, "blueprint_category": "Action Potentials", "learning_objective": "AP LO7-8", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Absolute refractory = too many Na+ channels inactivated; relative refractory = just enough have reset, so an unusually strong input is needed.", "source": "Wk3 packet p.48", "distractor_explanations": {"A": "If all Na+ channels were still inactivated, no stimulus could trigger a spike; that is the absolute refractory period.", "B": "K+ channels are still open in the relative refractory period, which adds to the need for a stronger stimulus.", "D": "The pump keeps running and is not responsible for refractory periods."}}, {"id": "mk1-q60", "n": 60, "part": 1, "title": null, "stem": "A 31-year-old woman with relapsing-remitting multiple sclerosis begins a monthly IV humanized monoclonal antibody that binds alpha-4 integrin and keeps immune cells from crossing the blood-brain barrier. Which serious adverse effect should her physician counsel her about most?", "options": [{"letter": "A", "text": "Reactivation of hepatitis B"}, {"letter": "B", "text": "Necrosis at the injection site"}, {"letter": "C", "text": "Methemoglobinemia"}, {"letter": "D", "text": "Stevens-Johnson syndrome"}, {"letter": "E", "text": "Progressive multifocal leukoencephalopathy"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Multiple Sclerosis", "topic": "Multiple Sclerosis", "note": null, "blueprint_category": "Multiple Sclerosis", "learning_objective": "MS LO5", "difficulty": 3, "format": "vignette", "drug_item": "side effect", "laterality": false, "thursday_11_5": false, "explanation": "The drug is natalizumab (anti-alpha4-integrin), which carries PML risk; hepatitis B reactivation is rituximab and injection-site necrosis is interferon beta-1a.", "source": "Drug list, Exam 1 'Medications for Multiple Sclerosis': Natalizumab row (side effects: 'Progressive multifocal leukoencephalopathy'); MS slide 58", "distractor_explanations": {"A": "Hepatitis B reactivation is the boxed warning for anti-CD20 antibodies (rituximab, ocrelizumab), not natalizumab.", "B": "Injection-site reactions and necrosis come with subcutaneous injectables such as interferon beta and glatiramer acetate. Natalizumab is given IV.", "C": "Methemoglobinemia comes from dapsone, topical anesthetics like benzocaine, and nitrites, not MS antibodies.", "D": "Stevens-Johnson syndrome is classically from lamotrigine, carbamazepine and sulfonamides, not natalizumab."}}, {"id": "mk1-q61", "n": 61, "part": 1, "title": null, "stem": "A 66-year-old man with a large right frontal glioma becomes increasingly drowsy. MRI shows the right cingulate gyrus pushed beneath the free edge of the falx cerebri. This type of herniation is most notable for its risk of:", "options": [{"letter": "A", "text": "Compressing the oculomotor nerve, causing a fixed dilated pupil"}, {"letter": "B", "text": "Tearing additional blood vessels, causing subarachnoid or subdural hemorrhage"}, {"letter": "C", "text": "Compressing the medulla, causing respiratory arrest"}, {"letter": "D", "text": "Obstructing the cerebral aqueduct"}, {"letter": "E", "text": "Compressing the optic chiasm"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Protecting the Brain", "topic": "Protecting the Brain", "note": null, "blueprint_category": "Protecting the Brain", "learning_objective": "Protecting the Brain LO5", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Slide 43: subfalcine herniation has a poorly defined presentation and is notable because it tears additional vessels (SAH/SDH); CN III compression is uncal and medullary compression is tonsillar. (Standard Step 1 teaching adds ACA compression -> contralateral leg weakness; not offered here.)", "source": "Protecting & Supplying the Brain slide 43; Wk1 packet p.90 (LO5)", "distractor_explanations": {"A": "Oculomotor nerve compression with a fixed dilated pupil is the classic sign of uncal (transtentorial) herniation, not subfalcine.", "C": "Medullary compression with respiratory arrest comes from tonsillar herniation through the foramen magnum.", "D": "Aqueduct obstruction comes with central (downward or upward) brainstem herniation or posterior fossa masses, not the cingulate gyrus sliding under the falx.", "E": "The optic chiasm is compressed by sellar masses (pituitary adenoma, craniopharyngioma), not by herniation under the falx."}}, {"id": "mk1-q62", "n": 62, "part": 1, "title": null, "stem": "Which mechanoreceptor responds best to high-frequency vibration and adapts rapidly?", "options": [{"letter": "A", "text": "Meissner corpuscle"}, {"letter": "B", "text": "Merkel disc"}, {"letter": "C", "text": "Ruffini ending"}, {"letter": "D", "text": "Pacinian corpuscle"}, {"letter": "E", "text": "Free nerve ending"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Somatosensory Receptors and Tracts", "topic": "Somatosensory Receptors and Tracts", "note": null, "blueprint_category": "Somatosensory Receptors and Tracts", "learning_objective": "Sensory Receptors LO1", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Pacinian corpuscles are deep, rapidly adapting vibration receptors; Meissner = low-frequency flutter and light touch, Merkel = sustained pressure and texture, Ruffini = stretch.", "source": "Sensory Receptors & Pathways slides 11-13; Wk2 packet p.1-3 (LO1)", "distractor_explanations": {"A": "Meissner corpuscles do adapt rapidly, but they respond to low-frequency flutter and light touch in hairless skin, not high-frequency vibration.", "B": "Merkel discs adapt slowly and signal sustained pressure, texture and shape.", "C": "Ruffini endings adapt slowly and signal skin stretch.", "E": "Free nerve endings carry pain, temperature and crude touch."}}, {"id": "mk1-q63", "n": 63, "part": 1, "title": null, "stem": "A 2-month-old has a small lower jaw, flattened cheekbones, and down-slanting eyes with notched lower eyelids. A hearing test shows bilateral conductive hearing loss. The hearing loss most likely reflects abnormal development of which structures?", "options": [{"letter": "A", "text": "Stapes"}, {"letter": "B", "text": "Cochlea"}, {"letter": "C", "text": "Vestibulocochlear nerve"}, {"letter": "D", "text": "Semicircular canals"}, {"letter": "E", "text": "Malleus and incus"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Face Embryology", "topic": "Face Embryology", "note": null, "blueprint_category": "Face Embryology", "learning_objective": "Facial Embryology LO2, LO6", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "This is Treacher Collins, a first-arch neural crest defect: arch 1 forms the mandible, malleus and incus, so the conductive loss comes from the ossicles; the stapes is arch 2.", "source": "Facial Embryology slide 21 ('Treacher-Collins: microsomia of arch 1 derivatives (ear ossicles, mandible)'); slide 5 arch table (Arch 1: Meckel's cartilage, malleus, incus)", "distractor_explanations": {"A": "The stapes comes from the second arch.", "B": "Cochlear damage causes sensorineural, not conductive, loss.", "C": "Nerve damage causes sensorineural loss.", "D": "The semicircular canals are inner ear (balance) and come from the otic placode."}}, {"id": "mk1-q64", "n": 64, "part": 1, "title": null, "stem": "What is the rate-limiting enzyme in serotonin synthesis?", "options": [{"letter": "A", "text": "Tryptophan hydroxylase"}, {"letter": "B", "text": "Tyrosine hydroxylase"}, {"letter": "C", "text": "Aromatic L-amino acid decarboxylase"}, {"letter": "D", "text": "Choline acetyltransferase"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Synaptic transmission and neurotransmitters", "topic": "Synaptic transmission and neurotransmitters", "note": null, "blueprint_category": "Synaptic transmission and neurotransmitters", "learning_objective": "Synaptic Transmission LO3", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Tryptophan hydroxylase converts tryptophan to 5-OH-tryptophan, the first and rate-limiting step.", "source": "Wk3 packet p.24; Synaptic Transmission slide 5", "distractor_explanations": {"B": "Tyrosine hydroxylase is the rate-limiting enzyme for catecholamines (dopamine, norepinephrine, epinephrine), not serotonin.", "C": "Aromatic L-amino acid decarboxylase does the second step for both serotonin (5-HTP to 5-HT) and dopamine (L-DOPA to dopamine). It isn't rate-limiting.", "D": "Choline acetyltransferase makes acetylcholine."}}, {"id": "mk1-q65", "n": 65, "part": 1, "title": null, "stem": "Which hypothalamic nucleus receives direct retinal input and serves as the master clock for circadian rhythms?", "options": [{"letter": "A", "text": "Supraoptic nucleus"}, {"letter": "B", "text": "Arcuate nucleus"}, {"letter": "C", "text": "Suprachiasmatic nucleus"}, {"letter": "D", "text": "Paraventricular nucleus"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Hypothalamus", "topic": "Hypothalamus", "note": null, "blueprint_category": "Hypothalamus", "learning_objective": "Hypothalamus LO2", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The suprachiasmatic nucleus gets retinohypothalamic input and sets circadian rhythms.", "source": "Wk3 packet p.3", "distractor_explanations": {"A": "The supraoptic nucleus makes ADH (and some oxytocin) and sends it to the posterior pituitary.", "B": "The arcuate nucleus releases hormones such as GnRH and dopamine into the portal system and helps control feeding (POMC and NPY neurons).", "D": "The paraventricular nucleus makes oxytocin and ADH (to the posterior pituitary) plus CRH and TRH (to the portal system), and drives autonomic output."}}, {"id": "mk1-q66", "n": 66, "part": 1, "title": null, "stem": "A 39-year-old man has a deep laceration of the left cheek just in front of the ear that cuts through the parotid gland. Afterward the entire left side of his face, from forehead to neck, is paralyzed. Which function on the left side is most likely preserved?", "options": [{"letter": "A", "text": "Wrinkling of the forehead"}, {"letter": "B", "text": "Puckering of the lips"}, {"letter": "C", "text": "Tensing the skin of the neck"}, {"letter": "D", "text": "Taste from the anterior two-thirds of the tongue"}, {"letter": "E", "text": "Closing the eye in response to corneal touch"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Face Anatomy", "topic": "Face Anatomy", "note": null, "blueprint_category": "Face Anatomy", "learning_objective": "Face ILM LO4, LO6", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Inside the parotid the facial nerve has already split into its terminal motor branches; the chorda tympani (taste) leaves earlier inside the temporal bone, so taste is spared.", "source": "Wk1 packet p.41 (facial nerve lesions); ILM Anatomy of the Face slides 26, 28 (chorda tympani joins the lingual n.)", "distractor_explanations": {"A": "Forehead wrinkling uses the temporal branch of VII, which is cut inside the parotid.", "B": "Puckering the lips (orbicularis oris) uses the buccal and marginal mandibular branches, which are cut.", "C": "The platysma is supplied by the cervical branch, which is cut.", "E": "The corneal reflex needs V1 to sense the touch and VII (temporal/zygomatic branches to orbicularis oculi) to close the eye. The VII side is cut, so the eye won't close."}}, {"id": "mk1-q67", "n": 67, "part": 1, "title": null, "stem": "Status epilepticus is defined as continuous seizure activity lasting at least how long, or recurrent seizures without a return to neurologic baseline?", "options": [{"letter": "A", "text": "30 seconds"}, {"letter": "B", "text": "2 minutes"}, {"letter": "C", "text": "5 minutes"}, {"letter": "D", "text": "15 minutes"}, {"letter": "E", "text": "30 minutes"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Seizures & Epilepsy", "topic": "Seizures & Epilepsy", "note": null, "blueprint_category": "Seizures & Epilepsy", "learning_objective": "Seizures LO4", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": true, "explanation": "Course definition: a seizure longer than 5 minutes, or 2+ seizures without return to baseline.", "source": "Seizures and Epilepsy slides 47, 53; Wk3 packet p.133 (LO4)", "distractor_explanations": {"A": "Most seizures stop on their own within about 30 seconds to 2 minutes. That is a normal seizure, not status.", "B": "Two minutes is still within the usual length of a self-limited seizure.", "D": "Fifteen minutes isn't the cutoff used in any standard definition.", "E": "Thirty minutes is the older definition, and the time after which lasting neuron damage becomes likely. The course uses 5 minutes so treatment starts sooner."}}, {"id": "mk1-q68", "n": 68, "part": 1, "title": null, "stem": "A section of cervical spinal cord from a 45-year-old woman with relapsing episodes of optic neuritis and leg weakness is stained with a myelin stain. Her demyelinating lesions would most likely appear as:", "options": [{"letter": "A", "text": "Pale, unstained patches within the white matter"}, {"letter": "B", "text": "Dark-staining clusters of neuron cell bodies in the gray matter"}, {"letter": "C", "text": "Loss of Nissl substance in ventral horn neurons"}, {"letter": "D", "text": "Thickened perineurium around the ventral roots"}, {"letter": "E", "text": "Onion-bulb whorls around axons"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Histology Lab", "topic": "Histology Lab", "note": null, "blueprint_category": "Histology Lab", "learning_objective": "Histology Lab LO6-7", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "A myelin stain colors intact white matter dark, so MS plaques that have lost myelin stay pale; onion bulbs are a peripheral (Schwann cell) finding.", "source": "Histology of the CNS 2 slides 23-24 (myelin stain shows tracts); Wk1 packet p.209 (Lab LO6-7)", "distractor_explanations": {"B": "A myelin stain colors white matter, not neuron cell bodies. MS also damages myelin, not gray-matter neurons.", "C": "Loss of Nissl substance (chromatolysis) is a cell-body reaction to axon injury, seen with a Nissl stain, not with a myelin stain. It isn't the MS lesion.", "D": "Perineurium belongs to peripheral nerves. The ventral roots are PNS, and MS is a CNS disease.", "E": "Onion bulbs are rings of Schwann cells from repeated demyelination and remyelination of peripheral nerves (CIDP, Charcot-Marie-Tooth type 1). They aren't seen in CNS MS plaques."}}, {"id": "mk1-q69", "n": 69, "part": 1, "title": null, "stem": "A 29-year-old woman had painful vision loss in her right eye 2 years ago that resolved over several weeks. She now has double vision. On looking to the right, her left eye does not move inward and her right eye shows nystagmus; convergence is intact. Where is the new lesion?", "options": [{"letter": "A", "text": "Right medial longitudinal fasciculus"}, {"letter": "B", "text": "Left oculomotor nerve"}, {"letter": "C", "text": "Right abducens nucleus"}, {"letter": "D", "text": "Left abducens nerve"}, {"letter": "E", "text": "Left medial longitudinal fasciculus"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Multiple Sclerosis", "topic": "Multiple Sclerosis", "note": null, "blueprint_category": "Multiple Sclerosis", "learning_objective": "MS LO3", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": true, "thursday_11_5": false, "explanation": "Internuclear ophthalmoplegia from MLF demyelination: the eye that fails to adduct is on the side of the lesion, and intact convergence shows CN III works.", "source": "Wk2 packet p.76 ('Internuclear ophthalmoplegia ... due to demyelination of the medial longitudinal fasciculus')", "distractor_explanations": {"A": "The eye that fails to adduct is on the side of the MLF lesion; here the left eye fails.", "B": "A CN III lesion would also impair convergence and cause ptosis and other deficits.", "C": "An abducens nucleus lesion causes a gaze palsy to that side: neither eye looks right.", "D": "A left CN VI lesion would weaken abduction of the left eye on left gaze."}}, {"id": "mk1-q70", "n": 70, "part": 1, "title": null, "stem": "This section was taken from a ganglion. The small cells indicated by the arrows, which encircle the large neuron cell bodies, are derived from which embryonic tissue?", "options": [{"letter": "A", "text": "Neural tube (ventricular zone)"}, {"letter": "B", "text": "Neural crest"}, {"letter": "C", "text": "Paraxial mesoderm"}, {"letter": "D", "text": "Surface ectoderm"}, {"letter": "E", "text": "Endoderm"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock1-images/s-histolab-drg.png", "image_needed": true, "week": 1, "session_guess": "Histology Lab", "topic": "Histology Lab", "note": null, "blueprint_category": "Histology Lab", "learning_objective": "Histology Lab LO1-2", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrows mark satellite cells around pseudounipolar DRG neurons; satellite cells, Schwann cells and DRG neurons all come from neural crest.", "source": "Wk1 packet p.185 figure (DRG; 'Satellite cells' labeled); Wk3 packet p.10 and Autonomic slide 2 (neural crest -> satellite cells)", "distractor_explanations": {"A": "The neural tube (ventricular zone) gives CNS neurons, astrocytes, oligodendrocytes and ependymal cells, not cells in a peripheral ganglion.", "C": "Paraxial mesoderm (somites) gives vertebrae, skeletal muscle and dermis.", "D": "Surface ectoderm gives the epidermis, lens, anterior pituitary and the otic and nasal placodes. Satellite cells are neural crest, not surface ectoderm.", "E": "Endoderm gives the lining of the gut and its glands."}}, {"id": "mk1-q71", "n": 71, "part": 1, "title": null, "stem": "A 16-year-old girl with juvenile myoclonic epilepsy starts a broad-spectrum antiseizure drug that prolongs Na+ channel inactivation, increases GABA-A activity, and reduces T-type Ca2+ current. Which serious adverse effect of this drug requires monitoring?", "options": [{"letter": "A", "text": "Gingival enlargement"}, {"letter": "B", "text": "Kidney stones"}, {"letter": "C", "text": "Aplastic anemia"}, {"letter": "D", "text": "Fulminant hepatotoxicity"}, {"letter": "E", "text": "Methemoglobinemia"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Antiepileptics", "topic": "Antiepileptics", "note": null, "blueprint_category": "Antiepileptics", "learning_objective": "Antiepileptics LO2", "difficulty": 2, "format": "vignette", "drug_item": "side effect", "laterality": false, "thursday_11_5": true, "explanation": "Valproate (all three mechanisms) can cause fatal hepatitis and pancreatitis; gingival enlargement = phenytoin, kidney stones = topiramate, aplastic anemia = carbamazepine.", "source": "Drug list, Exam 1 'Epilepsy Medications': Valproic acid / Divalproex / Valproate row ('hepatotoxicity (fulminant hepatitis can be fatal)'); Phenytoin, Topiramate, Carbamazepine rows", "distractor_explanations": {"A": "Gingival enlargement is the classic adverse effect of phenytoin.", "B": "Kidney stones come from topiramate (and zonisamide) through carbonic anhydrase inhibition.", "C": "Aplastic anemia is the classic warning for carbamazepine (and felbamate), not valproate.", "E": "Methemoglobinemia comes from dapsone, local anesthetics and nitrites, not antiseizure drugs."}}, {"id": "mk1-q72", "n": 72, "part": 1, "title": null, "stem": "A 47-year-old woman has hoarseness and nasal regurgitation of liquids two weeks after skull base surgery. When she says \"ah,\" her uvula deviates to the right and the left side of her soft palate does not rise. Which nerve is most likely injured?", "options": [{"letter": "A", "text": "Right vagus nerve"}, {"letter": "B", "text": "Left glossopharyngeal nerve"}, {"letter": "C", "text": "Right glossopharyngeal nerve"}, {"letter": "D", "text": "Left hypoglossal nerve"}, {"letter": "E", "text": "Left vagus nerve"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Cranial Nerves Module", "topic": "Cranial Nerves Module", "note": null, "blueprint_category": "Cranial Nerves Module", "learning_objective": "CN Modules LO5", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": true, "thursday_11_5": false, "explanation": "With a CN X lesion the intact side pulls the uvula toward the normal side (away from the lesion), so deviation to the right plus hoarseness = left vagus.", "source": "Wk1 packet p.170 and p.172 table ('deviation of uvula to normal side; hoarseness'); CN Reflexes slide 27", "distractor_explanations": {"A": "With a right vagus lesion, the uvula would deviate to the left.", "B": "CN IX carries pharyngeal sensation (the gag's afferent limb); it does not elevate the palate.", "C": "CN IX does not move the palate or cause hoarseness.", "D": "CN XII moves the tongue, not the palate or larynx."}}, {"id": "mk1-q73", "n": 73, "part": 1, "title": null, "stem": "A 46-year-old man with Down syndrome has had 2 years of progressive forgetfulness and loss of daily living skills. Which mechanism best explains why his dementia began so early?", "options": [{"letter": "A", "text": "An extra copy of the APP gene increases amyloid-beta production"}, {"letter": "B", "text": "Inheritance of two ApoE4 alleles"}, {"letter": "C", "text": "A presenilin-1 mutation"}, {"letter": "D", "text": "Intracellular TDP-43 inclusions"}, {"letter": "E", "text": "A GAA trinucleotide repeat expansion"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Aging and Neurodegenerative Disorders", "topic": "Aging and Neurodegenerative Disorders", "note": null, "blueprint_category": "Aging and Neurodegenerative Disorders", "learning_objective": "Aging & Neurodegenerative LO4", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Trisomy 21 raises APP gene dosage, driving early Alzheimer pathology.", "source": "Wk3 packet p.103 ('An extra chromosome 21 increases APP gene dosage and the risk of early AD pathology')", "distractor_explanations": {"B": "ApoE4 raises risk but is not why Down syndrome causes dementia so early.", "C": "PSEN1 mutations cause familial early-onset AD, but this is explained by trisomy 21.", "D": "TDP-43 inclusions are linked to ALS and frontotemporal degeneration.", "E": "GAA repeats cause Friedreich ataxia."}}, {"id": "mk1-q74", "n": 74, "part": 1, "title": null, "stem": "During a total thyroidectomy, the surgeon ligates the right inferior thyroid artery close to the gland and injures the nerve that runs with it. After surgery the patient is hoarse. Which laryngeal muscle on the right side most likely still works?", "options": [{"letter": "A", "text": "Posterior cricoarytenoid"}, {"letter": "B", "text": "Lateral cricoarytenoid"}, {"letter": "C", "text": "Cricothyroid"}, {"letter": "D", "text": "Thyroarytenoid"}, {"letter": "E", "text": "Transverse arytenoid"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Neck Anatomy", "topic": "Neck Anatomy", "note": null, "blueprint_category": "Neck Anatomy", "learning_objective": "Neck ILM LO5, LO7", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The recurrent (inferior) laryngeal nerve, next to the inferior thyroid artery, supplies all intrinsic laryngeal muscles except the cricothyroid, which gets the superior laryngeal nerve.", "source": "CN Modules slide 83 (superior laryngeal -> cricothyroid; recurrent laryngeal -> intrinsic muscles of the larynx); ILM Anatomy of the Neck slide 17 (recurrent -> inferior laryngeal n.; lesions -> dysphonia). Named intrinsic distractors are standard anatomy, beyond the slides", "distractor_explanations": {"A": "The posterior cricoarytenoid is supplied by the recurrent laryngeal nerve and would be lost.", "B": "The lateral cricoarytenoid is supplied by the recurrent laryngeal nerve.", "D": "The thyroarytenoid is supplied by the recurrent laryngeal nerve.", "E": "The transverse arytenoid is supplied by the recurrent laryngeal nerve."}}, {"id": "mk1-q75", "n": 75, "part": 1, "title": null, "stem": "A rat with a selective lesion of the central nucleus of the amygdala hears a tone that was previously paired with a foot shock. Which part of its response to the tone is most reduced?", "options": [{"letter": "A", "text": "Hearing the tone"}, {"letter": "B", "text": "The rise in heart rate and blood pressure"}, {"letter": "C", "text": "Recalling the room where training took place"}, {"letter": "D", "text": "The spinal withdrawal reflex to a new shock"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Limbic System", "topic": "Limbic System", "note": null, "blueprint_category": "Limbic System", "learning_objective": "Limbic LO3", "difficulty": 2, "format": "research scenario", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The central nucleus sends output to the brainstem and hypothalamus for the autonomic expression of emotion; hearing, context memory (hippocampus), spinal reflexes and orienting (tectospinal) do not depend on it.", "source": "Limbic System slide 17", "distractor_explanations": {"A": "Hearing depends on the auditory pathway (cochlea, medial geniculate, auditory cortex). The amygdala receives that input but isn't needed to hear the tone.", "C": "Remembering the training room (contextual memory) depends on the hippocampus.", "D": "The withdrawal reflex is a spinal reflex arc and works without the amygdala."}}, {"id": "mk1-q76", "n": 76, "part": 1, "title": null, "stem": "The muscles of facial expression develop from mesoderm of which pharyngeal arch?", "options": [{"letter": "A", "text": "First arch"}, {"letter": "B", "text": "Second arch"}, {"letter": "C", "text": "Third arch"}, {"letter": "D", "text": "Fourth arch"}, {"letter": "E", "text": "Sixth arch"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Face Embryology", "topic": "Face Embryology", "note": null, "blueprint_category": "Face Embryology", "learning_objective": "Facial Embryology LO2", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Arch 2 (CN VII) forms the muscles of facial expression, posterior digastric, stylohyoid and stapedius; arch 1 (CN V) forms the muscles of mastication.", "source": "Facial Embryology slide 10 (arch derivative table); Wk1 packet p.19", "distractor_explanations": {"A": "Arch 1 (CN V) forms the muscles of mastication.", "C": "Arch 3 (CN IX) forms the stylopharyngeus.", "D": "Arch 4 (CN X) forms the pharyngeal constrictors and cricothyroid.", "E": "Arch 6 (CN X, recurrent laryngeal) forms most intrinsic laryngeal muscles."}}, {"id": "mk1-q77", "n": 77, "part": 1, "title": null, "stem": "A 35-year-old man has had attacks of severe, stabbing pain behind his left eye every night for 3 weeks. Each lasts about 45 minutes; during attacks he paces the room, his left eye tears, and his left nostril runs. Which is the most appropriate acute treatment?", "options": [{"letter": "A", "text": "Oral propranolol"}, {"letter": "B", "text": "Oral topiramate"}, {"letter": "C", "text": "Oral verapamil"}, {"letter": "D", "text": "Amitriptyline at bedtime"}, {"letter": "E", "text": "100% oxygen by face mask"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Headaches", "topic": "Headaches", "note": null, "blueprint_category": "Headaches", "learning_objective": "Headache LO1, LO6", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Cluster headache: first-line acute treatment is 100% oxygen (with SC sumatriptan); verapamil is cluster prophylaxis, propranolol and topiramate are migraine prophylaxis, amitriptyline is for tension-type.", "source": "Wk2 packet p.137 ('first-line acute treatment for cluster headaches is subcutaneous sumatriptan ... alongside 100% oxygen'); drug list Migraine Medications (verapamil = cluster prophylaxis)", "distractor_explanations": {"A": "Propranolol is a migraine preventive, not an acute cluster treatment.", "B": "Topiramate is a migraine preventive.", "C": "Verapamil prevents cluster attacks but does not stop an attack in progress.", "D": "Amitriptyline is for tension-type headache prevention."}}, {"id": "mk1-q78", "n": 78, "part": 2, "title": "Gross anatomy lab image: Face", "stem": "The structure indicated by the arrow pierces which muscle to open into the oral cavity?", "options": [{"letter": "A", "text": "Buccinator"}, {"letter": "B", "text": "Masseter"}, {"letter": "C", "text": "Orbicularis oris"}, {"letter": "D", "text": "Zygomaticus major"}, {"letter": "E", "text": "Platysma"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock1-images/lab-face-1.png", "image_needed": true, "week": 1, "session_guess": "Lab 1 (10/20)", "topic": "Face", "note": null, "blueprint_category": "Gross Anatomy Lab Image: Face", "learning_objective": "Lab 1 (10/20) LO1 (identify structures on the structure list); LO3 (relationships/functions)", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrow is on the parotid duct, which crosses the masseter and pierces the buccinator to open opposite the upper second molar.", "source": "Lab 1 notes p.8, Fig. 11 ('Parotid duct' pin); Lab 1 structure list (Glands, Face: Parotid duct)", "distractor_explanations": {"B": "The duct crosses the surface of the masseter but does not pierce it.", "C": "Orbicularis oris surrounds the lips, in front of where the duct opens.", "D": "Zygomaticus major runs from the cheekbone to the mouth corner, superficial to the duct's path.", "E": "Platysma lies in the neck and lower face, below the duct."}}, {"id": "mk1-q79", "n": 79, "part": 2, "title": "Gross anatomy lab image: Face", "stem": "Identify the nerve indicated by the arrow.", "options": [{"letter": "A", "text": "Inferior alveolar nerve"}, {"letter": "B", "text": "Chorda tympani"}, {"letter": "C", "text": "Auriculotemporal nerve"}, {"letter": "D", "text": "Lingual nerve"}, {"letter": "E", "text": "Long buccal nerve"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock1-images/lab-face-2.png", "image_needed": true, "week": 1, "session_guess": "Lab 1 (10/20)", "topic": "Face", "note": null, "blueprint_category": "Gross Anatomy Lab Image: Face", "learning_objective": "Lab 1 (10/20) LO1 (identify structures on the structure list)", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrow is on the 'Lingual n.' pin in the deep face, the V3 branch running anteriorly toward the tongue.", "source": "Lab 1 notes p.10, Fig. 15 ('Lingual n.' pin); Lab 1 structure list (Nerves, Face: Lingual nerve)", "distractor_explanations": {"A": "The inferior alveolar nerve runs behind the lingual nerve and enters the mandibular foramen.", "B": "The chorda tympani joins the lingual nerve higher up; it is a thin branch, not the nerve running to the tongue.", "C": "The auriculotemporal nerve runs backward around the middle meningeal artery toward the ear and temple.", "E": "The long buccal nerve runs forward onto the buccinator to the cheek, not toward the tongue."}}, {"id": "mk1-q80", "n": 80, "part": 2, "title": "Gross anatomy lab image: Face", "stem": "Identify the artery indicated by the arrow.", "options": [{"letter": "A", "text": "Maxillary artery"}, {"letter": "B", "text": "Superficial temporal artery"}, {"letter": "C", "text": "Middle meningeal artery"}, {"letter": "D", "text": "Inferior alveolar artery"}, {"letter": "E", "text": "External carotid artery"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock1-images/lab-face-3.png", "image_needed": true, "week": 1, "session_guess": "Lab 1 (10/20)", "topic": "Face", "note": null, "blueprint_category": "Gross Anatomy Lab Image: Face", "learning_objective": "Lab 1 (10/20) LO1 (identify structures on the structure list)", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrow is on the 'Middle meningeal a.' pin, the branch rising from the maxillary artery toward the foramen spinosum.", "source": "Lab 1 notes p.10, Fig. 15 ('Middle meningeal a.' pin); Lab 1 structure list (Arteries, Face: Middle meningeal artery)", "distractor_explanations": {"A": "The maxillary artery is the parent trunk running forward deep to the mandible; the arrowed branch rises from it.", "B": "The superficial temporal artery runs up in front of the ear outside the skull.", "D": "The inferior alveolar artery runs down into the mandibular foramen.", "E": "The external carotid ends behind the mandible by dividing into maxillary and superficial temporal arteries."}}, {"id": "mk1-q81", "n": 81, "part": 2, "title": "Gross anatomy lab image: Neck", "stem": "Identify the structure indicated by the arrow.", "options": [{"letter": "A", "text": "Cricoid cartilage"}, {"letter": "B", "text": "Hyoid bone"}, {"letter": "C", "text": "Thyroid cartilage"}, {"letter": "D", "text": "Isthmus of the thyroid gland"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock1-images/lab-neck-1.png", "image_needed": true, "week": 1, "session_guess": "Lab 1 (10/20)", "topic": "Neck", "note": null, "blueprint_category": "Gross Anatomy Lab Image: Neck", "learning_objective": "Lab 1 (10/20) LO1 (identify structures on the structure list)", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrow is on the 'Thyroid cartilage' pin (lamina) in the anterior neck.", "source": "Lab 1 notes p.13, Fig. 19 ('Thyroid cartilage' pin); Lab 1 structure list (Bones & Cartilages, Neck)", "distractor_explanations": {"A": "The cricoid is the complete ring below the thyroid cartilage.", "B": "The hyoid is above the thyroid cartilage, at the base of the tongue.", "D": "The thyroid isthmus crosses the trachea below the cricoid."}}, {"id": "mk1-q82", "n": 82, "part": 2, "title": "Gross anatomy lab image: External Features", "stem": "This is the inferior surface of the brainstem with its arteries in place. Identify the vessel indicated by the arrow.", "options": [{"letter": "A", "text": "Basilar artery"}, {"letter": "B", "text": "Vertebral artery"}, {"letter": "C", "text": "Posterior inferior cerebellar artery"}, {"letter": "D", "text": "Anterior inferior cerebellar artery"}, {"letter": "E", "text": "Anterior spinal artery"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock1-images/lab-ext-1.png", "image_needed": true, "week": 2, "session_guess": "Lab 2 (10/27)", "topic": "External Features", "note": null, "blueprint_category": "Gross Anatomy Lab Image: External Features", "learning_objective": "Lab 2 (10/27) LO1 (identify structures on the structure list)", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrow is on one of the paired vessels below the point where they join to form the basilar artery (labeled 'Vertebral artery' in Nolte's drawing).", "source": "Nolte Ch. 1, Fig. 1.6B (photo PDF p.45; labeled drawing p.47, 'Vertebral artery'); Lab 2 structure list (Cerebral Arteries: Vertebral arteries, bold)", "distractor_explanations": {"A": "The basilar artery is the single midline trunk formed after the two vessels join.", "C": "PICA branches off the vertebral artery and runs back around the medulla to the cerebellum.", "D": "AICA branches from the lower basilar artery.", "E": "The anterior spinal artery is a thin midline vessel running down from the vertebral arteries."}}, {"id": "mk1-q83", "n": 83, "part": 2, "title": "Gross anatomy lab image: External Features", "stem": "Identify the cranial nerve root indicated by the arrow on this ventral view of the brainstem.", "options": [{"letter": "A", "text": "Trigeminal nerve (CN V)"}, {"letter": "B", "text": "Facial nerve (CN VII)"}, {"letter": "C", "text": "Oculomotor nerve (CN III)"}, {"letter": "D", "text": "Abducens nerve (CN VI)"}, {"letter": "E", "text": "Hypoglossal nerve (CN XII)"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock1-images/lab-ext-2.png", "image_needed": true, "week": 2, "session_guess": "Lab 2 (10/27)", "topic": "External Features", "note": null, "blueprint_category": "Gross Anatomy Lab Image: External Features", "learning_objective": "Lab 2 (10/27) LO1 (identify structures on the structure list)", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrow is on the root leaving the caudal pons near the midline, medial and inferior to the trigeminal stump (labeled 'Abducens nerve (CN VI)' in Nolte's drawing).", "source": "Nolte Ch. 1, Fig. 1.10 (photo PDF p.74; labeled drawing p.76, 'Abducens nerve (CN VI)'); Lab 2 structure list (Cranial Nerves)", "distractor_explanations": {"A": "CN V leaves the lateral pons as a large stump, not near the midline at the pontomedullary junction.", "B": "CN VII leaves laterally at the cerebellopontine angle, not near the midline.", "C": "CN III leaves the midbrain between the cerebral peduncles, above the pons.", "E": "CN XII leaves the medulla between the pyramid and olive."}}, {"id": "mk1-q84", "n": 84, "part": 2, "title": "Gross anatomy lab image: External Features", "stem": "Identify the structure indicated by the arrow on the inferior surface of the brain.", "options": [{"letter": "A", "text": "Uncus"}, {"letter": "B", "text": "Parahippocampal gyrus"}, {"letter": "C", "text": "Temporal pole"}, {"letter": "D", "text": "Mammillary body"}, {"letter": "E", "text": "Optic tract"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock1-images/lab-ext-3.png", "image_needed": true, "week": 2, "session_guess": "Lab 2 (10/27)", "topic": "External Features", "note": null, "blueprint_category": "Gross Anatomy Lab Image: External Features", "learning_objective": "Lab 2 (10/27) LO1 (identify structures on the structure list)", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrow is on the 'Uncus (Un)' pin, the hooked anterior end of the parahippocampal gyrus on the medial temporal lobe.", "source": "Lab 3 notes (docx) inferior-brain figure ('Uncus (Un)' pin); Lab 2 structure list (External Features: Uncus, bold)", "distractor_explanations": {"B": "The parahippocampal gyrus is the longer gyrus behind the uncus; the uncus is its hooked front end.", "C": "The temporal pole is the most anterior tip of the temporal lobe, lateral to the uncus.", "D": "The mammillary bodies are midline structures behind the infundibulum.", "E": "The optic tract wraps around the cerebral peduncle, medial to the uncus."}}, {"id": "mk1-q85", "n": 85, "part": 2, "title": "Gross anatomy lab image: External Features", "stem": "The gland that sits in the depression marked by the asterisk receives hypothalamic releasing hormones mainly through:", "options": [{"letter": "A", "text": "Axons of supraoptic and paraventricular neurons"}, {"
