he cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Radiculopathy; Spinal cord imaging", "topic": "Radiculopathy; Spinal cord imaging", "note": null, "blueprint_category": "Radiculopathy; Spinal cord imaging", "learning_objective": "Radiculopathy LO4", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Most disc herniations improve with conservative care. Surgery is considered for failure of conservative treatment over 6 weeks with definite compression on MRI, or for progressive or disabling deficits (weakness, bowel or bladder loss).", "distractor_explanations": {"B": "Surgery is for progressive or disabling deficits, bowel or bladder involvement, or no response after about 6 weeks.", "C": "There is no suspicion of infection or inflammation of the nerve roots.", "D": "There is no sign of infection.", "E": "Prolonged bed rest is not the conservative care the course describes."}, "source": "Wk2 packet p.123 ('disc herniation can frequently be managed conservatively in the majority of cases -- with physical therapy and pain management'; indications for surgery)"}, {"id": "mk4-q37", "n": 37, "part": 1, "title": null, "stem": "If the region indicated by the arrow were destroyed on the left side of the spinal cord from T4 to T6, and nothing else were damaged, what deficit would result?", "options": [{"letter": "A", "text": "Loss of pain and temperature on the right side of the body below T6"}, {"letter": "B", "text": "Loss of vibration and position sense on the left below T4"}, {"letter": "C", "text": "Loss of pain and temperature in the left T4-T6 dermatomes only"}, {"letter": "D", "text": "Loss of all sensation in the right T4-T6 dermatomes"}, {"letter": "E", "text": "Weakness of the left trunk muscles at T4-T6"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock4-images/s-sc-gelatinosa.png", "image_needed": true, "week": 2, "session_guess": "Spinal Cord Cross-Sectional Anatomy", "topic": "Spinal Cord Cross-Sectional Anatomy", "note": null, "blueprint_category": "Spinal Cord Cross-Sectional Anatomy", "learning_objective": "SC Cross-Sectional LO3-4", "difficulty": 3, "format": "image", "drug_item": null, "laterality": true, "thursday_11_5": false, "explanation": "The arrow marks the substantia gelatinosa (lamina II) of the dorsal horn, where first-order pain and temperature fibers synapse. Second-order axons then cross in the anterior white commissure. Destroying it removes pain and temperature only in the same-side dermatomes of those segments; tracts carrying signals from below are untouched.", "distractor_explanations": {"A": "That would follow a lesion of the left spinothalamic tract in the lateral white matter, which carries already-crossed fibers from below.", "B": "That would follow a lesion of the left dorsal columns.", "D": "Segmental input enters on the same side, and touch and vibration bypass this region.", "E": "Motor neurons are in the ventral horn."}, "source": "SC Cross-Sectional Anatomy worksheet p.10, Figure 2 (image used; 'Substantia gelatinosa' label); Wk2 Pain session (first-order nociceptive synapse in the dorsal horn, crossing in the anterior white commissure)", "annotation": {"image": "qbank/midterm1-mock4-images/annotated/s-sc-gelatinosa.png", "options": {"A": "Not labeled in this figure", "B": "Not labeled in this figure", "C": "Labeled \"Substantia gelatinosa\" (arrowed)", "D": "Not labeled in this figure", "E": "Labeled \"motor neurons of the anterior horn\""}, "note": "The spinothalamic tract and dorsal columns (other choices) are white matter tracts, shown in Figure 1 of the same worksheet page, not in this gray-matter drawing.", "how": "Same faculty figure with its labels showing (the full labeled version or the faculty key for the photo). Green box = correct answer; red boxes = other answer choices the figure labels; amber star = the arrowed structure when the key is not a structure name. Arrow redrawn where the question placed it.", "marked": ["C", "E"]}}, {"id": "mk4-q38", "n": 38, "part": 1, "title": null, "stem": "A subpopulation of arcuate nucleus neurons expresses kisspeptin, neurokinin B and dynorphin (KNDy neurons) and carries estrogen receptors. What is their main role as described in the course?", "options": [{"letter": "A", "text": "Inhibiting prolactin release by secreting dopamine into the portal system"}, {"letter": "B", "text": "Mediating estrogen negative feedback on GnRH secretion"}, {"letter": "C", "text": "Controlling body weight through POMC and NPY signaling"}, {"letter": "D", "text": "Setting circadian rhythms from retinal input"}, {"letter": "E", "text": "Making vasopressin for release from the posterior pituitary"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Hypothalamus", "topic": "Hypothalamus", "note": null, "blueprint_category": "Hypothalamus", "learning_objective": "Hypothalamus ILM LO2", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arcuate nucleus has at least 15 neuron subtypes. KNDy neurons express estrogen receptors and regulate estrogen negative feedback on GnRH; other arcuate neurons control weight (POMC, NPY), inhibit prolactin (dopamine) or make GHRH and somatostatin.", "distractor_explanations": {"A": "A different arcuate population does this.", "C": "These are other arcuate subtypes (POMC and NPY neurons).", "D": "That is the suprachiasmatic nucleus.", "E": "That is done by the supraoptic and paraventricular nuclei."}, "source": "Wk3 packet p.4 ('KNDy neurons ... express estrogen receptors and regulate estrogen negative feedback on GnRH secretion')"}, {"id": "mk4-q39", "n": 39, "part": 1, "title": null, "stem": "Which bones of the neurocranium form by intramembranous ossification?", "options": [{"letter": "A", "text": "The frontal and parietal bones"}, {"letter": "B", "text": "The ethmoid and most of the sphenoid"}, {"letter": "C", "text": "The petrous part of the temporal bone and the base of the occipital bone"}, {"letter": "D", "text": "The mandible and maxilla"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Face Embryology", "topic": "Face Embryology", "note": null, "blueprint_category": "Face Embryology", "learning_objective": "Face Embryology LO4", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Membranous neurocranium = frontal, parietal, the interparietal (superior) part of the occipital and part of the greater wing of the sphenoid near the pterion. Ethmoid, most of the sphenoid, the petrous temporal and the rest of the occipital form from cartilage.", "distractor_explanations": {"B": "Listed in the course as endochondral neurocranium.", "C": "Both form by endochondral ossification from cartilage precursors.", "D": "These are viscerocranium (face), not neurocranium."}, "source": "Wk1 packet p.25 ('Membranous Neurocranium: includes the frontal, parietal, and superior part of the occipital...')"}, {"id": "mk4-q40", "n": 40, "part": 1, "title": null, "stem": "Chromaffin cells of the adrenal medulla secrete epinephrine into the blood. In the course's description of autonomic development, these cells are best described as:", "options": [{"letter": "A", "text": "Preganglionic sympathetic neurons derived from the neural tube"}, {"letter": "B", "text": "Neural crest-derived equivalents of postganglionic sympathetic neurons, innervated by preganglionic fibers"}, {"letter": "C", "text": "Postganglionic parasympathetic neurons supplied by the vagus"}, {"letter": "D", "text": "Mesoderm-derived adrenal cortex cells innervated by postganglionic fibers"}, {"letter": "E", "text": "Enteric neurons from vagal neural crest"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Autonomics", "topic": "Autonomics", "note": null, "blueprint_category": "Autonomics", "learning_objective": "Autonomics LO1-2", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Postganglionic sympathetic, parasympathetic and enteric neurons and adrenal chromaffin cells all come from neural crest. Chromaffin cells receive preganglionic sympathetic input directly and act like postganglionic neurons that release their transmitter into the blood.", "distractor_explanations": {"A": "Preganglionic neurons arise from the neural tube and sit in the spinal cord; chromaffin cells are their targets.", "C": "The adrenal medulla is part of the sympathetic system.", "D": "The cortex is mesodermal and makes steroids; the medulla comes from neural crest and receives preganglionic input.", "E": "Enteric neurons form the gut wall plexuses."}, "source": "Wk3 packet p.10 LO-2 ('The postganglionic sympathetic, parasympathetic, enteric, adrenal chromaffin and support cells of the ANS develop from the specific Neural Crest ... begin to receive input from ... preganglionic neurons')"}, {"id": "mk4-q41", "n": 41, "part": 1, "title": null, "stem": "In normal neurulation, what are the order and timing of neuropore closure?", "options": [{"letter": "A", "text": "The caudal neuropore closes first (about day 21), then the rostral (about day 28)"}, {"letter": "B", "text": "Both neuropores close together at about day 21"}, {"letter": "C", "text": "The rostral neuropore closes at about day 40, after the brain vesicles form"}, {"letter": "D", "text": "The rostral neuropore closes first (about day 24), then the caudal neuropore (about day 27)"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Embryology of CNS PNS", "topic": "Embryology of CNS PNS", "note": null, "blueprint_category": "Embryology of CNS PNS", "learning_objective": "Embryology CNS/PNS LO1", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Course timeline: the rostral end of the neural tube closes first (day 24) and the caudal end by about day 27. The closed tube then forms the primary brain vesicles in late week 4.", "distractor_explanations": {"A": "The order is reversed.", "B": "Closure starts around day 21-22 but the two ends close days apart.", "C": "The primary vesicles form in late week 4, after the rostral end has closed."}, "source": "Wk1 packet p.143 ('The rostral end of the neural tube closes first (day 24), and the caudal end closes by approximately day 27')"}, {"id": "mk4-q42", "n": 42, "part": 1, "title": null, "stem": "A 23-year-old man is injured diving into a shallow pool. CT shows a fracture of the C5 vertebra that runs through the foramen in its transverse process. Which structure is most at risk?", "options": [{"letter": "A", "text": "Vertebral artery"}, {"letter": "B", "text": "The C5 spinal nerve"}, {"letter": "C", "text": "Internal carotid artery"}, {"letter": "D", "text": "Sympathetic trunk"}, {"letter": "E", "text": "Spinal accessory nerve"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Spinal Cord", "topic": "Spinal Cord", "note": null, "blueprint_category": "Spinal Cord", "learning_objective": "Spinal Cord LO2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Cervical vertebrae have transverse foramina that carry the vertebral arteries up to the foramen magnum (usually from C6 upward). A fracture through the foramen can tear or dissect the artery.", "distractor_explanations": {"B": "Spinal nerves leave through the intervertebral foramina, not the transverse foramina.", "C": "The internal carotid runs in the carotid sheath, in front of the transverse processes.", "D": "The trunk lies in front of the transverse processes, not inside the foramen.", "E": "CN XI crosses the posterior triangle superficially, away from the vertebrae."}, "source": "Wk2 packet p.38 ('Cervical vertebral bodies are small and ovoid, with large transverse foramina for passage of the vertebral arteries')"}, {"id": "mk4-q43", "n": 43, "part": 1, "title": null, "stem": "While lifting weights, a 44-year-old woman has a sudden, explosive headache that is at its worst within a minute. A noncontrast head CT 9 hours later is normal. What is the best next step?", "options": [{"letter": "A", "text": "Lumbar puncture to look for red blood cells or xanthochromia"}, {"letter": "B", "text": "Discharge with a triptan for presumed migraine"}, {"letter": "C", "text": "MRI of the cervical spine"}, {"letter": "D", "text": "EEG"}, {"letter": "E", "text": "Start verapamil"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Headaches", "topic": "Headaches", "note": null, "blueprint_category": "Headaches", "learning_objective": "Headache LO10", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "CT sensitivity for subarachnoid hemorrhage falls with time, so a negative scan does not exclude it. Lumbar puncture looks for red cells or xanthochromia (yellow CSF from bilirubin as red cells break down).", "distractor_explanations": {"B": "A thunderclap headache must not be treated as migraine until subarachnoid hemorrhage is excluded.", "C": "This does not evaluate a possible aneurysmal bleed.", "D": "There is no sign of seizure.", "E": "Verapamil prevents cluster headache."}, "source": "Wk2 packet p.140 ('negative results do not rule out SAH. Lumbar puncture may be necessary to evaluate the presence of red blood cells or their degradation products in the CSF. Xanthochromia is the yellow appearance of CSF')"}, {"id": "mk4-q44", "n": 44, "part": 1, "title": null, "stem": "A week after a febrile illness, a 34-year-old man has weakness of his left leg. The leg is floppy, the thigh muscles twitch visibly and are wasting, and the knee and ankle reflexes are absent. Sensation is normal. Where is the lesion?", "options": [{"letter": "A", "text": "The left precentral gyrus"}, {"letter": "B", "text": "The right corticospinal fibers in the internal capsule"}, {"letter": "C", "text": "The left dorsal root ganglia"}, {"letter": "D", "text": "Lower motor neurons in the left anterior horn of the lumbar cord"}, {"letter": "E", "text": "The neuromuscular junctions of the left leg"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Corticospinal and UMN/LMN", "topic": "Corticospinal and UMN/LMN", "note": null, "blueprint_category": "Corticospinal and UMN/LMN", "learning_objective": "Descending Motor LO5", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Flaccid weakness, fasciculations, atrophy and lost reflexes with normal sensation are lower motor neuron signs. A pure motor LMN syndrome after a viral illness points to anterior horn cells (as in polio-like illnesses).", "distractor_explanations": {"A": "A cortical lesion gives upper motor neuron signs, and on the opposite side of the body.", "B": "Upper motor neuron lesions cause spasticity and brisk reflexes, not fasciculations and areflexia.", "C": "Sensation is normal, and ganglion damage would cause sensory loss.", "E": "Junction disorders cause fatigable weakness without fasciculations, early wasting or lost reflexes."}, "source": "Wk2 packet p.33 LMN signs ('Paresis or paralysis / Atrophy / Fasciculations / Flaccid paralysis / ... hyporeflexia'); Descending Motor LO5"}, {"id": "mk4-q45", "n": 45, "part": 1, "title": null, "stem": "This H&E section is from the white matter of a healthy cerebrum. What is a main function of the cell type indicated by the arrow?", "options": [{"letter": "A", "text": "Forming myelin around segments of many CNS axons"}, {"letter": "B", "text": "Phagocytosing debris as the resident immune cell"}, {"letter": "C", "text": "Lining the ventricles and producing CSF"}, {"letter": "D", "text": "Firing action potentials and releasing transmitter"}, {"letter": "E", "text": "Buffering extracellular K+ and taking up glutamate, with end-feet on capillaries"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock4-images/s-path-astrocyte.png", "image_needed": true, "week": 3, "session_guess": "Neuropathology of Neurodegenerative Diseases Lab", "topic": "Neuropathology of Neurodegenerative Diseases Lab", "note": null, "blueprint_category": "Neuropathology of Neurodegenerative Diseases Lab", "learning_objective": "Neuropath Lab LO1", "difficulty": 3, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": true, "explanation": "The arrowed cell is labeled an astrocyte in the lab key: an oval nucleus with no visible cytoplasm in H&E. Astrocytes buffer extracellular K+, take up glutamate, supply metabolic support, and their end-feet contribute to the blood-brain barrier.", "distractor_explanations": {"A": "That is the oligodendrocyte: round nucleus with a clear perinuclear halo, seen elsewhere in this field.", "B": "Microglia have small, elongated nuclei.", "C": "Ependymal cells line the ventricles, not the white matter.", "D": "Neurons have large cell bodies with visible cytoplasm and sit in the gray matter."}, "source": "Wk3 packet p.151 (Neuropath lab, healthy cerebrum figure, yellow circle; 'Astrocytes' label, image used); glial functions from Wk1 Histology CNS 1 LO5", "annotation": {"image": "qbank/midterm1-mock4-images/annotated/s-path-astrocyte.png", "options": {"A": "Labeled \"Oligos\" (oligodendrocytes)", "B": "Not labeled in this figure", "C": "Not labeled in this figure", "D": "Labeled \"Neurons\" (gray matter, blue circle)", "E": "Labeled \"Astrocytes\" (arrowed cell)"}, "note": "The arrowed cell is the one the faculty 'Astrocytes' arrow points to (yellow circle, white matter).", "how": "Same faculty figure with its labels showing (the full labeled version or the faculty key for the photo). Green box = correct answer; red boxes = other answer choices the figure labels; amber star = the arrowed structure when the key is not a structure name. Arrow redrawn where the question placed it.", "marked": ["A", "D", "E"]}}, {"id": "mk4-q46", "n": 46, "part": 1, "title": null, "stem": "In an fMRI study, patients with post-traumatic stress disorder and healthy controls view pictures of happy faces. Compared with controls, what pattern do the patients show?", "options": [{"letter": "A", "text": "Higher activity in the ventral striatum and amygdala"}, {"letter": "B", "text": "Lower activity in the ventral striatum (nucleus accumbens) and amygdala"}, {"letter": "C", "text": "Lower amygdala activity to threatening faces as well"}, {"letter": "D", "text": "Greater hippocampal volume"}, {"letter": "E", "text": "No difference, because PTSD affects only responses to threat"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Limbic System", "topic": "Limbic System", "note": null, "blueprint_category": "Limbic System", "learning_objective": "Limbic System LO4", "difficulty": 3, "format": "research scenario", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "In PTSD the amygdala is hyperactive to threatening stimuli but can be hypoactive to positive ones. The course figure shows lower ventral striatum (nucleus accumbens) and amygdala responses to happy faces, which fits emotional numbing.", "distractor_explanations": {"A": "This is the opposite of the course's finding for positive stimuli.", "C": "In PTSD the amygdala is hyperactive to threat.", "D": "PTSD is linked to hyperactive amygdala-hippocampal circuits, not to a larger hippocampus.", "E": "The course describes a blunted response to positive stimuli as well."}, "source": "Wk3 packet p.57 ('the amygdala is hyperactive in the presence of threatening stimuli but can be hypoactive in the presence of positive stimuli'; figure: 'Hypoactivity ... in the ventral striatum (NAcc) and the amygdala in response to happy faces in patients with PTSD')"}, {"id": "mk4-q47", "n": 47, "part": 1, "title": null, "stem": "A 70-year-old man has a complete occlusion of his left external carotid artery, while the left internal carotid artery is normal. Which area of his left face normally gets its arterial supply from the internal carotid system rather than the external?", "options": [{"letter": "A", "text": "Skin over the angle of the mandible"}, {"letter": "B", "text": "The upper lip"}, {"letter": "C", "text": "Skin of the forehead above the orbital margin, through the supraorbital and supratrochlear arteries"}, {"letter": "D", "text": "Skin in front of the ear over the parotid gland"}, {"letter": "E", "text": "The lower lip and chin"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Face Anatomy", "topic": "Face Anatomy", "note": null, "blueprint_category": "Face Anatomy", "learning_objective": "Face ILM LO5", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Most of the face is supplied by the external carotid. The exception in the course notes is the forehead above the orbital margin (and the orbit): the supraorbital and supratrochlear arteries are branches of the ophthalmic artery, which comes off the internal carotid.", "distractor_explanations": {"A": "Supplied by branches of the facial artery and other external carotid branches.", "B": "The superior labial artery is a branch of the facial artery, an external carotid branch.", "D": "Supplied by the superficial temporal artery and its transverse facial branch, both external carotid.", "E": "Supplied by the inferior labial (facial) and mental (inferior alveolar, from the maxillary) arteries, all external carotid."}, "source": "Wk1 packet p.47-48 ('The forehead above the orbital margin is supplied by ... supraorbital and supratrochlear arteries ... branches of the ophthalmic artery (a branch of the INTERNAL) carotid')"}, {"id": "mk4-q48", "n": 48, "part": 1, "title": null, "stem": "A 3-year-old boy loses his walking skills over a year. He is weak, with absent reflexes and slowed nerve conduction, and MRI shows symmetric white matter disease. A nerve biopsy shows metachromatic deposits. Which substance accumulates?", "options": [{"letter": "A", "text": "Galactocerebroside (psychosine)"}, {"letter": "B", "text": "Very-long-chain fatty acids"}, {"letter": "C", "text": "Globotriaosylceramide"}, {"letter": "D", "text": "Sulfatides"}, {"letter": "E", "text": "Phytanic acid"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Peripheral Neuropathies", "topic": "Peripheral Neuropathies", "note": null, "blueprint_category": "Peripheral Neuropathies", "learning_objective": "Peripheral Neuropathy LO7", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Metachromatic leukodystrophy is arylsulfatase A deficiency. Sulfatides build up and demyelinate both the CNS and the PNS, causing loss of motor skills, neuropathy and white matter disease in a young child.", "distractor_explanations": {"A": "This accumulates in Krabbe disease (galactocerebrosidase deficiency).", "B": "These accumulate in adrenoleukodystrophy (a peroxisomal disorder).", "C": "This accumulates in Fabry disease (alpha-galactosidase A deficiency), which causes painful small-fiber neuropathy.", "E": "This accumulates in Refsum disease (Claude's general-knowledge note)."}, "source": "Wk2 packet p.69 ('Metachromatic Leukodystrophy: caused by a deficiency of the enzyme arylsulfatase A, leading to the accumulation of sulfatides ... demyelination of both the central and peripheral nervous systems')"}, {"id": "mk4-q49", "n": 49, "part": 1, "title": null, "stem": "A 31-year-old woman with relapsing-remitting multiple sclerosis starts an oral drug that activates the Nrf2 antioxidant pathway. She has some abdominal upset in the first weeks. Which test is most important to monitor during long-term treatment?", "options": [{"letter": "A", "text": "Lymphocyte count, because lymphopenia raises the risk of progressive multifocal leukoencephalopathy"}, {"letter": "B", "text": "Serum potassium, because the drug causes hyperkalemia"}, {"letter": "C", "text": "Hepatitis B serology, because the drug reactivates hepatitis B"}, {"letter": "D", "text": "Serum sodium, because the drug causes SIADH"}, {"letter": "E", "text": "Fasting glucose, because the drug causes diabetes"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Multiple Sclerosis", "topic": "Multiple Sclerosis", "note": null, "blueprint_category": "Multiple Sclerosis", "learning_objective": "MS LO5", "difficulty": 2, "format": "vignette", "drug_item": "Dimethyl fumarate", "laterality": false, "thursday_11_5": false, "explanation": "This is dimethyl fumarate (GSH depletion, Nrf2 up-regulation). The drug list names PML and lymphopenia as its serious risks, so lymphocyte counts are followed. Flu-like symptoms and GI upset are its common effects.", "distractor_explanations": {"B": "Not a listed effect of this drug.", "C": "That is the warning for anti-CD20 antibodies such as rituximab.", "D": "Hyponatremia is linked to carbamazepine and oxcarbazepine.", "E": "Not a listed effect of this drug."}, "source": "Drug list, MS: Dimethyl Fumarate (bold) 'upregulation of ... Nrf2'; 'Progressive multifocal leukoencephalopathy and lymphopenia = serious risks. Can cause flu-like symptoms, GI disturbances'"}, {"id": "mk4-q50", "n": 50, "part": 1, "title": null, "stem": "A 38-year-old woman with multiple sclerosis has painful stiffness and spasms of her legs and is started on oral baclofen. What is its mechanism of action?", "options": [{"letter": "A", "text": "Agonist at alpha-2 adrenergic receptors"}, {"letter": "B", "text": "Agonist at GABA-B receptors (inhibitory G protein-coupled receptors)"}, {"letter": "C", "text": "Blocks Ca2+ release from the sarcoplasmic reticulum via the ryanodine receptor"}, {"letter": "D", "text": "Increases the opening frequency of GABA-A Cl- channels"}, {"letter": "E", "text": "Blocks nicotinic receptors at the neuromuscular junction"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Multiple Sclerosis", "topic": "Multiple Sclerosis", "note": null, "blueprint_category": "Multiple Sclerosis", "learning_objective": "MS LO7", "difficulty": 2, "format": "vignette", "drug_item": "Baclofen", "laterality": false, "thursday_11_5": false, "explanation": "Baclofen is a GABA-B agonist (GPCR, inhibitory coupling) used for spasticity in MS, ALS and dystonia. Side effects: dizziness, drowsiness, weakness, fatigue and, on abrupt withdrawal, seizures and hallucinations.", "distractor_explanations": {"A": "This is tizanidine, another spasmolytic used in MS.", "C": "This is dantrolene, which acts in muscle itself.", "D": "This is the benzodiazepine mechanism (e.g. midazolam).", "E": "This is a neuromuscular blocker such as pancuronium, used in anesthesia."}, "source": "Drug list, Spasmolytics: Baclofen (bold) 'GABAB agonist (GPCR inhibitory coupling)'; Tizanidine 'Alpha2 receptor agonist'; Dantrolene 'blocking the ryanodine receptor'; Midazolam 'increase channel opening frequency'; Wk2 packet p.80 ('Spasticity: Baclofen or tizanidine')"}, {"id": "mk4-q51", "n": 51, "part": 1, "title": null, "stem": "Splitting a restaurant bill in your head, holding the total while dividing it among friends, relies most on which kind of memory?", "options": [{"letter": "A", "text": "Working memory"}, {"letter": "B", "text": "Short-term memory used as simple storage"}, {"letter": "C", "text": "Episodic memory"}, {"letter": "D", "text": "Procedural memory"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Memory Formation", "topic": "Memory Formation", "note": null, "blueprint_category": "Memory Formation", "learning_objective": "Learning & Memory LO6", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Working memory (prefrontal cortex with parietal and sensory areas) holds information and works on it at the same time, as in mental arithmetic. Short-term memory is simple storage that needs no active work.", "distractor_explanations": {"B": "The course separates simple short-term storage (e.g. holding a phone number) from working memory, which also manipulates the information.", "C": "Episodic memory is long-term memory of personal events.", "D": "Procedural memory is for skills and habits."}, "source": "Wk3 packet p.65 (LO-6,7: short-term memory as simple storage vs working memory that temporarily holds and manipulates information)"}, {"id": "mk4-q52", "n": 52, "part": 1, "title": null, "stem": "Just after an action potential, the membrane briefly becomes more negative than the resting potential. What causes this after-hyperpolarization?", "options": [{"letter": "A", "text": "Voltage-gated Na+ channels reopen"}, {"letter": "B", "text": "The Na+/K+ pump moves 3 Na+ into the cell"}, {"letter": "C", "text": "Cl- channels open and Cl- leaves the cell"}, {"letter": "D", "text": "Voltage-gated K+ channels stay open, so K+ efflux pulls the membrane toward the K+ equilibrium potential"}, {"letter": "E", "text": "Ca2+ channels at the terminal close"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Action Potentials", "topic": "Action Potentials", "note": null, "blueprint_category": "Action Potentials", "learning_objective": "Action Potentials LO5", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Delayed voltage-gated K+ channels open late and close slowly. K+ efflux peaks and pulls the membrane toward E_K (about -80 mV), below rest, until the channels deactivate.", "distractor_explanations": {"A": "Na+ channels are inactivated at this time; Na+ entry would depolarize.", "B": "The pump moves 3 Na+ out and 2 K+ in.", "C": "Cl- leaving would depolarize the membrane, and Cl- is not the course's mechanism.", "E": "Terminal Ca2+ channels control release, not the axon's after-potential."}, "source": "Wk3 packet p.47 ('The efflux of K+ ions through the delayed, voltage-gated K+ channels reaches a maximum; pulling the membrane potential down to the level of the equilibrium potential for K+, which is below the resting potential')"}, {"id": "mk4-q53", "n": 53, "part": 1, "title": null, "stem": "An isolated axon is moved from normal saline into a bath with half the normal Na+ concentration, with osmolarity kept constant. Compared with before, what is expected?", "options": [{"letter": "A", "text": "The resting potential becomes much more negative, and the action potential is unchanged"}, {"letter": "B", "text": "The resting potential depolarizes markedly, and the axon becomes inexcitable"}, {"letter": "C", "text": "The action potential peak rises because the Na+ driving force is greater"}, {"letter": "D", "text": "No action potentials can occur at all"}, {"letter": "E", "text": "The resting potential changes little, but the peak (overshoot) of the action potential is lower"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Action Potentials", "topic": "Action Potentials", "note": null, "blueprint_category": "Action Potentials", "learning_objective": "Action Potentials LO10", "difficulty": 3, "format": "research scenario", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "At rest the membrane is mainly permeable to K+, so lowering extracellular Na+ barely changes the resting potential. The action potential peak heads toward E_Na, which falls when extracellular Na+ falls, so the overshoot is smaller.", "distractor_explanations": {"A": "Resting potential depends mostly on K+, and the Na+ change does alter the peak.", "B": "That is what raising extracellular K+ does.", "C": "Less extracellular Na+ lowers E_Na and the driving force.", "D": "Halving Na+ reduces the inward current but usually still allows action potentials."}, "source": "Wk3 packet Action Potentials LO3 and LO10 (predict changes in resting and action potentials after changes in Na+, K+ or Cl- gradients); application is Claude's"}, {"id": "mk4-q54", "n": 54, "part": 1, "title": null, "stem": "A 72-year-old man with benign prostatic hyperplasia starts a low-dose tricyclic antidepressant at bedtime for post-herpetic nerve pain. Two days later he cannot pass urine and has a dry mouth and constipation. Which action of the drug best explains this?", "options": [{"letter": "A", "text": "Inhibition of serotonin reuptake"}, {"letter": "B", "text": "Blockade of muscarinic acetylcholine receptors"}, {"letter": "C", "text": "Agonist action at alpha-2 receptors in the dorsal horn"}, {"letter": "D", "text": "Blockade of voltage-gated Na+ channels"}, {"letter": "E", "text": "Mu-opioid receptor agonism"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Pain Medications", "topic": "Pain Medications", "note": null, "blueprint_category": "Pain Medications", "learning_objective": "Pain Medications LO4", "difficulty": 3, "format": "vignette", "drug_item": "Amitriptyline", "laterality": false, "thursday_11_5": false, "explanation": "Tricyclics such as amitriptyline relieve pain by blocking NE and 5-HT reuptake, but they also block muscarinic receptors. Antimuscarinic effects (dry mouth, constipation, blurred vision, urinary retention) are worst in older men with an enlarged prostate.", "distractor_explanations": {"A": "This is part of the analgesic mechanism and does not cause urinary retention.", "C": "The drug raises NE, which acts on alpha-2 receptors to inhibit pain; this is how it helps, not the side effect.", "D": "This is how local anesthetics and some antiseizure drugs work.", "E": "Opioids can cause retention, but a tricyclic is not an opioid."}, "source": "Wk2 packet p.72 ('Amitriptyline ... Side effects include anticholinergic effects such as dry mouth, blurred vision, and constipation'); drug list, Amitriptyline (bold): 'Sedative, Antimuscarinic action'"}, {"id": "mk4-q55", "n": 55, "part": 1, "title": null, "stem": "A 34-year-old woman has a rare genetic disorder (Urbach-Wiethe syndrome) that has destroyed both amygdalae. Which deficit fits the course's description of bilateral amygdala damage?", "options": [{"letter": "A", "text": "Inability to form new long-term memories of facts and events"}, {"letter": "B", "text": "Impaired looking at the eyes and discrimination of facial expressions, with poor respect for others' personal space"}, {"letter": "C", "text": "Loss of the ability to learn new motor skills"}, {"letter": "D", "text": "Excessive fear and anxiety in social settings"}, {"letter": "E", "text": "Inability to recognize familiar faces, with normal reading of emotions"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Limbic System", "topic": "Limbic System", "note": null, "blueprint_category": "Limbic System", "learning_objective": "Limbic System LO3", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The amygdala contributes to social cognition through the visual circuit for faces, gaze and social signals. The course says bilateral lesions (typically from Urbach-Wiethe syndrome) impair looking at the eyes, discriminating facial expressions and respecting personal space.", "distractor_explanations": {"A": "This follows bilateral hippocampal (medial temporal) damage.", "C": "Motor skill learning relies on the striatum, cerebellum and motor cortex.", "D": "The amygdala is hyperactive in anxiety; destroying it reduces fear.", "E": "Face identity recognition depends on the fusiform face region, not the amygdala."}, "source": "Wk3 packet p.56-57 ('Bilateral amygdala lesions (typically caused by a rare genetic disorder called Urbach-Wiethe syndrome) impair looking at the eyes, the discrimination of facial expressions, and the ability to respect the personal space of others')"}, {"id": "mk4-q56", "n": 56, "part": 1, "title": null, "stem": "A second-trimester ultrasound of a 28-year-old woman shows a fetus with no cranial vault and an absent forebrain. Before her next pregnancy, which advice best lowers the risk of this defect?", "options": [{"letter": "A", "text": "Take high-dose vitamin A to support neural tube closure"}, {"letter": "B", "text": "Avoid folic acid, because it raises the risk of neural tube defects"}, {"letter": "C", "text": "Take folic acid supplements and avoid excess vitamin A (retinoids)"}, {"letter": "D", "text": "Take iron, because iron deficiency prevents rostral neuropore closure"}, {"letter": "E", "text": "No change is needed, because this defect comes from failed caudal neuropore closure"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Embryo Disorders of CNS", "topic": "Embryo Disorders of CNS", "note": null, "blueprint_category": "Embryo Disorders of CNS", "learning_objective": "Embryological Disorders LO2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "This is anencephaly: failed closure of the rostral neuropore. The course states that neural tube closure defects can be prevented with folic acid and by avoiding excess vitamin A (retinol/retinoic acid).", "distractor_explanations": {"A": "Excess vitamin A (retinoic acid) is itself a risk factor.", "B": "Folic acid is protective.", "D": "The course names folate and retinoic acid, not iron.", "E": "Anencephaly comes from failed closure of the rostral (cranial) neuropore, and it is preventable."}, "source": "Wk1 packet p.190-191 ('These conditions can be prevented with folic acid supplementation and prevention of excess Vitamin A'; 'Folate and retinoic acid are vital metabolites for ensuring closure of the cranial neuropore')"}, {"id": "mk4-q57", "n": 57, "part": 1, "title": null, "stem": "After sitting with his legs crossed for hours, a 30-year-old man has foot drop. Nerve studies show a conduction block at the fibular head, but the nerve conducts normally below it. He recovers fully in 3 weeks. Which injury did he have?", "options": [{"letter": "A", "text": "Axonotmesis with Wallerian degeneration and regrowth along intact sheaths"}, {"letter": "B", "text": "Neurapraxia: axons compressed but not cut, with no Wallerian degeneration"}, {"letter": "C", "text": "Neurotmesis requiring surgical repair"}, {"letter": "D", "text": "Wallerian degeneration of the proximal segment only"}, {"letter": "E", "text": "Death of the lower motor neuron cell bodies"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Axon Repair", "topic": "Axon Repair", "note": null, "blueprint_category": "Axon Repair", "learning_objective": "Axon Repair LO1", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Neurapraxia is the mildest injury: axons are compressed and temporarily blocked but intact, so there is no Wallerian degeneration, the distal nerve still conducts, and recovery is quick and complete.", "distractor_explanations": {"A": "Distal axons would degenerate and stop conducting, and regrowth would take months.", "C": "Complete disruption would not recover by itself in 3 weeks.", "D": "Wallerian degeneration affects the segment distal to the injury.", "E": "Cell death would not allow full, quick recovery."}, "source": "Wk2 packet p.50 ('Neurapraxia is the mildest form of injury where the axons are compressed and rendered temporarily inactive, but they are not physically interrupted. Neurapraxia does not lead to Wallerian degeneration')"}, {"id": "mk4-q58", "n": 58, "part": 1, "title": null, "stem": "A 30-year-old man has a skull-base fracture that passes through the right foramen rotundum. Which deficit is most likely?", "options": [{"letter": "A", "text": "Numbness of the right forehead and upper eyelid"}, {"letter": "B", "text": "Numbness of the right lower lip and chin"}, {"letter": "C", "text": "Numbness of the skin of the right cheek, upper lip and side of the nose"}, {"letter": "D", "text": "Weak chewing on the right"}, {"letter": "E", "text": "Loss of taste on the right anterior two-thirds of the tongue"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Protecting the Brain", "topic": "Protecting the Brain", "note": null, "blueprint_category": "Protecting the Brain", "learning_objective": "Protecting the Brain LO8", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The foramen rotundum transmits the maxillary nerve (V2), which carries sensation from the cheek, lower eyelid, side of the nose, upper lip and upper teeth.", "distractor_explanations": {"A": "That is V1, which leaves through the superior orbital fissure.", "B": "That is V3 (inferior alveolar and mental nerves), which leaves through the foramen ovale.", "D": "The motor root runs with V3 through the foramen ovale.", "E": "Taste there travels in the chorda tympani (CN VII)."}, "source": "Wk1 packet p.37 foramina table ('Foramen rotundum / Sphenoid / Maxillary nerve (CN V2)')"}, {"id": "mk4-q59", "n": 59, "part": 1, "title": null, "stem": "A 58-year-old woman receiving a chemotherapy drug that prevents microtubule assembly develops numb feet. Delivery of synaptic vesicles and mitochondria from the cell body to the axon terminals is impaired. Which transport process and motor protein are affected?", "options": [{"letter": "A", "text": "Retrograde transport by dynein"}, {"letter": "B", "text": "Anterograde transport by myosin along neurofilaments"}, {"letter": "C", "text": "Anterograde transport by kinesin"}, {"letter": "D", "text": "Retrograde transport by kinesin"}, {"letter": "E", "text": "Passive diffusion through the axoplasm"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Histology of CNS 1: Neurons and Glia", "topic": "Histology of CNS 1: Neurons and Glia", "note": null, "blueprint_category": "Histology of CNS 1: Neurons and Glia", "learning_objective": "Histology CNS 1 LO2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Anterograde transport (soma to terminal: vesicles, mitochondria, proteins) uses kinesin on microtubules. Chemotherapy that prevents microtubule formation blocks it, and the longest axons (feet) suffer first.", "distractor_explanations": {"A": "Retrograde transport carries material from the terminal back to the soma, the opposite of the cargo described.", "B": "Axonal transport runs on microtubules, and neurofilaments give structure, not tracks.", "D": "Mismatched pairing: kinesin moves cargo anterogradely.", "E": "Diffusion is far too slow to supply long axons, and it needs no microtubules."}, "source": "Wk1 packet p.178 ('Anterograde transport moves synaptic vesicles, mitochondria, and proteins from the soma to the axon terminal, using kinesin motor proteins. The interruption of anterograde transport (through ... chemotherapy that prevents the synthesis of microtubules)...')"}, {"id": "mk4-q60", "n": 60, "part": 1, "title": null, "stem": "A 52-year-old woman has 2 weeks of worsening headache behind her left eye. Her left eyelid droops, the left eye rests down and out, and the left pupil is large and does not constrict to light. Vision is normal. An aneurysm at which site best explains her findings?", "options": [{"letter": "A", "text": "The right posterior communicating artery"}, {"letter": "B", "text": "The left posterior communicating artery, where it arises from the internal carotid"}, {"letter": "C", "text": "The anterior communicating artery"}, {"letter": "D", "text": "The left middle cerebral artery bifurcation"}, {"letter": "E", "text": "The left vertebral artery near the foramen magnum"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Protecting the Brain", "topic": "Protecting the Brain", "note": null, "blueprint_category": "Protecting the Brain", "learning_objective": "Protecting the Brain LO1", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": true, "thursday_11_5": false, "explanation": "Ptosis, a down-and-out eye and a dilated, unreactive pupil = left CN III palsy. The pupil is involved because the parasympathetic fibers run on the outside of the nerve, where compression hits first. A posterior communicating artery aneurysm sits right next to CN III.", "distractor_explanations": {"A": "The oculomotor palsy is on the left, and an aneurysm compresses the nerve on its own side.", "C": "A classic aneurysm site, but it lies in front of the optic chiasm, far from CN III.", "D": "This lies in the lateral sulcus, away from the course of CN III.", "E": "This could compress the lower cranial nerves (IX-XII), not CN III."}, "source": "Wk1 packet p.123 ('A posterior communicating artery aneurysm is also clinically important because it can compress CN III and produce a third nerve palsy')"}, {"id": "mk4-q61", "n": 61, "part": 1, "title": null, "stem": "A 58-year-old man with migraine had a myocardial infarction last year and has stable coronary artery disease. He needs a drug to take at the start of his attacks. Which is the best choice?", "options": [{"letter": "A", "text": "Sumatriptan"}, {"letter": "B", "text": "Amitriptyline"}, {"letter": "C", "text": "Verapamil"}, {"letter": "D", "text": "Naloxone"}, {"letter": "E", "text": "Rimegepant"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Headaches", "topic": "Headaches", "note": null, "blueprint_category": "Headaches", "learning_objective": "Headache LO6", "difficulty": 3, "format": "vignette", "drug_item": "Rimegepant", "laterality": false, "thursday_11_5": false, "explanation": "Gepants such as rimegepant block CGRP receptors and work for acute migraine. They do not constrict blood vessels, so they suit patients with coronary disease, in whom triptans are contraindicated. Main side effects: GI upset (nausea) and allergic reactions.", "distractor_explanations": {"A": "A 5-HT1B/1D agonist that can cause coronary vasospasm; contraindicated after an MI.", "B": "Used for prevention (and tension-type headache), not to abort an attack.", "C": "Used to prevent cluster headaches.", "D": "An opioid antagonist used for overdose, not migraine."}, "source": "Drug list, Migraine: Sumatriptan (bold) 'coronary artery vasospasm, Contraindicated in individuals with previous MI'; Rimegepant (bold) 'CGRP receptor antagonist; GI issues, allergic reactions'; Wk2 packet p.92 and p.137 (gepants for acute treatment)"}, {"id": "mk4-q62", "n": 62, "part": 1, "title": null, "stem": "The optic nerve is formed by the axons of which retinal cells, which converge at the optic disc?", "options": [{"letter": "A", "text": "Rods and cones"}, {"letter": "B", "text": "Bipolar cells"}, {"letter": "C", "text": "Amacrine cells"}, {"letter": "D", "text": "Neurons of the lateral geniculate nucleus"}, {"letter": "E", "text": "Retinal ganglion cells"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Cranial Nerves Module", "topic": "Cranial Nerves Module", "note": null, "blueprint_category": "Cranial Nerves Module", "learning_objective": "CN Modules LO2 (CN II)", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Retinal ganglion cell axons gather at the optic disc to form the optic nerve, which projects through the chiasm and optic tract to the thalamus (lateral geniculate nucleus); the thalamus relays to the primary visual cortex.", "distractor_explanations": {"A": "Photoreceptors are the first cells in the pathway and do not send axons out of the eye.", "B": "Bipolar cells relay from photoreceptors to ganglion cells within the retina.", "C": "Amacrine cells are retinal interneurons that do not leave the eye.", "D": "These thalamic neurons receive the optic tract and project to the visual cortex."}, "source": "Wk1 packet p.159, Figure 3 caption ('The axons of the retinal ganglion cells combine at the optic disc to form the optic nerve. The optic nerves then project to the thalamus')"}, {"id": "mk4-q63", "n": 63, "part": 1, "title": null, "stem": "A 30-year-old man with focal seizures has taken the same antiseizure drug for 3 years. It prolongs fast inactivation of voltage-gated Na+ channels and induces CYP3A4. He now has overgrown gums, horizontal nystagmus and an unsteady gait. Which drug is it?", "options": [{"letter": "A", "text": "Carbamazepine"}, {"letter": "B", "text": "Lamotrigine"}, {"letter": "C", "text": "Valproate"}, {"letter": "D", "text": "Phenytoin"}, {"letter": "E", "text": "Ethosuximide"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Antiepileptics", "topic": "Antiepileptics", "note": null, "blueprint_category": "Antiepileptics", "learning_objective": "Antiepileptics LO2", "difficulty": 2, "format": "vignette", "drug_item": "Phenytoin", "laterality": false, "thursday_11_5": true, "explanation": "Phenytoin prolongs fast inactivation of voltage-gated Na+ channels, induces CYP3A4 and CYP2C9, and causes gingival enlargement, horizontal gaze nystagmus, cerebellar ataxia and sedation. It is also a teratogen.", "distractor_explanations": {"A": "Also a Na+ channel blocker and enzyme inducer, but gum overgrowth is the phenytoin signature (Claude's note on the drug-list rows).", "B": "Its key warning is serious rash (SJS/TEN), and it is not a major enzyme inducer.", "C": "Acts by several mechanisms and inhibits liver enzymes; key risks are hepatotoxicity and teratogenicity.", "E": "Blocks T-type Ca2+ channels and is used for absence seizures."}, "source": "Drug list, Epilepsy: Phenytoin (bold) 'Prolong fast inactivation of voltage gated sodium channels / Induces CYP3A4 & CYP2C9, Teratogen, horizontal gaze nystagmus, sedation, cerebellar ataxia ... gingival enlargement'"}, {"id": "mk4-q64", "n": 64, "part": 1, "title": null, "stem": "Pain from inflamed meninges of the anterior and middle cranial fossae travels in trigeminal afferents. In which nuclei are the second- and third-order neurons of this pathway?", "options": [{"letter": "A", "text": "The main (principal) sensory nucleus of V, then the ventral posterolateral (VPL) nucleus"}, {"letter": "B", "text": "The mesencephalic nucleus of V, then VPM"}, {"letter": "C", "text": "The dorsal horn of the lumbar cord, then VPL"}, {"letter": "D", "text": "The nucleus of the solitary tract, then VPM"}, {"letter": "E", "text": "The spinal trigeminal nucleus in the medulla, then the ventral posteromedial (VPM) nucleus of the thalamus"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Headaches", "topic": "Headaches", "note": null, "blueprint_category": "Headaches", "learning_objective": "Headache LO3", "difficulty": 2, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Trigeminal nociceptive fibers synapse in the ipsilateral spinal trigeminal nucleus in the medulla. The second-order axons cross and ascend (trigeminothalamic tract) to the VPM nucleus, and third-order neurons project to the sensory cortex.", "distractor_explanations": {"A": "The principal nucleus handles discriminative touch, and VPL serves the body, not the head.", "B": "The mesencephalic nucleus holds first-order proprioceptive neurons from the jaw muscles.", "C": "That is the route for pain from the legs.", "D": "That is the taste and visceral sensory pathway."}, "source": "Wk2 packet p.135 ('Trigeminal nerves synapse in the ipsilateral spinal trigeminal nucleus located in the medulla, sending their axons across midline ... After reaching the ventral posteromedial nucleus of the thalamus')"}, {"id": "mk4-q65", "n": 65, "part": 1, "title": null, "stem": "A 77-year-old man has trouble remembering appointments and names, and testing confirms decline beyond what is expected for his age. He still manages his own finances, medications and driving. Which term fits best?", "options": [{"letter": "A", "text": "Dementia"}, {"letter": "B", "text": "Normal cognitive aging"}, {"letter": "C", "text": "Delirium"}, {"letter": "D", "text": "Mild cognitive impairment"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Aging and Neurodegenerative Disorders", "topic": "Aging and Neurodegenerative Disorders", "note": null, "blueprint_category": "Aging and Neurodegenerative Disorders", "learning_objective": "Aging & Neurodegeneration LO1", "difficulty": 1, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The line between mild cognitive impairment and dementia is independence: in MCI, objective decline exists but daily activities are preserved. Dementia is acquired decline severe enough to interfere with independence.", "distractor_explanations": {"A": "Dementia requires decline severe enough to interfere with independence.", "B": "Testing shows decline beyond what is expected for age.", "C": "Delirium is an acute, fluctuating disturbance of attention."}, "source": "Wk3 packet p.101 ('Dementia refers to an acquired decline in cognitive function that becomes severe enough to interfere with a person's independence')"}, {"id": "mk4-q66", "n": 66, "part": 1, "title": null, "stem": "In the substantia nigra of a patient with Parkinson disease, brown granular pigment lies free in the tissue and inside macrophages, in areas where pigmented neurons should be. What does this finding indicate?", "options": [{"letter": "A", "text": "Dopaminergic neurons have died and released neuromelanin, which macrophages have taken up"}, {"letter": "B", "text": "Hemosiderin from an old hemorrhage"}, {"letter": "C", "text": "Lipofuscin building up in healthy aging neurons"}, {"letter": "D", "text": "Lewy bodies made of alpha-synuclein"}, {"letter": "E", "text": "Iron-laden astrocytes reacting to inflammation"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Neuropathology of Neurodegenerative Diseases Lab", "topic": "Neuropathology of Neurodegenerative Diseases Lab", "note": null, "blueprint_category": "Neuropathology of Neurodegenerative Diseases Lab", "learning_objective": "Neuropath Lab LO4", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": true, "explanation": "Nigral dopaminergic neurons contain neuromelanin. As they die in Parkinson disease, they release the granules into the tissue, where macrophages phagocytose them. Free pigment and pigment-laden macrophages mark neuron loss.", "distractor_explanations": {"B": "Nothing suggests bleeding; in Parkinson disease the pigment comes from dying nigral neurons.", "C": "Lipofuscin stays inside living neurons.", "D": "Lewy bodies are round, eosinophilic inclusions inside neurons, not brown pigment.", "E": "This is not how the course explains the pigment."}, "source": "Wk3 packet p.154 ('As the disease progresses and neurons die, they release their neuromelanin pigment granules into the parenchyma, which are then phagocytosed by macrophages')"}, {"id": "mk4-q67", "n": 67, "part": 1, "title": null, "stem": "To create an emergency airway, a physician feels for and incises a membrane in the anterior midline of the neck. This membrane connects which two structures?", "options": [{"letter": "A", "text": "The thyroid cartilage and the cricoid cartilage"}, {"letter": "B", "text": "The hyoid bone and the thyroid cartilage"}, {"letter": "C", "text": "The cricoid cartilage and the first tracheal ring"}, {"letter": "D", "text": "The thyroid cartilage and the epiglottis"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Neck Anatomy", "topic": "Neck Anatomy", "note": null, "blueprint_category": "Neck Anatomy", "learning_objective": "Neck ILM LO1", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The cricothyroid membrane lies between the thyroid and cricoid cartilages. It is palpable in the midline and can be opened to establish an emergency airway.", "distractor_explanations": {"B": "That is the thyrohyoid membrane, above the vocal cords; an opening there would not bypass the larynx.", "C": "This lies below the cricothyroid membrane and is not the emergency site described.", "D": "This connection is inside the larynx and cannot be felt or reached through the skin."}, "source": "Wk1 packet p.55 ('Between these two cartilages is a palpable membrane (cricothyroid membrane) that can be opened to establish an emergency airway')"}, {"id": "mk4-q68", "n": 68, "part": 1, "title": null, "stem": "A 12-year-old boy with a known epilepsy syndrome has brief episodes in which his head suddenly drops forward or his knees buckle, sometimes making him fall. There is no stiffening or jerking, and he recovers within seconds. Which seizure type is this?", "options": [{"letter": "A", "text": "Tonic seizure"}, {"letter": "B", "text": "Myoclonic seizure"}, {"letter": "C", "text": "Absence seizure"}, {"letter": "D", "text": "Focal seizure with impaired awareness"}, {"letter": "E", "text": "Atonic seizure"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Seizures & Epilepsy", "topic": "Seizures & Epilepsy", "note": null, "blueprint_category": "Seizures & Epilepsy", "learning_objective": "Seizures LO11", "difficulty": 1, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": true, "explanation": "Atonic seizures cause a sudden loss of muscle tone: a head drop or knee buckle if brief, a collapse if more muscles are involved. Recovery is fast, and they can be mistaken for syncope or 'drop attacks'.", "distractor_explanations": {"A": "Tonic seizures cause sustained stiffening.", "B": "Myoclonic seizures are brief shock-like jerks.", "C": "Absence seizures are brief staring spells without falls.", "D": "These last longer, with automatisms and post-event confusion."}, "source": "Wk3 packet p.142 (LO11 Atonic seizures: 'sudden loss or marked reduction of muscle tone ... quick head drop or momentary buckling of the knees ... Recovery is often rapid')"}, {"id": "mk4-q69", "n": 69, "part": 1, "title": null, "stem": "A 50-year-old woman has a meningioma confined to the posterior cranial fossa. Which brain structure is it most likely to compress?", "options": [{"letter": "A", "text": "The cerebellum"}, {"letter": "B", "text": "The occipital lobe"}, {"letter": "C", "text": "The temporal lobe"}, {"letter": "D", "text": "The frontal lobe"}, {"letter": "E", "text": "The pituitary gland"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Protecting the Brain", "topic": "Protecting the Brain", "note": null, "blueprint_category": "Protecting the Brain", "learning_objective": "Protecting the Brain LO6", "difficulty": 1, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The posterior cranial fossa (mainly occipital bone) holds the brainstem, cerebellum, sigmoid sinus and the roots of CN IX-XII. The occipital lobes sit above the tentorium cerebelli.", "distractor_explanations": {"B": "The occipital lobe lies above the tentorium, not in the posterior cranial fossa.", "C": "The temporal lobe sits in the middle cranial fossa.", "D": "The frontal lobe rests in the anterior cranial fossa.", "E": "The pituitary sits in the sella turcica of the middle cranial fossa."}, "source": "Wk1 packet p.105 ('Posterior Cranial Fossa: Occipital bone / Brainstem / Cerebellum / Sigmoid Sinus / Cranial Nerves IX through XII')"}, {"id": "mk4-q70", "n": 70, "part": 1, "title": null, "stem": "Which cutaneous receptor is a spindle-shaped, slowly adapting ending in the dermis that responds to sustained stretching of the skin?", "options": [{"letter": "A", "text": "Pacinian corpuscle"}, {"letter": "B", "text": "Meissner corpuscle"}, {"letter": "C", "text": "Merkel disc"}, {"letter": "D", "text": "Free nerve ending"}, {"letter": "E", "text": "Ruffini ending"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Somatosensory Receptors and Tracts", "topic": "Somatosensory Receptors and Tracts", "note": null, "blueprint_category": "Somatosensory Receptors and Tracts", "learning_objective": "Sensory Receptors LO1", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Ruffini endings are spindle-shaped, slowly adapting Abeta mechanoreceptors in the dermis and joints that keep firing during stretch of the skin.", "distractor_explanations": {"A": "Rapidly adapting; detects vibration and deep pressure.", "B": "Rapidly adapting; sits in the dermal papillae and detects light touch and flutter.", "C": "Slowly adapting, but sits at the base of the epidermis and signals pressure and texture.", "D": "Detects pain and temperature, not skin stretch."}, "source": "Wk2 packet p.5 receptor table ('Ruffini ... spindle-shaped ... detect stretching-related deformation of the skin and joints ... Slow adapting')"}, {"id": "mk4-q71", "n": 71, "part": 1, "title": null, "stem": "On the motor homunculus of the precentral gyrus, which body regions have a disproportionately large representation?", "options": [{"letter": "A", "text": "The trunk and hips"}, {"letter": "B", "text": "The hand, face and tongue"}, {"letter": "C", "text": "The thigh and leg"}, {"letter": "D", "text": "The neck and shoulders"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Corticospinal and UMN/LMN", "topic": "Corticospinal and UMN/LMN", "note": null, "blueprint_category": "Corticospinal and UMN/LMN", "learning_objective": "Descending Motor LO1", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Regions with fine motor control (hand, face, tongue) have more upper motor neurons devoted to them, so they are magnified on the homunculus.", "distractor_explanations": {"A": "Axial regions with coarse control have small representations.", "C": "The leg area on the medial surface is relatively small.", "D": "These have modest representations compared with the hand and face."}, "source": "Wk2 packet p.24 (Figure 1 homunculus; 'Note magnification of the hand, face, and tongue')"}, {"id": "mk4-q72", "n": 72, "part": 1, "title": null, "stem": "A 68-year-old man has taken an antiarrhythmic drug with a very long half-life for atrial fibrillation for 2 years. He now has slowly progressive numbness, tingling and weakness of his feet. Which drug most likely caused his neuropathy?", "options": [{"letter": "A", "text": "Digoxin"}, {"letter": "B", "text": "Metoprolol"}, {"letter": "C", "text": "Amiodarone"}, {"letter": "D", "text": "Warfarin"}, {"letter": "E", "text": "Diltiazem"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Peripheral Neuropathies", "topic": "Peripheral Neuropathies", "note": null, "blueprint_category": "Peripheral Neuropathies", "learning_objective": "Peripheral Neuropathy LO6", "difficulty": 1, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The course lists amiodarone as a drug that causes sensory and motor neuropathy. It develops insidiously and needs monitoring because of the drug's long half-life.", "distractor_explanations": {"A": "Digoxin toxicity causes nausea, visual changes and arrhythmias, not a typical neuropathy (Claude's general-knowledge note).", "B": "Beta-blockers are not a recognized cause of neuropathy.", "D": "Warfarin's main risk is bleeding.", "E": "Calcium channel blockers are not a recognized cause of neuropathy."}, "source": "Wk2 packet p.68 ('Amiodarone: antiarrhythmic agent that can cause both sensory and motor neuropathy ... due to the drug's long half-life')"}, {"id": "mk4-q73", "n": 73, "part": 1, "title": null, "stem": "A small tumor presses on the left ventral brainstem at the pontomedullary junction, right next to the midline just above the pyramid. Which cranial nerve is most likely affected first, and what sign results?", "options": [{"letter": "A", "text": "Left abducens nerve; the left eye cannot abduct"}, {"letter": "B", "text": "Left facial nerve; weakness of the left side of the face"}, {"letter": "C", "text": "Left vestibulocochlear nerve; left hearing loss"}, {"letter": "D", "text": "Right abducens nerve; the right eye cannot abduct"}, {"letter": "E", "text": "Left hypoglossal nerve; the tongue deviates to the left"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Cranial Nerves Module", "topic": "Cranial Nerves Module", "note": null, "blueprint_category": "Cranial Nerves Module", "learning_objective": "CN Modules LO1", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": true, "thursday_11_5": false, "explanation": "At the pontomedullary junction the abducens exits closest to the midline, just above the pyramid; the facial nerve exits more laterally and the vestibulocochlear most laterally ('midline = motor'). A left CN VI lesion stops the left lateral rectus, so the left eye cannot look out.", "distractor_explanations": {"B": "CN VII exits more laterally, near the anterolateral sulcus.", "C": "CN VIII exits the most laterally at this junction.", "D": "The tumor is on the left, and the nerve is affected on its own side.", "E": "CN XII exits lower, from the medulla between the pyramid and olive."}, "source": "Wk1 packet p.154 ('The GSE abducens (CN VI) n. closest to the midline, above the pyramids'; 'Midline = Motor')"}, {"id": "mk4-q74", "n": 74, "part": 1, "title": null, "stem": "The posterior one-third of the tongue grows from which pharyngeal arch?", "options": [{"letter": "A", "text": "Third arch"}, {"letter": "B", "text": "First arch"}, {"letter": "C", "text": "Second arch"}, {"letter": "D", "text": "Fourth arch"}, {"letter": "E", "text": "Sixth arch"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Face Embryology", "topic": "Face Embryology", "note": null, "blueprint_category": "Face Embryology", "learning_objective": "Face Embryology LO5", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Anterior two-thirds = first arch, which overgrows the second-arch tissue. Posterior one-third = third arch. The sulcus terminalis marks the line of fusion, with the foramen cecum at its apex. This is why the posterior third is supplied by the third-arch nerve, CN IX.", "distractor_explanations": {"B": "The first arch forms the anterior two-thirds (lingual swellings and tuberculum impar).", "C": "The second-arch tissue of the copula is overgrown and contributes little to the adult tongue surface.", "D": "The fourth arch contributes to the region of the epiglottis, not the posterior third of the tongue.", "E": "The sixth arch forms laryngeal structures."}, "source": "Wk1 packet p.30 ('the anterior 2/3 is from the first arch overgrowing the tissue from arch 2, and the posterior 1/3 is from the third arch')"}, {"id": "mk4-q75", "n": 75, "part": 1, "title": null, "stem": "In a brain slice experiment, a toxin that blocks presynaptic voltage-gated Ca2+ channels is applied. Action potentials still reach the axon terminals. What happens to synaptic transmission?", "options": [{"letter": "A", "text": "Release increases, because Ca2+ normally holds vesicles back"}, {"letter": "B", "text": "Action potentials fail to reach the terminal"}, {"letter": "C", "text": "Vesicle fusion and transmitter release fail, because Ca2+ entry triggers exocytosis"}, {"letter": "D", "text": "Release is normal, but postsynaptic receptors are blocked"}, {"letter": "E", "text": "Vesicles are released continuously because the terminal cannot repolarize"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Synaptic transmission and neurotransmitters", "topic": "Synaptic transmission and neurotransmitters", "note": null, "blueprint_category": "Synaptic transmission and neurotransmitters", "learning_objective": "Synaptic Transmission LO2, LO4", "difficulty": 2, "format": "research scenario", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "When the action potential depolarizes the terminal, voltage-gated Ca2+ channels open. Ca2+ entry triggers vesicle fusion and quantal release. Without Ca2+ entry, release stops even though the terminal depolarizes.", "distractor_explanations": {"A": "Ca2+ entry is the trigger for release, not a brake.", "B": "The stem states that they still arrive; this toxin does not block Na+ channels.", "D": "The toxin acts on presynaptic Ca2+ channels, not on receptors.", "E": "Blocking Ca2+ entry stops release; it does not cause continuous release."}, "source": "Wk3 packet p.26 (Figure 9 caption: 'the depolarization activates the opening of voltage sensitive calcium channels. Calcium triggers the vesicle ... to fuse with the membrane and release its contents')"}, {"id": "mk4-q76", "n": 76, "part": 1, "title": null, "stem": "A 67-year-old man with prostate cancer that has spread to the sacrum develops numbness of the buttocks and perineum. He cannot empty his bladder. Damage to which fibers best explains the urinary retention?", "options": [{"letter": "A", "text": "Sympathetic fibers from T10-L2"}, {"letter": "B", "text": "Somatic motor fibers of the pudendal nerve to the external urethral sphincter"}, {"letter": "C", "text": "Upper motor neurons in the lateral corticospinal tracts"}, {"letter": "D", "text": "Sensory fibers of the L1-L2 roots"}, {"letter": "E", "text": "Preganglionic parasympathetic fibers in the S2-S4 roots (pelvic splanchnic nerves)"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Cauda Equina and Conus Medullaris", "topic": "Cauda Equina and Conus Medullaris", "note": null, "blueprint_category": "Cauda Equina and Conus Medullaris", "learning_objective": "Cauda Equina LO2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Bladder emptying depends on parasympathetic fibers in the pelvic splanchnic nerves from S2-S4. Compression of the sacral roots in cauda equina syndrome typically causes urinary retention, later with overflow incontinence.", "distractor_explanations": {"A": "Sympathetic input favors urine storage; losing it would not cause retention.", "B": "Losing these causes incontinence, not inability to void.", "C": "The cauda equina contains roots (lower motor neurons), not cord tracts.", "D": "These roots do not carry the parasympathetic supply to the bladder."}, "source": "Wk2 packet p.126 ('bowel and bladder dysfunction (mediated by the pelvic splanchnic nerves, which originate from the S2, S3, and S4 sacral spinal nerves) ... Most typically the patient cannot urinate (urinary retention)')"}, {"id": "mk4-q77", "n": 77, "part": 1, "title": null, "stem": "A 25-year-old woman has had three episodes of a rising feeling in her stomach followed by unresponsiveness and lip-smacking. A 30-minute routine EEG recorded between episodes is normal. What is the correct interpretation?", "options": [{"letter": "A", "text": "Epilepsy has been ruled out"}, {"letter": "B", "text": "The events must be psychogenic"}, {"letter": "C", "text": "The EEG detects only generalized seizures, so it is not useful here"}, {"letter": "D", "text": "A normal routine EEG does not rule out epilepsy; prolonged or video-EEG monitoring can capture an event"}, {"letter": "E", "text": "An abnormal EEG is required before the diagnosis can be made"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Seizures & Epilepsy", "topic": "Seizures & Epilepsy", "note": null, "blueprint_category": "Seizures & Epilepsy", "learning_objective": "Seizures LO1", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": true, "explanation": "Between seizures, epileptiform spikes or sharp waves support the diagnosis, but they are intermittent. A normal routine EEG does not rule out epilepsy, and an isolated EEG abnormality should not be over-read. Recording an event (video-EEG) shows where it starts.", "distractor_explanations": {"A": "Epileptiform activity is intermittent and may not appear during a short recording.", "B": "A normal interictal EEG does not prove that the events are functional.", "C": "EEG can show focal activity; a short recording simply missed it.", "E": "Epilepsy is a clinical diagnosis supported, not defined, by the EEG."}, "source": "Wk3 packet p.134 ('A normal routine EEG does not rule out epilepsy, since abnormal activity may be intermittent and simply not occur during the recording')"}, {"id": "mk4-q78", "n": 78, "part": 2, "title": "Gross anatomy lab image: Face", "stem": "Identify the muscle indicated by the arrow.", "options": [{"letter": "A", "text": "Zygomaticus minor"}, {"letter": "B", "text": "Levator labii superioris"}, {"letter": "C", "text": "Zygomaticus major"}, {"letter": "D", "text": "Orbicularis oris"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock4-images/lab-face-1.png", "image_needed": true, "week": 1, "session_guess": "Lab 1 (10/20)", "topic": "Face", "note": null, "blueprint_category": "Gross Anatomy Lab Image: Face", "learning_objective": "Lab 1 (10/20) LO1 (identify structures on the structure list)", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrow is on the long strap of muscle running from the zygomatic bone down and medially to the angle of the mouth, lateral and inferior to zygomaticus minor. It draws the corner of the mouth up and back in smiling and is supplied by facial nerve branches.", "distractor_explanations": {"A": "Zygomaticus minor runs more medially and steeply, to the upper lip next to levator labii superioris.", "B": "This muscle runs vertically from below the orbit to the upper lip, medial to the zygomatic muscles.", "D": "This is the ring of muscle around the lips."}, "source": "Lab 1 notes (PDF) Fig. 9, superficial facial muscles ('Zygomaticus major' label); Lab 1 structure list (Face muscles: zygomaticus major and minor)", "annotation": {"image": "qbank/midterm1-mock4-images/annotated/lab-face-1.png", "options": {"A": "Labeled \"Zygomaticus minor\"", "B": "Labeled \"Levator labii superioris\"", "C": "Labeled \"Zygomaticus major\" (arrowed)", "D": "Labeled \"Orbicularis oris\""}, "note": null, "how": "Same faculty figure with its labels showing (the full labeled version or the faculty key for the photo). Green box = correct answer; red boxes = other answer choices the figure labels; amber star = the arrowed structure when the key is not a structure name. Arrow redrawn where the question placed it.", "marked": ["A", "B", "C", "D"]}}, {"id": "mk4-q79", "n": 79, "part": 2, "title": "Gross anatomy lab image: Face", "stem": "Identify the artery indicated by the arrow in this deep dissection of the infratemporal fossa.", "options": [{"letter": "A", "text": "Maxillary artery"}, {"letter": "B", "text": "Middle meningeal artery"}, {"letter": "C", "text": "Superficial temporal artery"}, {"letter": "D", "text": "External carotid artery"}, {"letter": "E", "text": "Inferior alveolar artery"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock4-images/lab-face-2.png", "image_needed": true, "week": 1, "session_guess": "Lab 1 (10/20)", "topic": "Face", "note": null, "blueprint_category": "Gross Anatomy Lab Image: Face", "learning_objective": "Lab 1 (10/20) LO1 (identify structures on the structure list)", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The maxillary artery is a terminal branch of the external carotid. It runs forward deep to the neck of the mandible through the infratemporal fossa toward the pterygopalatine fossa, giving off the middle meningeal, inferior alveolar and other branches.", "distractor_explanations":
