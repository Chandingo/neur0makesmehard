 {"B": "A branch of the maxillary artery that runs straight up to the foramen spinosum.", "C": "The other terminal branch of the external carotid; it runs up in front of the ear, superficial to the TMJ.", "D": "The external carotid ends behind the neck of the mandible by dividing into the maxillary and superficial temporal arteries.", "E": "A descending branch that enters the mandibular foramen with the inferior alveolar nerve."}, "source": "Lab 1 notes (PDF) p.10 deep face figure ('Maxillary a.' label); Lab 1 structure list (Face arteries: maxillary artery)", "annotation": {"image": "qbank/midterm1-mock4-images/annotated/lab-face-2.png", "options": {"A": "Labeled \"Maxillary a.\" (arrowed)", "B": "Labeled \"Middle meningeal a.\"", "C": "Labeled \"Superficial temporal a.\"", "D": "Labeled \"External carotid a.\"", "E": "Labeled \"Inferior alveolar a. and n.\""}, "note": null, "how": "Same faculty figure with its labels showing (the full labeled version or the faculty key for the photo). Green box = correct answer; red boxes = other answer choices the figure labels; amber star = the arrowed structure when the key is not a structure name. Arrow redrawn where the question placed it.", "marked": ["A", "B", "C", "D", "E"]}}, {"id": "mk4-q80", "n": 80, "part": 2, "title": "Gross anatomy lab image: Face", "stem": "Identify the nerve indicated by the arrow.", "options": [{"letter": "A", "text": "Lingual nerve"}, {"letter": "B", "text": "Chorda tympani"}, {"letter": "C", "text": "Inferior alveolar nerve"}, {"letter": "D", "text": "Nerve to mylohyoid"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock4-images/lab-face-3.png", "image_needed": true, "week": 1, "session_guess": "Lab 1 (10/20)", "topic": "Face", "note": null, "blueprint_category": "Gross Anatomy Lab Image: Face", "learning_objective": "Lab 1 (10/20) LO1 (identify structures on the structure list)", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrow is on the large V3 branch that descends behind the lingual nerve to enter the mandibular foramen with the inferior alveolar artery. It supplies the lower teeth and ends as the mental nerve to the lower lip and chin.", "distractor_explanations": {"A": "The lingual nerve runs more anteriorly and medially, toward the tongue, and is joined by the chorda tympani.", "B": "A thin branch of CN VII that joins the lingual nerve high in the infratemporal fossa.", "D": "A small branch that leaves the inferior alveolar nerve just before it enters the mandibular foramen."}, "source": "Lab 1 notes (PDF) Fig. 16, infratemporal fossa ('Inferior alveolar n.' label); Wk1 packet p.51", "annotation": {"image": "qbank/midterm1-mock4-images/annotated/lab-face-3.png", "options": {"A": "Labeled \"Lingual n.\"", "B": "Labeled \"Chorda tympani\"", "C": "Labeled \"Inferior alveolar n.\" (arrowed)", "D": "Labeled \"N. to mylohyoid\""}, "note": null, "how": "Same faculty figure with its labels showing (the full labeled version or the faculty key for the photo). Green box = correct answer; red boxes = other answer choices the figure labels; amber star = the arrowed structure when the key is not a structure name. Arrow redrawn where the question placed it.", "marked": ["A", "B", "C", "D"]}}, {"id": "mk4-q81", "n": 81, "part": 2, "title": "Gross anatomy lab image: Neck", "stem": "During a neck operation, the structure indicated by the arrow is cut on that side. Which finding is most likely on the same side?", "options": [{"letter": "A", "text": "Hoarseness from vocal cord paralysis"}, {"letter": "B", "text": "Paralysis of half of the diaphragm"}, {"letter": "C", "text": "Drooping eyelid, small pupil and loss of sweating on the face"}, {"letter": "D", "text": "A dilated pupil that does not react to light"}, {"letter": "E", "text": "Deviation of the tongue toward that side"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock4-images/lab-neck-1.png", "image_needed": true, "week": 1, "session_guess": "Lab 1 (10/20)", "topic": "Neck", "note": null, "blueprint_category": "Gross Anatomy Lab Image: Neck", "learning_objective": "Lab 1 (10/20) LO1 (identify structures); LO5 (dysfunction after injury)", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrow is on the cervical sympathetic trunk, lying on the longus colli behind the carotid sheath with its middle and inferior cervical ganglia. Cutting it removes sympathetic supply to that side of the head: Horner syndrome (ptosis, miosis, anhidrosis).", "distractor_explanations": {"A": "This follows injury to the vagus or recurrent laryngeal nerve.", "B": "This follows injury to the phrenic nerve on the anterior scalene.", "D": "This is an oculomotor (parasympathetic) lesion, the opposite of what happens here.", "E": "This follows a hypoglossal nerve lesion."}, "source": "Lab 1 notes (PDF) p.14 root-of-neck figure ('Sympathetic trunk' label); Wk1 packet p.71 ('a lesion to the sympathetic chain in the neck can cause Horner's syndrome (meiosis ..., ptosis ..., and anhidrosis)')", "annotation": {"image": "qbank/midterm1-mock4-images/annotated/lab-neck-1.png", "options": {"A": "Labeled \"Vagus n. (CN X)\"", "B": "Labeled \"Phrenic n.\"", "C": "The arrowed structure is labeled \"Sympathetic trunk\" (star); cutting it causes this finding", "D": "Not labeled in this figure", "E": "Not labeled in this figure"}, "note": "Arrowed structure = sympathetic trunk (star). Vagus = hoarseness choice; phrenic nerve = diaphragm choice. The oculomotor and hypoglossal nerves are not in this figure.", "how": "Same faculty figure with its labels showing (the full labeled version or the faculty key for the photo). Green box = correct answer; red boxes = other answer choices the figure labels; amber star = the arrowed structure when the key is not a structure name. Arrow redrawn where the question placed it.", "marked": ["A", "B"]}}, {"id": "mk4-q82", "n": 82, "part": 2, "title": "Gross anatomy lab image: External Features", "stem": "Identify the gyrus indicated by the arrow on this lateral view of the left cerebral hemisphere.", "options": [{"letter": "A", "text": "Supramarginal gyrus"}, {"letter": "B", "text": "Angular gyrus"}, {"letter": "C", "text": "Superior parietal lobule"}, {"letter": "D", "text": "Postcentral gyrus"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock4-images/lab-ext-1.png", "image_needed": true, "week": 2, "session_guess": "Lab 2 (10/27)", "topic": "External Features", "note": null, "blueprint_category": "Gross Anatomy Lab Image: External Features", "learning_objective": "Lab 2 (10/27) LO1 (identify structures on the structure list)", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The inferior parietal lobule has two gyri: the supramarginal gyrus, capping the end of the lateral sulcus, and behind it the angular gyrus, capping the end of the superior temporal sulcus. The arrow is on the angular gyrus.", "distractor_explanations": {"A": "The supramarginal gyrus is just in front of this one and caps the upturned end of the lateral sulcus.", "C": "This lies above the intraparietal sulcus.", "D": "This runs vertically just behind the central sulcus."}, "source": "Nolte photo atlas Fig. 1.5A (photo p.32, key p.33 'Angular gyrus'); Wk2 packet p.85 ('the angular gyrus, which similarly caps the superior temporal sulcus'); Lab 2 structure list", "annotation": {"image": "qbank/midterm1-mock4-images/annotated/lab-ext-1.png", "options": {"A": "Labeled \"Supramarginal gyrus\"", "B": "Labeled \"Angular gyrus\" (arrowed)", "C": "Labeled \"Superior parietal lobule\"", "D": "Not labeled in this figure"}, "note": null, "how": "Same faculty figure with its labels showing (the full labeled version or the faculty key for the photo). Green box = correct answer; red boxes = other answer choices the figure labels; amber star = the arrowed structure when the key is not a structure name. Arrow redrawn where the question placed it.", "marked": ["A", "B", "C"]}}, {"id": "mk4-q83", "n": 83, "part": 2, "title": "Gross anatomy lab image: External Features", "stem": "Identify the cranial nerve indicated by the arrow on this ventral view of the brainstem.", "options": [{"letter": "A", "text": "Facial nerve (CN VII)"}, {"letter": "B", "text": "Trigeminal nerve (CN V)"}, {"letter": "C", "text": "Vestibulocochlear nerve (CN VIII)"}, {"letter": "D", "text": "Abducens nerve (CN VI)"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock4-images/lab-ext-2.png", "image_needed": true, "week": 2, "session_guess": "Lab 2 (10/27)", "topic": "External Features", "note": null, "blueprint_category": "Gross Anatomy Lab Image: External Features", "learning_objective": "Lab 2 (10/27) LO1 (identify structures on the structure list)", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The trigeminal nerve leaves the lateral middle of the pons as a large sensory root with a small motor root. It is the thickest cranial nerve stump on the ventral surface.", "distractor_explanations": {"A": "CN VII emerges lower, at the pontomedullary junction.", "C": "CN VIII emerges at the pontomedullary junction, lateral to CN VII.", "D": "CN VI emerges near the midline at the lower border of the pons."}, "source": "Nolte photo atlas Fig. 1.10C (photo p.74, key p.76 'Trigeminal nerve (CN V): motor root / sensory root'); Lab 2 structure list", "annotation": {"image": "qbank/midterm1-mock4-images/annotated/lab-ext-2.png", "options": {"A": "Labeled \"Facial nerve (CN VII)\"", "B": "Labeled \"Trigeminal nerve (CN V): motor root / sensory root\" (arrowed)", "C": "Labeled \"Vestibulocochlear nerve (CN VIII)\"", "D": "Not labeled in this figure"}, "note": null, "how": "Same faculty figure with its labels showing (the full labeled version or the faculty key for the photo). Green box = correct answer; red boxes = other answer choices the figure labels; amber star = the arrowed structure when the key is not a structure name. Arrow redrawn where the question placed it.", "marked": ["A", "B", "C"]}}, {"id": "mk4-q84", "n": 84, "part": 2, "title": "Gross anatomy lab image: External Features", "stem": "Occlusion of the artery indicated by the arrow would most directly reduce blood supply to which region?", "options": [{"letter": "A", "text": "The lateral surface of the frontal and parietal lobes"}, {"letter": "B", "text": "The medial surface of the frontal and parietal lobes"}, {"letter": "C", "text": "The superior surface of the cerebellum"}, {"letter": "D", "text": "The lateral medulla"}, {"letter": "E", "text": "The occipital lobe and the inferior surface of the temporal lobe"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock4-images/lab-ext-3.png", "image_needed": true, "week": 2, "session_guess": "Lab 2 (10/27)", "topic": "External Features", "note": null, "blueprint_category": "Gross Anatomy Lab Image: External Features", "learning_objective": "Lab 2 (10/27) LO1 (identify structures); LO3 (functional relationships)", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrow is on a posterior cerebral artery, one of the two terminal branches at the top of the basilar artery. It curves around the cerebral peduncle to supply the occipital lobe (including visual cortex) and the inferior temporal lobe.", "distractor_explanations": {"A": "That is the middle cerebral artery territory.", "B": "That is the anterior cerebral artery territory.", "C": "That is supplied by the superior cerebellar artery, which runs just below the arrowed vessel.", "D": "That is supplied by the posterior inferior cerebellar (and vertebral) arteries."}, "source": "Nolte photo atlas Fig. 1.6B (photo p.45, key p.47 'Posterior cerebral artery'); Lab 2 structure list (Posterior cerebral arteries)", "annotation": {"image": "qbank/midterm1-mock4-images/annotated/lab-ext-3.png", "options": {"A": "Labeled \"Middle cerebral artery\", the artery for this territory", "B": "Labeled \"Anterior cerebral artery\", the artery for this territory", "C": "Labeled \"Superior cerebellar artery\", the artery for this territory", "D": "Labeled \"Posterior inferior cerebellar artery\", the artery for this territory", "E": "Labeled \"Posterior cerebral artery\" (arrowed), the artery for this territory"}, "note": "Each choice is boxed on the artery that supplies that territory: posterior cerebral (key), middle cerebral, anterior cerebral, superior cerebellar, posterior inferior cerebellar.", "how": "Same faculty figure with its labels showing (the full labeled version or the faculty key for the photo). Green box = correct answer; red boxes = other answer choices the figure labels; amber star = the arrowed structure when the key is not a structure name. Arrow redrawn where the question placed it.", "marked": ["A", "B", "C", "D", "E"]}}, {"id": "mk4-q85", "n": 85, "part": 2, "title": "Gross anatomy lab image: External Features", "stem": "Identify the structure indicated by the arrow on this inferior view of the brain.", "options": [{"letter": "A", "text": "Infundibulum"}, {"letter": "B", "text": "Mammillary bodies"}, {"letter": "C", "text": "Optic chiasm"}, {"letter": "D", "text": "Oculomotor nerve (CN III)"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock4-images/lab-ext-4.png", "image_needed": true, "week": 2, "session_guess": "Lab 2 (10/27)", "topic": "External Features", "note": null, "blueprint_category": "Gross Anatomy Lab Image: External Features", "learning_objective": "Lab 2 (10/27) LO1 (identify structures on the structure list)", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The mammillary bodies are the paired round bumps behind the infundibulum and in front of the interpeduncular fossa. They receive the fornix and project to the anterior thalamus (mammillothalamic tract).", "distractor_explanations": {"A": "The pituitary stalk lies further forward, just behind the optic chiasm.", "C": "The chiasm is the X-shaped crossing at the front of this region.", "D": "CN III emerges just behind and lateral to this structure, between the cerebral peduncles."}, "source": "Lab 3 notes (docx), Haines ventral view of the brain ('Mammillary body (MB)' label); Lab 2 structure list (Mammillary bodies)", "annotation": {"image": "qbank/midterm1-mock4-images/annotated/lab-ext-4.png", "options": {"A": "Labeled \"Infundibulum\"", "B": "Labeled \"Mammillary body (MB)\" (arrowed)", "C": "Labeled \"Optic chiasm\"", "D": "Not labeled in this figure"}, "note": null, "how": "Same faculty figure with its labels showing (the full labeled version or the faculty key for the photo). Green box = correct answer; red boxes = other answer choices the figure labels; amber star = the arrowed structure when the key is not a structure name. Arrow redrawn where the question placed it.", "marked": ["A", "B", "C"]}}, {"id": "mk4-q86", "n": 86, "part": 2, "title": "Gross anatomy lab image: Internal Features", "stem": "A meningioma arising from the falx cerebri compresses the region indicated by the arrow on both hemispheres. Which deficit is most likely?", "options": [{"letter": "A", "text": "Weakness and numbness of both legs"}, {"letter": "B", "text": "Weakness and numbness of both arms"}, {"letter": "C", "text": "Weakness of both sides of the face"}, {"letter": "D", "text": "Loss of vision in both lower visual fields"}, {"letter": "E", "text": "Expressive aphasia"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock4-images/lab-int-1.png", "image_needed": true, "week": 2, "session_guess": "Lab 2 (10/27)", "topic": "Internal Features", "note": null, "blueprint_category": "Gross Anatomy Lab Image: Internal Features", "learning_objective": "Lab 2 (10/27) LO1 (identify structures); LO3 (functional relationships)", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrow is on the paracentral lobule, the medial continuation of the precentral and postcentral gyri around the top of the central sulcus. It holds the leg (and foot) motor and sensory areas, so a falx mass pressing on both sides affects both legs.", "distractor_explanations": {"B": "The arm areas are on the lateral convexity of the pre- and postcentral gyri.", "C": "The face area is low on the lateral surface, near the lateral sulcus.", "D": "The visual cortex lies along the calcarine sulcus of the occipital lobe.", "E": "Broca's area is in the inferior frontal gyrus."}, "source": "Nolte photo atlas Fig. 1.8A (photo p.52, key p.53 'Paracentral lobule'); Wk2 packet p.85 (posterior paracentral lobule as the medial extension of the postcentral gyrus); Lab 2 structure list", "annotation": {"image": "qbank/midterm1-mock4-images/annotated/lab-int-1.png", "options": {"A": "Labeled \"Paracentral lobule\" (arrowed)", "B": "Not labeled in this figure", "C": "Not labeled in this figure", "D": "Labeled \"Calcarine sulcus\"", "E": "Not labeled in this figure"}, "note": "Box on the paracentral lobule label = key (leg area). The calcarine sulcus (visual cortex) is boxed for the vision choice; the arm, face and Broca areas are on the lateral surface, not in this medial view.", "how": "Same faculty figure with its labels showing (the full labeled version or the faculty key for the photo). Green box = correct answer; red boxes = other answer choices the figure labels; amber star = the arrowed structure when the key is not a structure name. Arrow redrawn where the question placed it.", "marked": ["A", "D"]}}, {"id": "mk4-q87", "n": 87, "part": 2, "title": "Gross anatomy lab image: Internal Features", "stem": "Cerebrospinal fluid passes through the opening indicated by the arrow on its way from which space to which?", "options": [{"letter": "A", "text": "From the third ventricle into the fourth ventricle"}, {"letter": "B", "text": "From the fourth ventricle into the subarachnoid space"}, {"letter": "C", "text": "From the subarachnoid space into the venous sinuses"}, {"letter": "D", "text": "From the third ventricle into the lateral ventricle"}, {"letter": "E", "text": "From the lateral ventricle into the third ventricle"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock4-images/lab-int-2.png", "image_needed": true, "week": 2, "session_guess": "Lab 2 (10/27)", "topic": "Internal Features", "note": null, "blueprint_category": "Gross Anatomy Lab Image: Internal Features", "learning_objective": "Lab 2 (10/27) LO1 (identify structures); LO3 (CSF circulation)", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrow is on the interventricular foramen (of Monro), between the column of the fornix in front and the anterior end of the thalamus behind. Each lateral ventricle drains through it into the third ventricle.", "distractor_explanations": {"A": "That path is the cerebral aqueduct, through the midbrain.", "B": "That is through the median and lateral apertures (Magendie and Luschka).", "C": "That is through arachnoid granulations.", "D": "CSF flows the other way, from the lateral ventricles into the third."}, "source": "Nolte photo atlas Fig. 1.8B (photo p.50, key p.51 'Interventricular foramen'); Lab 3 notes ('the column forms the anterior margin of the interventricular foramen'); Lab 2 structure list", "annotation": {"image": "qbank/midterm1-mock4-images/annotated/lab-int-2.png", "options": {"A": "Labeled \"Aqueduct\"", "B": "Not labeled in this figure", "C": "Not labeled in this figure", "D": "Not labeled in this figure", "E": "Labeled \"Interventricular foramen\" (arrowed)"}, "note": "Green box = interventricular foramen (arrowed). Red box = aqueduct, the passage for the third-to-fourth-ventricle choice.", "how": "Same faculty figure with its labels showing (the full labeled version or the faculty key for the photo). Green box = correct answer; red boxes = other answer choices the figure labels; amber star = the arrowed structure when the key is not a structure name. Arrow redrawn where the question placed it.", "marked": ["A", "E"]}}, {"id": "mk4-q88", "n": 88, "part": 2, "title": "Gross anatomy lab image: Limbic & Cross-Section", "stem": "Identify the gyrus indicated by the arrow on this inferior view of the brain.", "options": [{"letter": "A", "text": "Parahippocampal gyrus"}, {"letter": "B", "text": "Uncus"}, {"letter": "C", "text": "Occipitotemporal (fusiform) gyrus"}, {"letter": "D", "text": "Inferior temporal gyrus"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock4-images/lab-lim-1.png", "image_needed": true, "week": 3, "session_guess": "Lab 3 (11/3)", "topic": "Limbic & Cross-Section", "note": null, "blueprint_category": "Gross Anatomy Lab Image: Limbic & Cross-Section", "learning_objective": "Lab 3 (11/3) LO1 (identify structures on the structure list)", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The parahippocampal gyrus is the most medial gyrus on the inferior temporal surface, medial to the collateral and rhinal sulci. Its front end hooks back as the uncus.", "distractor_explanations": {"B": "The ed. The posterior limb is the white band between the thalamus (medially) and the lentiform nucleus (laterally). It carries corticospinal and thalamocortical fibers.", "distractor_explanations": {"A": "The anterior limb lies between the head of the caudate and the lentiform nucleus, in front of the genu.", "B": "The genu is the bend at the level of the interventricular foramen.", "C": "The globus pallidus is the paler medial part of the lentiform nucleus, lateral to the capsule."}, "source": "Lab 3 notes (docx), Haines axial section ('Posterior limb of internal capsule (PLIntCap)' label); Lab 3 structure list (Internal capsule)", "annotation": {"image": "qbank/midterm1-mock4-images/annotated/lab-lim-2.png", "options": {"A": "Labeled \"Anterior limb of internal capsule (ALIntCap)\"", "B": "Labeled \"Genu of internal capsule (GIntCap)\"", "C": "Labeled \"Globus pallidus (GP): lateral / medial segment\"", "D": "Labeled \"Posterior limb of internal capsule (PLIntCap)\" (arrowed)"}, "note": null, "how": "Same faculty figure with its labels showing (the full labeled version or the faculty key for the photo). Green box = correct answer; red boxes = other answer choices the figure labels; amber star = the arrowed structure when the key is not a structure name. Arrow redrawn where the question placed it.", "marked": ["A", "B", "C", "D"]}}, {"id": "mk4-q90", "n": 90, "part": 2, "title": "Gross anatomy lab image: Brainstem, BG, Cerebellum", "stem": "The region indicated by the arrow, in the floor of the fourth ventricle, overlies a nucleus made of which type of neuron?", "options": [{"letter": "A", "text": "Somatic motor neurons to the tongue muscles"}, {"letter": "B", "text": "Second-order vestibular neurons"}, {"letter": "C", "text": "Preganglionic parasympathetic neurons to the heart, lungs and gut"}, {"letter": "D", "text": "Motor neurons to the lateral rectus"}, {"letter": "E", "text": "Neurons that sense blood-borne toxins and trigger vomiting"}], "answer": "C", "answer_s  labeled version or the faculty key for the photo). Green box = correct answer; red boxes = other answer choices the figure labels; amber star = the arrowed structure when the key is not a structure name. Arrow redrawn where the question placed it.", "marked": ["A", "C", "D", "E"]}}, {"id": "mk4-q91", "n": 91, "part": 2, "title": "Gross anatomy lab image: Brainstem, BG, Cerebellum", "stem": "The large fiber bundle indicated by the arrow carries axons from which source into the cerebellum?", "options": [{"letter": "A", "text": "Deep cerebellar nuclei, as the main cerebellar output"}, {"letter": "B", "text": "Pontine nuclei of the opposite side"}, {"letter": "C", "text": "The spinal cord, through the dorsal spinocerebellar tract"}, {"letter": "D", "text": "The vestibular nuclei"}, {"letter": "E", "text": "The red nucleus, as cerebellar output to the midbrain"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock4-images/lab-bs-2.png", "image_needed": true, "week": 3, "session_guess": "Lab 3 (11/3)", "topic": "Brainstem, BG, Cerebellum", "note": null, "blueprint_category": "Gross Anatomy Lab Image: Brainstem, BG, Cerebellum", "learning_objective": "Lab 3 (11/3) LO1 (identify structures); LO3 (functional relationships)", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrow is on the middle cerebellar peduncle, continuous with the transverse fibers of the pons. It is purely an input pathway: fibers from the contralateral pontine nuclei, relaying corticopontine input to the cerebellar hemispheres.", "distractor_explanations": {"A": "Output leaves mainly through the superior cerebellar peduncle.", "C": "This tract enters through the inferior cerebellar peduncle.", "D": "These connect with the cerebellum near the inferior peduncle.", "E": "Output to the red nucleus leaves through the superior cerebellar peduncle."}, "source": "La atomy Lab Image: Brainstem, BG, Cerebellum", "learning_objective": "Lab 3 (11/3) LO1 (identify structures); LO3 (functional relationships)", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrow is on the posterolateral fissure, between the nodulus (lobule X, part of the flocculonodular lobe) and the uvula (lobule IX, posterior lobe). The primary fissure separates the anterior and posterior lobes.", "distractor_explanations": {"A": "That is the primary fissure, higher on the superior surface.", "B": "The vermis and hemispheres are separated by shallow paravermal grooves, not a transverse fissure (Claude's note).", "C": "The cerebellum is attached by the peduncles and separated by the fourth ventricle.", "D": "That is the horizontal fissure, on the lateral hemisphere."}, "source": "Lab 3 notes (docx) Figure 12, midsagittal cerebellum ('Posterolateral fissure (PostLatFis)' label); Lab 3 notes ('the posterolateral fissure between the posterior and flocculonodular lobes')", "annotation": {"image": "qbank/midterm1-mock4-images/annotated/lab-bs-3.png", "options": {"A": "Labeled \"Primary fissure (PriFis)\"", "B": "Not labeled in this figure", "C": "Not labeled in this figure", "D": "Not labeled in this figure", "E": "Labeled \"Posterolateral fissure (PostLatFis)\" (arrowed)"}, "note": "Green = posterolateral fissure (arrowed, between lobule X, the nodulus, and lobule IX). Red = primary fissure. The other choices are not structures labeled in this figure.", "how": "Same faculty figure with its labels showing (the full labeled version or the faculty key for the photo). Green box = correct answer; red boxes = other answer choices the figure labels; amber star = the arrowed structure when the key is not a structure name. Arrow redrawn where the question placed it.", "marked": ["A", "E"]}}]}</script>
<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById("exam-data").textContent);
const Q = DATA.questions.slice().sort((a,b)=>a.n-b.n);
const N = Q.length;
const byN = {}; Q.forEach(q=>byN[q.n]=q);
const imgSrc = q => q.image ? "m4-" + q.image.split("/").pop().replace(/\.png$/i,".jpg") : null;
const annSrc = q => q.annotation && q.annotation.image ? "m4-ann-" + q.annotation.image.split("/").pop().replace(/\.png$/i,".jpg") : null;
// explanation_image (Mock #5+): annotated figure shown only in feedback/review; same images/ + .png->.jpg mapping as question images
const explSrc = q => q.explanation_image ? "m4-" + q.explanation_image.split("/").pop().replace(/\.png$/i,".jpg") : null;
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const pad = n => String(n).padStart(2,"0");
const fmtTime = s => { s=Math.max(0,Math.floor(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return h? h+":"+pad(m)+":"+pad(x) : m+":"+pad(x); };

/* ---------- state ---------- */
let S = {attempt:1, status:"in_progress", elapsed_s:0, started:null, mode:"immediate"};
let showClock = ls("mock4.clock") !== false;
let allResp = {};          // docId -> {attempt,n,choice,flagged}
let attempts = {};         // "a1" -> summary
let idx = 0;
let view = "exam";         // exam | results
let filter = "all";
let db = null, sync = "connecting";

function ls(k,v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; } }
function struckOf(n){ const r=resp(n); return new Set(r && Array.isArray(r.struck) ? r.struck : []); }
function hlOf(n){ const r=resp(n); return r && Array.isArray(r.hl) ? r.hl : []; }
const revealed = n => submitted() || (S.mode==="immediate" && !!choiceOf(n));
const savedIdx = ls("mock4.idx"); if(typeof savedIdx==="number" && savedIdx>=0 && savedIdx<N) idx = savedIdx;

const rid = n => "a"+S.attempt+"-q"+pad(n);
function resp(n){ return allResp[rid(n)] || null; }
function choiceOf(n){ const r=resp(n); return r && r.choice ? r.choice : null; }
function flagOf(n){ const r=resp(n); return !!(r && r.flagged); }
const submitted = () => S.status === "submitted";
function answeredCount(){ let c=0; Q.forEach(q=>{ if(choiceOf(q.n)) c++; }); return c; }

/* ---------- persistence ---------- */
const queues = {};
function put(path, body){
  if(!db){ localSave(); return Promise.resolve(); }
  
  const p = (queues[path]||Promise.resolve()).then(()=>db.doc(path).set(body)).then(()=>{ if(queues[path]===p) setSync("saved"); }, e=>{ setSync("error", e && e.code); });
  queues[path] = p; return p;
}
function localSave(){ ls("mock4.local",{S, allResp, attempts}); }
function writeResp(n){
  const r = allResp[rid(n)];
  const q = byN[n];
  put("responses/"+rid(n), {attempt:S.attempt, n, qid:q.id, choice:r.choice||null, correct: r.choice? r.choice===q.answer : null, flagged:!!r.flagged,
    mode:S.mode, struck:Array.isArray(r.struck)?r.struck:[], hl:Array.isArray(r.hl)?r.hl:[], updated:new Date().toISOString()});
}
let stateTimer = null;
function writeState(now){
  clearTimeout(stateTimer);
  const go = ()=>put("exam/state", {attempt:S.attempt, status:S.status, mode:S.mode, elapsed_s:Math.round(S.elapsed_s), started:S.started, updated:new Date().toISOString()});
  if(now) go(); else stateTimer = setTimeout(go, 1500);
}
function setSync(s, code){
  sync = s; const el = document.getElementById("sync"); if(!el) return;
  el.className = "sync" + (s==="error" ? " warn" : "");
  el.textContent = s==="saving" ? "Saving…" : s==="saved" ? "Answers saved to this artifact" :
    s==="connecting" ? "Connecting…" : s==="local" ? "Your progress is saved in this browser only. Use the same device and browser to pick up where you left off." :
    "Last save failed"+(code?" ("+code+")":"")+". Keep going; the next answer retries.";
}

/* ---------- timer ---------- */
let last = Date.now();
setInterval(()=>{
  const now = Date.now(), dt = (now-last)/1000; last = now;
  if(!submitted() && S.started && document.visibilityState==="visible" && dt < 5) S.elapsed_s += dt;
  paintMeters();
}, 1000);
document.addEventListener("visibilitychange", ()=>{ last = Date.now(); if(document.visibilityState==="hidden" && S.started && !submitted()) writeState(true); });

/* ---------- actions ---------- */
function ensureResp(n){ const k=rid(n); if(!allResp[k]) allResp[k]={attempt:S.attempt,n,choice:null,flagged:false}; else allResp[k]=Object.assign({},allResp[k]); return allResp[k]; }
function choose(letter){
  if(submitted()) return;
  const q = Q[idx]; if(!q.options.some(o=>o.letter===letter)) return;
  if(revealed(q.n)) return;   // immediate feedback locks the first answer
  const r = ensureResp(q.n); r.choice = letter;
  if(Array.isArray(r.struck)) r.struck = r.struck.filter(x=>x!==letter);
  if(!S.started){ S.started = new Date().toISOString(); }
  writeResp(q.n); writeState(false); render();
}
function toggleFlag(){
  const q = Q[idx]; const r = ensureResp(q.n); r.flagged = !r.flagged;
  writeResp(q.n); render();
}
function toggleStrike(n, L){
  if(revealed(n)) return;
  const r = ensureResp(n); const s = new Set(Array.isArray(r.struck)?r.struck:[]);
  s.has(L)? s.delete(L) : s.add(L); r.struck = [...s].sort();
  writeResp(n); renderMain();
}
function setHL(n, ranges){ const r = ensureResp(n); r.hl = ranges; writeResp(n); renderMain(); }
function addHL(n, s, e){
  const all = hlOf(n).map(x=>x.slice()).concat([[s,e]]).sort((a,b)=>a[0]-b[0]);
  const out = [];
  all.forEach(r=>{ const last = out[out.length-1]; if(last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]); else out.push(r); });
  setHL(n, out);
}
function hlHTML(text, ranges){
  let h = "", pos = 0;
  ranges.forEach((r,i)=>{ const s=Math.max(pos,r[0]), e=Math.min(text.length,r[1]); if(e<=s) return;
    h += esc(text.slice(pos,s)) + '<mark data-h="'+i+'" title="Click to remove highlight">'+esc(text.slice(s,e))+'</mark>'; pos = e; });
  return h + esc(text.slice(pos));
}
function offsetIn(el, node, off){ const r = document.createRange(); r.selectNodeContents(el); r.setEnd(node, off); return r.toString().length; }
document.addEventListener("mouseup", ()=>setTimeout(()=>{
  const sel = window.getSelection(); if(!sel || !sel.rangeCount || sel.isCollapsed) return;
  const el = document.getElementById("stem"); if(!el) return;
  const rg = sel.getRangeAt(0);
  if(!el.contains(rg.startContainer) || !el.contains(rg.endContainer)) return;
  const s = offsetIn(el, rg.startContainer, rg.startOffset), e = offsetIn(el, rg.endContainer, rg.endOffset);
  sel.removeAllRanges();
  if(e > s) addHL(Q[idx].n, s, e);
}, 0));
function setMode(m){
  if(submitted() || S.mode===m) return;
  S.mode = m; writeState(true); render();
}
function go(i){ idx = Math.max(0, Math.min(N-1, i)); ls("mock4.idx", idx); if(view!=="exam") view="exam"; render(); window.scrollTo({top:0}); }
function visibleList(){
  return Q.filter(q=>{
    if(filter==="all") return true;
    const c = choiceOf(q.n);
    if(filter==="flagged") return flagOf(q.n);
    if(filter==="unanswered") return !c;
    if(filter==="missed") return submitted() && c !== q.answer;
    return true;
  }).map(q=>q.n);
}
function step(d){
  const list = visibleList(); const cur = Q[idx].n;
  if(filter==="all" || !list.length) return go(idx+d);
  const pos = list.indexOf(cur);
  let target;
  if(pos>=0) target = list[pos+d];
  else target = d>0 ? list.find(n=>n>cur) : list.slice().reverse().find(n=>n<cur);
  if(target!=null) go(target-1);
}

function computeResults(){
  const out = {score:0, total:N, answered:0, misses:[], unanswered:[], flagged:[], choices:{}, part:{1:[0,0],2:[0,0]}, diff:{}, week:{}, cat:{}};
  Q.forEach(q=>{
    const c = choiceOf(q.n), ok = c===q.answer;
    out.choices[q.n] = c;
    if(c) out.answered++; else out.unanswered.push(q.n);
    if(ok) out.score++; else out.misses.push(q.n);
    if(flagOf(q.n)) out.flagged.push(q.n);
    const add = (o,k)=>{ o[k]=o[k]||[0,0,[]]; o[k][1]++; if(ok) o[k][0]++; else o[k][2].push(q.n); };
    out.part[q.part][1]++; if(ok) out.part[q.part][0]++;
    add(out.diff, q.difficulty); add(out.week, q.week); add(out.cat, q.blueprint_category);
  });
  return out;
}
function doSubmit(){
  S.status = "submitted";
  const R = computeResults();
  const summary = {attempt:S.attempt, submitted:new Date().toISOString(), elapsed_s:Math.round(S.elapsed_s), score:R.score, total:N, answered:R.answered,
    misses:R.misses, unanswered:R.unanswered, flagged:R.flagged, choices:Object.fromEntries(Object.entries(R.choices).map(([k,v])=>[k,v||""]))};
  attempts["a"+S.attempt] = summary;
  put("attempts/a"+S.attempt, summary); writeState(true);
  view = "results"; filter = "all"; closeOverlay(); render(); window.scrollTo({top:0});
}
function doRetake(){
  S = {attempt:S.attempt+1, status:"in_progress", elapsed_s:0, started:null, mode:S.mode};
  idx = 0; ls("mock4.idx",0); view="exam"; filter="all";
  writeState(true); closeOverlay(); render(); window.scrollTo({top:0});
}

/* ---------- overlay ---------- */
const overlay = document.getElementById("overlay");
function closeOverlay(){ overlay.innerHTML=""; }
function confirmBox(title, body, okLabel, onOk){
  overlay.innerHTML = '<div class="scrim" id="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-h"><h3 id="dlg-h">'+esc(title)+'</h3><p>'+body+'</p><div class="row"><button class="btn" type="button" id="dlg-no">Keep working</button><button class="btn primary" type="button" id="dlg-ok">'+esc(okLabel)+'</button></div></div></div>';
  document.getElementById("dlg-no").onclick = closeOverlay;
  document.getElementById("dlg-ok").onclick = onOk;
  document.getElementById("scrim").onclick = e=>{ if(e.target.id==="scrim") closeOverlay(); };
  document.getElementById("dlg-ok").focus();
}
function zoom(src){
  overlay.innerHTML = '<div class="scrim lightbox" id="scrim"><img alt="Enlarged figure" src="'+esc(src)+'"></div>';
  document.getElementById("scrim").onclick = closeOverlay;
}

/* ---------- render ---------- */
const $main = document.getElementById("main"), $rail = document.getElementById("rail");
function paintMeters(){
  const ans = answeredCount();
  if(S.mode==="immediate" && !submitted()){
    const ok = Q.filter(q=>choiceOf(q.n)===q.answer).length;
    document.getElementById("m-ans-l").textContent = "Correct";
    document.getElementById("m-ans").innerHTML = '<span class="live">'+ok+'</span> / '+ans+(ans? ' · '+Math.round(100*ok/ans)+'%' : '');
  } else {
    document.getElementById("m-ans-l").textContent = "Answered";
    document.getElementById("m-ans").textContent = ans+" / "+N;
  }
  document.getElementById("m-time").textContent = showClock ? fmtTime(S.elapsed_s) : "show clock";
  document.getElementById("m-time-l").textContent = submitted() ? "Time used" : "Untimed";
  document.getElementById("modebox").hidden = submitted();
  document.getElementById("mode-imm").setAttribute("aria-pressed", S.mode==="immediate");
  document.getElementById("mode-end").setAttribute("aria-pressed", S.mode!=="immediate");
  const bp = document.getElementById("b-pause"), bs = document.getElementById("b-submit");
  bp.hidden = !submitted();
  if(submitted()){
    bp.textContent = view==="results" ? "Review questions" : "Results";
    bs.textContent = "Retake";
    bs.className = "btn";
  } else {
    bs.textContent = S.mode==="immediate" ? "Finish & see results" : "Submit exam"; bs.className = "btn primary";
  }
  document.getElementById("sub").textContent = "92 items · Wks 1–3 · Claude-written mock" + (S.attempt>1 ? " · attempt "+S.attempt : "");
}
document.getElementById("b-pause").onclick = ()=>{
  if(submitted()){ view = view==="results" ? "exam" : "results"; render(); window.scrollTo({top:0}); }
};
document.getElementById("m-clock").onclick = ()=>{ showClock = !showClock; ls("mock4.clock", showClock); paintMeters(); };
document.getElementById("mode-imm").onclick = ()=>setMode("immediate");
document.getElementById("mode-end").onclick = ()=>{
  if(S.mode==="immediate" && answeredCount()) confirmBox("Hide answers until the end?", "Answers you already checked will be hidden again until you submit. Your picks stay as they are.", "Switch", ()=>{ closeOverlay(); setMode("end"); });
  else setMode("end");
};
document.getElementById("b-submit").onclick = ()=>{
  if(submitted()){
    confirmBox("Start attempt "+(S.attempt+1)+"?", "Your attempt "+S.attempt+" score stays saved. The new attempt starts blank with the timer at 0:00.", "Start retake", doRetake);
  } else {
    const un = N-answeredCount(), fl = Q.filter(q=>flagOf(q.n)).length;
    const parts = [];
    if(un) parts.push("<b>"+un+"</b> unanswered (scored wrong)");
    if(fl) parts.push("<b>"+fl+"</b> flagged");
    confirmBox(S.mode==="immediate" ? "Finish this attempt?" : "Submit the exam?", (parts.length? "You have "+parts.join(" and ")+". " : "All 92 answered. ")+"Then you'll see your score by category and can review every question.", S.mode==="immediate" ? "Finish" : "Submit", doSubmit);
  }
};

function render(){ paintMeters(); renderRail(); if(view==="results" && submitted()) renderResults(); else { view="exam"; renderMain(); } }

const FLAG_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 15V1.5M3 2h8.5l-1.8 3.2L11.5 8.5H3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';

function explImgBlock(q){
  const src = explSrc(q); if(!src) return "";
  const lines = String(q.explanation_image_legend||"").split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const rows = lines.map(t=>{ const m = t.match(/^([A-E★])\s*[:=.)]\s*(.*)$/);
    const cls = m ? (m[1]===q.answer||m[1]==="★" ? "k" : "d") : "n";
    return '<li>'+(m? '<span class="dot '+cls+'">'+esc(m[1])+'</span><span>'+esc(m[2])+'</span>' : '<span>'+esc(t)+'</span>')+'</li>'; }).join("");
  return '<div class="ann"><div class="ann-h">Annotated figure</div><img id="annimg" src="'+esc(src)+'" alt="Annotated figure for question '+q.n+'">'+
    (rows? '<ul>'+rows+'</ul>' : '')+'</div>';
}
function annBlock(q){
  if(q.explanation_image) return explImgBlock(q);
  const a = q.annotation, src = annSrc(q); if(!a || !src) return "";
  const lab = t => /^Labeled/.test(t);
  const rows = q.options.filter(o=>a.options && a.options[o.letter]).map(o=>{
    const t = a.options[o.letter], mk = a.marked ? a.marked.indexOf(o.letter)>=0 : lab(t), cls = o.letter===q.answer ? "k" : (mk ? "d" : "n");
    return '<li><span class="dot '+cls+'">'+o.letter+'</span><span>'+esc(t)+'</span></li>'; }).join("");
  return '<div class="ann"><div class="ann-h">Annotated figure</div><img id="annimg" src="'+esc(src)+'" alt="Annotated figure for question '+q.n+'">'+
    '<p class="how">'+esc(a.how||"")+'</p><ul>'+rows+'</ul>'+(a.note? '<p class="note">'+esc(a.note)+'</p>' : '')+'</div>';
}
function whyNot(q){
  const d = q.distractor_explanations; if(!d) return "";
  const rows = q.options.filter(o=>o.letter!==q.answer && d[o.letter]).map(o=>'<li><b>'+o.letter+'. '+esc(o.text)+'</b> — '+esc(d[o.letter])+'</li>').join("");
  return rows ? '<div class="whynot"><div class="whynot-h">Why the other choices are wrong</div><ul>'+rows+'</ul></div>' : "";
}
function renderMain(){
  const q = Q[idx], c = choiceOf(q.n), done = revealed(q.n);
  const src = imgSrc(q), struck = struckOf(q.n);
  const tags = [];
  if(q.part===2) tags.push('<span class="tag">Lab image</span>');
  if(q.thursday_11_5) tags.push('<span class="tag thu" title="Taught Thu 11/5">Thu 11/5 material</span>');
  if(done) tags.push('<span class="tag">'+esc(q.blueprint_category)+'</span>');
  let h = '<div class="qhead"><span class="qnum"><b>'+q.n+'</b>of '+N+'</span>'+tags.join("")+
    '<span class="spacer"></span><button class="btn flagbtn" type="button" id="b-flag" aria-pressed="'+flagOf(q.n)+'">'+FLAG_SVG+(flagOf(q.n)?"Flagged":"Flag")+'</button></div>';
  h += '<p class="stem" id="stem">'+hlHTML(q.stem, hlOf(q.n))+'</p>';
  if(src) h += '<figure class="figure"><img id="qimg" src="'+esc(src)+'" alt="Figure for question '+q.n+'"><figcaption>Tap the image to enlarge</figcaption></figure>';
  h += '<div class="opts" role="group" aria-label="Answer choices">';
  q.options.forEach(o=>{
    const cls = ["opt"];
    if(!done && c===o.letter) cls.push("sel");
    if(struck.has(o.letter)) cls.push("struck");
    if(done && o.letter===q.answer) cls.push("right");
    if(done && c===o.letter && c!==q.answer) cls.push("wrong");
    h += '<div class="optrow"><button type="button" class="'+cls.join(" ")+'" data-k="'+o.letter+'"'+(done?" disabled":"")+(done?"":' title="Right-click to cross out"')+'><span class="L">'+o.letter+'</span><span class="T">'+esc(o.text)+'</span></button></div>';
  });
  h += '</div>';
  if(done){
    const ok = c===q.answer;
    const v = !c ? '<span class="verdict bad">Unanswered.</span> Correct answer: '+q.answer
      : ok ? '<span class="verdict ok">Correct: '+q.answer+'</span>' : '<span class="verdict bad">You chose '+c+'.</span> Correct answer: '+q.answer;
    h += '<div class="explain"><div>'+v+'</div><p>'+esc(q.explanation)+'</p>'+annBlock(q)+whyNot(q)+'<dl>'+
      '<dt>Source</dt><dd>'+esc(q.source)+'</dd>'+
      '<dt>Objective</dt><dd>'+esc(q.learning_objective)+'</dd>'+
      '<dt>Item</dt><dd>Week '+q.week+' · difficulty '+q.difficulty+' · '+esc(q.format)+(q.drug_item? ' · drug: '+esc(q.drug_item):'')+'</dd>'+
      '<dt>Key</dt><dd>'+esc(q.answer_source)+'</dd></dl></div>';
  }
  h += '<div class="qnav"><button class="btn" type="button" id="b-prev"'+(idx===0?" disabled":"")+'>← Previous</button><button class="btn" type="button" id="b-next"'+(idx===N-1?" disabled":"")+'>Next →</button>'+
    (hlOf(q.n).length? '<button class="btn ghost" type="button" id="b-clearhl">Clear highlights</button>' : '')+
    '<span class="hint">'+(done? '<kbd>←</kbd> <kbd>→</kbd> move · <kbd>F</kbd> flag · select stem text to highlight' : '<kbd>A</kbd>–<kbd>E</kbd> answer · right-click an option to cross it out · select stem text to highlight · <kbd>←</kbd> <kbd>→</kbd> · <kbd>F</kbd> flag')+'</span></div>';
  $main.innerHTML = h;
  $main.querySelectorAll(".opt").forEach(b=>{
    b.onclick = ()=>choose(b.dataset.k);
    b.oncontextmenu = e=>{ e.preventDefault(); toggleStrike(q.n, b.dataset.k); };
  });
  $main.querySelectorAll(".stem mark").forEach(m=>m.onclick=()=>{
    const sel = window.getSelection(); if(sel && !sel.isCollapsed) return;
    const i = +m.dataset.h; setHL(q.n, hlOf(q.n).filter((_,j)=>j!==i));
  });
  const ch = document.getElementById("b-clearhl"); if(ch) ch.onclick = ()=>setHL(q.n, []);
  document.getElementById("b-flag").onclick = toggleFlag;
  document.getElementById("b-prev").onclick = ()=>step(-1);
  document.getElementById("b-next").onclick = ()=>step(1);
  const im = document.getElementById("qimg"); if(im) im.onclick = ()=>zoom(src);
  const ai = document.getElementById("annimg"); if(ai) ai.onclick = ()=>zoom(explSrc(q) || annSrc(q));
}

function renderRail(){
  const done = submitted(), list = new Set(visibleList());
  const cell = q => {
    const c = choiceOf(q.n), cls=["cell"];
    if(revealed(q.n)) cls.push(c===q.answer ? "ok" : "bad");
    else if(done) cls.push("skip");
    else if(c) cls.push("ans");
    if(flagOf(q.n)) cls.push("flg");
    if(view==="exam" && Q[idx].n===q.n) cls.push("cur");
    if(!list.has(q.n)) cls.push("dim");
    return '<button type="button" class="'+cls.join(" ")+'" data-i="'+(q.n-1)+'" aria-label="Question '+q.n+'">'+q.n+'</button>';
  };
  const fl = done ? ["all","missed","flagged","unanswered"] : ["all","flagged","unanswered"];
  const lab = {all:"All",missed:"Missed",flagged:"Flagged",unanswered:"Unanswered"};
  let h = '<div><p class="rail-h">Show</p><div class="filters">'+fl.map(f=>'<button type="button" class="chip" data-f="'+f+'" aria-pressed="'+(filter===f)+'">'+lab[f]+'</button>').join("")+'</div></div>';
  h += '<div><p class="rail-h">Session items · 1–77</p><div class="grid">'+Q.filter(q=>q.part===1).map(cell).join("")+'</div></div>';
  h += '<div><p class="rail-h">Lab image items · 78–92</p><div class="grid">'+Q.filter(q=>q.part===2).map(cell).join("")+'</div></div>';
  h += '<div class="legend">'+(done
      ? '<span><i style="background:var(--ok-soft);border-color:var(--ok)"></i>Correct</span><span><i style="background:var(--bad-soft);border-color:var(--bad)"></i>Wrong</span><span><i style="border:1px dashed var(--bad)"></i>Blank</span>'
      : S.mode==="immediate" ? '<span><i style="background:var(--ok-soft);border-color:var(--ok)"></i>Correct</span><span><i style="background:var(--bad-soft);border-color:var(--bad)"></i>Wrong</span><span><i></i>Open</span>'
      : '<span><i style="background:var(--accent-soft)"></i>Answered</span><span><i></i>Open</span>')+
    '<span><i style="background:var(--flag);border-color:var(--flag);border-radius:50%"></i>Flagged</span></div>';
  if(done) h += '<button type="button" class="btn" id="b-results"'+(view==="results"?" disabled":"")+'>View results</button>';
  h += '<div class="sync" id="sync"></div>';
  $rail.innerHTML = h;
  $rail.querySelectorAll(".cell").forEach(b=>b.onclick=()=>go(+b.dataset.i));
  $rail.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ filter=b.dataset.f; const l=visibleList(); if(l.length && view==="exam" && !l.includes(Q[idx].n)) { idx=l[0]-1; } render(); });
  const br = document.getElementById("b-results"); if(br) br.onclick=()=>{ view="results"; render(); window.scrollTo({top:0}); };
  setSync(sync);
}

function pct(a,b){ return b? Math.round(100*a/b) : 0; }
function renderResults(){
  const R = computeResults();
  const missChips = arr => arr.map(n=>'<button type="button" class="miss'+(choiceOf(n)?"":" skipd")+'" data-n="'+n+'" title="'+(choiceOf(n)?"Wrong":"Blank")+'">'+n+'</button>').join("");
  const barRows = (obj, label) => Object.keys(obj).sort().map(k=>{ const [a,b]=obj[k]; return '<span>'+label(k)+'</span><div class="track" role="img" aria-label="'+a+' of '+b+'"><div class="fill" style="width:'+pct(a,b)+'%"></div></div><span class="mono">'+a+'/'+b+' · '+pct(a,b)+'%</span>'; }).join("");
  const cats = Object.entries(R.cat).sort((x,y)=> (x[1][0]/x[1][1]) - (y[1][0]/y[1][1]) || y[1][1]-x[1][1] || x[0].localeCompare(y[0]));
  const avg = R.answered ? S.elapsed_s / R.answered : 0;
  let h = '<section class="results"><h2>'+R.score+' of '+N+' correct</h2><p class="sub">Attempt '+S.attempt+' · submitted '+(attempts["a"+S.attempt]? new Date(attempts["a"+S.attempt].submitted).toLocaleString([], {weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "")+' · keys are Claude-written, checked against the cited course source</p>';
  h += '<div class="score">'+
    '<div class="stat lead"><small>Overall</small><span class="mono">'+pct(R.score,N)+'%<em>'+R.score+'/'+N+'</em></span></div>'+
    '<div class="stat"><small>Session items</small><span class="mono">'+pct(R.part[1][0],R.part[1][1])+'%<em>'+R.part[1][0]+'/'+R.part[1][1]+'</em></span></div>'+
    '<div class="stat"><small>Lab image items</small><span class="mono">'+pct(R.part[2][0],R.part[2][1])+'%<em>'+R.part[2][0]+'/'+R.part[2][1]+'</em></span></div>'+
    '<div class="stat"><small>Time used</small><span class="mono">'+fmtTime(S.elapsed_s)+'<em>'+(avg? Math.round(avg)+'s / item':'')+'</em></span></div></div>';
  if(R.misses.length) h += '<p class="section-h">Missed and blank items · tap to review</p><div>'+missChips(R.misses)+'</div>';
  h += '<p class="section-h">By difficulty</p><div class="bars">'+barRows(R.diff, k=>({1:"1 · one-fact recall",2:"2 · one-step vignette",3:"3 · two-step / integrative"}[k]||k))+'</div>';
  h += '<p class="section-h">By week</p><div class="bars">'+barRows(R.week, k=>"Week "+k)+'</div>';
  h += '<p class="section-h">By blueprint category · weakest first</p><div class="tbl-wrap"><table><thead><tr><th>Category</th><th>Score</th><th>Missed</th></tr></thead><tbody>'+
    cats.map(([k,[a,b,m]])=>'<tr><td>'+esc(k)+'</td><td class="num">'+a+'/'+b+'</td><td>'+(m.length? missChips(m) : '<span class="hint">none</span>')+'</td></tr>').join("")+'</tbody></table></div>';
  const prev = Object.values(attempts).filter(a=>a.attempt!==S.attempt).sort((a,b)=>a.attempt-b.attempt);
  if(prev.length) h += '<p class="section-h">Earlier attempts</p><ul class="hist">'+prev.map(a=>'<li>Attempt '+a.attempt+': '+a.score+'/'+a.total+' ('+pct(a.score,a.total)+'%) · '+fmtTime(a.elapsed_s)+'</li>').join("")+'</ul>';
  h += '</section>';
  $main.innerHTML = h;
  $main.querySelectorAll(".miss").forEach(b=>b.onclick=()=>{ filter="missed"; go(+b.dataset.n-1); });
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(overlay.innerHTML){ if(e.key==="Escape") closeOverlay(); return; }
  if(view!=="exam") return;
  const k = e.key.toUpperCase();
  if(k==="ARROWRIGHT"||k==="J"){ step(1); e.preventDefault(); }
  else if(k==="ARROWLEFT"||k==="K"){ step(-1); e.preventDefault(); }
  else if(k==="F"){ toggleFlag(); }
  else if(/^[A-G]$/.test(k)){ choose(k); }
  else if(/^[1-7]$/.test(k)){ choose("ABCDEFG"[+k-1]); }
});

/* ---------- boot ---------- */
render();
(()=>{
  const L = ls("mock4.local");
  if(L && L.S){ S=L.S; allResp=L.allResp||{}; attempts=L.attempts||{}; if(S.status==="submitted") view="results"; }
  setSync("local"); render();
})();
})();
</script>
