<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Midterm 1 Mock #4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: sticky exam bar; question column (serif stems, like a printed exam) + item navigator rail; rail drops below on phones. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --ink:#15202b; --muted:#5a6976; --line:#d3dce3;
  --accent:#1d5f8a; --accent-ink:#ffffff; --accent-soft:#dfebf4;
  --flag:#a86a12; --ok:#21764a; --ok-soft:#e1f1e8; --bad:#b1352d; --bad-soft:#f7e2e0;
  --hl:#fbe68a; --hl-ink:#15202b;
  --font-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#151e27; --ink:#e3e9ee; --muted:#93a2ae; --line:#283541;
  --accent:#6db3df; --accent-ink:#0b1620; --accent-soft:#183245;
  --flag:#e3aa4f; --ok:#5ec48b; --ok-soft:#153424; --bad:#ef7f75; --bad-soft:#3b1d1b; --hl:#6b5a14; --hl-ink:#fff6d6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#151e27; --ink:#e3e9ee; --muted:#93a2ae; --line:#283541;
  --accent:#6db3df; --accent-ink:#0b1620; --accent-soft:#183245;
  --flag:#e3aa4f; --ok:#5ec48b; --ok-soft:#153424; --bad:#ef7f75; --bad-soft:#3b1d1b; --hl:#6b5a14; --hl-ink:#fff6d6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand b{font-weight:600;font-size:16px;letter-spacing:.01em}
.brand span{color:var(--muted);font-size:12.5px}
.meters{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.meter{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.meter small{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meter .mono{font-size:15px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-size:13.5px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 6px}
.btn.ghost:hover{color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
main{min-width:0}

/* question */
.qhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:12px}
.qnum{font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.qnum b{color:var(--ink);font-size:20px;font-weight:500;margin-right:4px}
.tag{font-size:11.5px;letter-spacing:.04em;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.thu{border-color:var(--flag);color:var(--flag)}
.spacer{margin-left:auto}
.flagbtn{display:inline-flex;align-items:center;gap:6px}
.flagbtn[aria-pressed="true"]{color:var(--flag);border-color:var(--flag)}
.flagbtn svg{width:14px;height:14px}
.stem{font-family:var(--font-body);font-size:18px;line-height:1.6;max-width:68ch;margin:0 0 16px;cursor:text}
.stem mark{background:var(--hl);color:var(--hl-ink);border-radius:2px;padding:0 1px;cursor:pointer}
.stem mark:hover{text-decoration:line-through;text-decoration-thickness:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:none;background:transparent;padding:6px 10px;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg-l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.meter.clock{cursor:pointer;background:transparent;border:none;padding:0;font:inherit;color:inherit}
.live{color:var(--ok)}
.figure{margin:0 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:inline-block;max-width:100%}
.figure img{display:block;max-height:460px;width:auto;max-width:100%;border-radius:4px;cursor:zoom-in}
.ann{margin:14px 0 4px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ann-h{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.ann img{display:block;max-width:100%;max-height:620px;width:auto;border-radius:4px;cursor:zoom-in;background:#fff}
.ann .how{font-size:12.5px;color:var(--muted);margin:8px 0 6px}
.ann ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.ann li{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;line-height:1.45}
.ann .dot{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 12px var(--font-mono);margin-top:1px}
.ann .dot.k{background:#169646}.ann .dot.d{background:#d63c32}.ann .dot.n{background:transparent;color:var(--muted);border:1px solid var(--line)}
.ann .note{font-size:13.5px;color:var(--muted);margin-top:8px}
.figure figcaption{font-size:12px;color:var(--muted);margin-top:6px}
.opts{display:flex;flex-direction:column;gap:8px;max-width:72ch}
.optrow{display:flex;gap:6px;align-items:stretch}
.opt{flex:1;min-width:0;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 14px;font-family:var(--font-body);font-size:16.5px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .L{font-family:var(--font-mono);font-size:13.5px;flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;margin-top:1px;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .L{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.struck .T{text-decoration:line-through;color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default;color:inherit}
.strike{flex:none;width:36px;border:1px solid transparent;background:transparent;border-radius:8px;color:var(--muted);font-size:13px}
.strike:hover{border-color:var(--line);color:var(--ink)}
.qnav{display:flex;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted)}
.hint kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}

.explain{margin-top:20px;max-width:72ch;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.explain .verdict{font-weight:600}
.explain .verdict.ok{color:var(--ok)} .explain .verdict.bad{color:var(--bad)}
.explain p{margin:0;font-family:var(--font-body);font-size:16px;line-height:1.55}
.whynot-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.whynot ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-family:var(--font-body);font-size:15px;line-height:1.5}
.whynot b{font-weight:600}
.explain dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.explain dt{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:11px;padding-top:2px}
.explain dd{margin:0}

/* rail */
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:calc(100vh - 100px);overflow:auto}
@media (max-width:860px){aside{position:static;max-height:none}}
.rail-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:4px}
.cell{position:relative;height:30px;border:1px solid var(--line);background:transparent;border-radius:5px;font-family:var(--font-mono);font-size:12px;color:var(--muted);padding:0}
.cell.ans{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.cell.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.cell.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.cell.skip{border-style:dashed;border-color:var(--bad);color:var(--bad)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--ink)}
.cell.flg::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--flag)}
.cell.dim{opacity:.25}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:3px 10px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.sync{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.sync.warn{color:var(--flag)}

/* results */
.results h2{font-family:var(--font-body);font-weight:600;font-size:28px;margin:0 0 4px;text-wrap:balance}
.results .sub{color:var(--muted);margin:0 0 20px}
.score{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;min-width:140px;flex:1}
.stat small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .mono{font-size:24px}
.stat .mono em{font-style:normal;font-size:14px;color:var(--muted);margin-left:6px}
.stat.lead{border-color:var(--accent)}
.section-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 8px}
.bars{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;font-size:13.5px}
.track{height:10px;background:var(--bad-soft);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--ok)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:none}
td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.miss{display:inline-block;font-family:var(--font-mono);font-size:12px;border:1px solid var(--bad);color:var(--bad);border-radius:4px;padding:0 6px;margin:0 4px 4px 0;background:transparent}
.miss.skipd{border-style:dashed}
.hist{font-size:13px;color:var(--muted)}
.hist li{margin-bottom:2px}

/* dialog + lightbox */
.scrim{position:fixed;inset:0;background:rgba(5,10,15,.55);z-index:20;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
.dialog h3{margin:0;font-size:17px}
.dialog p{margin:0;color:var(--muted)}
.dialog .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.lightbox img{max-width:100%;max-height:calc(100vh - 60px);border-radius:6px;background:#fff;cursor:zoom-out}
@media (prefers-reduced-motion:no-preference){.opt,.cell,.btn{transition:border-color .12s,background-color .12s}}
</style>

</div></header>

"image_items": 20, "thursday_items": [22, 45, 63, 66, 68, 77]}, "questions": [{"id": "mk4-q01", "n": 1, "part": 1, "title": null, "stem": "After a cardiac arrest, a 55-year-old man has bilateral hippocampal damage and cannot remember the previous day. Over a week of daily practice, his speed at a mirror-tracing task improves steadily, though he denies ever doing it before. Which structures most likely support this improvement?", "options": [{"letter": "A", "text": "The hippocampus and medial temporal lobe"}, {"letter": "B", "text": "The amygdala"}, {"letter": "C", "text": "The prefrontal cortex working-memory system alone"}, {"letter": "D", "text": "The mammillary bodies and medial thalamus"}, {"letter": "E", "text": "The striatum, cerebellum and motor areas of the cortex"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Memory Formation", "topic": "Memory Formation", "note": null, "blueprint_category": "Memory Formation", "learning_objective": "Learning & Memory LO1", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Skill learning is implicit (procedural) memory and depends on motor areas of cortex, the striatum and the cerebellum, not the medial temporal lobe. Patients like H.M. improve at a task day after day without remembering doing it.", "distractor_explanations": {"A": "These are damaged and support explicit memory, which is lost.", "B": "The amygdala supports emotional associations, not motor skills.", "C": "Working memory holds information briefly; it does not store a skill across days.", "D": "These diencephalic structures support explicit (declarative) memory."}, "source": "Wk3 packet p.60-61 (Figure 1: 'Skills & Habits -- Motor areas of cortex, Striatum, Cerebellum'; patients with bilateral temporal lobe damage solve a puzzle faster each day while denying having done it)"}, {"id": "mk4-q02", "n": 2, "part": 1, "title": null, "stem": "GABA, the main inhibitory neurotransmitter of the brain, is synthesized from which precursor, by which enzyme?", "options": [{"letter": "A", "text": "Glycine, by glycine decarboxylase"}, {"letter": "B", "text": "Tyrosine, by tyrosine hydroxylase"}, {"letter": "C", "text": "Tryptophan, by aromatic L-amino acid decarboxylase"}, {"letter": "D", "text": "Glutamate, by glutamic acid decarboxylase"}, {"letter": "E", "text": "Choline, by choline acetyltransferase"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Synaptic transmission and neurotransmitters", "topic": "Synaptic transmission and neurotransmitters", "note": null, "blueprint_category": "Synaptic transmission and neurotransmitters", "learning_objective": "Synaptic Transmission LO3", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "GABA is made from the excitatory transmitter glutamate by glutamic acid decarboxylase (GAD).", "distractor_explanations": {"A": "Glycine is itself a transmitter (mainly in the spinal cord), not GABA's precursor.", "B": "This is the first step of catecholamine synthesis.", "C": "This route makes serotonin (via 5-hydroxytryptophan).", "E": "This makes acetylcholine."}, "source": "Wk3 packet p.24 ('The common inhibitory neurotransmitter GABA is synthesized from the amino acid glutamate, by the enzyme glutamic acid decarboxylase')"}, {"id": "mk4-q03", "n": 3, "part": 1, "title": null, "stem": "The nuclei of which cranial nerves lie in the midbrain?", "options": [{"letter": "A", "text": "Abducens (VI) and facial (VII)"}, {"letter": "B", "text": "Vestibulocochlear (VIII) and glossopharyngeal (IX)"}, {"letter": "C", "text": "Vagus (X) and hypoglossal (XII)"}, {"letter": "D", "text": "Oculomotor (III) and trochlear (IV)"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Cranial Nerves Module", "topic": "Cranial Nerves Module", "note": null, "blueprint_category": "Cranial Nerves Module", "learning_objective": "CN Modules LO1", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Course rule of four: midbrain (and above) I-IV, with the III and IV nuclei in the midbrain; pons V-VIII; medulla (and below) IX-XII.", "distractor_explanations": {"A": "These nuclei are in the pons.", "B": "These nuclei are in the pons and medulla.", "C": "These nuclei are in the medulla."}, "source": "Wk1 packet p.156 (each brainstem division contains about 4 cranial nerves: midbrain and above, pons, medulla and below); CN Modules LO1"}, {"id": "mk4-q04", "n": 4, "part": 1, "title": null, "stem": "On this CT angiogram of the head and neck (anterior view), which vessels join to form the vessel indicated by the arrow?", "options": [{"letter": "A", "text": "The right and left internal carotid arteries"}, {"letter": "B", "text": "The two posterior cerebral arteries"}, {"letter": "C", "text": "The right and left vertebral arteries"}, {"letter": "D", "text": "The two anterior cerebral arteries"}, {"letter": "E", "text": "The right and left common carotid arteries"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock4-images/s-cta-basilar.png", "image_needed": true, "week": 1, "session_guess": "Imaging Techniques for the Head and Brain", "topic": "Imaging Techniques for the Head and Brain", "note": null, "blueprint_category": "Imaging Techniques for the Head and Brain", "learning_objective": "Imaging Techniques LO4", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The arrow is on the basilar artery, the single midline vessel in front of the brainstem. It forms where the two vertebral arteries join and ends by splitting into the two posterior cerebral arteries.", "distractor_explanations": {"A": "The internal carotids never merge; each ends by dividing into the anterior and middle cerebral arteries.", "B": "The posterior cerebral arteries are the terminal branches of this vessel, not its origin.", "D": "They are linked by the anterior communicating artery but do not form a single trunk.", "E": "The common carotids divide in the neck and do not join each other."}, "source": "Imaging Techniques deck, slides 29-30 ('Posterior circulation': Subclavian -> Vertebral artery -> Basilar artery -> Posterior cerebral artery; slide 30 colors the vessels on this CTA)", "annotation": {"image": "qbank/midterm1-mock4-images/annotated/s-cta-basilar.png", "options": {"A": "Not labeled in this figure", "B": "Labeled \"Posterior cerebral artery\" on the slide (blue, the branches at the top of the arrowed vessel)", "C": "Labeled \"Vertebral artery (L)\" and \"Vertebral artery (R)\" on the slide (purple on the CTA)", "D": "Not labeled in this figure", "E": "Not labeled in this figure"}, "note": "Arrowed vessel = basilar artery (star; blue on the faculty slide). The faculty slide colors the vertebral arteries purple and the basilar and posterior cerebral arteries blue.", "how": "Same faculty figure with its labels showing (the full labeled version or the faculty key for the photo). Green box = correct answer; red boxes = other answer choices the figure labels; amber star = the arrowed structure when the key is not a structure name. Arrow redrawn where the question placed it.", "marked": ["B", "C"]}}, {"id": "mk4-q05", "n": 5, "part": 1, "title": null, "stem": "How does dense cortical bone of the skull appear on CT and on MRI?", "options": [{"letter": "A", "text": "Dark on CT and bright on both T1 and T2"}, {"letter": "B", "text": "Bright on CT, bright on T1 and dark on T2"}, {"letter": "C", "text": "Gray on CT and bright only on T2"}, {"letter": "D", "text": "Bright (hyperdense) on CT and dark on all MRI sequences"}, {"letter": "E", "text": "Dark on both CT and MRI"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Neuroimaging Tutorial", "topic": "Neuroimaging Tutorial", "note": null, "blueprint_category": "Neuroimaging Tutorial", "learning_objective": "Neuroimaging Tutorial LO3", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "CT shows X-ray attenuation, so bone is hyperdense (white). MRI depends on proton signal, and cortical bone has a low proton density, so it is dark on every sequence.", "distractor_explanations": {"A": "This is reversed; bone strongly attenuates X-rays.", "B": "That pattern does not apply to cortical bone, which has very few mobile protons.", "C": "Bone is the brightest tissue on CT, and it is dark on T2.", "E": "Bone is bright on CT."}, "source": "Wk1 packet p.219 ('Bone: CT: Hyperdense (white) due to high attenuation. MRI: Cortical bone appears hypointense (dark) on all sequences because of low proton density')"}, {"id": "mk4-q06", "n": 6, "part": 1, "title": null, "stem": "A 41-year-old woman has 2 years of progressive memory loss. Her father and grandmother developed dementia in their 40s. Genetic testing finds a pathogenic variant in a chromosome 14 gene whose product is part of the gamma-secretase complex. Which gene?", "options": [{"letter": "A", "text": "Presenilin 2 (PSEN2)"}, {"letter": "B", "text": "Amyloid precursor protein (APP)"}, {"letter": "C", "text": "APOE epsilon-4"}, {"letter": "D", "text": "Microtubule-associated protein tau (MAPT)"}, {"letter": "E", "text": "Presenilin 1 (PSEN1)"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Aging and Neurodegenerative Disorders", "topic": "Aging and Neurodegenerative Disorders", "note": null, "blueprint_category": "Aging and Neurodegenerative Disorders", "learning_objective": "Aging & Neurodegeneration LO4", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "PSEN1 on chromosome 14 encodes presenilin 1, part of gamma-secretase, which processes APP. Pathogenic variants cause autosomal dominant early-onset familial Alzheimer disease.", "distractor_explanations": {"A": "Also part of gamma-secretase and a cause of familial AD, but it is on chromosome 1.", "B": "APP is the substrate that gamma-secretase cuts; its gene is on chromosome 21.", "C": "A risk allele that raises the odds of AD rather than causing autosomal dominant disease.", "D": "Linked to frontotemporal degeneration (Claude's general-knowledge note)."}, "source": "Wk3 packet p.104 ('Presenilin 1 on chromosome 14: PSEN1 pathogenic variants cause autosomal dominant familial AD. Presenilin is part of the gamma-secretase complex'; 'Presenilin 2 on chromosome 1')"}, {"id": "mk4-q07", "n": 7, "part": 1, "title": null, "stem": "In an experiment, an animal receives a drug that blocks nicotinic acetylcholine receptors in autonomic ganglia. Which effect is expected?", "options": [{"letter": "A", "text": "Only parasympathetic ganglia are blocked, because sympathetic ganglia use norepinephrine"}, {"letter": "B", "text": "Only target organs with muscarinic receptors are blocked"}, {"letter": "C", "text": "Norepinephrine release from sympathetic postganglionic terminals increases"}, {"letter": "D", "text": "Transmission from preganglionic to postganglionic neurons is blocked in both the sympathetic and parasympathetic divisions"}, {"letter": "E", "text": "Skeletal muscle is paralyzed while autonomic function is unchanged"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Autonomics", "topic": "Autonomics", "note": null, "blueprint_category": "Autonomics", "learning_objective": "Autonomics LO3", "difficulty": 2, "format": "research scenario", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "In both divisions, preganglionic neurons release ACh onto nicotinic receptors on postganglionic neurons. Blocking ganglionic nicotinic receptors therefore shuts down both sympathetic and parasympathetic outflow.", "distractor_explanations": {"A": "Preganglionic neurons of both divisions release ACh onto nicotinic receptors; NE is released by most sympathetic postganglionic fibers at targets.", "B": "Muscarinic receptors are on target organs, not in the ganglia.", "C": "If the ganglion is blocked, postganglionic neurons are not driven, so NE release falls.", "E": "The drug acts on ganglionic nicotinic receptors, which are distinct from the neuromuscular junction (Claude's note)."}, "source": "Wk3 packet p.12 table (preganglionic fibers release ACh onto nicotinic channels in both divisions)"}, {"id": "mk4-q08", "n": 8, "part": 1, "title": null, "stem": "A 79-year-old woman with normal blood pressure has a sudden hemorrhage in the right parietal lobe near the cortical surface. Two years ago she had a smaller left occipital lobar hemorrhage. Which process most likely explains her repeated bleeds?", "options": [{"letter": "A", "text": "Cerebral amyloid angiopathy (amyloid-beta deposited in vessel walls)"}, {"letter": "B", "text": "Hypertensive damage to the lenticulostriate arteries"}, {"letter": "C", "text": "A ruptured saccular (berry) aneurysm"}, {"letter": "D", "text": "Alpha-synuclein deposition"}, {"letter": "E", "text": "Neurofibrillary tangles in vessel walls"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Neuropathology of Neurodegenerative Diseases Lecture", "topic": "Neuropathology of Neurodegenerative Diseases Lecture", "note": null, "blueprint_category": "Neuropathology of Neurodegenerative Diseases Lecture", "learning_objective": "Neuropathology Lecture LO2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Amyloid-beta can deposit in the walls of cerebral vessels (cerebral amyloid angiopathy), which raises the risk of lobar (cortical-subcortical) hemorrhages, often repeated, in older people.", "distractor_explanations": {"B": "Hypertensive bleeds are deep (basal ganglia, thalamus), and she is normotensive.", "C": "Aneurysm rupture usually causes subarachnoid hemorrhage, not repeated lobar bleeds.", "D": "This forms Lewy bodies, not vessel wall deposits.", "E": "Tangles form inside neurons."}, "source": "Wk3 packet p.105 ('It can also deposit in the walls of cerebral blood vessels, producing cerebral amyloid angiopathy, which increases the risk of lobar intracerebral hemorrhage')"}, {"id": "mk4-q09", "n": 9, "part": 1, "title": null, "stem": "The artery of the third pharyngeal arch gives rise to which adult vessels?", "options": [{"letter": "A", "text": "The common carotid artery and the first part of the internal carotid artery"}, {"letter": "B", "text": "The stapedial artery"}, {"letter": "C", "text": "Part of the arch of the aorta and the proximal right subclavian artery"}, {"letter": "D", "text": "Parts of the pulmonary arteries and the ductus arteriosus"}, {"letter": "E", "text": "Part of the maxillary artery"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Face Embryology", "topic": "Face Embryology", "note": null, "blueprint_category": "Face Embryology", "learning_objective": "Face Embryology LO3", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Arch artery derivatives in the course table: 1 = part of the maxillary artery; 2 = stapedial; 3 = common carotid and part of the internal carotid; 4 = part of the aortic arch and proximal right subclavian; 6 = parts of the pulmonary arteries and the ductus arteriosus.", "distractor_explanations": {"B": "That is the second-arch artery.", "C": "These come from the fourth-arch arteries.", "D": "These come from the sixth-arch arteries.", "E": "That comes from the first-arch artery."}, "source": "Wk1 packet p.25 Table ('3 Common carotid artery & part of internal carotid artery')"}, {"id": "mk4-q10", "n": 10, "part": 1, "title": null, "stem": "In this low-power section of cerebellar cortex, the arrow marks a band packed with small, dark-staining cells. Which statement best describes the main neurons of this layer?", "options": [{"letter": "A", "text": "They are large inhibitory Purkinje cells, the only output of the cerebellar cortex"}, {"letter": "B", "text": "They are small excitatory granule cells, mixed with inhibitory Golgi cells"}, {"letter": "C", "text": "They are stellate and basket cells among the Purkinje cell dendrites"}, {"letter": "D", "text": "They are myelinated axons entering and leaving the cortex"}, {"letter": "E", "text": "They are pyramidal cells that project to spinal motor neurons"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock4-images/s-histo-granule.png", "image_needed": true, "week": 1, "session_guess": "Histology of CNS 2: Organization of Nerve tissues", "topic": "Histology of CNS 2: Organization of Nerve tissues", "note": null, "blueprint_category": "Histology of CNS 2: Organization of Nerve tissues", "learning_objective": "Histology CNS 2 LO6", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "From the pia to the core: molecular layer (pale, finely textured), Purkinje cell layer (one row of very large cells), granule cell layer (packed with small neurons), then white matter. The granule cell layer holds excitatory granule cells and inhibitory Golgi cells.", "distractor_explanations": {"A": "Purkinje cells form a single row of very large cells at the edge of this band, not a thick band.", "C": "Those cells are in the pale outer molecular layer.", "D": "The pale core is the white matter.", "E": "Pyramidal cells are in the cerebral cortex (layer 5), not the cerebellum."}, "source": "Wk1 packet p.207 ('Granule Cell Layer -- Primary Neuron Type: Granule cells (excitatory) and Golgi cells (inhibitory)') and p.208 Figure 11A (image used; 'Granule cell layer' label)", "annotation": {"image": "qbank/midterm1-mock4-images/annotated/s-histo-granule.png", "options": {"A": "Labeled \"Purkinje cell layer\"", "B": "Labeled \"Granule cell layer\" (arrowed)", "C": "Labeled \"Molecular layer\"", "D": "Labeled \"White matter\"", "E": "Not labeled in this figure"}, "note": "Choice letters sit on the layer each choice describes.", "how": "Same faculty figure with its labels showing (the full labeled version or the faculty key for the photo). Green box = correct answer; red boxes = other answer choices the figure labels; amber star = the arrowed structure when the key is not a structure name. Arrow redrawn where the question placed it.", "marked": ["A", "B", "C", "D"]}}, {"id": "mk4-q11", "n": 11, "part": 1, "title": null, "stem": "A 24-year-old woman yawns widely and then cannot close her mouth. Her jaw is fixed open and the area just in front of each ear looks hollow. What happened at the temporomandibular joints?", "options": [{"letter": "A", "text": "Each condyle rotated on its articular disc without any forward gliding"}, {"letter": "B", "text": "Each condyle was driven backward toward the external acoustic meatus"}, {"letter": "C", "text": "Each mandibular condyle glided forward past the front boundary of the mandibular fossa"}, {"letter": "D", "text": "The coronoid processes fractured"}, {"letter": "E", "text": "The articular discs were torn from the lateral pterygoid muscles"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Face Anatomy", "topic": "Face Anatomy", "note": null, "blueprint_category": "Face Anatomy", "learning_objective": "Face ILM LO3", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Course framing: opening is a two-step movement, rotation of the condyle on the disc and then forward gliding onto the articular eminence. Dislocation happens when the gliding goes past the front boundary of the fossa, so the condyles sit in front of the eminence and the fossae in front of the ears look empty.", "distractor_explanations": {"A": "Rotation is the normal first step of opening. On its own it keeps the condyle in the fossa and cannot lock the jaw open.", "B": "A backward displacement would need a blow to the chin, and it would not empty the area in front of the ear.", "D": "A fracture needs trauma, and the coronoid process is not part of the joint.", "E": "Disc problems cause clicking or limited opening, not a jaw stuck wide open with empty fossae."}, "source": "Wk1 packet p.42 ('Dislocation of the jaw occurs when this gliding proceeds anterior to the boundary of the fossa'); Face ILM LO3"}, {"id": "mk4-q12", "n": 12, "part": 1, "title": null, "stem": "Over 3 days, a 41-year-old woman develops weakness and numbness of both legs and cannot urinate. Pinprick is reduced everywhere below a horizontal line at the level of the umbilicus and normal above it. Leg reflexes are reduced. Which finding most strongly places the lesion in the spinal cord rather than the peripheral nerves?", "options": [{"letter": "A", "text": "The sensory level at the umbilicus (T10), with normal sensation above it"}, {"letter": "B", "text": "The reduced leg reflexes"}, {"letter": "C", "text": "Weakness of both legs"}, {"letter": "D", "text": "The symmetry of the findings"}, {"letter": "E", "text": "The onset over days"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Spinal Syndromes", "topic": "Spinal Syndromes", "note": null, "blueprint_category": "Spinal Syndromes", "learning_objective": "Spinal Syndromes LO4; Pin the Lesion", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "A spinal cord lesion produces deficits that start at a particular dermatome and include all dermatomes below it (a sensory level). Peripheral neuropathy produces a distal, length-dependent (stocking) pattern. Early urinary retention also favors the cord.", "distractor_explanations": {"B": "Reduced reflexes occur in neuropathy and also in the first days of an acute cord lesion, so they do not separate the two.", "C": "Both polyneuropathy and cord lesions can weaken both legs.", "D": "Polyneuropathies are typically symmetric too.", "E": "Guillain-Barre syndrome can also develop over days."}, "source": "Wk2 packet p.144, Pin the Lesion ('Spinal Cord: Deficits follow a dermatomal pattern, beginning at a specific dermatome and affecting all dermatomes below it')"}, {"id": "mk4-q13", "n": 13, "part": 1, "title": null, "stem": "A 4-month-old infant has bluish lips and skin after a parent rubbed an over-the-counter teething gel on his gums several times. His pulse oximetry reading is about 85% and does not improve with oxygen. Which drug in the gel is responsible?", "options": [{"letter": "A", "text": "Bupivacaine"}, {"letter": "B", "text": "Benzocaine"}, {"letter": "C", "text": "Lidocaine"}, {"letter": "D", "text": "Cocaine"}, {"letter": "E", "text": "Acetaminophen"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Synaptic transmission and neurotransmitters", "topic": "Synaptic transmission and neurotransmitters", "note": null, "blueprint_category": "Synaptic transmission and neurotransmitters", "learning_objective": "Synaptic Transmission LO9 (local anesthetics)", "difficulty": 2, "format": "vignette", "drug_item": "Benzocaine", "laterality": false, "thursday_11_5": false, "explanation": "Benzocaine is a surface-only Na+ channel blocker in over-the-counter gels. It can cause methemoglobinemia, a rare but serious condition, with highest risk in infants under 6 months, the elderly and people with inborn defects. Cyanosis that does not improve with oxygen is the clue.", "distractor_explanations": {"A": "A long-acting injected local anesthetic known for cardiotoxicity, not used in teething gels.", "C": "The drug list does not flag methemoglobinemia for lidocaine; its toxicity concern is seizures and arrhythmias at high doses.", "D": "A topical anesthetic and vasoconstrictor used in nasal procedures, not in teething gels.", "E": "Not a local anesthetic and not a cause of methemoglobinemia at normal doses."}, "source": "Drug list, Local Anesthetics: Benzocaine (bold) 'Blockade of VGNa+C, surface use only ... Can cause Methemoglobinemia -- rare but serious condition with elevated risk in the elderly, children under 6 months of age'"}, {"id": "mk4-q14", "n": 14, "part": 1, "title": null, "stem": "A 66-year-old man has a squamous cell carcinoma of the skin of the lateral lower lip. Following the superficial lymphatic drainage of the face described in the course, which nodes are most likely to be involved first?", "options": [{"letter": "A", "text": "Deep cervical nodes along the internal jugular vein"}, {"letter": "B", "text": "Supraclavicular nodes at the root of the neck"}, {"letter": "C", "text": "Retropharyngeal nodes behind the pharynx"}, {"letter": "D", "text": "Nodes at the junction of the jaw and neck (submandibular region)"}, {"letter": "E", "text": "The thoracic duct at the left venous angle, directly"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Neck Anatomy", "topic": "Neck Anatomy", "note": null, "blueprint_category": "Neck Anatomy", "learning_objective": "Neck ILM LO4", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Superficial drainage of the face first goes to a ring of nodes at the junction of the jaw and neck. From there it drains to the deep nodes along the internal jugular vein, then to the right lymphatic or thoracic duct at the venous angle.", "distractor_explanations": {"A": "These are the final collecting nodes; superficial facial lymph reaches them only after the nodes at the jaw.", "B": "Further downstream; not a first station for the lip.", "C": "These drain deep structures such as the pharynx and nasal cavity.", "E": "Lymph passes through nodes before reaching the duct and venous angle."}, "source": "Wk1 packet p.63-64, Fig. 8 caption ('superficial drainage of the face first goes to a set of lymph nodes at the junction of the jaw and neck')"}, {"id": "mk4-q15", "n": 15, "part": 1, "title": null, "stem": "A 9-year-old boy has headaches, slowed growth and loss of the outer halves of his visual fields. Imaging shows a calcified, cystic mass above the sella. This tumor arises from remnants of which embryonic structure?", "options": [{"letter": "A", "text": "The downgrowth of the diencephalon that forms the posterior pituitary"}, {"letter": "B", "text": "The third pharyngeal pouch"}, {"letter": "C", "text": "The thyroglossal duct"}, {"letter": "D", "text": "Neural crest of the first pharyngeal arch"}, {"letter": "E", "text": "Rathke's pouch, the oral ectoderm that forms the anterior pituitary"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Hypothalamus", "topic": "Hypothalamus", "note": null, "blueprint_category": "Hypothalamus", "learning_objective": "Hypothalamus ILM LO3", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "This is a craniopharyngioma, which arises from remnants of Rathke's pouch, the diverticulum of oral ectoderm that forms the anterior pituitary (adenohypophysis). Pressing on the chiasm causes bitemporal field loss.", "distractor_explanations": {"A": "The posterior pituitary is neural tissue and is not the source of this tumor.", "B": "This forms the thymus and inferior parathyroids.", "C": "Its remnants form midline neck cysts, not suprasellar masses.", "D": "This forms facial bones and connective tissue."}, "source": "Wk3 packet p.5 ('The anterior pituitary gland (adenohypophysis) embryologically arises from a diverticulum in the oral ectoderm known as Rathke's pouch'); craniopharyngioma link is Claude's addition"}, {"id": "mk4-q16", "n": 16, "part": 1, "title": null, "stem": "An 80-year-old woman with osteoporosis has several thoracic compression fractures and an exaggerated forward rounding of her upper back. This curvature is best described as:", "options": [{"letter": "A", "text": "Excessive lordosis"}, {"letter": "B", "text": "Excessive kyphosis"}, {"letter": "C", "text": "Scoliosis"}, {"letter": "D", "text": "Loss of the normal thoracic curvature"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Spinal Cord", "topic": "Spinal Cord", "note": null, "blueprint_category": "Spinal Cord", "learning_objective": "Spinal Cord LO1", "difficulty": 1, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The normal spine has lordosis (cervical, lumbar) and kyphosis (thoracic, sacral). Wedge compression fractures exaggerate the thoracic kyphosis. Scoliosis, a lateral curve, is always pathological.", "distractor_explanations": {"A": "Lordosis is the inward (concave-back) curve of the cervical and lumbar regions.", "C": "Scoliosis is a sideways curvature.", "D": "The thoracic curve is increased here, not flattened."}, "source": "Wk2 packet p.35-36 (LO1: lordosis, kyphosis, scoliosis; 'curvatures may deepen and become pathological')"}, {"id": "mk4-q17", "n": 17, "part": 1, "title": null, "stem": "Stubbing a toe in the dark wakes a sleeping 30-year-old man at once. Which brainstem structure integrates the pain signal with arousal and keeps him alert?", "options": [{"letter": "A", "text": "Periaqueductal gray"}, {"letter": "B", "text": "Superior colliculus"}, {"letter": "C", "text": "Ventral posterolateral nucleus of the thalamus"}, {"letter": "D", "text": "Reticular formation"}, {"letter": "E", "text": "Cerebellum"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Pain & Pain pathways", "topic": "Pain & Pain pathways", "note": null, "blueprint_category": "Pain & Pain pathways", "learning_objective": "Pain LO5", "difficulty": 1, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "In the affective-motivational pain system, the reticular formation spans the brainstem, maintains consciousness and arousal, and links pain with other sensory inputs, so pain raises alertness.", "distractor_explanations": {"A": "The PAG drives descending pain modulation, not arousal.", "B": "The superior colliculus turns the head and eyes toward the stimulus (orienting).", "C": "VPL relays discriminative location and intensity to the cortex.", "E": "The cerebellum coordinates movement and is not part of the affective pain system."}, "source": "Wk2 packet p.18 LO5 ('Reticular Formation: ... essential for maintaining consciousness and arousal. It integrates pain signals with other sensory inputs')"}, {"id": "mk4-q18", "n": 18, "part": 1, "title": null, "stem": "A 45-year-old man has a sore throat, fever and painful swallowing. CT shows an abscess in the space behind the pharynx and esophagus. Two days later he has chest pain and fever, and a chest radiograph shows a widened mediastinum. How did the infection reach his chest?", "options": [{"letter": "A", "text": "Through the carotid sheath into the cranial cavity"}, {"letter": "B", "text": "Through lymphatics into the thoracic duct"}, {"letter": "C", "text": "Within the investing layer of deep cervical fascia"}, {"letter": "D", "text": "It spread downward through the retropharyngeal space, which continues inferiorly into the mediastinum"}, {"letter": "E", "text": "Along the sympathetic trunk through the thoracic inlet"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Neck Anatomy", "topic": "Neck Anatomy", "note": null, "blueprint_category": "Neck Anatomy", "learning_objective": "Neck ILM LO2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The retropharyngeal space lies behind the pharynx and esophagus (behind the pretracheal layer) and continues down into the mediastinum, so infection there can cause mediastinitis.", "distractor_explanations": {"A": "The carotid sheath is not the route described, and the cranial cavity is the wrong direction for chest findings.", "B": "The course describes spread along the fascial space itself, not through lymph.", "C": "The investing layer attaches to the clavicle and sternum and does not open into the mediastinum.", "E": "Nerves are not a route for an abscess to track along."}, "source": "Wk1 packet p.10 and p.56 ('Infections in the retropharyngeal space can spread inferiorly into the mediastinum')"}, {"id": "mk4-q19", "n": 19, "part": 1, "title": null, "stem": "Why do axons and white matter tracts stay nearly unstained in a Nissl-stained section of the brainstem?", "options": [{"letter": "A", "text": "Nissl dyes bind myelin lipids, which are washed out in processing"}, {"letter": "B", "text": "Nissl dyes bind neurofilaments, which axons lack"}, {"letter": "C", "text": "Nissl dyes bind ribosomal RNA on rough ER, which is concentrated in neuronal cell bodies"}, {"letter": "D", "text": "Nissl dyes stain only glial nuclei"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Histology Lab", "topic": "Histology Lab", "note": null, "blueprint_category": "Histology Lab", "learning_objective": "Histology Lab LO7", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Nissl stain is a basic dye that binds rRNA (ribosomes) and so labels rough ER, which is abundant in neuron cell bodies with high protein synthesis. Axons have no Nissl substance, so tracts stay pale.", "distractor_explanations": {"A": "Myelin is shown with myelin stains such as Luxol fast blue, not Nissl.", "B": "Axons are full of neurofilaments; silver stains show them.", "D": "Nissl dyes stain neuronal cell bodies strongly; that is their main use."}, "source": "Wk1 packet p.215 stain table ('Nissl stain: Basic dye that stains ribosomes (rRNA) and labels rough endoplasmic reticulum in neurons')"}, {"id": "mk4-q20", "n": 20, "part": 1, "title": null, "stem": "On a section of the rostral medulla, two large bundles of fibers form the ventral surface on either side of the midline. A small infarct destroying the right bundle would most likely cause:", "options": [{"letter": "A", "text": "Weakness of the right arm and leg with upper motor neuron signs"}, {"letter": "B", "text": "Loss of vibration and position sense on the right side of the body"}, {"letter": "C", "text": "Weakness of the left arm and leg with upper motor neuron signs"}, {"letter": "D", "text": "Loss of pain and temperature on the left side of the body"}, {"letter": "E", "text": "The tongue deviating to the left on protrusion"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Histology Lab", "topic": "Histology Lab", "note": null, "blueprint_category": "Histology Lab", "learning_objective": "Histology Lab LO4", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": true, "thursday_11_5": false, "explanation": "These are the pyramids, which carry corticospinal axons. They cross in the pyramidal decussation in the caudal medulla, so a lesion of the right pyramid above the decussation weakens the left limbs, with upper motor neuron signs.", "distractor_explanations": {"A": "The fibers have not yet crossed at this level; they decussate lower, in the caudal medulla.", "B": "That would come from the dorsal columns or nuclei below the decussation of the medial lemniscus.", "D": "The spinothalamic tract runs laterally, not in the ventral bundles.", "E": "That is a hypoglossal (CN XII) lesion."}, "source": "Wk1 packet p.213 (medulla section structures: medial lemniscus, inferior olive, pyramids); Wk2 corticospinal session (crossing at the pyramidal decussation)"}, {"id": "mk4-q21", "n": 21, "part": 1, "title": null, "stem": "A 63-year-old woman has been in the ICU for 3 weeks with septic shock and multi-organ failure. As sedation is reduced, she has symmetric weakness of all four limbs, worse distally, with reduced reflexes, and she is hard to wean from the ventilator. Which diagnosis is most likely?", "options": [{"letter": "A", "text": "Critical illness polyneuropathy"}, {"letter": "B", "text": "Guillain-Barre syndrome"}, {"letter": "C", "text": "Amyotrophic lateral sclerosis"}, {"letter": "D", "text": "Spinal cord infarction"}, {"letter": "E", "text": "Myasthenia gravis"}], "answer": "A", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Peripheral Neuropathies", "topic": "Peripheral Neuropathies", "note": null, "blueprint_category": "Peripheral Neuropathies", "learning_objective": "Peripheral Neuropathy LO3", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Critical illness polyneuropathy develops in critically ill patients, especially with sepsis or multi-organ failure. The systemic inflammatory response damages nerves and muscle excitability, causing symmetric distal weakness and trouble weaning from the ventilator.", "distractor_explanations": {"B": "GBS follows an infection in someone otherwise well; weakness that appears during prolonged sepsis and multi-organ failure fits critical illness neuropathy.", "C": "ALS progresses over months with mixed upper and lower motor neuron signs.", "D": "A cord infarct causes a sensory level and spares the arms if it is below the cervical cord.", "E": "Myasthenia gives fatigable, often ocular weakness with normal reflexes."}, "source": "Wk2 packet p.65 ('Critical Illness Polyneuropathy: occurs in patients who are critically ill, particularly those with sepsis or multi-organ failure')"}, {"id": "mk4-q22", "n": 22, "part": 1, "title": null, "stem": "Paramedics find a 35-year-old man in a convulsive seizure that has lasted 8 minutes. They cannot place an IV line. Which treatment should be given first?", "options": [{"letter": "A", "text": "Intravenous lorazepam"}, {"letter": "B", "text": "Oral phenytoin"}, {"letter": "C", "text": "Intramuscular midazolam"}, {"letter": "D", "text": "Wait 30 minutes, since most seizures stop on their own"}, {"letter": "E", "text": "Intravenous valproate"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Antiepileptics", "topic": "Antiepileptics", "note": null, "blueprint_category": "Antiepileptics", "learning_objective": "Antiepileptics LO2", "difficulty": 2, "format": "vignette", "drug_item": "Midazolam", "laterality": false, "thursday_11_5": true, "explanation": "For ongoing convulsive status, give a benzodiazepine promptly and at an adequate dose: IV lorazepam if there is access, IM midazolam if not. Midazolam increases GABA-A Cl- channel opening frequency.", "distractor_explanations": {"A": "The preferred benzodiazepine when IV access is available, which it is not here.", "B": "A convulsing patient cannot take oral medication, and phenytoin is not first line.", "D": "A seizure lasting this long is status epilepticus and needs prompt treatment.", "E": "It needs IV access and is a second-line agent after a benzodiazepine."}, "source": "Wk3 packet p.137 ('IV lorazepam is commonly used when vascular access is available, while IM midazolam is an important alternative when it is not'); drug list, Midazolam (bold) 'For Status Epilepticus'"}, {"id": "mk4-q23", "n": 23, "part": 1, "title": null, "stem": "In a study, volunteers given saline that they are told is a strong painkiller report less pain from a heat probe. When the opioid antagonist naloxone is given first, this placebo pain relief is largely lost. What does this show?", "options": [{"letter": "A", "text": "Saline blocks voltage-gated Na+ channels on nociceptors"}, {"letter": "B", "text": "Naloxone directly activates nociceptors"}, {"letter": "C", "text": "Placebo analgesia depends partly on the release of endogenous opioids"}, {"letter": "D", "text": "Placebo analgesia works only through the spinal gate (Abeta fibers)"}, {"letter": "E", "text": "The volunteers were opioid-dependent and in withdrawal"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Pain & Pain pathways", "topic": "Pain & Pain pathways", "note": null, "blueprint_category": "Pain & Pain pathways", "learning_objective": "Pain LO6", "difficulty": 2, "format": "research scenario", "drug_item": "Naloxone", "laterality": false, "thursday_11_5": false, "explanation": "In placebo analgesia, expectation drives the prefrontal cortex and reward centers to release endogenous opioids (and dopamine), which engage descending pain control. Blocking opioid receptors with naloxone removes much of the effect.", "distractor_explanations": {"A": "Saline has no drug action; the effect comes from expectation.", "B": "Naloxone is an opioid receptor antagonist; it removes an opioid effect rather than exciting nociceptors.", "D": "Gate control depends on touch input; blocking opioid receptors would not cancel it.", "E": "Nothing suggests opioid use; the result shows the placebo itself uses opioid signaling."}, "source": "Wk2 packet p.19 (placebo, Figure 9: 'During Placebo Analgesia, the Prefrontal Cortex and Reward Centers Release Opioids & Dopamine'); drug list, Naloxone (bold): 'Blocks Opioid Receptors'"}, {"id": "mk4-q24", "n": 24, "part": 1, "title": null, "stem": "In the course model of sleep and memory consolidation, during which state are acetylcholine levels low while information flows out of the hippocampus to the cortex?", "options": [{"letter": "A", "text": "REM sleep"}, {"letter": "B", "text": "Active waking"}, {"letter": "C", "text": "Both waking and REM sleep equally"}, {"letter": "D", "text": "Drowsy wakefulness before sleep onset"}, {"letter": "E", "text": "Slow-wave sleep"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Memory Formation", "topic": "Memory Formation", "note": null, "blueprint_category": "Memory Formation", "learning_objective": "Learning & Memory LO9", "difficulty": 2, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Course model: waking = high ACh, acquisition. Slow-wave sleep = low ACh, information flows from the hippocampus out to the cortex. REM = high ACh, ongoing consolidation in the cortex.", "distractor_explanations": {"A": "ACh is high in REM, when information relayed to the cortex is consolidated.", "B": "ACh is high while awake and new information is acquired.", "C": "Both have high ACh; neither is the low-ACh outflow phase.", "D": "This is not a stage in the course model."}, "source": "Wk3 packet p.67 (Figure 11: 'During the slow wave sleep (SWS) cycle acetylcholine levels are low and there is a heavy amount of information ... flowing out of the areas of the hippocampus back towards the cortex')"}, {"id": "mk4-q25", "n": 25, "part": 1, "title": null, "stem": "In this H&E section of a large motor neuron, what is characteristic of the region indicated by the arrow?", "options": [{"letter": "A", "text": "It is packed with Nissl substance (rough ER) for protein synthesis"}, {"letter": "B", "text": "It is a dendrite that receives most of the neuron's synaptic input"}, {"letter": "C", "text": "It is the nucleolus, the site of ribosomal RNA synthesis"}, {"letter": "D", "text": "It is the axon hillock, which lacks Nissl substance and is where action potentials are usually generated"}, {"letter": "E", "text": "It is the nucleus of a glial cell beside the neuron"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": "qbank/midterm1-mock4-images/s-histo-hillock.png", "image_needed": true, "week": 1, "session_guess": "Histology Lab", "topic": "Histology Lab", "note": null, "blueprint_category": "Histology Lab", "learning_objective": "Histology Lab LO1, LO7", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The axon emerges from the cell body at the axon hillock, a pale cone without Nissl substance. The course calls this initial region the prime generator of action potentials.", "distractor_explanations": {"A": "The Nissl-rich cytoplasm is the purple cell body around the nucleus.", "B": "Dendrites taper gradually and contain Nissl substance.", "C": "The nucleolus is inside the nucleus in the center of the cell body.", "E": "Glial nuclei are the small dark dots scattered around the neuron."}, "source": "Wk1 packet p.176, Figure 1 inset (image used; 'axon (A) emerging from an axon hillock (AH)'; 'This region is a prime generator of action potentials'). 'Lacks Nissl substance' is standard histology (Claude's addition); Nissl substance (NS) is labeled only in the cell body", "annotation": {"image": "qbank/midterm1-mock4-images/annotated/s-histo-hillock.png", "options": {"A": "Labeled \"NS\" (Nissl substance, in the cell body)", "B": "Labeled \"D\" (dendrites)", "C": "Labeled \"N\" (nucleus; the nucleolus is the dark dot inside it)", "D": "Labeled \"AH\" (axon hillock; arrowed)", "E": "Labeled \"G\" (glial cell nuclei)"}, "note": "Faculty labels: AH = axon hillock, NS = Nissl substance, D = dendrites, N = nucleus (the nucleolus is the dark dot inside it), G = glial cell nuclei, A = axon.", "how": "Same faculty figure with its labels showing (the full labeled version or the faculty key for the photo). Green box = correct answer; red boxes = other answer choices the figure labels; amber star = the arrowed structure when the key is not a structure name. Arrow redrawn where the question placed it.", "marked": ["A", "B", "C", "D", "E"]}}, {"id": "mk4-q26", "n": 26, "part": 1, "title": null, "stem": "A 40-year-old man with a large brain tumor has bilateral optic disc swelling on funduscopy. How does raised intracranial pressure cause this finding?", "options": [{"letter": "A", "text": "It occludes the central retinal artery and infarcts the retina"}, {"letter": "B", "text": "It compresses the crossing fibers of the optic chiasm"}, {"letter": "C", "text": "It raises pressure in the cavernous sinus and the ophthalmic artery"}, {"letter": "D", "text": "Pressure carried along the optic nerve sheath impairs axoplasmic flow at the optic nerve head"}, {"letter": "E", "text": "It paralyzes the ciliary ganglion"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Increased Cranial Pressure", "topic": "Increased Cranial Pressure", "note": null, "blueprint_category": "Increased Cranial Pressure", "learning_objective": "Elevated ICP ILM LO1", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The subarachnoid space extends along the optic nerve inside its sheath. When ICP rises, the pressure is transmitted along the sheath and blocks axoplasmic flow at the optic nerve head, so the disc swells (papilledema). It can take time to appear, so a normal fundus does not rule out high ICP.", "distractor_explanations": {"A": "Retinal artery occlusion gives a pale retina, not a swollen disc.", "B": "Chiasm compression causes a field cut (bitemporal loss), not disc swelling.", "C": "This is not the mechanism the course describes.", "E": "That would affect the pupil, not the optic disc."}, "source": "Wk1 packet p.132 ('...that pressure can be transmitted along the optic nerve sheath and interfere with normal axoplasmic flow at the optic nerve head')"}, {"id": "mk4-q27", "n": 27, "part": 1, "title": null, "stem": "Days after a small brain infarct, many cells in the damaged area are engulfing debris and releasing signals that attract other immune cells into the brain. Which resident glial cell is doing this?", "options": [{"letter": "A", "text": "Oligodendrocytes"}, {"letter": "B", "text": "Ependymal cells"}, {"letter": "C", "text": "Microglia"}, {"letter": "D", "text": "Schwann cells"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Histology of CNS 1: Neurons and Glia", "topic": "Histology of CNS 1: Neurons and Glia", "note": null, "blueprint_category": "Histology of CNS 1: Neurons and Glia", "learning_objective": "Histology CNS 1 LO5", "difficulty": 1, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Microglia are the resident immune cells of the brain, acting like macrophages elsewhere: they phagocytose debris and pathogens and release signals that recruit other immune cells.", "distractor_explanations": {"A": "Oligodendrocytes make CNS myelin; they are not phagocytes.", "B": "Ependymal cells line the ventricles.", "D": "Schwann cells are peripheral glia that myelinate PNS axons."}, "source": "Wk1 packet p.181-182 ('Microglia are the resident immune cells of the brain, and their role is similar to the role of phagocytic macrophages in other tissues ... Microglia produce signaling molecules that attract to the brain other immune cell populations')"}, {"id": "mk4-q28", "n": 28, "part": 1, "title": null, "stem": "A 7-year-old girl has influenza with fever and aches. Her parent asks which over-the-counter pain reliever to avoid. Which drug should she not be given, and why?", "options": [{"letter": "A", "text": "Acetaminophen, because of the risk of Reye syndrome"}, {"letter": "B", "text": "Aspirin, because of the risk of Reye syndrome"}, {"letter": "C", "text": "Ibuprofen, because it irreversibly inhibits COX"}, {"letter": "D", "text": "Aspirin, because it causes methemoglobinemia in children"}, {"letter": "E", "text": "Naproxen, because NSAIDs are contraindicated in all children"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Pain Medications", "topic": "Pain Medications", "note": null, "blueprint_category": "Pain Medications", "learning_objective": "Pain Medications LO2", "difficulty": 1, "format": "vignette", "drug_item": "Aspirin", "laterality": false, "thursday_11_5": false, "explanation": "Aspirin (irreversible COX inhibitor) is avoided in children with viral illnesses because of Reye syndrome (liver failure and encephalopathy). The drug list marks Reye syndrome as aspirin-only.", "distractor_explanations": {"A": "Reye syndrome is linked to aspirin, not acetaminophen.", "C": "Ibuprofen inhibits COX reversibly; aspirin is the irreversible inhibitor.", "D": "Methemoglobinemia is linked to benzocaine.", "E": "NSAIDs other than aspirin are not banned in children."}, "source": "Wk2 packet p.89 ('Acetylsalicylic acid (Aspirin): irreversible COX inhibition: Reye's Syndrome in children'); drug list, Aspirin (bold): 'Reye Syndrome in children (Aspirin only)'"}, {"id": "mk4-q29", "n": 29, "part": 1, "title": null, "stem": "Besides the muscles of mastication, motor fibers of the mandibular nerve (V3) supply which muscle of the soft palate?", "options": [{"letter": "A", "text": "Levator veli palatini"}, {"letter": "B", "text": "Tensor veli palatini"}, {"letter": "C", "text": "Palatoglossus"}, {"letter": "D", "text": "Musculus uvulae"}, {"letter": "E", "text": "Stylopharyngeus"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Face Anatomy", "topic": "Face Anatomy", "note": null, "blueprint_category": "Face Anatomy", "learning_objective": "Face ILM LO6", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "V3 supplies the muscles of mastication, mylohyoid, anterior belly of digastric and two 'tensors': tensor tympani and tensor veli palatini (first-arch muscles). The course mnemonic: 'these two Tensors use the Trigeminal.' The other palate muscles are vagal.", "distractor_explanations": {"A": "Supplied by the vagus nerve through the pharyngeal plexus (Claude's general-knowledge note).", "C": "Supplied by the vagus nerve, not the trigeminal.", "D": "Supplied by the vagus nerve.", "E": "A pharyngeal muscle supplied by the glossopharyngeal nerve, not a palate muscle."}, "source": "Wk1 packet p.51 ('...a palate muscle, the tensor veli palatini... these two Tensors use the Trigeminal'); p.19 arch table"}, {"id": "mk4-q30", "n": 30, "part": 1, "title": null, "stem": "Which cranial nerves carry preganglionic parasympathetic (general visceral efferent) fibers?", "options": [{"letter": "A", "text": "III, V, VII and X"}, {"letter": "B", "text": "V, VII, IX and X"}, {"letter": "C", "text": "III, IV, VI and X"}, {"letter": "D", "text": "VII, IX, X and XI"}, {"letter": "E", "text": "III, VII, IX and X"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 1, "session_guess": "Cranial Nerves Module", "topic": "Cranial Nerves Module", "note": null, "blueprint_category": "Cranial Nerves Module", "learning_objective": "CN Modules LO3", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Parasympathetic outflow: III (pupil constriction, accommodation), VII (lacrimal, submandibular, sublingual glands), IX (parotid) and X (thoracic and abdominal organs). The course stresses that V has none, though postganglionic fibers travel along its branches.", "distractor_explanations": {"A": "CN V carries no parasympathetic fibers; postganglionic fibers only hitchhike on its branches.", "B": "Again includes V, which has none.", "C": "IV and VI are purely somatic motor to eye muscles.", "D": "Leaves out III (pupil and lens) and wrongly includes XI."}, "source": "Wk1 packet p.155 Table 1 (GVE in III, VII, IX, X); Wk2 packet p.54 ('remember that cranial nerve V does not contain parasympathetic fibers!')"}, {"id": "mk4-q31", "n": 31, "part": 1, "title": null, "stem": "A 46-year-old man who injects drugs has 5 days of fever and severe mid-back pain, and today his legs are weak. MRI shows a spinal epidural abscess compressing the thoracic cord. What is the appropriate management?", "options": [{"letter": "A", "text": "NSAIDs and physical therapy, with reassessment in 6 weeks"}, {"letter": "B", "text": "High-dose corticosteroids alone"}, {"letter": "C", "text": "Lumbar puncture to culture CSF before any treatment"}, {"letter": "D", "text": "Intravenous antibiotics with urgent surgical drainage and decompression"}, {"letter": "E", "text": "Antibiotics alone, with surgery only if he loses bladder control"}], "answer": "D", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Spinal Syndromes", "topic": "Spinal Syndromes", "note": null, "blueprint_category": "Spinal Syndromes", "learning_objective": "Spinal Syndromes LO6", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Spinal epidural abscess (from bacteremia, IV drug use, endocarditis and similar sources) needs antibiotics, and surgical drainage when there is compression or a neurologic deficit.", "distractor_explanations": {"A": "Conservative care fits uncomplicated disc disease, not an infection compressing the cord.", "B": "Steroids do not treat the infection or relieve the compression.", "C": "A needle through an infected epidural space risks spreading it and delays treatment.", "E": "Progressing weakness already calls for decompression."}, "source": "Wk2 packet p.112 ('For cases involving infection, such as abscesses ... antibiotic therapy and sometimes surgical drainage are required') and p.117 (epidural abscess causes)"}, {"id": "mk4-q32", "n": 32, "part": 1, "title": null, "stem": "In young monkeys, depleting norepinephrine and dopamine inputs to the prefrontal cortex produces which deficit?", "options": [{"letter": "A", "text": "Loss of motor skill learning"}, {"letter": "B", "text": "Dense amnesia for new facts and events"}, {"letter": "C", "text": "Impaired working memory"}, {"letter": "D", "text": "Loss of conditioned fear"}, {"letter": "E", "text": "Visual field loss"}], "answer": "C", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Memory Formation", "topic": "Memory Formation", "note": null, "blueprint_category": "Memory Formation", "learning_objective": "Learning & Memory LO10", "difficulty": 2, "format": "research scenario", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The course cites studies in young monkeys in which depleting NE and DA input to the prefrontal cortex caused memory loss, showing that NE and DA synapses in the PFC support memory, especially working memory.", "distractor_explanations": {"A": "Skill learning depends on the striatum, cerebellum and motor cortex.", "B": "That follows medial temporal lobe damage.", "D": "Fear conditioning depends on the amygdala.", "E": "The prefrontal cortex is not part of the visual pathway."}, "source": "Wk3 packet p.67 LO-10 ('Studies in young monkeys with depletion of norepinephrine and dopamine input to their prefrontal cortex demonstrated signs of memory loss ... (specially working memory)')"}, {"id": "mk4-q33", "n": 33, "part": 1, "title": null, "stem": "A 70-year-old woman who follows a vegan diet and takes metformin has 6 months of forgetfulness, tingling feet and an unsteady gait. Vibration and position sense are reduced in her toes. Hemoglobin and MCV are normal. What is the most appropriate next test?", "options": [{"letter": "A", "text": "None; a normal hemoglobin rules out B12 deficiency"}, {"letter": "B", "text": "Amyloid PET scan"}, {"letter": "C", "text": "EEG"}, {"letter": "D", "text": "Thyroid antibodies only"}, {"letter": "E", "text": "Serum vitamin B12 with methylmalonic acid"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 3, "session_guess": "Aging and Neurodegenerative Disorders", "topic": "Aging and Neurodegenerative Disorders", "note": null, "blueprint_category": "Aging and Neurodegenerative Disorders", "learning_objective": "Aging & Neurodegeneration LO2", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "Cognitive change with paresthesias, impaired vibration and position sense, and gait trouble suggests B12 deficiency, a reversible cause of cognitive decline. Diet and metformin are risk factors. A low B12 with elevated methylmalonic acid supports the diagnosis, even without anemia.", "distractor_explanations": {"A": "Neurologic B12 deficiency can occur without anemia.", "B": "Reversible causes should be checked first, and the neuropathy points elsewhere.", "C": "Nothing suggests seizures.", "D": "Thyroid function is part of the work-up, but antibodies alone would miss the most likely cause here."}, "source": "Wk3 packet p.102 table ('Vitamin B12 deficiency: Cognitive changes may accompany paresthesias, impaired vibration/proprioception, or gait dysfunction. Neurologic disease can occur without anemia. Low B12; elevated methylmalonic acid supports deficiency'); metformin as a risk factor is Claude's addition"}, {"id": "mk4-q34", "n": 34, "part": 1, "title": null, "stem": "In a 49-year-old man, touching the right cornea makes only the left eye blink, and touching the left cornea also makes only the left eye blink. Both corneas feel the touch normally. Where is the lesion?", "options": [{"letter": "A", "text": "Left facial nerve"}, {"letter": "B", "text": "Right facial nerve"}, {"letter": "C", "text": "Right trigeminal nerve (V1)"}, {"letter": "D", "text": "Left trigeminal nerve (V1)"}, {"letter": "E", "text": "Right oculomotor nerve"}], "answer": "B", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Cranial Nerve Reflexes", "topic": "Cranial Nerve Reflexes", "note": null, "blueprint_category": "Cranial Nerve Reflexes", "learning_objective": "Reflex Arc & Cranial Reflexes LO2", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": true, "thursday_11_5": false, "explanation": "The corneal reflex is bilateral: V1 carries the touch to the spinal trigeminal nucleus, which projects to both facial nuclei. When the right eye never blinks whichever cornea is touched, the right efferent limb (right CN VII to orbicularis oculi) is damaged.", "distractor_explanations": {"A": "The left eye blinks normally to both sides, so the left efferent limb works.", "C": "An afferent lesion would stop both eyes blinking when the right cornea is touched, and sensation is normal.", "D": "Touching the left cornea still produces a blink, so the left afferent limb works.", "E": "CN III opens the eyelid; eyelid closing uses orbicularis oculi (CN VII)."}, "source": "Wk2 packet p.54 ('If touching one eye causes a blink only in the contralateral eye, the ipsilateral facial nerve is damaged')"}, {"id": "mk4-q35", "n": 35, "part": 1, "title": null, "stem": "A 47-year-old man has a meningioma arising from the dura in the posterior midline at C6. It presses on the dorsal columns from behind, next to the dorsal median sulcus. Which early sensory finding is most likely?", "options": [{"letter": "A", "text": "Reduced vibration and position sense in both arms, with the legs spared"}, {"letter": "B", "text": "Loss of pain and temperature in both legs"}, {"letter": "C", "text": "Loss of vibration in the right leg only"}, {"letter": "D", "text": "Loss of pain and temperature in a cape over both shoulders"}, {"letter": "E", "text": "Reduced vibration and position sense in both legs, with the arms relatively spared"}], "answer": "E", "answer_source": "Claude-written key, checked against the cited course source", "image": null, "image_needed": false, "week": 2, "session_guess": "Somatosensory Receptors and Tracts", "topic": "Somatosensory Receptors and Tracts", "note": null, "blueprint_category": "Somatosensory Receptors and Tracts", "learning_objective": "Sensory Receptors LO3-4", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "thursday_11_5": false, "explanation": "The dorsal columns are somatotopic: the fasciculus gracilis (legs, lower body) lies medially next to the midline, and the fasciculus cuneatus (trunk, arms, neck) lies laterally. A mass pressing in at the midline hits the gracile fibers first.", "distractor_explanations": {"A": "Arm fibers run in the fasciculus cuneatus, the lateral part of the dorsal columns, farther from the midline.", "B": "Pain and temperature travel in the anterolateral (spinothalamic) system, away from a dorsal midline mass.", "C": "A midline mass presses on both gracile fasciculi.", "D": "That pattern comes from a central lesion of crossing fibers (e.g. a syrinx)."}, "source": "Wk2 packet p.8, Figure 4 ('the medial gracile fasciculus carrying fine touch ... from the legs and lower body, and the lateral cuneate fasciculus ... from the trunk, arms, and neck')"}, {"id": "mk4-q36", "n": 36, "part": 1, "title": null, "stem": "After lifting a sofa, a 38-year-old man has 10 days of low back pain radiating down the back of his right leg to the outer foot. The right ankle reflex is reduced, strength is full, and bowel and bladder function are normal. MRI shows an L5-S1 disc herniation. What is the best next step?", "options": [{"letter": "A", "text": "Conservative care (physical therapy and pain control) with reassessment"}, {"letter": "B", "text": "Urgent surgical discectomy"}, {"letter": "C", "text": "Lumbar puncture"}, {"letter": "D", "text": "Intravenous antibiotics"}, {"letter": "E", "text": "Strict bed rest for 6 weeks"}], "answer": "A", "answer_source": "Claude-written key, checked against t
